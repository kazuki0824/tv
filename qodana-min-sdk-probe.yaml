version: "1.0"
linter: qodana-jvm-android
projectJDK: 17

# 診断専用。CIでtisを一時Gradle project rootにし、同じtis/srcをproject内sourceとして解析する。
rootJavaProjects:
  - "./tis"

onlyDirectory: tis/src

profile:
  base:
    name: qodana.recommended
  inspections:
    - inspection: UnusedSymbol
      enabled: true
      severity: ERROR
