name: agent-fix-playback-queue-epoch

on:
  push:
    branches:
      - agent/fix-playback-dvr-origin-generation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply documentation fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tuner_hal/DESIGN_JA.md')
          s = p.read_text()
          old = 'TsInputOrigin::PlaybackDvr(dvr_id, dvr_generation)'
          new = 'TsInputOrigin::PlaybackDvr(dvr_id, queue_epoch)'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one {old!r}, got {s.count(old)}')
          s = s.replace(old, new)
          anchor = '記述子の置換では旧識別子を閉じ、世代0の別識別子を生成する。\n\n#### 独立した世代軸'
          insert = ('記述子の置換では旧識別子を閉じ、世代0の別識別子を生成する。\n\n'
                    'Playback DVR の入力originは `TsInputOrigin::PlaybackDvr(dvr_id, queue_epoch)` を唯一の正本キーとし、別の `dvr_generation` は設けない。`queue_epoch` の所有者は当該Playback DVRの `QueueEpochProtocol` とし、キュー生成時は0、`stop()` / `start()` では維持し、成功した `flush()` の消去commitでだけ進める。`close()` / 所有者消滅では当該キュー識別子ごと無効化し、記述子置換時は新しいキュー識別子を世代0で開始する。これにより `stop()`→`start()` は同一stream continuationを保ち、`flush()` 前後のcontinuity / parser stateを同一originとして再結合しない。\n\n'
                    '#### 独立した世代軸')
          if s.count(anchor) != 1:
              raise SystemExit(f'expected exactly one QueueEpoch anchor, got {s.count(anchor)}')
          s = s.replace(anchor, insert)
          p.write_text(s)
          PY
          rm .github/workflows/agent_fix_playback_queue_epoch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tuner_hal/DESIGN_JA.md .github/workflows/agent_fix_playback_queue_epoch.yml
          git diff --cached --check
          git commit -m 'docs: reuse queue epoch for playback origin'
          git push
