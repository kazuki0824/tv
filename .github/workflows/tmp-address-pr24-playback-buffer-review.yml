name: Temporary PR24 playback buffer review fix

on:
  push:
    branches:
      - agent/fix-dvr-stop-parser-residual

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-dvr-stop-parser-residual
      - name: Align playback processing-buffer lifetime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tuner_hal/DESIGN_JA.md')
          s = p.read_text()
          old = '致命的エラー、停止、閉鎖では、残りの正確な消失バイト数と終端理由を記録してから破棄'
          assert s.count(old) == 1, s.count(old)
          new = '致命的エラー、`flush()`、閉鎖では、残りの正確な消失バイト数と終端理由を記録してから破棄する。`stop()`では`commitRead()`済みの処理中バッファとinjection cursorを維持し、次の`start()`で同一streamの続きとして再開'
          p.write_text(s.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tuner_hal/DESIGN_JA.md
          git rm .github/workflows/tmp-address-pr24-playback-buffer-review.yml
          git commit -m "design: preserve playback processing buffer across stop"
          git push origin HEAD:agent/fix-dvr-stop-parser-residual
