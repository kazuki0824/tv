name: Patch sparse PTS review v3
'on':
  push:
    branches:
      - agent/fix-tis-arib-design-residuals
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          echo '' | base64 -d > /tmp/p.py
          python3 /tmp/p.py
          git diff --check
          rm -f .github/workflows/patch-pr19-sparse-pts.yml .github/workflows/patch-pr19-sparse-pts-v2.yml .github/workflows/patch-pr19-sparse-pts-v3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tis/DESIGN_JA.md tuner_hal/DESIGN_JA.md .github/workflows
          git commit -m 'docs: align sparse PTS producer contract'
          git push
