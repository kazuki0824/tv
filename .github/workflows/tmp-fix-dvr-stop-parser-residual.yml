name: Temporary DVR stop parser residual fix

on:
  push:
    branches:
      - agent/fix-dvr-stop-parser-residual

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-dvr-stop-parser-residual
      - name: Apply design-only fix
        run: |
          python3 -c 'from pathlib import Path; p=Path("tuner_hal/DESIGN_JA.md"); s=p.read_text(); old="`stop()` はキュー内容と識別子を維持して解析途中状態だけを破棄する。"; new="`stop()` はキュー内容と識別子を維持する。"; assert s.count(old) == 1, s.count(old); p.write_text(s.replace(old, new))'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tuner_hal/DESIGN_JA.md
          git rm .github/workflows/tmp-fix-dvr-stop-parser-residual.yml
          git commit -m "design: preserve DVR parser state across stop"
          git push origin HEAD:agent/fix-dvr-stop-parser-residual
