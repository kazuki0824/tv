name: temp-fix53-review35-batch2
on:
  push:
    branches: [fix/tuner-hal2-rustfmt-1.81]
    paths:
      - tools/temp_fix53_review35_batch2.py
      - tools/temp_fix53_review35_batch2_tail.py
      - .github/workflows/temp-fix53-review35-batch2.yml
permissions:
  contents: write
jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply review repairs through known import anchor
        run: |
          set +e
          python3 tools/temp_fix53_review35_batch2.py
          rc=$?
          set -e
          test "$rc" -ne 0
      - name: Apply repaired tail
        run: python3 tools/temp_fix53_review35_batch2_tail.py
      - name: Rustfmt touched Rust files
        run: |
          rustfmt --edition 2021 \
            tuner_hal2/control/src/lib.rs \
            tuner_hal2/device/src/runtime/thread_result_owner.rs \
            tuner_hal2/service_runtime/src/worker_runtime.rs \
            tuner_hal2/aidl_service/src/cleanup_reaper.rs \
            tuner_hal2/aidl_service/src/object_runtime/mod.rs \
            tuner_hal2/aidl_service/src/tuner_service.rs \
            tuner_hal2/aidl_service/src/tuner_service/filter_methods.rs \
            tuner_hal2/service_runtime/src/boot/frontend_txn.rs \
            tuner_hal2/service_runtime/src/lnb_ops.rs
      - name: Validate remaining source contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cleanup=Path('tuner_hal2/aidl_service/src/cleanup_reaper.rs').read_text()
          assert 'std::thread::Builder' not in cleanup
          assert 'Condvar' not in cleanup
          assert 'WorkerRuntimeReaperQueue' in cleanup
          thread_owner=Path('tuner_hal2/device/src/runtime/thread_result_owner.rs').read_text()
          for bad in ['JoinHandle','Condvar','thread::Builder','catch_unwind','Arc<Mutex']:
              assert bad not in thread_owner, bad
          assert 'WorkerRuntimeResultOwner' in thread_owner
          worker=Path('tuner_hal2/service_runtime/src/worker_runtime.rs').read_text()
          assert 'WorkerRuntimeResultOwner' in worker
          method=Path('tuner_hal2/aidl_service/src/tuner_service/filter_methods.rs').read_text()
          body=method[method.index('fn releaseAvHandle'):method.index('fn setDataSource')]
          assert 'preflight_filter_av_handle_release_for_any_lifecycle' not in body
          assert '.lock()' not in body
          assert 'execute_filter_av_handle_release_use_case' in body
          lnb=Path('tuner_hal2/service_runtime/src/lnb_ops.rs').read_text()
          assert '.registry_mut()\n        .retain_frontend_fixed_power_lease' not in lnb
          assert '.registry_mut()\n        .release_frontend_fixed_power_lease' not in lnb
          frontend=Path('tuner_hal2/service_runtime/src/boot/frontend_txn.rs').read_text()
          assert 'fn retain_fixed_power_lease' in frontend
          assert 'fn release_fixed_power_lease' in frontend
          PY
      - name: Diff check
        run: git diff --check
      - name: Host workspace test
        working-directory: tuner_hal2/host_ci
        run: cargo test --workspace --all-targets
      - name: Host workspace check
        working-directory: tuner_hal2/host_ci
        run: cargo check --workspace --all-targets
      - name: Host workspace clippy
        working-directory: tuner_hal2/host_ci
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Commit production repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tuner_hal2
          git diff --cached --check
          git commit -m "Converge worker and transaction ownership"
          git push