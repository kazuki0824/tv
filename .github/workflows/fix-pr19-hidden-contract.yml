name: Fix PR19 private API wording
on:
  push:
    branches: [agent/fix-tis-arib-design-residuals]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-tis-arib-design-residuals
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tis/DESIGN_JA.md')
          s=p.read_text()
          old='reflection、hidden API、`LinearBlock.map()`でESを`ByteArray`へ複製して通常input bufferへ入れる経路、通常ByteBuffer input modelへの代替処理を禁止する。'
          new='reflection、および本書で明示したMediaSync final-output観測用Framework-private `@hide` contract以外のnon-SDK APIを禁止する。`LinearBlock.map()`でESを`ByteArray`へ複製して通常input bufferへ入れる経路、通常ByteBuffer input modelへの代替処理も禁止する。'
          if s.count(old)!=1: raise SystemExit(f'match count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tis/DESIGN_JA.md
          git commit -m 'docs: narrow MediaSync private API exception'
          git push origin HEAD:agent/fix-tis-arib-design-residuals