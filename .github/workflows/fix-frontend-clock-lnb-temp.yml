name: Temporary frontend clock and fixed power design fix

on:
  push:
    branches:
      - agent/apply-tuner-hal2-design-proposals-v70
    paths:
      - .github/workflows/fix-frontend-clock-lnb-temp.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-frontend-clock-lnb-temp.yml

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apply-tuner-hal2-design-proposals-v70
          fetch-depth: 0
      - name: Run anchor-based correction script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/fix-frontend-clock-lnb-pr-temp.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in source[start:end].splitlines())
          exec(compile(script, 'embedded_design_fix.py', 'exec'))
