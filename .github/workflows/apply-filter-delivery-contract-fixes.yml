name: apply filter delivery contract fixes

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/tuner-hal2-rustfmt-1.81'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/tuner-hal2-rustfmt-1.81
      - name: Apply delay-hint and startId fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'missing replacement in {path}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1))

          # FilterRuntime remains the canonical A owner for delay and startId state.
          replace_once(
              'tuner_hal2/demux/src/runtime/filter.rs',
              '''use crate::config::{\n    AvStreamTypeConfig, FilterDelayHint, FilterDelayHints, FilterOpenType, OpenFilterRequest,\n    SectionConditionKind, SectionRuntimeConfig,\n};''',
              '''use crate::config::{\n    AvStreamTypeConfig, FilterDelayHint, FilterDelayHints, FilterDelayReadiness, FilterOpenType,\n    OpenFilterRequest, SectionConditionKind, SectionRuntimeConfig,\n};'''
          )
          replace_once(
              'tuner_hal2/demux/src/runtime/filter.rs',
              '''    #[cfg(test)]\n    pub fn delivery_readiness(&self) -> crate::config::FilterDelayReadiness {\n        self.delay_hints.delivery_readiness(\n            self.delivery_not_before\n                .map(|deadline| {\n                    if deadline <= Instant::now() {\n                        u64::MAX\n                    } else {\n                        0\n                    }\n                })\n                .unwrap_or(u64::MAX),\n            self.queued_bytes,\n        )\n    }''',
              '''    pub(crate) fn delivery_readiness(&self) -> FilterDelayReadiness {\n        self.delay_hints.delivery_readiness(\n            self.delivery_not_before\n                .map(|deadline| {\n                    if deadline <= Instant::now() {\n                        u64::MAX\n                    } else {\n                        0\n                    }\n                })\n                .unwrap_or(u64::MAX),\n            self.queued_bytes,\n        )\n    }\n\n    pub(crate) fn commit_delivery_batch(&mut self) {\n        self.queued_bytes = 0;\n        self.delivery_not_before = None;\n    }'''
          )
          replace_once(
              'tuner_hal2/demux/src/runtime/filter.rs',
              '''    pub(crate) fn take_pending_start_id(&mut self) -> Option<i32> {\n        self.pending_start_id.take()\n    }''',
              '''    pub(crate) const fn pending_start_id(&self) -> Option<i32> {\n        self.pending_start_id\n    }\n\n    pub(crate) fn commit_pending_start_id(&mut self, expected_start_id: i32) -> bool {\n        if self.pending_start_id != Some(expected_start_id) {\n            return false;\n        }\n        self.pending_start_id = None;\n        true\n    }'''
          )

          # DemuxRuntime exposes typed peek/commit while keeping FilterRuntime as state owner.
          replace_once(
              'tuner_hal2/demux/src/runtime/demux.rs',
              '''#[cfg(test)]\nuse crate::config::FilterDelayReadiness;\nuse crate::config::{\n    AvStreamTypeConfig, ConfigInputPid, FilterDelayHint, FilterOpenType, OpenFilterRequest,\n};''',
              '''use crate::config::{\n    AvStreamTypeConfig, ConfigInputPid, FilterDelayHint, FilterDelayReadiness, FilterOpenType,\n    OpenFilterRequest,\n};'''
          )
          replace_once(
              'tuner_hal2/demux/src/runtime/demux.rs',
              '''    pub fn take_pending_filter_start_id(\n        &mut self,\n        filter_id: i32,\n    ) -> Result<Option<i32>, DemuxRuntimeError> {\n        Ok(self\n            .filters\n            .get_mut(&filter_id)\n            .ok_or(DemuxRuntimeError::filter_missing(filter_id))?\n            .take_pending_start_id())\n    }''',
              '''    pub fn pending_filter_start_id(\n        &self,\n        filter_id: i32,\n    ) -> Result<Option<i32>, DemuxRuntimeError> {\n        Ok(self\n            .filters\n            .get(&filter_id)\n            .ok_or(DemuxRuntimeError::filter_missing(filter_id))?\n            .pending_start_id())\n    }\n\n    pub fn commit_pending_filter_start_id(\n        &mut self,\n        filter_id: i32,\n        expected_start_id: i32,\n    ) -> Result<bool, DemuxRuntimeError> {\n        Ok(self\n            .filters\n            .get_mut(&filter_id)\n            .ok_or(DemuxRuntimeError::filter_missing(filter_id))?\n            .commit_pending_start_id(expected_start_id))\n    }'''
          )

          # Record output contributes bytes to the same delay batch; do not drain its event immediately.
          replace_once(
              'tuner_hal2/demux/src/runtime/demux.rs',
              '''            let gate = match self.filter_producer_gates.get(&filter_id).cloned() {\n                Some(gate) => gate,\n                None => {\n                    drop(permit);\n                    diagnostics.push(\n                        PipelineDiagnostic::filter_queue_payload_delivery_failure(\n                            pid,\n                            filter_id,\n                            DemuxRuntimeError::filter_missing(filter_id),\n                        ),\n                    );\n                    continue;\n                }\n            };\n            if permit\n                .commit_record_output(TS_PACKET_SIZE, event)\n                .is_err()\n            {\n                self.quarantine_filter_runtime(filter_id);\n                diagnostics.push(\n                    PipelineDiagnostic::filter_queue_payload_delivery_failure(\n                        pid,\n                        filter_id,\n                        DemuxRuntimeError::queue_runtime_failure(filter_id),\n                    ),\n                );\n                continue;\n            }\n            match gate.take_pending_events() {\n                Ok(mut events) => generated_events.append(&mut events),\n                Err(_) => {\n                    self.quarantine_filter_runtime(filter_id);\n                    diagnostics.push(\n                        PipelineDiagnostic::filter_queue_payload_delivery_failure(\n                            pid,\n                            filter_id,\n                            DemuxRuntimeError::queue_runtime_failure(filter_id),\n                        ),\n                    );\n                }\n            }''',
              '''            if permit\n                .commit_record_output(TS_PACKET_SIZE, event)\n                .is_err()\n            {\n                self.quarantine_filter_runtime(filter_id);\n                diagnostics.push(\n                    PipelineDiagnostic::filter_queue_payload_delivery_failure(\n                        pid,\n                        filter_id,\n                        DemuxRuntimeError::queue_runtime_failure(filter_id),\n                    ),\n                );\n                continue;\n            }\n            if let Some(filter) = self.filters.get_mut(&filter_id) {\n                filter.note_payload_queued(TS_PACKET_SIZE);\n            }'''
          )

          # Pending callback events stay in FilterProducerDrainGate until either delay condition is ready.
          replace_once(
              'tuner_hal2/demux/src/runtime/demux.rs',
              '''        for filter_id in gates_with_pending_events {\n            let pending = self\n                .filter_producer_gates\n                .get(&filter_id)\n                .ok_or(DemuxRuntimeError::filter_missing(filter_id))\n                .and_then(|gate| {\n                    gate.take_pending_events()\n                        .map_err(|_| DemuxRuntimeError::queue_runtime_failure(filter_id))\n                });\n            match pending {\n                Ok(mut pending) => committed_events.append(&mut pending),\n                Err(error) => {\n                    self.quarantine_filter_runtime(filter_id);\n                    diagnostics.push(PipelineDiagnostic::filter_queue_payload_delivery_failure(\n                        packet_pid,\n                        filter_id,\n                        error,\n                    ));\n                }\n            }\n        }''',
              '''        for (filter_id, filter) in &self.filters {\n            if filter.state().is_started()\n                && filter.delivery_readiness() == FilterDelayReadiness::Ready\n            {\n                gates_with_pending_events.insert(*filter_id);\n            }\n        }\n        for filter_id in gates_with_pending_events {\n            let ready = self\n                .filters\n                .get(&filter_id)\n                .is_some_and(|filter| {\n                    filter.state().is_started()\n                        && filter.delivery_readiness() == FilterDelayReadiness::Ready\n                });\n            if !ready {\n                continue;\n            }\n            let pending = self\n                .filter_producer_gates\n                .get(&filter_id)\n                .ok_or(DemuxRuntimeError::filter_missing(filter_id))\n                .and_then(|gate| {\n                    gate.take_pending_events()\n                        .map_err(|_| DemuxRuntimeError::queue_runtime_failure(filter_id))\n                });\n            match pending {\n                Ok(mut pending) => {\n                    if !pending.is_empty() {\n                        if let Some(filter) = self.filters.get_mut(&filter_id) {\n                            filter.commit_delivery_batch();\n                        }\n                        committed_events.append(&mut pending);\n                    }\n                }\n                Err(error) => {\n                    self.quarantine_filter_runtime(filter_id);\n                    diagnostics.push(PipelineDiagnostic::filter_queue_payload_delivery_failure(\n                        packet_pid,\n                        filter_id,\n                        error,\n                    ));\n                }\n            }\n        }'''
          )

          # Snapshot carries the runtime filter id so successful startId delivery can commit the pending id.
          replace_once(
              'tuner_hal2/service_runtime/src/boot.rs',
              '''pub struct FilterEventDeliverySnapshot {\n    pub object_id: AidlObjectId,\n    pub generation: AidlObjectGeneration,\n    pub event: FilterEventDelivery,\n}''',
              '''pub struct FilterEventDeliverySnapshot {\n    pub object_id: AidlObjectId,\n    pub generation: AidlObjectGeneration,\n    pub filter_id: i32,\n    pub event: FilterEventDelivery,\n}'''
          )
          replace_once(
              'tuner_hal2/service_runtime/src/boot.rs',
              '''        let mut snapshots = Vec::new();\n        for event in reports''',
              '''        let mut snapshots = Vec::new();\n        let mut start_id_snapshot_emitted = BTreeSet::new();\n        for event in reports'''
          )
          replace_once(
              'tuner_hal2/service_runtime/src/boot.rs',
              '''            if let Some(start_id) = owner_demux_id\n                .and_then(|demux_id| self.registry.demux_runtime_mut(DemuxRuntimeId(demux_id)))\n                .and_then(|demux| demux.take_pending_filter_start_id(filter_id).ok())\n                .flatten()\n            {\n                snapshots.push(FilterEventDeliverySnapshot {\n                    object_id,\n                    generation,\n                    event: FilterEventDelivery::StartId(start_id),\n                });\n            }\n            snapshots.push(FilterEventDeliverySnapshot {\n                object_id,\n                generation,\n                event,\n            });''',
              '''            if start_id_snapshot_emitted.insert(filter_id) {\n                if let Some(start_id) = owner_demux_id\n                    .and_then(|demux_id| self.registry.demux_runtime(DemuxRuntimeId(demux_id)))\n                    .and_then(|demux| demux.pending_filter_start_id(filter_id).ok())\n                    .flatten()\n                {\n                    snapshots.push(FilterEventDeliverySnapshot {\n                        object_id,\n                        generation,\n                        filter_id,\n                        event: FilterEventDelivery::StartId(start_id),\n                    });\n                }\n            }\n            snapshots.push(FilterEventDeliverySnapshot {\n                object_id,\n                generation,\n                filter_id,\n                event,\n            });'''
          )
          replace_once(
              'tuner_hal2/service_runtime/src/boot.rs',
              '''        snapshots\n    }\n}\n\n#[cfg(test)]\nmod raw_filter_event_projection_tests''',
              '''        snapshots\n    }\n\n    pub fn commit_filter_start_id_delivery(\n        &mut self,\n        object_id: AidlObjectId,\n        object_generation: AidlObjectGeneration,\n        filter_id: i32,\n        start_id: i32,\n    ) -> Result<(), HalError> {\n        let entry = self\n            .object_table\n            .live_entry_for_runtime(AidlObjectKind::Filter, LedgerId(i64::from(filter_id)))\n            .ok_or_else(|| {\n                HalError::invalid_state(\n                    HalInvalidStateKind::InvalidLifecycle,\n                    "filter object is no longer live while committing startId delivery",\n                )\n            })?;\n        if entry.object_id != object_id || entry.generation != object_generation {\n            return Err(HalError::invalid_state(\n                HalInvalidStateKind::InvalidLifecycle,\n                "filter object generation changed while committing startId delivery",\n            ));\n        }\n        let owner_demux_id = self\n            .registry\n            .filter(FilterRuntimeId(filter_id))\n            .map(|filter| filter.owner_demux_id)\n            .ok_or_else(|| {\n                HalError::invalid_state(\n                    HalInvalidStateKind::InvalidLifecycle,\n                    "filter registry entry is missing while committing startId delivery",\n                )\n            })?;\n        let committed = self\n            .registry\n            .demux_runtime_mut(DemuxRuntimeId(owner_demux_id))\n            .ok_or_else(|| {\n                HalError::invalid_state(\n                    HalInvalidStateKind::InvalidLifecycle,\n                    "owner demux is missing while committing startId delivery",\n                )\n            })?\n            .commit_pending_filter_start_id(filter_id, start_id)\n            .map_err(demux_runtime_error_to_hal)?;\n        if committed {\n            Ok(())\n        } else {\n            Err(HalError::internal(\n                HalInternalKind::InvariantViolation,\n                "pending filter startId changed before successful delivery commit",\n            ))\n        }\n    }\n}\n\n#[cfg(test)]\nmod raw_filter_event_projection_tests'''
          )

          # AIDL dispatcher commits startId only after Binder success and fences normal events on failure.
          replace_once(
              'tuner_hal2/aidl_service/src/filter_callback_delivery.rs',
              '''use std::sync::{Arc, Mutex, Weak};''',
              '''use std::collections::BTreeSet;\nuse std::sync::{Arc, Mutex, Weak};'''
          )
          replace_once(
              'tuner_hal2/aidl_service/src/filter_callback_delivery.rs',
              '''        let mut failures = FirstErrorCollector::new();\n        for snapshot in snapshots {\n            let handle = AidlObjectHandle::new(''',
              '''        let mut failures = FirstErrorCollector::new();\n        let mut start_id_blocked = BTreeSet::new();\n        for snapshot in snapshots {\n            let delivery_key = (snapshot.object_id.0, snapshot.generation.0);\n            if start_id_blocked.contains(&delivery_key) {\n                continue;\n            }\n            let pending_start_id = match &snapshot.event {\n                FilterEventDelivery::StartId(start_id) => Some(*start_id),\n                _ => None,\n            };\n            let filter_id = snapshot.filter_id;\n            let handle = AidlObjectHandle::new('''
          )
          # Mark the generation blocked on pre-Binder failures of the mandatory startId callback.
          for needle in [
              '''                    failures.push_error(HalError::internal(\n                        HalInternalKind::InvariantViolation,\n                        "AIDL service context is not available for filter callback delivery",\n                    ));\n                    continue;''',
              '''                    failures.push_result(finish_filter_callback_delivery_failure(\n                        &context,\n                        runtime,\n                        handle,\n                        CallbackDeliveryFailurePhase::CallbackArtifactLookup,\n                        primary,\n                    ));\n                    continue;''',
              '''                    failures.push_result(finish_filter_callback_delivery_failure(\n                        &context,\n                        runtime,\n                        handle,\n                        CallbackDeliveryFailurePhase::EventConversion,\n                        primary,\n                    ));\n                    continue;'''
          ]:
              replacement = needle.replace('                    continue;', '''                    if pending_start_id.is_some() {\n                        start_id_blocked.insert(delivery_key);\n                    }\n                    continue;''')
              replace_once('tuner_hal2/aidl_service/src/filter_callback_delivery.rs', needle, replacement)
          # There are two callback-artifact branches with the same text; patch the second too if it remains.
          p = Path('tuner_hal2/aidl_service/src/filter_callback_delivery.rs')
          s = p.read_text()
          artifact_old = '''                    failures.push_result(finish_filter_callback_delivery_failure(\n                        &context,\n                        runtime,\n                        handle,\n                        CallbackDeliveryFailurePhase::CallbackArtifactLookup,\n                        primary,\n                    ));\n                    continue;'''
          if artifact_old in s:
              s = s.replace(artifact_old, artifact_old.replace('                    continue;', '''                    if pending_start_id.is_some() {\n                        start_id_blocked.insert(delivery_key);\n                    }\n                    continue;'''), 1)
              p.write_text(s)
          replace_once(
              'tuner_hal2/aidl_service/src/filter_callback_delivery.rs',
              '''            if let Err(error) = delivery_result {\n                let primary = HalError::callback_failed(\n                    operation,\n                    format!("binder failure: {error:?}"),\n                );\n                failures.push_result(finish_filter_callback_delivery_failure(\n                    &context,\n                    runtime,\n                    handle,\n                    CallbackDeliveryFailurePhase::BinderDelivery,\n                    primary,\n                ));\n            }''',
              '''            if let Err(error) = delivery_result {\n                let primary = HalError::callback_failed(\n                    operation,\n                    format!("binder failure: {error:?}"),\n                );\n                failures.push_result(finish_filter_callback_delivery_failure(\n                    &context,\n                    runtime,\n                    handle,\n                    CallbackDeliveryFailurePhase::BinderDelivery,\n                    primary,\n                ));\n                if pending_start_id.is_some() {\n                    start_id_blocked.insert(delivery_key);\n                }\n                continue;\n            }\n            if let Some(start_id) = pending_start_id {\n                let commit_result = runtime\n                    .lock()\n                    .map_err(|_| {\n                        HalError::internal(\n                            HalInternalKind::InvariantViolation,\n                            "service runtime lock poisoned while committing filter startId delivery",\n                        )\n                    })\n                    .and_then(|mut runtime| {\n                        runtime.commit_filter_start_id_delivery(\n                            handle.object_id(),\n                            handle.generation(),\n                            filter_id,\n                            start_id,\n                        )\n                    });\n                if let Err(error) = commit_result {\n                    failures.push_error(error);\n                    start_id_blocked.insert(delivery_key);\n                }\n            }'''
          )
          replace_once(
              'tuner_hal2/aidl_service/src/filter_callback_delivery.rs',
              '''        FilterEventDeliverySnapshot {\n            object_id: AidlObjectId(1),\n            generation: AidlObjectGeneration(2),\n            event,\n        }''',
              '''        FilterEventDeliverySnapshot {\n            object_id: AidlObjectId(1),\n            generation: AidlObjectGeneration(2),\n            filter_id: 3,\n            event,\n        }'''
          )
          PY
      - name: Format and validate
        shell: bash
        run: |
          cd tuner_hal2/host_ci
          cargo fmt --all
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cd ../..
          git diff --check
      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-filter-delivery-contract-fixes.yml
          git config user.name 'maleicacid'
          git config user.email '4982384+kazuki0824@users.noreply.github.com'
          git add -A
          git commit -m 'fix(tuner-hal2): honor filter delivery contracts'
          git push origin HEAD:fix/tuner-hal2-rustfmt-1.81
