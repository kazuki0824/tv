name: Fix PR19 MediaEvent PTS boundaries

on:
  push:
    branches:
      - agent/fix-tis-arib-design-residuals

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-tis-arib-design-residuals
          fetch-depth: 0
      - shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('tis/DESIGN_JA.md')
          text = p.read_text(encoding='utf-8')

          old1 = '''現行 product の平文 non-tunneled AV入力は、Tuner `MediaEvent.getLinearBlock()` と `MediaCodec` block model の型付き経路だけを正式経路とする。video／audio decoderは `MediaCodec.CONFIGURE_FLAG_USE_BLOCK_MODEL` で構成し、入力slotの `MediaCodec.QueueRequest.setLinearBlock(linearBlock, offset, dataLength)` を使う。`MediaEvent.isPtsPresent()` が true のsampleでは、raw PTSを90 kHz、33 bit modulo値として扱う。`PlaybackPipeline` は playback generation ごとに `PtsNormalizer` を1個だけ所有し、連続するraw PTSの差を modulo `2^33` の最短signed差としてunwrapしてgeneration内のextended PTSへ変換する。extended PTSから `presentationTimeUs = floor(pts90k * 1000000 / 90000)` をoverflow-safeなchecked integer arithmeticで算出し、`MediaCodec.QueueRequest.setPresentationTimeUs()`へ設定する。`isPtsPresent()` が false のsampleはAOSP Tuner API上で表現可能な入力状態として扱い、0、前sample、PCR、wallclock等から時刻を捏造せず、そのsampleだけをcodecへqueueせず解放してtrack別`MISSING_PTS_SAMPLE`診断へ計上する。PTS欠落sample単体を理由にplayback generationを再生不能へ遷移させず、`notifyVideoUnavailable()`も呼ばない。first frame前ではPTS欠落sampleをdecoder入力可能状態への進捗として数えず、既存の`decoderStartupDeadlineMs`を延長またはリセットしない。first frame後も当該sampleだけを破棄し、generation全体のunavailable遷移は既存のdecoder error、lock喪失、startup/backpressure deadline等の独立条件だけで判定する。このsample自体をTuner HALのmalformed eventとは扱わない。'''
          new1 = '''現行 product の平文 non-tunneled AV入力は、Tuner `MediaEvent.getLinearBlock()` と `MediaCodec` block model の型付き経路だけを正式経路とする。AOSP Tuner の media filter output は complete ES に限定されず partial ES も許すため、`MediaEvent` 1件を独立したaccess unitと仮定しない。video／audio decoderは `MediaCodec.CONFIGURE_FLAG_USE_BLOCK_MODEL` で構成し、track別のbounded `AccessUnitAssembler` がcodec bitstreamのframe/access-unit境界を確定するまで、到着順の`MediaEvent`／`LinearBlock`／rangeとそのeventに付随するPTS有無を保持する。境界確定後、1 access unitが複数rangeに分割されている場合は元のnon-overlap rangeを順に`MediaCodec.QueueRequest.setLinearBlock()`へ渡し、最後以外を`MediaCodec.BUFFER_FLAG_PARTIAL_FRAME`でqueueしてcodec側に同一frameとしてbatchさせる。1つの明示PTSがそのaccess unitに関連付けられた場合だけ、その90 kHz・33 bit値から算出した同一`presentationTimeUs`を当該access unitの各fragmentへ設定する。0、直前access unit、PCR、wallclock、frame rate等からPTSを補間・捏造しない。complete access unitの境界が確定しても明示PTSを関連付けられない場合に限り、その**完成access unit全体**をcodecへ渡さず解放してtrack別`MISSING_PTS_ACCESS_UNIT`診断へ計上する。`isPtsPresent()==false`の`MediaEvent`だけを理由にそのpayload/rangeを単独破棄してはならず、途中fragmentを欠落させない。incomplete access unitは既存のper-track pending byte/count budgetとstartup/backpressure deadlineに従い、上限超過時は当該incomplete unit全体を`INCOMPLETE_ACCESS_UNIT`として破棄するがdeadlineを延長・リセットしない。PTS欠落access unit単体を理由にplayback generationを再生不能へ遷移させず、generation全体のunavailable遷移は既存のdecoder error、lock喪失、startup/backpressure deadline等の独立条件だけで判定する。'''

          old2 = '''`PtsNormalizer` の状態はretune、新playback generation、filter flush、decoder再生成、非wrap discontinuityで破棄する。通常の33 bit wrapだけは同generation内の連続差としてunwrapし、独自media clock、PCR→wallclock変換、独自future/late schedulerへ拡張しない。reflection、および本書で明示したMediaSync final-output観測用Framework-private `@hide` contract以外のnon-SDK APIを禁止する。`LinearBlock.map()`でESを`ByteArray`へ複製して通常input bufferへ入れる経路、通常ByteBuffer input modelへの代替処理も禁止する。`MediaEvent`、`LinearBlock`、decoder input claimはqueue成功または破棄確定まで保持し、queue成功後にだけ呼出側所有権を解放する。secure `MediaEvent`は現行平文productの対象外とし、mappable blockへの暗黙変換を行わない。'''
          new2 = '''`PlaybackPipeline` はplayback generation内のactive compressed trackごとに独立した`PtsNormalizer`を持ち、video／各selected audio等のraw PTS列を相互に比較しない。各normalizerは最初の明示PTSをそのtrackのextended PTS seedとし、2件目以後は `delta = ((rawNew - rawPrev + 2^32) mod 2^33) - 2^32` の範囲 `[-2^32, 2^32-1]` で前回raw PTSとの差を一意に求め、`extendedNew = extendedPrev + delta` とする。したがって `2^33-1 -> 0` は+1の通常wrap、`0 -> 2^33-1`は-1のreorder、ちょうど半周期差は-`2^32`と固定する。negative deltaを含むpresentation-order reorderはそれ自体をdiscontinuityとみなさない。現行productはPTS差分の大きさだけから独自のforward/backward thresholdで「non-wrap discontinuity」を推定しない。retune、新playback generation、filter flush、decoder再生成、track置換等の明示的lifecycle境界でのみ対応trackのnormalizerを破棄し、境界後の最初の明示PTSを新seedとする。filterをstop/reconfigure/restartした場合の`RestartEvent`は旧configuration eventを捨てるevent-validity境界としてgeneration管理に使うが、任意のin-stream PTS jump検出器としては使わない。通常wrap／reorder／large deltaだけではgenerationを再生成しない。独自media clock、PCR→wallclock変換、独自future/late schedulerへ拡張しない。reflection、および本書で明示したMediaSync final-output観測用Framework-private `@hide` contract以外のnon-SDK APIを禁止する。`LinearBlock.map()`でESを`ByteArray`へ複製して通常input bufferへ入れる経路、通常ByteBuffer input modelへの代替処理も禁止する。`MediaEvent`、`LinearBlock`、decoder input claimは、そのrangeが属するaccess unitの全fragmentをqueue成功または破棄確定するまで保持し、queue成功後にだけ呼出側所有権を解放する。secure `MediaEvent`は現行平文productの対象外とし、mappable blockへの暗黙変換を行わない。'''

          old3 = '''`getLinearBlock()`がnull、block model configureまたはQueueRequestが利用不能、offset／lengthがblock範囲外、decoderが当該blockを受理しない場合は`BLOCK_MODEL_UNAVAILABLE`または入力不正の型付き診断へ落とす。成功を偽装せず、現generationのfilter、未queue event、decoder、MediaSync、startup queue、budget claimを解放して`notifyVideoUnavailable(VIDEO_UNAVAILABLE_REASON_UNKNOWN)`へ進む。'''
          new3 = '''`MediaEvent.getOffset()`／`getDataLength()`は`long`のまま境界検査し、`offsetLong >= 0`、`dataLengthLong > 0`、`offsetLong <= Int.MAX_VALUE`、`dataLengthLong <= Int.MAX_VALUE`を先に満たすことを要求する。次に`offsetLong + dataLengthLong`をchecked additionで算出して`long` overflowを拒否し、clear productでmappableな`LinearBlock`のmapped capacityを`long`へ拡張した値以下であることを確認する。これらをすべて満たした後だけ`Math.toIntExact()`相当でoffset／sizeを`int`へnarrowし、`QueueRequest.setLinearBlock()`へ渡す。implicit cast、truncate、narrow後のoverflow検査は禁止する。`getLinearBlock()`がnull、block model configureまたはQueueRequestが利用不能、上記range／narrowing検査違反、decoderが当該blockを受理しない場合は`BLOCK_MODEL_UNAVAILABLE`または入力不正の型付き診断へ落とす。成功を偽装せず、現generationのfilter、未queue event、decoder、MediaSync、startup queue、budget claimを解放して`notifyVideoUnavailable(VIDEO_UNAVAILABLE_REASON_UNKNOWN)`へ進む。'''

          old4 = '''retune、playback generation変更、stop、flush、非wrap PTS discontinuity、Surface変更、AudioTrack切替／再生成、audio route変更、decoder再生成では、既存MediaSyncの内部anchorを再利用せず、playback rateを0へ戻して未返却audio bufferと旧decoder outputを回収し、MediaSync input Surface、MediaSync、decoder、AudioTrackを解放して新generationとして再生成する。通常33-bit PTS wrapはgeneration内でunwrapし、wrapだけでは再生成しない。旧generationのdecoder／MediaSync／route callbackはstate更新に使わず、旧bufferを非描画解放する。'''
          new4 = '''retune、playback generation変更、stop、flush、Surface変更、AudioTrack切替／再生成、audio route変更、decoder再生成では、既存MediaSyncの内部anchorを再利用せず、playback rateを0へ戻して未返却audio bufferと旧decoder outputを回収し、MediaSync input Surface、MediaSync、decoder、AudioTrackを解放して新generationとして再生成する。PTS raw deltaの大小、通常33-bit wrap、presentation-order reorderだけではMediaSync generationを再生成しない。旧generationのdecoder／MediaSync／route callbackはstate更新に使わず、旧bufferを非描画解放する。'''

          old5 = '''最低試験契約は、型付きLinearBlock→block model QueueRequest、ES全体copy禁止、PTS欠落sample単体dropとgeneration継続、通常PTS wrap、MediaSync rate-0有限prefillからstartup gate成立後speed 1.0へ遷移すること、`MEDIASYNC_ERROR_SURFACE_FAIL`と`MEDIASYNC_ERROR_AUDIOTRACK_FAIL`の分離、audio-videoでAudioTrack failure時のvideo-only継続、audio-onlyでの再生不能遷移、video-onlyがAudioTrack error遷移を持たないこと、initial availability epochでfinal-output成功前はvideo availableにしないこと、late-drop／attach失敗／queue失敗でepochを消費しないこと、成功event後だけ一回availability通知すること、`available -> recoverable unavailable -> available`で同MediaSync instanceを維持する場合に新しい`availabilityEpochId`でlistenerをre-armして次のfinal-output成功後だけ再availableにすること、**epoch Aのfinal-output成功eventを生成したままJava配送を遅延させ、その間にunavailable遷移とepoch Bのre-armを行った場合、遅延event AをID不一致で破棄し、epoch B arm後の新しいfinal-output成功eventだけで再availableにする競合試験**、generation teardown後は新instanceのinitial armを使うこと、audio bufferのconsume callbackまでの寿命、A/V同期、video-only、audio-only、retune／flush／非wrap discontinuity／Surface変更／AudioTrack切替・再生成／audio route変更／decoder再生成後のMediaSync再生成、route変更後の旧generation非利用、MediaSync error写像、stale generation非描画を含む。試験のqueue数値上限は選択した`ProductProfile`と一致させる。'''
          new5 = '''最低試験契約は、型付きLinearBlock→block model QueueRequest、ES全体copy禁止、**PTSなしのpartial `MediaEvent`を単独dropせず保持して後続fragmentとaccess unitを完成させること、複数fragmentの完成access unitを最後以外`BUFFER_FLAG_PARTIAL_FRAME`でqueueすること、完成access unitに関連付く明示PTSを各fragmentへ同一値で渡すこと、明示PTSが無い場合はevent fragmentではなく完成access unit単位でだけdropすること**、incomplete access unitのbudget超過、track別PtsNormalizer、`2^33-1 -> 0` wrap、`0 -> 2^33-1` reorder、半周期差=`-2^32`、audio/video interleaveでnormalizer stateを共有しないこと、PTS deltaの大小だけではgeneration resetしないこと、flush／track置換後の最初の明示PTSが新seedになること、`MediaEvent`のlong offset／lengthについて負値、0 length、`Int.MAX_VALUE`境界、`Int.MAX_VALUE+1`、checked-add overflow、`end==capacity`、`end>capacity`をnarrow前に検査すること、MediaSync rate-0有限prefillからstartup gate成立後speed 1.0へ遷移すること、`MEDIASYNC_ERROR_SURFACE_FAIL`と`MEDIASYNC_ERROR_AUDIOTRACK_FAIL`の分離、audio-videoでAudioTrack failure時のvideo-only継続、audio-onlyでの再生不能遷移、video-onlyがAudioTrack error遷移を持たないこと、initial availability epochでfinal-output成功前はvideo availableにしないこと、late-drop／attach失敗／queue失敗でepochを消費しないこと、成功event後だけ一回availability通知すること、`available -> recoverable unavailable -> available`で同MediaSync instanceを維持する場合に新しい`availabilityEpochId`でlistenerをre-armして次のfinal-output成功後だけ再availableにすること、**epoch Aのfinal-output成功eventを生成したままJava配送を遅延させ、その間にunavailable遷移とepoch Bのre-armを行った場合、遅延event AをID不一致で破棄し、epoch B arm後の新しいfinal-output成功eventだけで再availableにする競合試験**、generation teardown後は新instanceのinitial armを使うこと、audio bufferのconsume callbackまでの寿命、A/V同期、video-only、audio-only、retune／flush／Surface変更／AudioTrack切替・再生成／audio route変更／decoder再生成後のMediaSync再生成、route変更後の旧generation非利用、MediaSync error写像、stale generation非描画を含む。試験のqueue数値上限は選択した`ProductProfile`と一致させる。'''

          for old, new in [(old1,new1),(old2,new2),(old3,new3),(old4,new4),(old5,new5)]:
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'expected one match, got {n}: {old[:100]!r}')
              text = text.replace(old,new,1)

          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tis/DESIGN_JA.md
          git commit -m 'docs: define partial ES and PTS boundaries'
          git push origin HEAD:agent/fix-tis-arib-design-residuals
