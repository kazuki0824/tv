name: PR54 F11/F15 文書同期（一時）

on:
  pull_request:
    paths:
      - "tis/**"
      - ".github/workflows/tis-host-ci.yml"
      - ".github/tmp/tis-host-ci.yml.orig"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/implement-tis-arib-si-design-pr53
          fetch-depth: 1
          persist-credentials: true

      - name: F11/F15の設計・統合文書を部分更新
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          design = Path("tis/DESIGN_JA.md")
          text = design.read_text()

          scan = re.compile(r"TISの物理候補表は製品scan実装データのSSOTであり、.*?driver固有slotまたはlegacy数値域への写像はTuner HALへ委ねる。", re.S)
          scan_new = """TISの物理候補表は製品scan実装データのSSOTであり、`開発規則.md`の規範値に従うRF候補を唯一保持する。BS setup/rescanは物理RFごとにstream selector未指定の`IsdbsFrontendSettings`でAOSP `Tuner.scan()`を実行し、`ScanCallback.onInputStreamIdsReported()`で得たcurrent stream IDをtyped `STREAM_ID` explicit tune candidateへ変換する。dynamic stream-ID discoveryが正常完了して1件以上のIDを報告した場合は、その報告IDだけを候補にする。scan開始後の失敗、timeout、または正常完了してもstream IDが0件の場合はfail-closedとし、versioned TSID表を代入しない。一方、frontend/HALがdynamic stream-ID discoveryという能力自体を提供しないことをframeworkの`Tuner.RESULT_UNAVAILABLE`として明示した場合に限り、`開発規則.md`のversioned BS TSID表を当該RFのexplicit `STREAM_ID` tune候補seedとして使用してよい。TISはbackend名、driver名、HAL内部のeffective capabilityを取得・推測してこの分岐を行わず、frameworkから返るtyped resultだけを判断入力にする。versioned TSID表はchannel登録事実ではなく選局候補に限定し、各候補を実際にtuneした後、PAT/NIT/SDT actualからONID/TSID/SIDとcurrent transportを確認できたserviceだけを登録・公開する。driver固有slotまたはlegacy数値域への写像はTuner HALへ委ねる。"""
          if "dynamic stream-ID discoveryという能力自体" not in text:
              text, n = scan.subn(scan_new, text, count=1)
              if n != 1:
                  raise SystemExit("F15設計段落を置換できません")

          f11 = re.compile(r"- ARIB exceptional ratingのpolicy ownerはLive TV Appとする。.*?TISはraw値から独自policyを実装せず ?`TvInputManager\.isRatingBlocked\(\)` ?の結果だけに従う。", re.S)
          f11_new = """- ARIB exceptional ratingのpolicy ownerはLive TV Appとする。rating定義は独立`AribContentRatings` APKがTIF標準providerとして公開し、System TV App本体へ直接patchを当てない。Android 15 / LineageOS 22.1系の既存`ContentRatingLevelPolicy`はTIF rating-provider XMLの`contentAgeHint`をpreset policyの入力として使い、`HIGH`は6以上、`MEDIUM`は12以上、`LOW`は各rating system内の最大age hint以上をblocked候補へ投影し、`NONE`は空集合にする。`ARIB_EXCEPTIONAL`は単一rating `BROADCASTER_DEFINED`を`contentAgeHint=18`で公開するため、既存policyでは`HIGH/MEDIUM/LOW`の各presetでblocked候補に含まれる。ここでの18はproduct preset policy分類用metadataであり、ARIB raw `parental_rating_descriptor.rating`を18歳へ解釈・変換した値ではない。明示受信した`0x12..0xFF`は従来どおり全て同一canonical exceptional ratingへ写像する。`CUSTOM`はstock TV Appの通常blocked-rating編集を正とし、このextensionがprivate stateを読んで強制上書きしない。第二policy APK、TV App private state reader、System TV App source patchを追加せず、PIN認証済みcurrent contentの`onUnblockContent()`一時解除と他domain/ratingSystemのpolicyを変更しない。TISはraw値から独自policyを実装せず`TvInputManager.isRatingBlocked()`の結果だけに従う。"""
          if "System TV App本体へ直接patchを当てない" not in text:
              text, n = f11.subn(f11_new, text, count=1)
              if n != 1:
                  raise SystemExit("F11設計段落を置換できません")
          design.write_text(text)

          p = Path("tis/INTEGRATION.md")
          text = p.read_text()
          start = "## ARIB exceptional ratingのLive TV App最小policy統合\n"
          end = "## MediaSync Exact-mode platform統合\n"
          if "## ARIB exceptional ratingのLive TV App標準extension統合" not in text:
              i = text.find(start)
              j = text.find(end)
              if i < 0 or j < 0 or j <= i:
                  raise SystemExit("INTEGRATIONのF11節境界が見つかりません")
              replacement = """## ARIB exceptional ratingのLive TV App標準extension統合

JPN parental rating raw `0x12..0xFF` はTISで年齢値へ推測変換せず、`com.maleicacid.tv.ratings / ARIB_EXCEPTIONAL / BROADCASTER_DEFINED`へ写像する。rating定義とTV Appへの発見経路は独立`AribContentRatings` APKがTIF標準providerとして所有し、blocked-rating policyのownerはLive TV Appとする。System TV App本体へ直接patchを当てる方式は採用しない。

Android 15 / LineageOS 22.1系の既存`ContentRatingLevelPolicy`はTIF rating-provider XMLの`contentAgeHint`をpreset policyの入力として使う。`HIGH`は6以上、`MEDIUM`は12以上、`LOW`はrating system内の最大age hint以上をblocked候補へ含め、`NONE`は空集合にする。単一ratingである`BROADCASTER_DEFINED`は既存XMLの`contentAgeHint=18`を維持するため、stock policyでは`HIGH/MEDIUM/LOW`の各presetでblocked候補になる。18はproduct preset policy分類用metadataであり、ARIB raw `0x12..0xFF`の年齢解釈ではない。`CUSTOM`ではstock TV Appの通常rating設定から同canonical ratingを追加・削除する。第二policy APK、TV App private state reader、`packages/apps/TV` source patchは追加しない。

製品buildでは`AribContentRatings`とstock `LiveTv`を組み込み、rating-provider receiverとXML metadataを発見可能にする。repo内では`AribContentRatings`のpackage/action/meta-data、`ARIB_EXCEPTIONAL / BROADCASTER_DEFINED`、`contentAgeHint=18`を静的確認し、旧System TV App patchを正規経路として残さない。product tree / 実機では、rating provider discovery、parental controls無効、`NONE`、`HIGH/MEDIUM/LOW`、`CUSTOM`での標準blocked-rating編集、PIN unblock、他domain/ratingSystem非干渉を確認する。

```text
m AribContentRatings LiveTv
```

TISは引き続き`TvInputManager.isRatingBlocked()`だけをcurrent policy authorityとして扱う。既存のblocked-rating永続化、PIN認証後のsession-level`onUnblockContent()`、通常年齢rating、第三者custom ratingの扱いは変更しない。

"""
              p.write_text(text[:i] + replacement + text[j:])
          PY

      - name: 元CIを復元して一時物を削除
        shell: bash
        run: |
          cp .github/tmp/tis-host-ci.yml.orig .github/workflows/tis-host-ci.yml
          rm .github/tmp/tis-host-ci.yml.orig
          rm -f .github/workflows/pr54-f11-f15-doc-sync-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(tis): F11/F15契約を実装へ同期"
          git push origin HEAD:agent/implement-tis-arib-si-design-pr53
