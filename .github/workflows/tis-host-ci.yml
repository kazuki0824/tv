name: PR54 F11/F15 文書補正（一時）

on:
  push:
    branches:
      - agent/implement-tis-arib-si-design-pr53

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/implement-tis-arib-si-design-pr53
          fetch-depth: 1
          persist-credentials: true

      - name: F11/F15文書補正
        run: python3 .github/scripts/pr54_f11_f15_cleanup.py

      - name: 通常CI復元と一時物撤去
        shell: bash
        run: |
          set -euo pipefail
          cp .github/tmp/tis-host-ci.yml.orig .github/workflows/tis-host-ci.yml
          rm .github/tmp/tis-host-ci.yml.orig
          rm .github/scripts/pr54_f11_f15_cleanup.py
          rm -f tis/.f11_f15_trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(tis): F11/F15残契約を完了"
          git push origin HEAD:agent/implement-tis-arib-si-design-pr53
