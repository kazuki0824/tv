name: TIS host CI

on:
  pull_request:
    paths:
      - "tis/**"
      - "arib_si_engine_rs/src/**"
      - "arib_si_engine_rs/host_ci/**"
      - ".github/workflows/tis-host-ci.yml"
  push:
    branches: [main]
    paths:
      - "tis/**"
      - "arib_si_engine_rs/src/**"
      - "arib_si_engine_rs/host_ci/**"
      - ".github/workflows/tis-host-ci.yml"

permissions:
  contents: read

concurrency:
  group: tis-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.81.0
  KOTLIN_VERSION: 1.9.22

jobs:
  caption-rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tis/host_ci/caption
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the LineageOS 22.1 Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt

      - name: Check caption JNI formatting
        run: cargo +"$RUST_TOOLCHAIN" fmt --all -- --check

  caption-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tis/host_ci/caption
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the LineageOS 22.1 Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Type-check caption JNI with the host ABI stub
        run: cargo +"$RUST_TOOLCHAIN" check --all-targets --locked

  caption-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tis/host_ci/caption
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the LineageOS 22.1 Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Run caption JNI host-compatible unit tests
        run: cargo +"$RUST_TOOLCHAIN" test --locked

  kotlin-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare pinned Kotlin and Android 14 inputs
        shell: bash
        run: |
          tools_dir="$RUNNER_TEMP/tis-kotlin-compile"
          mkdir -p "$tools_dir"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" \
            --output "$tools_dir/kotlin-compiler.zip"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://repo.maven.apache.org/maven2/org/robolectric/android-all/14-robolectric-10818077/android-all-14-robolectric-10818077.jar" \
            --output "$tools_dir/android-all.jar"
          echo "88b39213506532c816ff56348c07bbeefe0c8d18943bffbad11063cf97cac3e6  $tools_dir/kotlin-compiler.zip" | sha256sum --check
          echo "6be2218c6a53fe3c57bc22ebdc723edcb7270a8a6f187545708aa5c0ed813977  $tools_dir/android-all.jar" | sha256sum --check
          unzip -q "$tools_dir/kotlin-compiler.zip" -d "$tools_dir/compiler"
          echo "TIS_KOTLIN_HOME=$tools_dir/compiler/kotlinc" >> "$GITHUB_ENV"
          echo "TIS_ANDROID_ALL_JAR=$tools_dir/android-all.jar" >> "$GITHUB_ENV"

      - name: Compile TIS production Kotlin
        shell: bash
        run: |
          output_dir="$RUNNER_TEMP/tis-kotlin-production"
          mkdir -p "$output_dir"
          mapfile -d '' -t sources < <(
            find tis/src tis/host_ci/kotlin/stubs/android -type f -name '*.kt' -print0 | sort -z
          )
          "$TIS_KOTLIN_HOME/bin/kotlinc" \
            -J-Xmx4g \
            -jvm-target 17 \
            -classpath "$TIS_ANDROID_ALL_JAR" \
            -d "$output_dir" \
            "${sources[@]}"

  kotlin-host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the LineageOS 22.1 Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Build the real SI JNI library for host tests
        run: cargo +"$RUST_TOOLCHAIN" build --lib --locked --manifest-path arib_si_engine_rs/host_ci/Cargo.toml

      - name: Prepare pinned Kotlin, Android and JUnit inputs
        shell: bash
        run: |
          tools_dir="$RUNNER_TEMP/tis-kotlin-test"
          mkdir -p "$tools_dir"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" \
            --output "$tools_dir/kotlin-compiler.zip"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://repo.maven.apache.org/maven2/org/robolectric/android-all/14-robolectric-10818077/android-all-14-robolectric-10818077.jar" \
            --output "$tools_dir/android-all.jar"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar" \
            --output "$tools_dir/junit.jar"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar" \
            --output "$tools_dir/hamcrest-core.jar"
          echo "88b39213506532c816ff56348c07bbeefe0c8d18943bffbad11063cf97cac3e6  $tools_dir/kotlin-compiler.zip" | sha256sum --check
          echo "6be2218c6a53fe3c57bc22ebdc723edcb7270a8a6f187545708aa5c0ed813977  $tools_dir/android-all.jar" | sha256sum --check
          echo "8e495b634469d64fb8acfa3495a065cbacc8a0fff55ce1e31007be4c16dc57d3  $tools_dir/junit.jar" | sha256sum --check
          echo "66fdef91e9739348df7a096aa384a5685f4e875584cce89386a7a47251c4d8e9  $tools_dir/hamcrest-core.jar" | sha256sum --check
          unzip -q "$tools_dir/kotlin-compiler.zip" -d "$tools_dir/compiler"
          echo "TIS_KOTLIN_HOME=$tools_dir/compiler/kotlinc" >> "$GITHUB_ENV"
          echo "TIS_ANDROID_ALL_JAR=$tools_dir/android-all.jar" >> "$GITHUB_ENV"
          echo "TIS_JUNIT_JAR=$tools_dir/junit.jar" >> "$GITHUB_ENV"
          echo "TIS_HAMCREST_JAR=$tools_dir/hamcrest-core.jar" >> "$GITHUB_ENV"

      - name: Compile production and test Kotlin
        shell: bash
        run: |
          production_dir="$RUNNER_TEMP/tis-kotlin-production"
          test_dir="$RUNNER_TEMP/tis-kotlin-tests"
          mkdir -p "$production_dir" "$test_dir"
          mapfile -d '' -t production_sources < <(
            find tis/src tis/host_ci/kotlin/stubs/android -type f -name '*.kt' -print0 | sort -z
          )
          "$TIS_KOTLIN_HOME/bin/kotlinc" \
            -J-Xmx4g \
            -jvm-target 17 \
            -classpath "$TIS_ANDROID_ALL_JAR" \
            -d "$production_dir" \
            "${production_sources[@]}"
          test_classpath="$production_dir:$TIS_ANDROID_ALL_JAR:$TIS_JUNIT_JAR:$TIS_HAMCREST_JAR:$TIS_KOTLIN_HOME/lib/kotlin-test.jar:$TIS_KOTLIN_HOME/lib/kotlin-test-junit.jar"
          mapfile -d '' -t test_sources < <(
            find tis/tests/src tis/host_ci/kotlin/stubs/androidx -type f -name '*.kt' -print0 | sort -z
          )
          "$TIS_KOTLIN_HOME/bin/kotlinc" \
            -J-Xmx4g \
            -jvm-target 17 \
            -classpath "$test_classpath" \
            -d "$test_dir" \
            "${test_sources[@]}"
          echo "TIS_KOTLIN_PRODUCTION_DIR=$production_dir" >> "$GITHUB_ENV"
          echo "TIS_KOTLIN_TEST_DIR=$test_dir" >> "$GITHUB_ENV"

      - name: Run 130 host-compatible Kotlin tests
        shell: bash
        run: |
          mapfile -t discovered_classes < <(
            find "$TIS_KOTLIN_TEST_DIR" -type f -name '*Test.class' -printf '%P\n' \
              | sed 's#/#.#g; s#\.class$##' \
              | sort
          )
          test_classes=()
          for test_class in "${discovered_classes[@]}"; do
            case "$test_class" in
              com.maleicacid.tvinput.tis.DirectBootGuardR51FixTest|\
              com.maleicacid.tvinput.tis.ProviderDataAssetsR51ContractTest|\
              com.maleicacid.tvinput.tis.RecordingDisabledR51Test|\
              com.maleicacid.tvinput.tis.TvProviderWriterDescriptorSchemaTest)
                ;;
              *)
                test_classes+=("$test_class")
                ;;
            esac
          done
          test "${#discovered_classes[@]}" -eq 29
          test "${#test_classes[@]}" -eq 25
          runtime_classpath="$TIS_KOTLIN_PRODUCTION_DIR:$TIS_KOTLIN_TEST_DIR:$TIS_ANDROID_ALL_JAR:$TIS_JUNIT_JAR:$TIS_HAMCREST_JAR:$TIS_KOTLIN_HOME/lib/kotlin-stdlib.jar:$TIS_KOTLIN_HOME/lib/kotlin-stdlib-jdk7.jar:$TIS_KOTLIN_HOME/lib/kotlin-stdlib-jdk8.jar:$TIS_KOTLIN_HOME/lib/kotlin-test.jar:$TIS_KOTLIN_HOME/lib/kotlin-test-junit.jar"
          java \
            -Xmx4g \
            -Djava.library.path=arib_si_engine_rs/host_ci/target/debug/deps \
            -cp "$runtime_classpath" \
            org.junit.runner.JUnitCore \
            "${test_classes[@]}" \
            | tee "$RUNNER_TEMP/tis-junit.log"
          grep --fixed-strings "OK (130 tests)" "$RUNNER_TEMP/tis-junit.log"

  xml-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Parse TIS manifests, resources and permission XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          paths = sorted(Path("tis").rglob("*.xml"))
          if not paths:
              raise SystemExit("TIS XML files were not found")
          for path in paths:
              ElementTree.parse(path)
              print(path)
          PY
