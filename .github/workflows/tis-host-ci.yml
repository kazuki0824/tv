name: TIS ホストCI

on:
  pull_request:
    paths:
      - "tis/.f11_f15_trigger"
      - ".github/workflows/tis-host-ci.yml"

permissions:
  contents: write

jobs:
  f11_f15_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/implement-tis-arib-si-design-pr53
          fetch-depth: 1
          persist-credentials: true
      - name: triggerなしなら変更しない
        if: ${{ hashFiles('tis/.f11_f15_trigger') == '' }}
        run: echo "triggerなし"
      - name: F11/F15文書同期
        if: ${{ hashFiles('tis/.f11_f15_trigger') != '' }}
        shell: bash
        run: |
          python3 .github/scripts/pr54_f11_f15_sync.py
          cp .github/tmp/tis-host-ci.yml.orig .github/workflows/tis-host-ci.yml
          rm .github/tmp/tis-host-ci.yml.orig
          rm .github/scripts/pr54_f11_f15_sync.py
          rm tis/.f11_f15_trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(tis): F11/F15契約を実装へ同期"
          git push origin HEAD:agent/implement-tis-arib-si-design-pr53
