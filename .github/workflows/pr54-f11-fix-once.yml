name: PR54 F11 repair once

on:
  push:
    paths:
      - ".github/workflows/pr54-f11-fix-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/implement-tis-arib-si-design-pr53
          fetch-depth: 0
      - name: F11を適用
        run: python3 .github/scripts/pr54_f11_fix.py
      - name: rating extension契約を検証
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          manifest = Path('tis/arib_parental_rating/AndroidManifest.xml').read_text()
          rating = Path('tis/arib_parental_rating/res/xml/tv_content_rating_systems.xml').read_text()
          bp = Path('tis/arib_parental_rating/Android.bp').read_text()
          ET.fromstring(manifest)
          ET.fromstring(rating)
          assert 'android.media.tv.action.QUERY_CONTENT_RATING_SYSTEMS' in manifest
          assert 'android.media.tv.metadata.CONTENT_RATING_SYSTEMS' in manifest
          assert 'package="com.maleicacid.tv.ratings"' in manifest
          assert 'android:name="ARIB_EXCEPTIONAL"' in rating
          assert 'android:name="BROADCASTER_DEFINED"' in rating
          assert 'android:contentAgeHint="0"' in rating
          assert 'name: "AribContentRatings"' in bp
          assert 'AribContentRatings' in Path('tis/config/product_integration.mk').read_text()
          assert not Path('tis/platform_patches/lineage-22.1/packages_apps_TV_arib_exceptional_parental_policy.patch').exists()
          assert not Path('tis/arib_content_ratings').exists()
          PY
          git diff --check
      - name: 通常sourceをcommit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tis/arib_content_ratings tis/arib_parental_rating \
                     tis/platform_patches/lineage-22.1/packages_apps_TV_arib_exceptional_parental_policy.patch \
                     tis/INTEGRATION.md
          git commit -m "fix(tis): publish ARIB parental rating as product extension"
          git push origin HEAD:agent/implement-tis-arib-si-design-pr53
