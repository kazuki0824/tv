name: Temporary CAS plugin design patch

on:
  push:
    branches:
      - design/aosp-mediacas-b25-plugin
    paths:
      - .github/workflows/tmp-cas-plugin-doc-patch.yml

permissions:
  contents: write

jobs:
  patch-cross-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/aosp-mediacas-b25-plugin
          fetch-depth: 0
      - name: Patch CAS references in large current documents
        shell: python
        run: |
          from pathlib import Path

          def patch(path_name: str, transform) -> None:
              path = Path(path_name)
              before = path.read_text(encoding="utf-8")
              after = transform(before)
              if after == before:
                  raise SystemExit(f"no change produced for {path_name}")
              path.write_text(after, encoding="utf-8")

          def tuner_design(text: str) -> str:
              old_ref = "../future_work/r52/b25_key_slot_registry_contract.md"
              if text.count(old_ref) != 2:
                  raise SystemExit(f"expected two old key-contract refs, got {text.count(old_ref)}")
              text = text.replace(old_ref, "../cas_plugin/DESIGN_JA.md")
              text = text.replace("CAS HAL または CAS bridge", "Maleicacid CAS pluginまたはvendor key bridge")
              text = text.replace("CAS HAL / TIS / Tuner HAL", "CAS plugin / TIS / Tuner HAL")
              text = text.replace("CAS / TIS / Tuner HAL", "CAS plugin / TIS / Tuner HAL")
              text = text.replace("CAS HAL", "CAS plugin")
              return text

          def tis_design(text: str) -> str:
              text = text.replace("CAS HAL", "CAS plugin")
              heading = "## CAS / descrambler の現行境界\n\n"
              note = "CAS plugin内部のfactory/backend/key lifecycle契約は `../cas_plugin/DESIGN_JA.md` を正とし、本書ではTISからMediaCas/Tuner SDKへ接続するruntime境界だけを定義する。\n\n"
              if note not in text:
                  if heading not in text:
                      raise SystemExit("TIS CAS boundary heading not found")
                  text = text.replace(heading, heading + note, 1)
              text = text.replace("## CAS 仮実装境界", "## CAS plugin 仮実装境界")
              return text

          def tuner_integration(text: str) -> str:
              if "CAS HAL" not in text:
                  raise SystemExit("tuner integration has no CAS HAL reference")
              return text.replace("CAS HAL", "CAS plugin")

          def cas_controller(text: str) -> str:
              old = "カード I/O、CW 生成、鍵発行は MediaCas/CAS HAL 側の責務とする。"
              new = "カード I/O、CW 生成、鍵発行は MediaCas/Maleicacid CAS plugin 側の責務とする。"
              if text.count(old) != 1:
                  raise SystemExit("CasController responsibility comment not found exactly once")
              return text.replace(old, new, 1)

          patch("tuner_hal/DESIGN_JA.md", tuner_design)
          patch("tis/DESIGN_JA.md", tis_design)
          patch("tuner_hal/INTEGRATION.md", tuner_integration)
          patch("tis/src/com/maleicacid/tvinput/tis/CasController.kt", cas_controller)
      - name: Commit cross-document updates
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- tuner_hal/DESIGN_JA.md tis/DESIGN_JA.md tuner_hal/INTEGRATION.md tis/src/com/maleicacid/tvinput/tis/CasController.kt
          git diff --cached --check
          git commit -m "docs(cas): point current documents at cas_plugin SSOT"
          git push origin HEAD:design/aosp-mediacas-b25-plugin
