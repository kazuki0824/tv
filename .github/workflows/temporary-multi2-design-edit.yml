name: 一時MULTI2設計正本更新

on:
  push:
    branches: [feat/cas]
    paths:
      - ".github/workflows/temporary-multi2-design-edit.yml"

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/cas
      - name: MULTI2設計正本の該当節だけを更新
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("開発規則.md")
          text = path.read_text()
          replacement = '''### r52のMULTI2固定値と動的鍵状態

複数moduleに跨るMULTI2 parameterの所有と共有方針は本節を正本とする。B25とB1は別CAS方式であり、固定parameterを共通値として扱わない。

| 情報 | 所有と使用 | runtime更新 |
|---|---|---|
| B25 `system_key` / `cbc_initial_value`（`init_cbc`） | `tuner_hal2`がB25 packet復号に使用するB25専用の製品固定parameter | CAS pluginから配送せず、session登録・ECM更新の対象にしない |
| B1 `system_key` / `cbc_initial_value`（`init_cbc`） | `tuner_hal2`がB1 packet復号に使用するB1専用の製品固定parameter。B25値を代用しない | CAS pluginから配送せず、session登録・ECM更新の対象にしない |
| `odd_ks` / `even_ks` | CAS側がECMから成立させ、MediaCas session/tokenに対応付ける動的鍵状態 | 同じtokenの参照先をatomicに更新・失効する |

TISは標準`MediaCas.Session.getSessionId()`と同一bytesのopaque tokenだけをTuner `IDescrambler.setKeyToken()`へ渡す。Tunerはtoken bytesを解析してCA方式を判定しない。vendor内部のtoken解決結果はcurrent Ksまたはそれを使用できる内部鍵資源への参照に加え、その状態を成立させたCAS方式の識別を持ち、Tunerはその方式識別でB25/B1それぞれの固定parameterを選択する。方式識別はvendor内部metadataであり、AOSP公開token形式やTISとのAPIを拡張しない。

B25の`system_key` 32 byteと`cbc_initial_value` 8 byteはB25方式の固定parameterとして扱い、ECM由来KsやYakisoba credentialと同じ秘密性をproduct invariantとして要求しない。正しい方式の値を選ぶこと、vendor image上で意図しない改変を許さないことと、値そのものの秘匿性は別の要件として扱う。Yakisoba credentialの秘密管理はCAS統合側の別契約とし、この固定parameterの扱いから派生させない。

B1の固定parameterはB1方式として独立に接続し、値または取得契約が成立していない状態でB25値へfallbackしてはならない。B1 tokenを解決しても対応するB1固定parameterを利用できない場合は復号可能な鍵状態として扱わず、利用不能として拒否する。

本製品ではCAS plugin→Tuner HALの直接通信を採用せず、CAS pluginの依存先にTuner HALを置かない。動的鍵状態と方式識別の具体的な共有方式はvendor内部実装に委ねる。新規service、公開IPC、公開wire形式を必須にせず、AOSP公開APIはtoken連携のままとする。raw Kw / KsをBinderまたはTISへ出さない責務境界を維持する。

session/tokenと動的鍵状態の一意な対応、atomic update/revoke、stale token・後着結果の排除の詳細は`cas_plugin/DESIGN_JA.md`を正とする。Tuner側のtoken参照・方式別固定parameter選択・packet復号契約は`tuner_hal/DESIGN_JA.md`、その実装ownerは`tuner_hal2/DESIGN_JA.md`を正とし、CAS側のKs更新とTuner側の参照結合を同じ責務にしない。

### r53 の到達点'''
          pattern = r"### r52のMULTI2固定値と動的鍵状態\n.*?\n### r53 の到達点"
          updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f"対象節の一致数が1ではありません: {count}")
          path.write_text(updated)
          PY
          git diff --check -- 開発規則.md
      - name: 一時workflowを削除して同一commitへまとめる
        run: |
          rm .github/workflows/temporary-multi2-design-edit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 開発規則.md .github/workflows/temporary-multi2-design-edit.yml
          git commit -m "fix(design): MULTI2固定parameterをCAS方式別に分離"
          git push origin HEAD:feat/cas
