name: temporary multi2 design edit

on: [push]

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/cas
      - run: python3 .github/scripts/temporary_multi2_edit.py
      - run: |
          git diff --check -- 開発規則.md
          rm .github/workflows/temporary-multi2-design-edit.yml .github/scripts/temporary_multi2_edit.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 開発規則.md .github/workflows/temporary-multi2-design-edit.yml .github/scripts/temporary_multi2_edit.py
          git commit -m "fix(design): MULTI2固定parameterをCAS方式別に分離"
          git push origin HEAD:feat/cas
