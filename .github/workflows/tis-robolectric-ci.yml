name: TIS Robolectric host CI

on:
  pull_request:
    paths:
      - "tis/**"
      - ".github/workflows/tis-robolectric-ci.yml"
  push:
    branches: [main]
    paths:
      - "tis/**"
      - ".github/workflows/tis-robolectric-ci.yml"

permissions:
  contents: read

concurrency:
  group: tis-robolectric-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  robolectric:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: JDK 17を使用
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android依存Kotlin契約をRobolectricで実行
        run: mvn --batch-mode --no-transfer-progress -f tis/host_ci/robolectric/pom.xml test
