name: TIS Robolectric host CI

on:
  pull_request:
    paths:
      - "tis/**"
      - "tuner_hal2/**"
      - "arib_si_engine_rs/**"
      - ".github/workflows/tis-robolectric-ci.yml"
  push:
    branches: [main]
    paths:
      - "tis/**"
      - "tuner_hal2/**"
      - "arib_si_engine_rs/**"
      - ".github/workflows/tis-robolectric-ci.yml"

permissions:
  contents: read

concurrency:
  group: tis-robolectric-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  robolectric:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: JDK 17を使用
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9を使用
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Rust 1.81.0を使用
        uses: dtolnay/rust-toolchain@1.81.0

      - name: HAL実TS実行器と製品SI解析JNIをビルド
        run: |
          cargo build --manifest-path tuner_hal2/host_ci/Cargo.toml --locked -p maleicacid-tuner-hal2-demux-host-ci --bin real_ts_sections
          cargo build --manifest-path arib_si_engine_rs/host_ci/Cargo.toml --locked --lib

      - name: 実TS AVC AU・PTS試験を明示実行
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tis/host_ci/robolectric/build/real-ts-diagnostics
          python3 - <<'PYFIXTURE'
          import hashlib
          import json
          from pathlib import Path

          directory = Path("tis/tests/fixtures/real_ts")
          expected = json.loads((directory / "expected.json").read_text())
          capture = directory / expected["fixture"]
          assert capture.stat().st_size == expected["size_bytes"], "実TSのbyte数が不一致です"
          assert hashlib.sha256(capture.read_bytes()).hexdigest() == expected["sha256"], "実TSのSHA-256が不一致です"
          assert expected["complete_packets"] == expected["size_bytes"] // expected["packet_size"]
          assert expected["trailing_bytes"] == expected["size_bytes"] % expected["packet_size"]
          PYFIXTURE
          AVC_CAPTURE_PATH="$PWD/tis/tests/fixtures/real_ts/test.ts" \
            cargo test --manifest-path tuner_hal2/host_ci/Cargo.toml --locked \
              -p maleicacid-tuner-hal2-demux-host-ci --lib \
              captured_transport_frames_have_individual_timestamps -- --ignored --nocapture \
              2>&1 | tee tis/host_ci/robolectric/build/real-ts-diagnostics/avc-au-pts.log
          python3 - <<'PYRESULT'
          import re
          from pathlib import Path

          output = Path("tis/host_ci/robolectric/build/real-ts-diagnostics/avc-au-pts.log").read_text()
          assert output.count("captured_transport_frames_have_individual_timestamps") == 1, "対象試験の実行件数が不正です"
          assert re.search(r"test result: ok\. 1 passed; 0 failed; 0 ignored;", output), "試験1件の成功を確認できません"
          observed = re.search(r"frames=(\d+) failures=(\d+)", output)
          assert observed and int(observed.group(1)) > 80, "実AUの出力計数を確認できません"
          print(f"AVC AU/PTS実TS試験: {observed.group(1)} AU、解析拒否 {observed.group(2)} 件")
          PYRESULT

      - name: Android依存Kotlin契約をRobolectricで実行
        run: |
          gradle --no-daemon -p tis/host_ci/robolectric testDebugUnitTest \
            --tests com.maleicacid.tvinput.tis.DirectBootGuardR51FixTest \
            --tests com.maleicacid.tvinput.tis.RecordingDisabledR51Test \
            --tests com.maleicacid.tvinput.tis.TvProviderWriterDescriptorSchemaTest \
            --tests com.maleicacid.tvinput.tis.FrameworkTunerScanBoundaryTest \
            --tests com.maleicacid.tvinput.tis.TunerFrontendLeaseTransitionTest \
            --tests com.maleicacid.tvinput.tis.TunerScanCleanupTest \
            --tests com.maleicacid.tvinput.tis.TunerSectionSourceDiagnosticTest \
            --tests com.maleicacid.tvinput.tis.ProgramBatchIpcBudgetTest \
            --tests com.maleicacid.tvinput.tis.ProgramUpgradeIdentityTest \
            --tests com.maleicacid.tvinput.tis.TvProviderVisibilityTransactionTest \
            --tests com.maleicacid.tvinput.tis.PlaybackFilterAdmissionTest \
            --tests com.maleicacid.tvinput.tis.PlaybackStartupCleanupTest \
            --tests com.maleicacid.tvinput.tis.CurrentProgramRatingResolverTest \
            --tests com.maleicacid.tvinput.tis.PlaybackMediaSyncReleaseTest \
            --tests com.maleicacid.tvinput.tis.CaptionInputContinuityTest \
            --tests com.maleicacid.tvinput.tis.RealTsHalSiIntegrationTest

      - name: 実SDK scan境界試験の実行結果を確認
        run: |
          python3 - <<'PYRESULT'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("tis/host_ci/robolectric/build/test-results/testDebugUnitTest/TEST-com.maleicacid.tvinput.tis.FrameworkTunerScanBoundaryTest.xml")
          suite = ET.parse(report).getroot()
          assert suite.get("tests") == "2", suite.attrib
          assert suite.get("failures") == "0" and suite.get("errors") == "0", suite.attrib
          assert suite.get("skipped", "0") == "0", suite.attrib
          for case in suite.findall("testcase"):
              print(f"Android 15実SDK境界試験: {case.get('name')} success")
          source = ET.parse(report.with_name("TEST-com.maleicacid.tvinput.tis.TunerSectionSourceDiagnosticTest.xml")).getroot()
          assert source.get("tests") == "4", source.attrib
          assert source.get("failures") == "0" and source.get("errors") == "0", source.attrib
          assert source.get("skipped", "0") == "0", source.attrib
          startup = ET.parse(report.with_name("TEST-com.maleicacid.tvinput.tis.PlaybackStartupCleanupTest.xml")).getroot()
          assert startup.get("tests") == "2", startup.attrib
          assert startup.get("failures") == "0" and startup.get("errors") == "0", startup.attrib
          assert startup.get("skipped", "0") == "0", startup.attrib
          identity = ET.parse(report.with_name("TEST-com.maleicacid.tvinput.tis.ProgramUpgradeIdentityTest.xml")).getroot()
          assert identity.get("tests") == "1" and identity.get("failures") == "0" and identity.get("errors") == "0", identity.attrib
          assert identity.get("skipped", "0") == "0", identity.attrib
          playback_report = report.with_name("TEST-com.maleicacid.tvinput.tis.PlaybackFilterAdmissionTest.xml")
          playback = ET.parse(playback_report).getroot()
          assert playback.get("tests") == "51", playback.attrib
          assert playback.get("failures") == "0" and playback.get("errors") == "0", playback.attrib
          assert playback.get("skipped", "0") == "0", playback.attrib
          for case in playback.findall("testcase"):
              print(f"Android 15実SDK playback受付試験: {case.get('name')} success")
          resolver = ET.parse(report.with_name("TEST-com.maleicacid.tvinput.tis.CurrentProgramRatingResolverTest.xml")).getroot()
          assert resolver.get("tests") == "2", resolver.attrib
          assert resolver.get("failures") == "0" and resolver.get("errors") == "0", resolver.attrib
          assert resolver.get("skipped", "0") == "0", resolver.attrib
          lease = ET.parse(report.with_name("TEST-com.maleicacid.tvinput.tis.TunerFrontendLeaseTransitionTest.xml")).getroot()
          assert lease.get("tests") == "14", lease.attrib
          assert lease.get("failures") == "0" and lease.get("errors") == "0", lease.attrib
          assert lease.get("skipped", "0") == "0", lease.attrib
          for case in lease.findall("testcase"):
              print(f"Android 15実SDK Frontend解放試験: {case.get('name')} success")
          scan_cleanup = ET.parse(report.with_name("TEST-com.maleicacid.tvinput.tis.TunerScanCleanupTest.xml")).getroot()
          assert scan_cleanup.get("tests") == "7", scan_cleanup.attrib
          assert scan_cleanup.get("failures") == "0" and scan_cleanup.get("errors") == "0", scan_cleanup.attrib
          assert scan_cleanup.get("skipped", "0") == "0", scan_cleanup.attrib
          sync = ET.parse(report.with_name("TEST-com.maleicacid.tvinput.tis.PlaybackMediaSyncReleaseTest.xml")).getroot()
          assert sync.get("tests") == "14", sync.attrib
          assert sync.get("failures") == "0" and sync.get("errors") == "0", sync.attrib
          assert sync.get("skipped", "0") == "0", sync.attrib
          caption = ET.parse(report.with_name("TEST-com.maleicacid.tvinput.tis.CaptionInputContinuityTest.xml")).getroot()
          assert caption.get("tests") == "5", caption.attrib
          assert caption.get("failures") == "0" and caption.get("errors") == "0", caption.attrib
          assert caption.get("skipped", "0") == "0", caption.attrib
          for case in caption.findall("testcase"):
              print(f"Android 15字幕入力continuity試験: {case.get('name')} success")
          PYRESULT

      - name: 実TS試験と既存3クラスの実行結果を確認
        run: |
          python3 - <<'PYRESULT'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path("tis/host_ci/robolectric/build/test-results/testDebugUnitTest")
          classes = ["DirectBootGuardR51FixTest", "RecordingDisabledR51Test",
                     "TvProviderWriterDescriptorSchemaTest", "RealTsHalSiIntegrationTest"]
          for name in classes:
              suite = ET.parse(root / f"TEST-com.maleicacid.tvinput.tis.{name}.xml").getroot()
              cases = suite.findall("testcase")
              assert cases, f"{name}: 試験0件"
              assert all(not any(case.find(tag) is not None for tag in
                             ("skipped", "failure", "error")) for case in cases), name
              if name == "RealTsHalSiIntegrationTest":
                  assert {case.get("name") for case in cases} == {"realTsProducesServiceAndProgramFacts", "realTsBurstLossAndRetransmissionStayWithinCandidate"}, name
              print(f"{name}: {len(cases)} passed")
          PYRESULT

      - name: 試験結果とHAL診断を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tis-robolectric-results
          path: |
            tis/host_ci/robolectric/build/test-results/
            tis/host_ci/robolectric/build/reports/tests/
            tis/host_ci/robolectric/build/real-ts-diagnostics/
