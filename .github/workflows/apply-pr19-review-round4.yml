name: Apply PR19 review round 4

on:
  push:
    branches:
      - agent/fix-tis-arib-design-residuals
    paths:
      - .github/workflows/apply-pr19-review-round4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-tis-arib-design-residuals
      - name: Apply design-only review fix
        run: |
          python3 .github/scripts/apply_pr19_round4.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tis/DESIGN_JA.md
          git commit -m "docs: require final renderer first-frame commit"
          git push
