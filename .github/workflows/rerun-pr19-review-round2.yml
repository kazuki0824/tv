name: Rerun PR19 review round 2 fixes

on:
  push:
    paths:
      - '.github/workflows/rerun-pr19-review-round2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-tis-arib-design-residuals
          fetch-depth: 0
      - name: Reuse design-only patch script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap
          src = Path('.github/workflows/inspect-pr19-review-round2.yml').read_text()
          m = re.search(r"python3 - <<'PY'\n(.*?)\n          PY", src, re.S)
          if not m:
              raise SystemExit('embedded patch script not found')
          code = textwrap.dedent(m.group(1))
          exec(compile(code, '<embedded-pr19-fix>', 'exec'))
          PY
          git diff --check
          ! grep -F '整数overflow時はwrapさせず現sessionのplayback pipelineを再生成' tis/DESIGN_JA.md
          ! grep -F 'ChannelTune` は `inputId`、' tis/DESIGN_JA.md arib_si_engine_rs/DESIGN_JA.md
          ! grep -F 'tune 復元に必要な `inputId`、物理選局情報' arib_si_engine_rs/DESIGN_JA.md
          git status --short
          git add tis/DESIGN_JA.md arib_si_engine_rs/DESIGN_JA.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'docs: close tune lifecycle and provider ownership gaps'
          git push origin HEAD:agent/fix-tis-arib-design-residuals
