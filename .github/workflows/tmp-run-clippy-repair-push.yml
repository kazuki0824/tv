name: Run temporary ARIB SI Clippy repair on push

on:
  push:
    branches:
      - automation/fix-clippy-pr53-pr54

permissions:
  contents: write

jobs:
  arib-si:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair and validate PR54
        run: |
          cp tmp/fix_clippy_pr53_pr54.py /tmp/fix_clippy.py
          cp tmp/fix_arib_clippy_remaining.py /tmp/fix_arib_remaining.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/implement-tis-arib-si-design-pr53
          git checkout -B agent/implement-tis-arib-si-design-pr53 origin/agent/implement-tis-arib-si-design-pr53
          rustup toolchain install 1.81.0 --profile minimal --component clippy,rustfmt
          python3 /tmp/fix_clippy.py arib
          python3 /tmp/fix_arib_remaining.py
          set +e
          (cd arib_si_engine_rs/host_ci && cargo +1.81.0 clippy --fix --allow-dirty --allow-staged --all-targets --locked -- -D warnings)
          set -e
          (cd arib_si_engine_rs/host_ci && cargo +1.81.0 fmt --all)
          (cd arib_si_engine_rs/host_ci && cargo +1.81.0 clippy --all-targets --locked -- -D warnings)
          (cd arib_si_engine_rs/host_ci && cargo +1.81.0 test --locked)
          git diff --check
          git add arib_si_engine_rs
          git commit -m "fix(arib_si): resolve Clippy findings"
          git push origin HEAD:agent/implement-tis-arib-si-design-pr53
