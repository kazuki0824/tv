name: Refine PR19 MediaSync private API naming

on:
  push:
    branches:
      - agent/fix-tis-arib-design-residuals

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-tis-arib-design-residuals
          fetch-depth: 0
      - shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('tis/DESIGN_JA.md')
          text = p.read_text(encoding='utf-8')

          replacements = [
          (
          '''stock Android 14 / LineageOS 21 の `MediaSync` はvideo scheduling/dropをnative側で所有し、late frameをinputへ返すdrop分岐と、render対象frameをcurrent outputへattachして`queueBuffer()`する分岐を区別する。一方、公開Java APIにはそのfinal-output成功をvideo clientへ通知するcallbackがない。この不足だけを閉じるため、対象LineageOS platformの`android.media.MediaSync`へ、既存public `MediaSync.Callback`とは別の `@hide OnFirstVideoFrameQueuedListener` と、`availabilityEpochId`を同時にarmする `@hide setOnFirstVideoFrameQueuedListener(long availabilityEpochId, listener, handler)` 相当を追加する。listener eventは少なくとも`MediaSync` instanceと成功判定時に固定した`availabilityEpochId`を返す。public SDK、`@SystemApi`、`@TestApi`、Tuner AIDL/VINTFは変更しない。''',
          '''stock Android 14 / LineageOS 21 の `MediaSync` はvideo scheduling/dropをnative側で所有し、late frameをinputへ返すdrop分岐と、render対象frameをcurrent outputへattachして`queueBuffer()`する分岐を区別する。一方、公開Java APIにはそのfinal-output成功をvideo clientへ通知するcallbackがない。この不足だけを閉じるため、対象LineageOS platformの`android.media.MediaSync`へ、既存public `MediaSync.Callback`とは別の `@hide OnFirstVideoFrameQueuedToOutputListener` と、opaqueな識別子を同時にarmする `@hide setOnFirstVideoFrameQueuedToOutputListener(long registrationToken, listener, handler)` 相当を追加する。Framework側は`registrationToken`をTIF/TIS固有の意味を持たないopaque tokenとして保持し、listener eventは少なくとも`MediaSync` instanceと成功判定時に固定した`registrationToken`を返す。public SDK、`@SystemApi`、`@TestApi`、Tuner AIDL/VINTFは変更しない。'''
          ),
          (
          '''availabilityをarmするたびに、`PlaybackPipeline`は同一session内で再利用しない単調増加`availabilityEpochId`を割り当てる。Framework-private setterはlistener/handlerとこのIDを同時にnativeへ渡し、native MediaSyncはcurrent armのIDを保持する。arm中にvideo bufferがlate-drop分岐を通過し、current `mOutput`へのattachと`queueBuffer()`がともに成功した時点で、その**成功を判定したarmの`availabilityEpochId`をevent payloadへ固定してから**epochをdisarmする。late-drop、attach失敗、queue失敗、output abandonment、inputへ返したbufferではeventを生成せず、arm状態も消費しない。re-arm後に旧eventのJava配送が遅延しても、event payloadのIDは生成時の旧epochから書き換えない。`availabilityEpochId`はpending eventが存在し得る間に再利用せず、整数overflow時はwrapさせず現sessionのplayback pipelineを再生成する。常時すべてのrender成功を通知せず、TISが必要なavailability epochだけをarm/re-armする。''',
          '''availabilityをarmするたびに、`PlaybackPipeline`は同一session内で再利用しない単調増加`availabilityEpochId`を割り当て、その値をFramework-private setterへopaqueな`registrationToken`として渡す。native MediaSyncはcurrent armの`registrationToken`を保持するだけでavailability semanticsを解釈しない。arm中にvideo bufferがlate-drop分岐を通過し、current `mOutput`へのattachと`queueBuffer()`がともに成功した時点で、その**成功を判定したarmの`registrationToken`をevent payloadへ固定してから**armを解除する。late-drop、attach失敗、queue失敗、output abandonment、inputへ返したbufferではeventを生成せず、arm状態も消費しない。re-arm後に旧eventのJava配送が遅延しても、event payloadのtokenは生成時の旧registrationから書き換えない。TIS側の`availabilityEpochId`はpending eventが存在し得る間に再利用せず、整数overflow時はwrapさせず現sessionのplayback pipelineを再生成する。常時すべてのrender成功を通知せず、TISが必要なavailability epochだけをarm/re-armする。'''
          ),
          (
          '''TISは新playback generation開始時にinitial availability epochを新しい`availabilityEpochId`でarmし、`waitingAvailabilityEpochId`として保持する。callback eventはMediaSync instance、playback generation、event payloadの`availabilityEpochId`を同executor上で照合し、IDが`waitingAvailabilityEpochId`と一致し、current `sessionSurface`が有効、視聴制限でblockされておらず、同generationの`MEDIASYNC_ERROR_SURFACE_FAIL`がない場合だけ`notifyVideoAvailable()`を呼ぶ。受理またはepoch取消し後は`waitingAvailabilityEpochId`を無効化する。一度availableになった後、`VIDEO_UNAVAILABLE_REASON_BUFFERING`等のrecoverable unavailableへ遷移し**同じMediaSync instance/generationを維持して復旧する場合**は、旧waiting epochを取消して新しいIDでre-armし、re-arm前の旧epochで既に生成済みだった遅延eventはID不一致で必ず破棄する。新epochのfinal-output成功event後だけ再びavailableへ遷移する。generation teardownを伴うunavailableは新MediaSync instanceのinitial armで閉じる。これにより`available -> unavailable -> available`をrecoverable pathとgeneration-recreate pathの双方で閉じる。''',
          '''TISは新playback generation開始時にinitial availability epochを新しい`availabilityEpochId`でarmし、`waitingAvailabilityEpochId`として保持するとともに同じ数値をopaqueな`registrationToken`としてMediaSyncへ渡す。callback eventはMediaSync instance、playback generation、event payloadの`registrationToken`を同executor上で照合し、tokenが`waitingAvailabilityEpochId`と一致し、current `sessionSurface`が有効、視聴制限でblockされておらず、同generationの`MEDIASYNC_ERROR_SURFACE_FAIL`がない場合だけ`notifyVideoAvailable()`を呼ぶ。受理またはepoch取消し後は`waitingAvailabilityEpochId`を無効化する。一度availableになった後、`VIDEO_UNAVAILABLE_REASON_BUFFERING`等のrecoverable unavailableへ遷移し**同じMediaSync instance/generationを維持して復旧する場合**は、旧waiting epochを取消して新しいID/tokenでre-armし、re-arm前の旧epochで既に生成済みだった遅延eventはtoken不一致で必ず破棄する。新epochのfinal-output成功event後だけ再びavailableへ遷移する。generation teardownを伴うunavailableは新MediaSync instanceのinitial armで閉じる。これにより`available -> unavailable -> available`をrecoverable pathとgeneration-recreate pathの双方で閉じる。'''
          ),
          (
          '''callbackは物理display/compositorへのpresent fence完了を意味せず、video scheduling/drop ownerであるMediaSyncがrender対象を選択しcurrent final outputへのqueueを成功させたことだけをcommitする。`MediaCodec.OnFrameRenderedListener`、`MediaSync.getTimestamp()`、playback clock進行はvideo availability commitへ使用しない。native内部mutexを保持したままJavaへreentrant callせず、成功時に固定した`availabilityEpochId`を保持したままJNI/Java handlerへ非同期配送する。release済み、旧generation、旧MediaSync instance、またはcurrent waiting epochとIDが一致しない遅延eventはstate更新に使わない。''',
          '''callbackは物理display/compositorへのpresent fence完了を意味せず、video scheduling/drop ownerであるMediaSyncがrender対象を選択しcurrent final outputへのqueueを成功させたことだけをcommitする。`MediaCodec.OnFrameRenderedListener`、`MediaSync.getTimestamp()`、playback clock進行はvideo availability commitへ使用しない。native内部mutexを保持したままJavaへreentrant callせず、成功時に固定したopaque `registrationToken`を保持したままJNI/Java handlerへ非同期配送する。release済み、旧generation、旧MediaSync instance、またはTISのcurrent waiting epochとtokenが一致しない遅延eventはstate更新に使わない。'''
          )]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, got {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tis/DESIGN_JA.md
          git commit -m 'docs: keep MediaSync callback token opaque'
          git push origin HEAD:agent/fix-tis-arib-design-residuals
