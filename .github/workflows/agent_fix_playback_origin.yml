name: agent-fix-playback-origin
on:
  push:
    branches:
      - agent/fix-playback-dvr-origin-generation
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch design contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tuner_hal/DESIGN_JA.md')
          s = p.read_text()
          old = '| SF-002 | DVR playback input TS | `TsInputOrigin::Playback(dvr_id)` | playback origin の continuity / assembler 更新 | frontend origin への混入 | playback入力として処理 |'
          new = '| SF-002 | DVR playback input TS | `TsInputOrigin::PlaybackDvr(dvr_id, dvr_generation)` | playback origin の continuity / assembler 更新 | frontend origin への混入 | playback入力として処理 |'
          count = s.count(old)
          assert count == 1, count
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit design-only change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent_fix_playback_origin.yml
          git add tuner_hal/DESIGN_JA.md
          git diff --cached --check
          git commit -m 'docs: include generation in playback DVR origin'
          git push
