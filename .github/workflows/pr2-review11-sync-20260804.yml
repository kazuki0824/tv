name: PR2 review11 synchronize 2026-08-04

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/pr2-review11-trigger-20260804.txt

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tooling
        uses: actions/checkout@v4
        with:
          ref: main
          path: tooling
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/apply-tuner-hal2-design-proposals-v70
          path: work
      - name: Apply design fixes
        run: python3 tooling/.github/pr2-review11-patch-20260804.py work
      - name: Validate and push
        working-directory: work
        run: |
          set -euxo pipefail
          rm .github/pr2-review11-trigger-20260804.txt
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' .github/pr2-review11-trigger-20260804.txt tuner_hal/DESIGN_JA.md | sort)"
          test "$changed" = "$expected"
          python3 - <<'PY'
          from pathlib import Path
          text = Path('tuner_hal/DESIGN_JA.md').read_text(encoding='utf-8')
          for stale in (
              'tableInfoOneShotBufferBytes',
              '1,048,576',
              '最大256 section×4096 bytes',
              '全番号が揃ってからsection番号順',
              'one-shot対象を完成前に部分配送しない',
          ):
              assert stale not in text, stale
          for required in (
              '256-bit（32 byte）の配送済みbitmap',
              '最初の出現順に各section番号を正確に1回だけ逐次配送',
              '同一table ID/versionで複数extension/current-nextが並行',
              'TableInfoOneShotTracker',
          ):
              assert required in text, required
          assert text.count('```') % 2 == 0
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .github/pr2-review11-trigger-20260804.txt tuner_hal/DESIGN_JA.md
          git commit -m 'docs: refine table one-shot delivery contract'
          git push origin HEAD:agent/apply-tuner-hal2-design-proposals-v70
