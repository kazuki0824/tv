name: PR28 six review fixes
on:
  push:
    branches:
      - agent/fix-commonization-boundaries
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-commonization-boundaries
          fetch-depth: 0
          sparse-checkout: |
            tuner_hal/DESIGN_JA.md
            .tmp/pr28_six_review_fixes.py
            .github/workflows/pr28-six-review-fixes.yml
      - name: Apply design fixes
        run: python3 .tmp/pr28_six_review_fixes.py
      - name: Commit design fixes
        run: |
          git rm .tmp/pr28_six_review_fixes.py .github/workflows/pr28-six-review-fixes.yml
          git config user.name "maleicacid"
          git config user.email "4982384+kazuki0824@users.noreply.github.com"
          git add tuner_hal/DESIGN_JA.md
          git diff --cached --check
          git commit -m "docs: address six PR28 canonical-boundary reviews [pr28-six-fixes]"
          git push origin HEAD:agent/fix-commonization-boundaries
