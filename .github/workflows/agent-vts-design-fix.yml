name: agent-vts-design-fix

on:
  push:
    branches:
      - agent/fix-vts-config-variant-resolution

permissions:
  contents: write

jobs:
  fix-design:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-vts-config-variant-resolution
      - name: Apply VTS environment binding correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('tuner_hal/DESIGN_JA.md')
          s = p.read_text()
          original = s

          replacements = {
          "Tuner VTS用XMLは実行環境に依存する静的構成であり、既定では導入しない。対象のLineageOS 21 / Android 14 VTSは`/vendor/etc/tuner_vts_config_aidl_V1.xml`だけを読むため、variant propertyやsuffix付きfilenameを使用しない。AOSP branch、受信元、周波数、stream ID、PID、実行手順、filter/DVR queue容量、製品memory予算を宣言し、必要な全資源を起動前に予約できる場合だけ、その値を持つ静的XMLを固定pathへinstallする。環境未確定時は`DESIGN_HOLD_VTS_ENVIRONMENT_UNDECLARED`とし、固定pathへXMLをinstallせず、VTS成功を宣言しない。descrambler AIDL objectを実装していても、試験設定だけで本番のスクランブル解除成功を宣言しない。":
          "Tuner VTS用XMLは実行環境に依存する静的構成であり、既定では導入しない。使用するVTS artifact/tag/commitと、試験実行機の`ro.vendor.vts_tuner_configuration_variant`を`VtsEnvironmentProfile`の入力として固定し、XML filenameは選択したVTS実装が実際に行う解決規則から決定する。Android 14 AIDL VTSでbase名`/vendor/etc/tuner_vts_config_aidl_V1`へnon-empty variantを`.`区切りで付加して`.xml`を読む実装を選択した場合は、`/vendor/etc/tuner_vts_config_aidl_V1[.<variant>].xml`として解決する。AOSP branch、VTS artifact/tag/commit、variant property、受信元、周波数、stream ID、PID、実行手順、filter/DVR queue容量、製品memory予算を宣言し、必要な全資源を起動前に予約できる場合だけ、その値を持つ静的XMLを解決済みpathへinstallする。VTS artifactまたはvariant propertyを含む環境入力が未確定な場合はfilename自体を`DESIGN_HOLD_VTS_ENVIRONMENT_UNDECLARED`とし、推測したpathへXMLをinstallせず、VTS成功を宣言しない。descrambler AIDL objectを実装していても、試験設定だけで本番のスクランブル解除成功を宣言しない。",
          "Tuner VTSはruntime能力から無条件に導出せず、起動前`VtsEnvironmentProfile`に入力元、PID、経路、queue容量、memory予算が定義されるまで`DESIGN_HOLD`として固定path XMLをinstallしない。":
          "Tuner VTSはruntime能力から無条件に導出せず、起動前`VtsEnvironmentProfile`にVTS artifact/tag/commit、variant property、入力元、PID、経路、queue容量、memory予算が定義されるまで`DESIGN_HOLD`としてXML filenameを解決せず、XMLをinstallしない。",
          "VTSは別の起動前環境bindingとし、未定義中は固定path XMLをinstallせず成功を表明しない。":
          "VTSは別の起動前環境bindingとし、VTS artifact/tag/commitとvariant propertyを含む環境入力が未定義中はXML filenameを解決せず、XMLをinstallせず成功を表明しない。",
          "VTS設定を実行時生成せず、無条件の既定XMLも設けない。起動前環境profileで入力元、経路、PID、queue予算を定義し、その要求全体がsnapshotに収まる場合だけ固定pathの静的V1 XMLをinstallする。それ以外はruntime保証を弱めずVTSを`DESIGN_HOLD`とする。":
          "VTS設定を実行時生成せず、無条件の既定XMLも設けない。起動前環境profileでVTS artifact/tag/commit、variant property、入力元、経路、PID、queue予算を定義し、選択したVTS実装の規則でXML filenameを解決し、その要求全体がsnapshotに収まる場合だけ解決済みpathへ静的XMLをinstallする。それ以外はruntime保証を弱めずVTSを`DESIGN_HOLD`とする。",
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)

          # Normalize the VTS environment table without depending on column spacing.
          lines = s.splitlines()
          out = []
          for line in lines:
              if line.startswith('| VTS-ENV-01 |'):
                  cols = line.split('|')
                  if len(cols) >= 5:
                      line = '| VTS-ENV-01 | AOSP branch、Tuner VTS設定schema/版、使用VTS artifact/tag/commit | 選択するVTS binary/source contractを一意に固定する | UNDECLARED_DESIGN_HOLD |'
              elif line.startswith('| VTS-ENV-06 |'):
                  line = '| VTS-ENV-06 | VTS設定XMLのfilename解決 | 選択済みVTS artifact/tag/commitと試験実行機の`ro.vendor.vts_tuner_configuration_variant`から、そのVTS実装が実際に読むfilenameを解決する。artifactまたはproperty未確定時はfilenameを推測しない。実行時rendererは使用しない | UNDECLARED_DESIGN_HOLD |'
              elif line.startswith('| VTS-STATE-UNBOUND |'):
                  line = re.sub(r'固定path[^|]*XML[^|]*', 'VTS artifact/tag/commitまたはvariant propertyを含む環境入力が未確定で、XML filenameを解決せずXMLをinstallしない', line)
              elif line.startswith('| VTS-STATE-BOUND |'):
                  line = line.replace('固定path', '選択したVTS実装で解決済みのpath')
              elif line.startswith('| VTS-STATE-REJECTED |'):
                  line = line.replace('固定path XML', '解決済みpathまたは既定値を推測したXML')
              out.append(line)
          s = '\n'.join(out) + ('\n' if original.endswith('\n') else '')

          # Correct prose occurrences that still assume a single fixed filename.
          s = s.replace('`VtsEnvironmentProfile=UNBOUND`では、固定path`/vendor/etc/tuner_vts_config_aidl_V1.xml`へXMLをinstallせず', '`VtsEnvironmentProfile=UNBOUND`では、VTS artifact/tag/commitまたはvariant propertyを含む環境入力が未確定であるためXML filenameを解決せず、XMLをinstallせず')
          s = s.replace('静的XMLを固定pathへ正確に1つinstall', '静的XMLを選択したVTS実装で解決済みのpathへ正確に1つinstall')
          s = s.replace('固定path XMLをinstall', '推測したpathへXMLをinstall')

          forbidden = [
              'VTSは`/vendor/etc/tuner_vts_config_aidl_V1.xml`だけを読む',
              'variant propertyやsuffix付きfilenameを使用しない',
              'variant property、suffix付きfilename、実行時rendererを使用しない',
          ]
          if any(x in s for x in forbidden):
              raise SystemExit('stale fixed-filename/variant assertion remains')
          if s == original:
              raise SystemExit('no design changes applied')
          p.write_text(s)
          PY
          git diff --check
          git diff -- tuner_hal/DESIGN_JA.md
      - name: Commit final design-only tree
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/agent-vts-design-fix.yml
          git add tuner_hal/DESIGN_JA.md
          git commit -m "docs: bind VTS XML filename to test environment"
          git push origin HEAD:agent/fix-vts-config-variant-resolution
