name: Kotlin quality CI

on:
  pull_request:
    paths:
      - "**/*.kt"
      - "**/*.kts"
      - ".github/workflows/kotlin-quality-ci.yml"
  push:
    branches: [main]
    paths:
      - "**/*.kt"
      - "**/*.kts"
      - ".github/workflows/kotlin-quality-ci.yml"

permissions:
  contents: read

concurrency:
  group: kotlin-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  KTLINT_VERSION: 1.8.0
  DETEKT_VERSION: 1.23.8

jobs:
  all-kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 全Kotlin一覧を生成
        id: files
        shell: bash
        run: |
          mapfile -d '' -t files < <(
            git ls-files -z -- '*.kt' '*.kts' | sort -z
          )
          printf 'Kotlin sources: %s\n' "${#files[@]}"
          printf '%s\n' "${files[@]}"
          if ((${#files[@]} == 0)); then
            echo 'files=[]' >> "$GITHUB_OUTPUT"
          else
            printf 'files=%s\n' "$(printf '%s\n' "${files[@]}" | jq -Rsc 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"
          fi

  ktlint:
    name: ktlint format check
    needs: all-kotlin
    if: ${{ needs.all-kotlin.outputs.files != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: JDK 17を使用
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: ktlintを導入
        shell: bash
        run: |
          tool="$RUNNER_TEMP/ktlint"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint" \
            --output "$tool"
          chmod +x "$tool"
          echo "KTLINT=$tool" >> "$GITHUB_ENV"
          "$tool" --version

      - name: 全Kotlinの整形を確認
        shell: bash
        env:
          FILES_JSON: ${{ needs.all-kotlin.outputs.files }}
        run: |
          mapfile -t sources < <(jq -r '.[]' <<<"$FILES_JSON")
          "$KTLINT" "${sources[@]}"

  detekt:
    name: detekt lint
    needs: all-kotlin
    if: ${{ needs.all-kotlin.outputs.files != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: JDK 17を使用
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: detektを導入
        shell: bash
        run: |
          tool="$RUNNER_TEMP/detekt-cli.jar"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/detekt/detekt/releases/download/v${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}-all.jar" \
            --output "$tool"
          echo "DETEKT=$tool" >> "$GITHUB_ENV"
          java -jar "$tool" --version

      - name: 全Kotlinをlint
        shell: bash
        env:
          FILES_JSON: ${{ needs.all-kotlin.outputs.files }}
        run: |
          mapfile -t sources < <(jq -r '.[]' <<<"$FILES_JSON")
          input="$(IFS=,; printf '%s' "${sources[*]}")"
          java -jar "$DETEKT" --input "$input"
