name: ARIB SIエンジン ホストCI

on:
  pull_request:
    paths:
      - "arib_si_engine_rs/**/*.rs"
      - "arib_si_engine_rs/**/Cargo.toml"
      - "arib_si_engine_rs/host_ci/Cargo.lock"
      - "arib_si_engine_rs/schema/**/*.json"
      - "arib_si_engine_rs/testdata/**/*.json"
      - "tis/tests/assets/**/*.json"
      - ".github/workflows/arib-si-engine-host-ci.yml"
  push:
    branches: [main]
    paths:
      - "arib_si_engine_rs/**/*.rs"
      - "arib_si_engine_rs/**/Cargo.toml"
      - "arib_si_engine_rs/host_ci/Cargo.lock"
      - "arib_si_engine_rs/schema/**/*.json"
      - "arib_si_engine_rs/testdata/**/*.json"
      - "tis/tests/assets/**/*.json"
      - ".github/workflows/arib-si-engine-host-ci.yml"

permissions:
  contents: read

concurrency:
  group: arib-si-engine-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.81.0

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: arib_si_engine_rs/host_ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: LineageOS 22.1のRust toolchainを導入
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
      - name: JNIとVTS host adapterのRust整形を確認
        run: cargo +"$RUST_TOOLCHAIN" fmt -p maleicacid-arib-si-engine-host-ci -- --check

  core-rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: arib_si_engine_rs/host_ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: LineageOS 22.1のRust toolchainを導入
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
      - name: Production coreのRust整形を直接確認
        run: cargo +"$RUST_TOOLCHAIN" fmt -p maleicacid_arib_si_engine_core -- --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: arib_si_engine_rs/host_ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: LineageOS 22.1のRust toolchainを導入
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
      - name: JNIとVTS host adapterをClippyで検査
        run: cargo +"$RUST_TOOLCHAIN" clippy -p maleicacid-arib-si-engine-host-ci --all-targets --locked --no-deps -- -D warnings

  core-clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: arib_si_engine_rs/host_ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: LineageOS 22.1のRust toolchainを導入
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
      - name: Production coreを直接Clippyで検査
        run: cargo +"$RUST_TOOLCHAIN" clippy -p maleicacid_arib_si_engine_core --all-targets --locked -- -D warnings

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: arib_si_engine_rs/host_ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: LineageOS 22.1のRust toolchainを導入
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: JNIとVTS host adapterを型検査
        run: cargo +"$RUST_TOOLCHAIN" check -p maleicacid-arib-si-engine-host-ci --all-targets --locked

  core-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: arib_si_engine_rs/host_ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: LineageOS 22.1のRust toolchainを導入
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Production coreを直接型検査
        run: cargo +"$RUST_TOOLCHAIN" check -p maleicacid_arib_si_engine_core --all-targets --locked

  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: arib_si_engine_rs/host_ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: LineageOS 22.1のRust toolchainを導入
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: JNIとVTS host adapterのホスト互換テストを実行
        run: cargo +"$RUST_TOOLCHAIN" test -p maleicacid-arib-si-engine-host-ci --locked

  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: arib_si_engine_rs/host_ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: LineageOS 22.1のRust toolchainを導入
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Production coreのテストを直接実行
        run: cargo +"$RUST_TOOLCHAIN" test -p maleicacid_arib_si_engine_core --locked

  provider-data-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: schemaとfixtureをJSONとして解析
        run: |
          while IFS= read -r path; do
            jq empty "$path"
          done < <(find arib_si_engine_rs/schema arib_si_engine_rs/testdata tis/tests/assets \
            -type f -name '*.json' -print | sort)

      - name: Program provider-data fixtureを正規schemaで検証
        run: |
          python3 -m pip install --disable-pip-version-check 'jsonschema==4.23.0'
          python3 - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator
          from referencing import Registry, Resource

          schema_dir = Path("arib_si_engine_rs/schema")
          schema = json.loads((schema_dir / "program_provider_data_v1.schema.json").read_text())
          diagnostic_schema = json.loads((schema_dir / "descriptor_diagnostic_v1.schema.json").read_text())
          registry = Registry().with_resources(
              (item["$id"], Resource.from_contents(item))
              for item in (json.loads(path.read_text()) for path in schema_dir.glob("*.schema.json"))
          )
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, registry=registry)
          fixture_dir = Path("arib_si_engine_rs/testdata/program_provider_data_v1")
          for path in sorted(fixture_dir.glob("*.json")):
              validator.validate(json.loads(path.read_text()))
              print(path)
          channel_schema = json.loads((schema_dir / "channel_provider_data_v1.schema.json").read_text())
          Draft202012Validator.check_schema(channel_schema)
          channel_validator = Draft202012Validator(channel_schema, registry=registry)
          corpus = json.loads(Path("arib_si_engine_rs/testdata/provider_data_boundary_v1/cases.json").read_text())
          for case in corpus:
              raw = case["data"].encode("utf-8") if case["encoding"] == "UTF8" else bytes.fromhex(case["data"])
              try:
                  data = json.loads(raw.decode("utf-8"))
                  accepted = (validator if case["boundary"] == "PROGRAM" else channel_validator).is_valid(data)
              except (UnicodeDecodeError, json.JSONDecodeError):
                  accepted = False
              assert accepted == case.get("schemaAccepted", case["accepted"]), case["name"]
          print(f"shared boundary cases: {len(corpus)}")
          PY

      - name: 対応fixtureのbyte一致を確認
        run: |
          cmp \
            arib_si_engine_rs/testdata/descriptor_diagnostic_v1/malformed_length.json \
            tis/tests/assets/descriptor_diagnostic_v1/malformed_length.json
          cmp \
            arib_si_engine_rs/testdata/program_provider_data_v1/minimal_clear_program.json \
            tis/tests/assets/program_provider_data_v1/minimal_clear_program.json
          cmp \
            arib_si_engine_rs/testdata/program_provider_data_v1/unsupported_codec_program.json \
            tis/tests/assets/program_provider_data_v1/unsupported_codec_program.json
          cmp \
            arib_si_engine_rs/testdata/provider_data_boundary_v1/cases.json \
            tis/tests/assets/provider_data_boundary_v1/cases.json
