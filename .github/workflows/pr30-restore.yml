name: PR30 restore tuner query contracts

on:
  push:
    branches:
      - agent/restore-tuner-query-contracts-and-fix-references

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-tuner-query-contracts-and-fix-references
      - name: Apply documentation fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("tuner_hal/DESIGN_JA.md")
          text = p.read_text(encoding="utf-8")

          replacements = {
              "2. `0-S. 状態所有・寿命・失敗時遷移設計`、0-S-3Bの名前付きcanonical contract、各公開APIの名前付き契約、`ARIB/ISDB入力処理契約`、`Stream boundary 契約`、`Packet pipeline 正本契約`、`AV shared handle 入出力契約` を現在の設計契約の正本とする。移送済みの旧表番号は現行正本参照に使用しない。":
              "2. `0-S. 状態所有・寿命・失敗時遷移設計`、`0-S-2. 状態所有者表`、0-S-3Bの名前付きcanonical contract、各公開APIの名前付き契約、`TS continuity / adaptation-only packet 固定`、`AV shared handle の NativeHandle 形式`、`AV転送方式とクライアント側の存続期間`、`AOSP / AIDL / VTS 系`、`ARIB TS packet 系`、`ARIB section 系`、`PES / record index 系`、`MULTI2 / B25 descrambler 系`を現在の設計契約の正本とする。移送済みの旧表番号・旧節名は現行正本参照に使用しない。",
              "- frontendで公開・受理する値は、本書「フロントエンド設定の反映表」で定める。ARIB B31の値域根拠は本書「VTS環境とARIB B31の境界」に置く。":
              "- frontendで公開・受理する値は、本書「フロントエンド設定の反映表」で定める。ARIB B31の値域根拠は本書「フロントエンドの対応能力と状態」、現行日本語版との差分管理は本書「ARIB規範本文との静的照合」を正とする。",
          }
          for old, new in replacements.items():
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f"ambiguous replacement: {old[:80]}")
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f"neither old nor new text found: {old[:80]}")

          heading = "### Filter / DVR query API 固定契約"
          if heading not in text:
              anchor = "`disconnectCiCam()`には入力引数がないため、CAM ID検証を適用しない。\n\n"
              if text.count(anchor) != 1:
                  raise SystemExit("query-contract insertion anchor not unique")
              block = '''`disconnectCiCam()`には入力引数がないため、CAM ID検証を適用しない。\n\n### Filter / DVR query API 固定契約\n\n`IFilter.getQueueDesc()`、`IFilter.getId()`、`IFilter.getId64Bit()`、`IDvr.getQueueDesc()`は読み取り専用queryであり、成功時にobject lifecycle、queue identity、generation、設定、relation、FMQ read/write positionを変更しない。論理閉鎖開始後は0-S-4の公開close gateに従い`INVALID_STATE`とする。\n\n| API | Live objectでの成功条件と結果 | 非対応 / failure |\n|---|---|---|\n| `IFilter.getQueueDesc()` | open時filter種別が通常payload FMQを持つ場合、`configure()`前後を問わずopen時に確保した同一FMQ descriptorを返す | 通常payload FMQを持たないfilterは`UNAVAILABLE`とし、FMQ descriptorを後付け生成しない |\n| `IFilter.getId()` / `getId64Bit()` | open時に確定したdemux-local filter IDを対応するAIDL返却型で返す。両queryは同じfilter object identityを表す | 読み取り専用queryとして別IDを再発行せず、状態を変更しない |\n| `IDvr.getQueueDesc()` | record / playbackとも、`configure()`前後およびstart/stop状態を問わず、open時に確保した同一DVR FMQ descriptorを返す | `configure()`または再設定でqueue identity、容量、descriptorを置換しない |\n\n通常payload FMQを持つFilterは、未configureを理由に`getQueueDesc()`を拒否しない。Record FilterのpayloadはRecord DVR FMQへ、audio/video mediaは`MediaEvent`の共有領域またはイベント固有fdへ配送し、PCRその他callback-only eventには通常payload FMQを設けない。DVR FMQは`openDvr()`の`bufferSize`から生成し、`configure()`はしきい値等のDVR設定だけを変更する。\n\n'''
              text = text.replace(anchor, block)

          p.write_text(text, encoding="utf-8")
          PY

          python3 - <<'PY'
          from pathlib import Path

          docs = [
              Path("tuner_hal/DESIGN_JA.md"),
              Path("tuner_hal2/DESIGN_JA.md"),
              Path("開発規則.md"),
          ]
          combined = "\n".join(p.read_text(encoding="utf-8") for p in docs)
          broken = [
              "ARIB/ISDB入力処理契約",
              "Stream boundary 契約",
              "Packet pipeline 正本契約",
              "AV shared handle 入出力契約",
              "VTS環境とARIB B31の境界",
              "AT-009a",
              "AT-010a",
              "WorkerExit/WorkerFailureClassifier/ScanSessionTxn",
          ]
          leftovers = [x for x in broken if x in combined]
          if leftovers:
              raise SystemExit(f"broken references remain: {leftovers}")

          public = docs[0].read_text(encoding="utf-8")
          required = [
              "`IFilter.getQueueDesc()`",
              "`IFilter.getId()`",
              "`IFilter.getId64Bit()`",
              "`IDvr.getQueueDesc()`",
              "### Filter / DVR query API 固定契約",
          ]
          missing = [x for x in required if x not in public]
          if missing:
              raise SystemExit(f"query contracts missing: {missing}")
          PY

          git diff --check

      - name: Commit documentation changes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "chatgpt-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tuner_hal/DESIGN_JA.md
          git commit -m "docs: restore tuner query contracts and references"
          git push origin HEAD:agent/restore-tuner-query-contracts-and-fix-references
