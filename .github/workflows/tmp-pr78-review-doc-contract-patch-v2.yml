name: temporary PR78 review document contract patch v2

on:
  push:
    branches: [fix/tuner-hal2-contract-boundaries]
    paths:
      - ".github/workflows/tmp-pr78-review-doc-contract-patch-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tuner-hal2-contract-boundaries
          fetch-depth: 0

      - name: Apply exact document patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: target count={count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_between(path, start, end, new, label):
              text = path.read_text(encoding="utf-8")
              if text.count(start) != 1 or text.count(end) != 1:
                  raise SystemExit(f"{label}: start count={text.count(start)}, end count={text.count(end)}")
              begin = text.index(start)
              finish = text.index(end, begin)
              path.write_text(text[:begin] + new + text[finish:], encoding="utf-8")

          public_design = Path("tuner_hal/DESIGN_JA.md")
          replace_once(
              public_design,
              "- `partialReceptionFlag`は未指定を表すAIDL値を明示制約なしとして成功させる。`TRUE` / `FALSE`は規格上有効な明示要求である。",
              "- `partialReceptionFlag=UNDEFINED`はcaller constraintなしを表すAOSP sentinelとして成功させる。`AUTO`はhardwareによる自動判定を求める既知の明示要求だが、現行product profileではその要求を設定・検証する契約を持たないため、backend副作用前に`UNAVAILABLE`とする。`TRUE` / `FALSE`は規格上有効な明示要求である。",
              "partial reception AUTO public contract",
          )

          impl_design = Path("tuner_hal2/DESIGN_JA.md")
          replace_once(
              impl_design,
              "| 27 | `WatermarkClassifier` | C | なし | なし | — |\n\nA=12、B=13、C=2であり、`WorkerHandle`を第二のAまたは第二の論理契約として数えない。",
              "| 27 | `WatermarkClassifier` | C | なし | なし | — |\n| 28 | `LnbRegistry` | A | 同一物理LNB・共有レールに対する永続状態変更と物理I/O権限をowner内で直列化する | LNB state generation + prepared control mutation + 物理I/O authority | — |\n\nA=13、B=13、C=2であり、`WorkerHandle`を第二のAまたは第二の論理契約として数えない。",
              "LnbRegistry ABC classification",
          )

          audio_start = "TS AUDIOのPTS-sparse event associationは"
          filter_start = "Filterの`stop()`は配送を停止するだけで"
          audio_replacement = "TS AUDIOのPTS-sparse event associationは`demux/src/av/audio_timestamp.rs`の有限codec extractorを`FilterRuntime`所有の従属状態として保持し、`DemuxRuntime`の既存AV配送境界からだけ更新する。独立した正規state owner、packet pipeline、clock、queue、workerを追加しない。明示PTSをH.222.0のfirst AU commencing in PESへanchorし、PES境界を跨ぐMPEG-2 AAC LC ADTS / MPEG audioについて、規格上限8191 byte以内の未完了frameを最大1件だけbyte完全に保持する。内部extractorは検証済みframe境界、frame長、同frameへ適用可能なPTS provenanceをtyped resultとして既存AV allocation ownerへ渡す。未anchorかつ`data_alignment_indicator=false`では先行frameの最大残り長未満だけを走査し、対応headerと宣言frame lengthを検査する。次境界未確認の候補はanchorへcommitせず、先行AU最大1 frame、first AU最大1 frame、次header最大7 byteの合計16389 byte以内だけ保留する。後続PES上で同一signatureの次境界まで確認できた一意候補だけを採用し、複数候補または上限超過はfail-closedとする。syncword一致だけの探索や上限なし走査は追加せず、`data_alignment_indicator=true`ならpayload先頭以外を候補にしない。連続ES上で検証したframe headerのactual sample rateとexact sample countだけを33-bit 90 kHzへ変換し、PES境界を跨ぐpartial frameは内部extractor状態として保持する。TEI、continuity gap、scramble/drop、flush、source/generation変更は既存`PacketPipeline` / filter lifecycle / stream boundaryの結果からanchor、未完了frame、cold-start保留bytesへreset通知し、PCR / wallclock / nominal値へfallbackしない。AIDL `MediaEvent`のpayload成立、presence/value投影、公開timestamp意味、成功配送条件は`../tuner_hal/DESIGN_JA.md`の「clear non-passthrough MediaEvent presentation timestamp 契約」だけを正本とし、本書では再定義しない。\n\n"
          replace_between(impl_design, audio_start, filter_start, audio_replacement, "TS AUDIO public semantics shrink")

          filter_end = "物理frontendの`exclusiveGroupId`は"
          filter_replacement = "Filter lifecycleと`startId`のcaller-visibleな保持・破棄境界、presence/value、配送順は`../tuner_hal/DESIGN_JA.md`のFilter lifecycle契約だけを正本とする。実装上は既存`FilterRuntime`をlifecycle依存状態と未配送`startId` artifactのownerとし、`QueueCleanupUseCase` / `StreamBoundaryTxn`その他の既存typed境界からだけ更新する。別owner、queue、worker、時計を追加せず、本書では公開`stop()` / `start()` / `flush()` / reconfigureの結果を再規定しない。\n\n"
          replace_between(impl_design, filter_start, filter_end, filter_replacement, "Filter lifecycle public semantics shrink")

          index_marker = "## 実装構造索引"
          capability_replacement = "物理frontendの`exclusiveGroupId`に関するcaller-visible capability policyは`../tuner_hal/DESIGN_JA.md`だけを正本とする。`tuner_hal2`ではdevice probeで得た物理identityを`aidl_service/src/service_entry.rs`のcapability構築経路へ渡し、`service_runtime/src/registry.rs::FrontendCapabilitySnapshot`へ格納してAIDL応答へ投影する実装接続だけを所有する。group値、公開条件、共有条件を本書で再定義しない。\n\nISDB-S symbol-rateの公開capability値と入力受付条件は`../tuner_hal/DESIGN_JA.md`だけを正本とする。`tuner_hal2`では`FrontendCapabilitySnapshot`へのcapability格納と、`device/src/dvb/tune_mapping.rs`で検証済みtyped requestをLinux DVB `DTV_SYMBOL_RATE` propertyへ写像する物理接続だけを所有する。公開値、sentinelの意味、成功・失敗条件を本書で再定義しない。\n\n"
          replace_between(impl_design, filter_end, index_marker, capability_replacement, "exclusive group and symbol rate public semantics shrink")
          PY
          git diff --check

      - name: Commit patch and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-pr78-review-doc-contract-patch.yml
          git rm .github/workflows/tmp-pr78-review-doc-contract-patch-v2.yml
          git add tuner_hal/DESIGN_JA.md tuner_hal2/DESIGN_JA.md
          git commit -m "docs(tuner): restore public contract SSOT boundaries"
          git push origin HEAD:fix/tuner-hal2-contract-boundaries
