name: Review17 design fix

on:
  push:
    branches:
      - agent/apply-tuner-hal2-design-proposals-v70

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply design fix
        run: python .github/review17_fix.py
      - name: Validate design fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'TisPlaybackBudgetSnapshot.singleEventLimitBytes`をofflineで独立導出' 開発規則.md
          grep -Fq 'TISはHAL内部`CapabilitySnapshot`、`avMaxEventBytes`、`avPerFilterLiveBytes`、`avRuntimeBudgetBytes`をruntime参照・公開・複製しない' 開発規則.md
          grep -Fq 'product-level invariantとして静的に検証する' 開発規則.md
          ! grep -Fq '同一製品profileから生成するHAL `CapabilitySnapshot`のper-event予算と、TISが使用するdecoder入力上限の小さい方へ接続する' 開発規則.md
      - name: Commit design fix and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/review17_fix.py .github/workflows/review17-fix.yml
          git add -A
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: separate TIS and HAL AV budgets'
          git push origin HEAD:agent/apply-tuner-hal2-design-proposals-v70
