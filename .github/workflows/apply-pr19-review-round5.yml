name: Apply PR19 review round 5

on:
  push:
    branches:
      - agent/fix-tis-arib-design-residuals
    paths:
      - .github/workflows/apply-pr19-review-round5.yml
      - .github/scripts/apply_pr19_round5.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-tis-arib-design-residuals
      - name: Apply design changes
        run: python3 .github/scripts/apply_pr19_round5.py
      - name: Verify and push
        run: |
          git diff --check
          if git grep -n -E 'MediaSync first-frame gate|同generationのMediaSync|block model decoder / MediaSync / AudioTrack|decoder、MediaSync|MediaSync input Surface|decoder／MediaSync入力' -- tis/DESIGN_JA.md; then
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tis/DESIGN_JA.md
          git commit -m 'docs: close Media3 playback ownership graph'
          git push
