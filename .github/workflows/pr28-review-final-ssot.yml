name: PR28 final SSOT review fix

on:
  push:
    branches:
      - agent/fix-commonization-boundaries
    paths:
      - .github/workflows/pr28-review-final-ssot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-commonization-boundaries
          fetch-depth: 0
      - name: Apply final SSOT fixes
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/pr28_final_ssot.py
          python3 /tmp/pr28_final_ssot.py
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tuner_hal2/DESIGN_JA.md 開発規則.md
          git commit -m 'design: finish SSOT responsibility cleanup'
          git push origin HEAD:agent/fix-commonization-boundaries
