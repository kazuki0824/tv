name: temporary CAS design overimplementation cleanup

on:
  push:
    branches: [feat/cas]

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/cas
      - name: Remove Yakisoba entitlement-only design
        shell: python
        run: |
          from pathlib import Path
          p = Path('cas_plugin/DESIGN_JA.md')
          s = p.read_text()
          def once(old, new):
              global s
              if s.count(old) != 1:
                  raise SystemExit(f'expected one match, got {s.count(old)}: {old[:100]!r}')
              s = s.replace(old, new, 1)

          once(
            'EMMで確定したwork keyと権利状態は、固定credentialを書き換えず、CASが所有する可変状態として`/data/vendor/maleicacid/cas/yakisoba_state`へ永続化する。永続状態はcard ID、各BroadcasterGroupのwork key、更新番号、有効期限、権利bitmap、重複配送判定に必要な情報を一体で保持し、再起動後の正本とする。libyakisobaのprocess内Keysetはこの永続状態から復元する実行時状態であり、別の永続正本にしない。',
            'EMMで確定したwork keyは、固定credentialを書き換えず、CASが所有する可変状態として`/data/vendor/maleicacid/cas/yakisoba_state`へ永続化する。永続状態はcard ID、各BroadcasterGroupのwork key、更新番号、重複配送判定に必要な情報を一体で保持し、再起動後の正本とする。libyakisobaのprocess内Keysetはこの永続状態から復元する実行時状態であり、別の永続正本にしない。')
          once('関連ECM処理がhalf-updated entitlement/work-key stateを観測しないorderingを提供する。',
               '関連ECM処理が更新途中のwork-key stateを観測しないorderingを提供する。')
          once('EMMの出力bufferを確保し、復号後のcommand、宛先、長さ、更新番号、適用条件をbackendで検証する。',
               'EMMの出力bufferを確保し、復号後のcommand、宛先、長さ、更新番号をbackendで検証する。')
          once('`bcas_decodeEMM()` の成功は復号・MAC検証の成功であり、entitlementやwork key台帳への更新完了ではない。YakisobaBackendが復号後commandの解釈と適用を所有し、対象外宛先の除外、重複更新の扱い、更新番号・権利条件の検証を経て、ECMが実際に参照するlibyakisobaのwork key台帳へ反映する。',
               '`bcas_decodeEMM()` の成功は復号・MAC検証の成功であり、work key台帳への更新完了ではない。YakisobaBackendが復号後commandの解釈と適用を所有し、対象外宛先の除外、重複更新の扱い、更新番号の検証を経て、ECMが実際に参照するlibyakisobaのwork key台帳へ反映する。')
          once('EMM処理は適用対象messageごとに、復号後command、権利条件、全work key登録の事前検査を完了してから次状態を構成する。',
               'EMM処理は適用対象messageごとに、復号後command、更新番号、全work key登録の事前検査を完了してから次状態を構成する。')
          once('その後に同じ更新をprocess内Keysetへ`Register()`して権利状態を切り替える。',
               'その後に同じ更新をprocess内Keysetへ`Register()`してwork key台帳を切り替える。')
          once('`ERROR_CAS_DECRYPT`。鍵・権利を更新しない', '`ERROR_CAS_DECRYPT`。鍵を更新しない')
          once('EMMで確定したYakisobaのKwと権利状態だけは§6のCAS所有永続状態へ保存し、Tuner側、固定credential、別cacheへ永続化しない。',
               'EMMで確定したYakisobaのKwと更新番号・再配送判定情報だけは§6のCAS所有永続状態へ保存し、Tuner側、固定credential、別cacheへ永続化しない。')
          p.write_text(s)
      - name: Commit design correction and remove this workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-cas-design-overimpl-cleanup.yml
          git diff --check
          git add cas_plugin/DESIGN_JA.md
          git commit -m "fix(cas): Yakisobaの権利判定責務を削除する"
          git push origin HEAD:feat/cas
