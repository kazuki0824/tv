name: PR2 review5 cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/pr2-review5-cleanup-trigger-20260802.txt

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove temporary review automation
        run: |
          git rm -f --ignore-unmatch \
            .github/pr2-review5-patch-20260802.py \
            .github/workflows/pr2-review5-fix-20260802.yml \
            .github/pr2-review5-trigger-20260802.txt \
            .github/pr2-review5-followup-20260802.py \
            .github/workflows/pr2-review5-followup-20260802.yml \
            .github/pr2-review5-followup-trigger-20260802.txt \
            .github/pr2-review5-finalize-20260802.py \
            .github/workflows/pr2-review5-finalize-20260802.yml \
            .github/pr2-review5-finalize-trigger-20260802.txt \
            .github/pr2-review5-consistency-20260802.py \
            .github/workflows/pr2-review5-consistency-20260802.yml \
            .github/pr2-review5-consistency-trigger-20260802.txt \
            .github/workflows/pr2-review5-cleanup-20260802.yml \
            .github/pr2-review5-cleanup-trigger-20260802.txt

      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: remove temporary PR2 review automation"
          git push origin HEAD:main
