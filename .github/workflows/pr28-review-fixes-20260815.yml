name: PR28 review fixes 20260815

on:
  push:
    branches:
      - agent/fix-commonization-boundaries

permissions:
  contents: write

jobs:
  fix-design-docs:
    if: github.event.head_commit.message == 'chore: apply PR28 review fixes 20260815'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply narrowly scoped design fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              return text.replace(old, new, 1)

          design = Path('tuner_hal/DESIGN_JA.md')
          text = design.read_text()

          text = replace_once(
              text,
              '`CloseCleanupAuthority`、未完step、cleanup report、retry/reaper handoff、完了確定',
              '`CloseCleanupAuthority`、未完step、cleanup report、retry/reaper handoff、早期再開要求、完了確定',
              'ObjectCloseTxn owned state',
          )
          text = replace_once(
              text,
              '全stepを試行し、retryableは`CleanupPending`。authority取得後にcaller/ownerが消滅した場合は未完authorityを回収機構へ一度だけ移管し、実状態不明/遮断不能だけquarantine。主障害とcleanup障害を別保持',
              '全stepを試行し、retryableは`CleanupPending`。再`close()`、owner消滅、依存資源の完了通知、service初期化は未完cleanupの早期再開を要求できるが、これらは唯一の進行契機ではなく、`WorkerRuntime` / `WorkerHandle`の自律retryを停止しない。authority取得後にcaller/ownerが消滅した場合は未完authorityを回収機構へ一度だけ移管し、実状態不明/遮断不能だけquarantine。主障害とcleanup障害を別保持',
              'ObjectCloseTxn progress triggers',
          )
          text = replace_once(
              text,
              'owner generation、stop signal、JoinHandle、fence、reaper handoff mechanism、typed worker terminal result（`Normal` / `StopRequested` / `RuntimeFailure` / `PanicOrJoinFailure`）',
              'owner generation、stop signal、JoinHandle、fence、reaper handoff mechanism、有界`ReaperSupervisor` work queue、retry schedule / coalesce state、typed worker terminal result（`Normal` / `StopRequested` / `RuntimeFailure` / `PanicOrJoinFailure`）',
              'WorkerRuntime owned state',
          )
          text = replace_once(
              text,
              'owner handle slot prepare → fenced worker spawn / handle bind → signal stop → wake/cancel → observe/join または one-shot reaper handoff → worker実終了と依存cleanup完了後にlease/slot release',
              'owner handle slot prepare → fenced worker spawn / handle bind → signal stop → wake/cancel → observe/join または one-shot reaper handoff → handoff済みworkを既存retry scheduleで外部API再呼出しなしに自律再試行 → worker実終了と依存cleanup完了後にlease/slot release',
              'WorkerRuntime phase',
          )
          text = replace_once(
              text,
              'failureはtyped reportしleaseを早期再利用しない。terminal budgetは',
              'failureはtyped reportしleaseを早期再利用しない。`ReaperSupervisor`へのenqueueおよび早期再開要求は `(owner, generation, dependency resource)` ごとにcoalesceし、同一未完workを重複実行しない。外部APIの再呼出しがなくても有界work queueがretry scheduleに従って進行する。terminal budgetは',
              'WorkerRuntime autonomous progress',
          )
          text = replace_once(
              text,
              'handle-slot failureでno-spawn、typed terminal result、stop/wake一回性、generation fence、join/one-shot reaper、panic、no early reuse、deadline branch、local quarantine対ServiceCritical判定',
              'handle-slot failureでno-spawn、typed terminal result、stop/wake一回性、generation fence、join/one-shot reaper、外部API再呼出しなしの自律retry、早期再開要求のcoalesce、panic、no early reuse、deadline branch、local quarantine対ServiceCritical判定',
              'WorkerRuntime minimum tests',
          )

          old_token_contract = '`IDescrambler.setKeyToken()` に到達する non-VOID トークン は、HAL key token table が発行した 8 byte の opaque byte array だけを有効とする。Android 14 系の `Tuner.VOID_KEYTOKEN` は 1 byte トークン `[0x00]` として扱い、current key removal 用の有効 トークン とする。空 トークン `[]` は VOID トークン ではなく、常に `INVALID_ARGUMENT` と内部診断 `BAD_TOKEN` に落とす。non-VOID で 8 byte 以外の トークン は registry lookup 前に `INVALID_ARGUMENT` / `BAD_TOKEN` とする。'
          new_token_contract = '`IDescrambler.setKeyToken()` に到達する non-VOID トークンは、標準MediaCas経路では `MediaCas.Session.getSessionId()` と同一byte sequenceをTuner key tokenとして用い、CAS / vendor key bridgeがそのbytesと内部`DescramblerKeySlot`の対応をHAL key token tableへ登録したものを解決対象とする。TIS向けに別形式のvendor-private tokenを設けない。入力形式はTuner SDK `Descrambler.isValidKeyToken()` に合わせ、1 byte以上16 byte以下を有効なtoken形式とする。ただしAndroid 14系の `Tuner.VOID_KEYTOKEN` は1 byteトークン `[0x00]` としてcurrent key removal用に予約する。空トークン `[]` はVOIDトークンではなく、常に `INVALID_ARGUMENT` と内部診断 `BAD_TOKEN` に落とす。16 byteを超えるnon-VOIDトークンはregistry lookup前に `INVALID_ARGUMENT` / `BAD_TOKEN` とする。'
          text = replace_once(text, old_token_contract, new_token_contract, 'Tuner token identity/length contract')
          text = replace_once(
              text,
              '`setKeyToken()` に渡す non-VOID byte array は HAL key token table が発行した 8 byte fixed テストトークン とし、長い診断名は テストケース 名、lookup table の説明、診断 dump の表示名に限定する。',
              '`setKeyToken()` に渡すtest用non-VOID byte arrayは1 byte以上16 byte以下（`[0x00]`を除く）のtest-only tokenをHAL key token tableへ事前登録したものとし、長い診断名はテストケース名、lookup tableの説明、診断dumpの表示名に限定する。',
              'test token format',
          )
          text = replace_once(
              text,
              '次に空 トークン `[]` と 8 byte 以外の non-VOID トークン を registry lookup 前に拒否し、`INVALID_ARGUMENT` と内部診断 `BAD_TOKEN` に固定する。8 byte だが未登録の トークン と CAS bridge 未接続 トークン は通常 トークン として registry lookup 後に区別して診断する。',
              '次に空トークン `[]` と16 byteを超えるnon-VOIDトークンをregistry lookup前に拒否し、`INVALID_ARGUMENT` と内部診断 `BAD_TOKEN` に固定する。1 byte以上16 byte以下（`[0x00]`を除く）だが未登録のトークンとCAS bridge未接続トークンは通常トークンとしてregistry lookup後に区別して診断する。',
              'token lookup classification',
          )
          text = replace_once(
              text,
              '`setKeyToken()` は、空 トークン、8 byte 以外の non-VOID トークン、未登録 トークン、CAS bridge 未接続 トークン を区別して診断カウンターに記録する。',
              '`setKeyToken()` は、空トークン、16 byteを超えるnon-VOIDトークン、未登録トークン、CAS bridge未接続トークンを区別して診断カウンターに記録する。',
              'token diagnostics',
          )
          design.write_text(text)

          rules = Path('開発規則.md')
          text = rules.read_text()
          text = replace_once(
              text,
              'KsをTuner descramblerから参照可能な安全な内部鍵資源へ設定し、その資源とsessionの対応を表すopaque key tokenをvendor key bridge経由で成立させる',
              'KsをTuner descramblerから参照可能な安全な内部鍵資源へ設定し、標準MediaCas session IDのbyte sequence（`MediaCas.Session.getSessionId()`）とその内部鍵資源の対応をvendor key bridgeで成立させる。このsession ID bytes自体をTuner key tokenのidentityとする',
              'CAS owner token identity',
          )
          text = replace_once(
              text,
              '| CAS / vendor key bridge → TIS | opaque key tokenだけをTISへ渡す。key slotの物理実装方式はvendor内部契約に閉じる | raw key materialまたはkey-slot内部表現をTIS / Binder契約へ露出しない |',
              '| CAS / vendor key bridge → TIS | `MediaCas.Session.getSessionId()` と同一byte sequenceのopaque key tokenだけをTISへ渡す。key slotの物理実装方式はvendor内部契約に閉じる | TIS向けに別形式のvendor-private tokenを発行しない。raw key materialまたはkey-slot内部表現をTIS / Binder契約へ露出しない |',
              'CAS to TIS token boundary',
          )
          text = replace_once(
              text,
              '| TIS → Tuner HAL | CAS側で成立したopaque key tokenを`IDescrambler.setKeyToken(token)`へ接続し、対象PIDを`addPid()` / `removePid()`へ接続する | Tuner HAL内部のkey table / key resourceを直接変更しない |',
              '| TIS → Tuner HAL | `MediaCas.Session.getSessionId()` と同一byte sequenceのopaque key tokenを`IDescrambler.setKeyToken(token)`へ接続し、対象PIDを`addPid()` / `removePid()`へ接続する | MediaCas session IDから別形式のtokenへTIS側で変換しない。Tuner HAL内部のkey table / key resourceを直接変更しない |',
              'TIS to Tuner token boundary',
          )
          text = replace_once(
              text,
              '                                                  │ key token発行\n                                                  ▼\nTIS <──────────────────── opaque key token ───── CAS/vendor key bridge',
              '                                                  │ session ID bytesをkey slotへ登録\n                                                  ▼\nTIS <──────── opaque key token (= session ID bytes) ─ CAS/vendor key bridge',
              'CAS data flow diagram',
          )
          rules.write_text(text)

          # Guard the specific regressions fixed by this change.
          d = design.read_text()
          r = rules.read_text()
          forbidden = [
              'HAL key token table が発行した 8 byte の opaque byte array',
              'non-VOID で 8 byte 以外の トークン',
              'HAL key token table が発行した 8 byte fixed テストトークン',
              '8 byte だが未登録の トークン',
              '空 トークン、8 byte 以外の non-VOID トークン',
          ]
          for s in forbidden:
              if s in d:
                  raise SystemExit(f'forbidden stale token contract remains: {s}')
          required = [
              '外部API再呼出しなしに自律再試行',
              '(owner, generation, dependency resource)',
              '`MediaCas.Session.getSessionId()` と同一byte sequence',
              '1 byte以上16 byte以下',
          ]
          all_text = d + '\n' + r
          for s in required:
              if s not in all_text:
                  raise SystemExit(f'missing required contract: {s}')
      - name: Commit design fixes and remove temporary workflow
        run: |
          git config user.name "maleicacid"
          git config user.email "4982384+kazuki0824@users.noreply.github.com"
          git rm .github/workflows/pr28-review-fixes-20260815.yml
          git add tuner_hal/DESIGN_JA.md 開発規則.md
          git commit -m "design: restore reaper and CAS token contracts"
          git push origin HEAD:agent/fix-commonization-boundaries
