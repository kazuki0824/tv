name: PR53 review fix temporary worker

on:
  push:
    branches:
      - agent/pr53-review-fix-20260902

permissions:
  contents: write

jobs:
  fix-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr53-review-fix-20260902
          persist-credentials: true
          fetch-depth: 0

      - name: Apply reviewed cleanup fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              p.write_text(text.replace(old, new, 1))

          demux = "tuner_hal2/demux/src/runtime/demux.rs"
          replace_once(
              demux,
              "    QueueRuntimeFailure,\n    AvBackingFailure,",
              "    QueueRuntimeFailure,\n    QueueRuntimeRollbackFailed,\n    AvBackingFailure,",
          )
          replace_once(
              demux,
              "    pub const fn queue_runtime_failure(id: i32) -> Self {\n        Self {\n            kind: DemuxRuntimeErrorKind::QueueRuntimeFailure,\n            id: Some(id),\n        }\n    }",
              "    pub const fn queue_runtime_failure(id: i32) -> Self {\n        Self {\n            kind: DemuxRuntimeErrorKind::QueueRuntimeFailure,\n            id: Some(id),\n        }\n    }\n    pub const fn queue_runtime_rollback_failed(id: i32) -> Self {\n        Self {\n            kind: DemuxRuntimeErrorKind::QueueRuntimeRollbackFailed,\n            id: Some(id),\n        }\n    }",
          )
          replace_once(
              demux,
              "            Err(_) => {\n                let _ = token.abort();\n                if let Some(dvr) = self.dvrs.get_mut(&dvr_id) {\n                    dvr.mark_failed();\n                }\n                return Err(DemuxRuntimeError::queue_runtime_failure(dvr_id));\n            }",
              "            Err(_) => {\n                if token.abort().is_err() {\n                    self.quarantine_dvr_runtime(dvr_id);\n                    return Err(DemuxRuntimeError::queue_runtime_rollback_failed(dvr_id));\n                }\n                if let Some(dvr) = self.dvrs.get_mut(&dvr_id) {\n                    dvr.mark_failed();\n                }\n                return Err(DemuxRuntimeError::queue_runtime_failure(dvr_id));\n            }",
          )

          boot = "tuner_hal2/service_runtime/src/boot.rs"
          replace_once(
              boot,
              "        maleicacid_tuner_hal2_demux::DemuxRuntimeErrorKind::QueueRuntimeFailure\n        | maleicacid_tuner_hal2_demux::DemuxRuntimeErrorKind::AvBackingFailure => {",
              "        maleicacid_tuner_hal2_demux::DemuxRuntimeErrorKind::QueueRuntimeRollbackFailed => {\n            HalError::cleanup_failed(\n                \"playback queue read rollback\",\n                \"DVR was quarantined after playback queue read rollback failure\",\n            )\n        }\n        maleicacid_tuner_hal2_demux::DemuxRuntimeErrorKind::QueueRuntimeFailure\n        | maleicacid_tuner_hal2_demux::DemuxRuntimeErrorKind::AvBackingFailure => {",
          )

          reaper = "tuner_hal2/aidl_service/src/cleanup_reaper.rs"
          replace_once(
              reaper,
              "        let Some(context) = context.upgrade() else {\n            let _ = clear_pending_cleanup_job(&pending, key);\n            return;\n        };",
              "        let Some(context) = context.upgrade() else {\n            // Without the canonical service context there is no authority to declare\n            // cleanup complete. Keep the pending obligation recorded until the\n            // reaper owner itself is destroyed.\n            return;\n        };",
          )
          replace_once(
              reaper,
              "            Err(_) => {\n                mark_cleanup_reaper_critical(&context);\n                let _ = clear_pending_cleanup_job(&pending, key);\n                return;\n            }",
              "            Err(_) => {\n                mark_cleanup_reaper_critical(&context);\n                if clear_pending_cleanup_job(&pending, key).is_err() {\n                    mark_cleanup_reaper_critical(&context);\n                }\n                return;\n            }",
          )

          contract = "tuner_hal2/compile_contract/src/lib.rs"
          p = Path(contract)
          text = p.read_text()
          addition = r'''

#[test]
fn cleanup_failure_preservation_source_contract() {
    const CLEANUP_REAPER: &str = include_str!("../../aidl_service/src/cleanup_reaper.rs");
    const DEMUX: &str = include_str!("../../demux/src/runtime/demux.rs");

    assert!(!CLEANUP_REAPER.contains("let _ = clear_pending_cleanup_job"));
    assert!(CLEANUP_REAPER.contains(
        "if clear_pending_cleanup_job(&pending, key).is_err() {\n                    mark_cleanup_reaper_critical(&context);"
    ));
    assert!(CLEANUP_REAPER.contains(
        "let Some(context) = context.upgrade() else {\n            // Without the canonical service context"
    ));
    assert!(!DEMUX.contains("let _ = token.abort();"));
    assert!(DEMUX.contains("DemuxRuntimeErrorKind::QueueRuntimeRollbackFailed"));
    assert!(DEMUX.contains("self.quarantine_dvr_runtime(dvr_id);"));
}
'''
          if "fn cleanup_failure_preservation_source_contract()" in text:
              raise SystemExit("compile contract already present")
          p.write_text(text + addition)
          PY

      - name: Format and validate
        shell: bash
        run: |
          rustfmt +1.81.0 --edition 2021 tuner_hal2/demux/src/runtime/demux.rs
          rustfmt +1.81.0 --edition 2021 tuner_hal2/service_runtime/src/boot.rs
          rustfmt +1.81.0 --edition 2021 tuner_hal2/aidl_service/src/cleanup_reaper.rs
          rustfmt +1.81.0 --edition 2021 tuner_hal2/compile_contract/src/lib.rs
          git diff --check
          cd tuner_hal2/host_ci
          cargo +1.81.0 fmt --all -- --check
          cargo +1.81.0 check --workspace --all-targets --locked
          cargo +1.81.0 test --workspace --locked
          cargo +1.81.0 clippy --workspace --all-targets --locked -- -D warnings

      - name: Commit validated source changes
        shell: bash
        run: |
          git config user.name "maleicacid"
          git config user.email "4982384+kazuki0824@users.noreply.github.com"
          git add tuner_hal2/demux/src/runtime/demux.rs tuner_hal2/service_runtime/src/boot.rs tuner_hal2/aidl_service/src/cleanup_reaper.rs tuner_hal2/compile_contract/src/lib.rs
          git diff --cached --check
          git commit -m "fix(tuner): preserve cleanup rollback failures"
          git push origin HEAD:agent/pr53-review-fix-20260902
