name: PR54 F11 design once

on:
  push:
    paths:
      - ".github/workflows/pr54-f11-design-once.yml"

permissions:
  contents: write

jobs:
  update-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/implement-tis-arib-si-design-pr53
          fetch-depth: 0
      - name: F11設計判断を正本化
        run: |
          python3 - <<'PY'
          from pathlib import Path

          design = Path('tis/DESIGN_JA.md')
          text = design.read_text()
          old = '- System TV Appはpolicy ownerとして、parental controlsが有効でglobal policyが`NONE`以外の場合に限り上記exceptional ratingをblocked-rating集合へ反映する。PIN認証済みcurrent contentの `onUnblockContent()` 一時解除は維持し、第三者custom rating、CTS Verifier由来rating、他domain/ratingSystemへこのproduct policyを波及させない。TISはraw値から独自policyを実装せず `TvInputManager.isRatingBlocked()` の結果だけに従う。'
          new = '- ARIB exceptional ratingのpolicy ownerはLive TV Appとする。rating定義は独立`AribContentRatings` APKがTIF標準providerとして公開する。Android 15 / LineageOS 22.1 baselineではpartner customizationとRRO/product overlayはresource customizationに限定され、`ContentRatingLevelPolicy`またはblocked-rating projectionへ外部codeを注入する正式hookがないため、product integrationではLive TV Appの既存parental policy pathへ `ARIB_EXCEPTIONAL / BROADCASTER_DEFINED` 1件のprojectionだけを最小差分で統合する。第二policy APKを追加せず、TISや別APKからLive TV App privateの`NONE/HIGH/MEDIUM/LOW/CUSTOM` stateを読む設計にしない。parental controls無効またはglobal policy=`NONE`ではexceptional ratingをblocked集合へ入れず、parental controls有効かつ`HIGH/MEDIUM/LOW/CUSTOM`ではblocked集合へ反映する。PIN認証済みcurrent contentの `onUnblockContent()` 一時解除は維持し、第三者custom rating、CTS Verifier由来rating、他domain/ratingSystemへこのproduct policyを波及させない。TISはraw値から独自policyを実装せず `TvInputManager.isRatingBlocked()` の結果だけに従う。'
          if text.count(old) != 1:
              raise SystemExit(f'DESIGN_JA target count={text.count(old)}')
          design.write_text(text.replace(old, new, 1))

          integration = Path('tis/INTEGRATION.md')
          text = integration.read_text()
          start = text.index('## System TV App exceptional rating policy統合\n')
          end = text.index('## MediaSync Exact-mode platform統合\n', start)
          section = '''## ARIB exceptional ratingのLive TV App最小policy統合

JPN parental rating raw `0x12..0xFF` はTISで `com.maleicacid.tv.ratings / ARIB_EXCEPTIONAL / BROADCASTER_DEFINED` として保持し、rating定義は独立`AribContentRatings` APKがTIF標準providerとして公開する。blocked-rating policyのownerはLive TV Appとする。

Android 15 / LineageOS 22.1 baselineのpartner customization、RRO、product resource overlayには `ContentRatingLevelPolicy` またはblocked-rating projectionへ外部codeを注入する正式hookがないため、第二policy APKは追加しない。Live TV Appの既存parental policy pathへexceptional rating 1件のprojectionだけを最小product integrationとして加える。TISまたは別APKがLive TV App privateの`NONE/HIGH/MEDIUM/LOW/CUSTOM` stateを読む構成にはしない。実装差分は次のpatchを正規product pathとする。

```bash
cd packages/apps/TV
git apply --check "$TV_REPO/tis/platform_patches/lineage-22.1/packages_apps_TV_arib_exceptional_parental_policy.patch"
git apply "$TV_REPO/tis/platform_patches/lineage-22.1/packages_apps_TV_arib_exceptional_parental_policy.patch"
```

policy mappingは、parental controls無効またはglobal policy=`NONE`ならexceptional ratingをblocked集合へ入れず、parental controls有効かつ`HIGH/MEDIUM/LOW/CUSTOM`ならblocked集合へ反映する。既存のblocked-rating永続化、PIN認証後のsession-level `onUnblockContent()`、通常年齢rating、第三者custom ratingの扱いは変更しない。TISは `TvInputManager.isRatingBlocked()` を唯一のpolicy authorityとして使い続ける。

製品統合ではpatch適用後のLive TV App target compileに加え、`AribContentRatings` discovery、parental controls無効、`NONE`、`HIGH/MEDIUM/LOW/CUSTOM`、PIN unblock、他domain/ratingSystem非干渉を確認する。

'''
          integration.write_text(text[:start] + section + text[end:])
          PY
      - name: 設計差分を検証
        run: |
          git diff --check
          grep -F '第二policy APKを追加せず' tis/DESIGN_JA.md
          grep -F 'Live TV Appの既存parental policy path' tis/INTEGRATION.md
          grep -F 'HIGH/MEDIUM/LOW/CUSTOM' tis/DESIGN_JA.md tis/INTEGRATION.md
      - name: 最小docs commitを作成
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr54-f11-design-once.yml
          git add tis/DESIGN_JA.md tis/INTEGRATION.md
          git commit -m "docs(tis): fix ARIB parental policy integration design"
          git push origin HEAD:agent/implement-tis-arib-si-design-pr53
