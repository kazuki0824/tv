name: PR28 B25 4.9 product contract

on:
  push:
    branches:
      - agent/fix-commonization-boundaries
    paths:
      - .github/workflows/pr28-b25-49-product-contract.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-commonization-boundaries
          fetch-depth: 0
      - name: Normalize STD-B25 Part 1 4.9 product contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          design_path = Path('tuner_hal/DESIGN_JA.md')
          design = design_path.read_text(encoding='utf-8')

          replacements = [
              (
                  'STD-B25デコード能力とSTD-B25 Part 1 §4.9への適合宣言を分離する。本設計は、Part 1 §4.9の受信機システム最小鍵組容量を`Tuner HAL`単体の設計対象外とし、同条項、Part 1 CAS-R全体、またはSTD-B25全体への適合を主張しない。1鍵組を保証することだけを根拠に、Part 1 §4.9準拠と表現してはならない。将来、製品全体として同条項への適合を宣言する場合は、受信機システム全体の統合profileで8鍵組以上を保証し、Tuner HAL、CAS、backendを含む同時利用条件を別途固定する。',
                  'STD-B25デコード能力とSTD-B25 Part 1 §4.9への適合宣言を分離する。`開発規則.md` のproduct-level invariantに従い、Part 1 §4.9の受信機システム最小8鍵組容量は本製品全体として恒久的に適合対象外とし、同条項への適合を宣言しない。`StdB25DecodeCapability`、1鍵組の保証、実鍵組数または実PID数を根拠に、同条項適合、Part 1 CAS-R全体への適合、またはSTD-B25全面準拠と表現してはならない。',
              ),
              (
                  '能力を有効にする場合も、実鍵組数または実PID数をPart 1 §4.9適合、Part 1 CAS-R適合、またはSTD-B25全面準拠の宣言へ読み替えない。',
                  '能力を有効にする場合も、実鍵組数または実PID数を、本製品全体として恒久的に適合対象外であるPart 1 §4.9への適合、Part 1 CAS-R適合、またはSTD-B25全面準拠の宣言へ読み替えない。',
              ),
              (
                  'Part 1 §4.9の受信機システム鍵容量は適合対象外であり、実鍵組数と実PID数は製品profileの事実としてSTD-B25デコード能力台帳で予約・受付・解放を強制する。',
                  '`開発規則.md` のproduct-level invariantどおり、Part 1 §4.9の受信機システム最小8鍵組容量は本製品全体として恒久的に適合対象外であり、実鍵組数と実PID数は製品profileの事実としてSTD-B25デコード能力台帳で予約・受付・解放を強制する。',
              ),
              (
                  'B25は公式英訳6.7-E1全文を精読基準とするが、Part 1 §4.9の受信機システム最小鍵組容量は本設計の適合対象外とする。',
                  'B25は公式英訳6.7-E1全文を精読基準とするが、`開発規則.md` のproduct-level invariantどおり、Part 1 §4.9の受信機システム最小8鍵組容量は本製品全体として恒久的に適合対象外とし、同条項への適合を宣言しない。',
              ),
              (
                  'STD-B25 Part 1 §4.9は上表の適合主張に含めない。同条項に係る受信機システム最小鍵組容量は、本設計の範囲外としてだけ明記し、1鍵組のSTD-B25デコード能力を同条項適合またはPart 1 CAS-R適合と表現しない。',
                  'STD-B25 Part 1 §4.9は上表の適合主張に含めない。`開発規則.md` のproduct-level invariantどおり、同条項に係る受信機システム最小8鍵組容量は本製品全体として恒久的に適合対象外とし、同条項への適合を宣言しない。1鍵組のSTD-B25デコード能力、実鍵組数または実PID数を同条項適合またはPart 1 CAS-R適合と表現しない。',
              ),
          ]

          for old, new in replacements:
              count = design.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one DESIGN occurrence, got {count}: {old[:120]}')
              design = design.replace(old, new)

          forbidden = [
              'Part 1 §4.9の受信機システム最小鍵組容量を`Tuner HAL`単体の設計対象外',
              '将来、製品全体として同条項への適合を宣言する場合',
              'Part 1 §4.9の受信機システム最小鍵組容量は本設計の適合対象外',
              '同条項に係る受信機システム最小鍵組容量は、本設計の範囲外としてだけ明記',
          ]
          for needle in forbidden:
              if needle in design:
                  raise SystemExit(f'remaining forbidden DESIGN wording: {needle}')

          design_path.write_text(design, encoding='utf-8')

          rules_path = Path('開発規則.md')
          rules = rules_path.read_text(encoding='utf-8')
          heading = '#### STD-B25 Part 1 §4.9 最小鍵組容量の製品適合方針'
          if heading in rules:
              raise SystemExit('product contract heading already exists')
          marker = '\n#### 製品 scan 候補の規範値\n'
          if rules.count(marker) != 1:
              raise SystemExit(f'expected one insertion marker, got {rules.count(marker)}')
          section = '''\n#### STD-B25 Part 1 §4.9 最小鍵組容量の製品適合方針\n\nSTD-B25 Part 1 §4.9 が受信機システムに要求する最小8鍵組容量は、本製品全体として恒久的に適合対象外とし、同条項への適合を宣言しない。`StdB25DecodeCapability` に記録する限定したTS payload decode能力、実鍵組数、実PID数を、同条項への適合、Part 1 CAS-R全体への適合、またはSTD-B25全面準拠の宣言へ読み替えてはならない。\n\nこの節が所有するのは上記product-level判断だけである。`StdB25DecodeCapability`、`DescramblerCapacityPool`、個別APIの受付・解放・失敗時契約は `tuner_hal/DESIGN_JA.md` を正とする。\n'''
          rules = rules.replace(marker, section + marker)
          rules_path.write_text(rules, encoding='utf-8')
          PY

          git config user.name kazuki0824
          git config user.email '4982384+kazuki0824@users.noreply.github.com'
          git rm .github/workflows/pr28-b25-49-product-contract.yml
          git add tuner_hal/DESIGN_JA.md '開発規則.md'
          git diff --cached --check
          git commit -m 'design: fix STD-B25 4.9 product contract [skip ci]'
          git push origin HEAD:agent/fix-commonization-boundaries
