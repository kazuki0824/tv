name: PR2 review eight fixes 20260801 2113

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pr2-review8-fix-20260801-2113.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apply-tuner-hal2-design-proposals-v70
          fetch-depth: 0
      - name: Resolve eight remaining design comments
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one occurrence, got {count}')
              return text.replace(old, new)

          def sub_once(text: str, pattern: str, new: str, label: str) -> str:
              updated, count = re.subn(pattern, new, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected one regex occurrence, got {count}')
              return updated

          # 開発規則.md
          path = Path('開発規則.md')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '- px4_drvは、BSにおいてTSIDでの選局と相対TS番号での選局の両方に対応している',
              '- 現行製品のpx4能力は、BSの相対TS番号 `0..7` に限定する。absolute TSID能力は、機器・driver契約版・functional probeを持つ別の将来能力としてのみ有効化する',
              'driver capability fact',
          )
          text = sub_once(
              text,
              r'## BS/CS選局方法\n.*?\n\n## 日本向け scan / 選局契約',
              '''## BS/CS選局方法
日本のISDB-Sでは、BSは同一周波数帯で複数TSを扱い、CS110は本製品の選局契約上、周波数だけで選局する。

現行製品では、earth_pt1 / DVB backend は typed `STREAM_ID` として absolute TSID `0..65534` を受け付け、`RELATIVE_STREAM_NUMBER` は受け付けない。px4 backend は typed `RELATIVE_STREAM_NUMBER` `0..7` だけを受け付け、absolute `STREAM_ID` は値にかかわらず `UNAVAILABLE` とする。将来px4でabsolute TSID能力を追加する場合は、機器識別子、driver契約版、functional probeを持つ別能力として有効化し、その能力では `0..65534` をtyped absolute値として扱い、`0..11`を数値重複だけで拒否しない。

TISはbackendのeffective capabilityに応じて候補を生成する。Tuner HALまたはbackendへTSIDから相対TS番号への変換表を置かない。

## 日本向け scan / 選局契約''',
              'BS/CS selection section',
          )
          text = sub_once(
              text,
              r'px4 backend は、TIS から渡された explicit tune request を px4 legacy API の `freq_no / slot / addfreq` へ落とす adapter に限定する。.*?px4 backend に BS TSID から相対TS番号へ変換する表を置いてはならない。',
              '''px4 backend は、TIS から渡された explicit tune request を px4 legacy API の `freq_no / slot / addfreq` へ落とす adapter に限定する。現行能力ではBSの `RELATIVE_STREAM_NUMBER` `0..7`だけを値を変えずに`slot`へ渡し、absolute `STREAM_ID`は`UNAVAILABLE`とする。将来absolute能力を有効化する場合は、機器識別子、driver契約版、functional probeを持つ別のrelease-eligible能力として扱い、typed `STREAM_ID` `0..65534`を値域から相対番号へ推測せず処理する。px4 backend に BS TSID から相対TS番号へ変換する表を置いてはならない。''',
              'px4 adapter paragraph',
          )
          text = sub_once(
              text,
              r'frontend_px4 は scan policy を持たず、px4_drv legacy ioctl adapter として、TIS から渡された explicit tune request を px4_drv の `freq_no / slot / addfreq` へ変換するだけにする。.*?本書の選局契約と TIS の製品用候補表を置き換える表を持ってはならない。',
              '''frontend_px4 は scan policy を持たず、px4_drv legacy ioctl adapter として、TIS から渡された explicit tune request を px4_drv の `freq_no / slot / addfreq` へ変換するだけにする。現行能力ではBS `RELATIVE_STREAM_NUMBER` `0..7`だけを`slot`へ直渡しし、absolute `STREAM_ID`は受け付けない。本書の選局契約と TIS の製品用候補表を置き換える表を持ってはならない。''',
              'frontend px4 paragraph',
          )
          text = sub_once(
              text,
              r'px4 BS `STREAM_ID` を `slot` へ直渡しする実装は、.*?互換性目的で frontend_px4 に TSID→relative slot 変換表を再導入してはならない。',
              '''px4の将来absolute `STREAM_ID`能力は、`slot >= 8` rejectが無効でlegacy `slot`をabsolute TSIDとしてdemodへ渡せるdriver契約を、機器識別子とfunctional probeで確認できる場合だけ別能力として追加できる。現行能力へ混在させず、互換性目的で frontend_px4 に TSID→relative slot 変換表を再導入してはならない。''',
              'future px4 absolute paragraph',
          )
          text = sub_once(
              text,
              r'## BS/CS110 stream selector境界\n.*?\n\n## BS/CS110 selector固定テスト',
              '''## BS/CS110 stream selector境界
BSでは、selectorのkindを値域より優先する。earth_pt1 / DVB backendはtyped `STREAM_ID`のabsolute TSID `0..65534`を受け付け、`0..11`も数値重複だけを理由に拒否しない。現行px4 backendはtyped `RELATIVE_STREAM_NUMBER` `0..7`だけを受け付け、absolute `STREAM_ID`は全域を`UNAVAILABLE`とする。将来px4 absolute能力を有効化した場合はtyped `STREAM_ID` `0..65534`を受け付け、値域からrelativeへ読み替えない。TISはeffective capabilityに応じ、DVB系にはTSID候補、現行px4にはTIS所有表からrelative候補を生成する。

CS110では、channel key/サービス識別子にONID/TSID/service_idを保持してよいが、HAL frontend selectorへ転用しない。stream selectorはNONEとし、HALは周波数だけで選局する。AOSP SDK defaultの `streamIdType=STREAM_ID` かつ `streamId=INVALID_STREAM_ID(0xFFFF)` はselectorなしとして吸収する。CS110にTSID、relative selector、負値selectorが指定された場合は`INVALID_ARGUMENT`とする。

## BS/CS110 selector固定テスト''',
              'selector boundary section',
          )
          text = sub_once(
              text,
              r'## BS/CS110 selector固定テスト\n.*?\n\n## px4_drv系のロック方法',
              '''## BS/CS110 selector固定テスト
次の契約を単体テストで固定し、必要に応じて静的確認で補強すること。

- TISがCS110 tune requestにstream selectorを付けないこと。
- HALがCS110のTSID、相対TS番号、負値selectorを`INVALID_ARGUMENT`とし、AOSP SDK defaultの`STREAM_ID / INVALID_STREAM_ID(0xFFFF)`だけをselectorなしとして吸収すること。
- earth_pt1 / DVB backendはBS typed `STREAM_ID` `0..65534`を受け付け、`0..11`もabsolute値として受け付けること。relative selectorは拒否すること。
- 現行px4 backendはBS typed `RELATIVE_STREAM_NUMBER` `0..7`だけを受け付け、absolute `STREAM_ID`は値にかかわらず`UNAVAILABLE`とすること。
- 将来px4 absolute能力を追加する場合は別の能力台帳項目とfunctional probeを必要とし、その能力では`STREAM_ID` `0..65534`をtyped absolute値として扱うこと。
- frontend_px4 はBS/CS110のTSIDから相対TS番号への変換表を持たないこと。

## px4_drv系のロック方法''',
              'selector tests section',
          )
          text = sub_once(
              text,
              r'## px4_drv系のロック方法\n.*?\n\n## px4_drv系のchardev open方法',
              '''## px4_drv系のロック方法
px4_drvはロック状態を直接取得するuserspace APIを持たないため、ioctl成功を`DEMOD_LOCK`またはAOSP `LOCKED`として扱わない。ioctl成功は選局要求の受理だけを意味する。

px4 backendの`DEMOD_LOCK`は、同一tune generationのTS入力について、188-byte境界、sync byte `0x47`、`transport_error_indicator=0`、予約値でない`adaptation_field_control`を満たす有効packetを16個連続で観測し、その列にPID `0x1FFF`以外のpayload付きpacketが1個以上含まれる場合にだけtrueとする。不正packet、世代変更、stop、retune、read失敗で連続数を初期化する。AOSP `LOCKED`はこの観測後にだけ通知し、VTS/CDD waiverを設計上の代替にしない。

## px4_drv系のchardev open方法''',
              'px4 lock section',
          )
          text = replace_once(
              text,
              '  PES、AV payload、record / DVR raw TS を HAL filter / DVR 契約に従って配送する処理。担当は Tuner HAL とする。AV passthrough は本製品では恒久的に対応せず、ライブ AV filter は non-passthrough `MediaEvent` + shared memory 経路のみを正式対応とする。AV payload を通常 FMQ / EventFlag へ載せる経路、および AV filter を他 filter の source とする経路は実装しない。',
              '  PES、AV payload、record / DVR raw TS を HAL filter / DVR 契約に従って配送する処理。担当は Tuner HAL とする。AV passthrough は本製品では恒久的に対応しない。ライブAV filterはnon-passthrough `MediaEvent`を使い、共有領域+`dataId`方式とイベント固有fd+`dataId`方式の両方を正式経路とする。共有handle未取得、使用権解放済み、共有領域空き不足、またはAUが共有領域に収まらない場合はイベント固有fd方式を使う。AV payloadを通常FMQ / EventFlagへ載せる経路、およびAV filterを他filterのsourceとする経路は実装しない。',
              'AV delivery boundary',
          )
          text = sub_once(
              text,
              r'- `MediaEvent` payload は `offset >= 0`、`dataLength > 0`、`offset \+ dataLength <= mapped buffer capacity`、`dataLength <= MAX_MEDIA_SAMPLE_BYTES` を満たす場合だけ decoder queue に渡す。\n- `MAX_MEDIA_SAMPLE_BYTES` は r51 では 4 MiB hard limit とする。範囲不正は playback 例外ではなく sample drop と 診断カウンター として扱う。',
              '''- `MediaEvent` payloadは`offset >= 0`、`dataLength > 0`、加算overflowなし、`offset + dataLength <= mapped buffer capacity`を満たす場合だけdecoder queueへ渡す。
- sample byte上限は固定値にせず、同一製品profileから生成するHAL `CapabilitySnapshot`のper-event予算と、TISが使用するdecoder入力上限の小さい方へ接続する。対応codecごとの最大正常AUを検証できないprofileでは対応宣言しない。
- 共有領域に収まらないAUはHALのevent-local fd方式で実サイズ配送する。両方式の実サイズ予約が成立しない場合だけ当該eventを診断付きで破棄し、継続不能ならTISは`notifyVideoUnavailable()`へ接続する。任意の4 MiB値を正常性判定に使わない。''',
              'root media sample budget',
          )
          for forbidden in (
              '全backendで、BS `STREAM_ID` の 0..11',
              'VTS/CDDも本件関連のFailに限りWaiver',
              'shared memory 経路のみを正式対応',
              '4 MiB hard limit',
          ):
              if forbidden in text:
                  raise SystemExit(f'開発規則.md: forbidden text remains: {forbidden}')
          path.write_text(text, encoding='utf-8')

          # tis/DESIGN_JA.md
          path = Path('tis/DESIGN_JA.md')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              'BS は IF 周波数と typed stream selector を保持し、selector は TSID または px4 専用の相対 TS 番号として保存する。earth_pt1 は TSID のみ許容し、px4 は TSID と相対 TS 番号を許容する。CS110 は周波数帯のみで scan candidate と tune selector を作り、stream selector を保存しない。',
              'BSはIF周波数とtyped stream selectorを保持する。現行製品ではearth_pt1 / DVB backendはabsolute TSID `0..65534`だけを許容し、px4 backendは相対TS番号`0..7`だけを許容する。px4のabsolute TSID対応は、HAL側で別の将来能力として有効化された場合にだけ候補生成へ追加する。CS110は周波数帯だけでscan candidateとtune selectorを作り、stream selectorを保存しない。',
              'TIS BS capability paragraph',
          )
          text = replace_once(
              text,
              'TvProvider の channel internal provider data には JSON v1 `tune.streamIdType` と `tune.streamId` を保存する。`NONE` は `streamId=null`、`TSID` は 0..0xffff、`RELATIVE` は 0..7 とする。',
              'TvProvider の channel internal provider data には JSON v1 `tune.streamIdType` と `tune.streamId` を保存する。`NONE` は `streamId=null`、`TSID` は `0..65534`、`RELATIVE` は `0..7` とする。`65535`はAOSP `INVALID_STREAM_ID`であり、実TSIDとして保存または再投入しない。',
              'TIS TSID range',
          )
          text = replace_once(
              text,
              'BSの通常実行時候補生成はTISが持つBS TSID表だけを正とする。px4向けの相対TS番号候補は診断またはbackend指定候補としてのみ許可し、earth_pt1向けには使わない。px4 backend側にTSIDからlegacy slotへの同等表または変換表を持つ場合でも、TISのBS TSID表と不一致になってはならない。',
              'BSの通常実行時候補は、TISが保持する候補データとHALのeffective backend capabilityから生成する。現行px4にはTIS所有のrelative候補表から`RELATIVE_STREAM_NUMBER 0..7`を生成し、earth_pt1 / DVBにはTIS所有のTSID表から`STREAM_ID 0..65534`を生成する。将来px4 absolute能力がHALで有効になった場合だけTSID候補を追加する。HAL/backendにTSIDからrelative slotへの変換表を置かず、能力外selectorを通常候補へ混入させない。',
              'TIS normal BS candidates',
          )
          text = sub_once(
              text,
              r'MediaEvent payload は、`offset >= 0`、`dataLength > 0`、`offset \+ dataLength <= mapped buffer capacity`、`dataLength <= MAX_MEDIA_SAMPLE_BYTES` を満たす場合だけ decoder queue に渡す。`MAX_MEDIA_SAMPLE_BYTES` は現行仕様では 4 MiB hard limit とする。範囲不正は playback pipeline 例外ではなく sample drop と 診断カウンター として扱う。',
              '''MediaEvent payloadは、`offset >= 0`、`dataLength > 0`、加算overflowなし、`offset + dataLength <= mapped buffer capacity`を満たす場合だけdecoder queueへ渡す。sample byte上限は固定4 MiBにせず、同一製品profileから生成されるHAL per-event予算と、選択したMediaCodecの入力上限の小さい方をTISの受付上限とする。TISは共有領域方式とイベント固有fd方式の両方を受け付け、実際の`dataLength`をpending byte予算へ予約する。上限超過は構文不正として黙って破棄せず、対応codec/profileの上限超過として診断し、再生継続不能なら`notifyVideoUnavailable()`へ接続する。''',
              'TIS playback media budget',
          )
          text = replace_once(
              text,
              '- `MediaEvent` sample は `4 MiB` を上限とする。負の offset、0 以下の length、offset + length の overflow、LinearBlock 容量超過は sample 確保なしで破棄し、診断に計上する。',
              '- `MediaEvent` sampleは固定4 MiBを上限にしない。負のoffset、0以下のlength、加算overflow、mapped capacity超過は不正入力として確保前に破棄する。正常な実サイズは同一製品profileのper-event予算とdecoder入力上限で受理し、共有領域方式とイベント固有fd方式を同じpending byte予算へ計上する。',
              'TIS callback media limit',
          )
          for forbidden in (
              '`TSID` は 0..0xffff',
              'px4 は TSID と相対 TS 番号を許容する',
              '4 MiB hard limit',
              '`MediaEvent` sample は `4 MiB`',
              'px4向けの相対TS番号候補は診断またはbackend指定候補としてのみ許可',
          ):
              if forbidden in text:
                  raise SystemExit(f'tis/DESIGN_JA.md: forbidden text remains: {forbidden}')
          path.write_text(text, encoding='utf-8')

          # tuner_hal/DESIGN_JA.md
          path = Path('tuner_hal/DESIGN_JA.md')
          text = path.read_text(encoding='utf-8')
          text = sub_once(
              text,
              r'- セクションフィルターの `repeat=false` は重複抑止ではなく、同一 `start\(\)` 世代内の配送停止条件である。.*?filter object の公開状態は Started のまま維持し、利用側が明示的に `stop\(\)` / `flush\(\)` / `configure\(\)` / `close\(\)` を呼べる状態を保つ。',
              '''- セクションフィルターの`repeat=false`は重複抑止ではなく、同一`start()`世代内の配送停止条件である。`SectionBits`は最初に一致したsectionを1件配送した後に停止する。`TableInfo`の候補照合条件は公開設定のtable idとversionだけとし、`table_id_extension`を暗黙のfilter条件または最初のsubtableだけを選ぶ条件に使わない。`repeat=false`は、製品profileが当該table id/versionに属する有限のsubtable集合と各`last_section_number`を一意に決定できるtableだけで受理し、期待集合に属する各`table_id_extension / section_number`を1回ずつ配送して全体完了後に停止する。公開条件だけでは完全集合を決定できないtable/profileは`configure()`で`UNAVAILABLE`とし、最初に観測したextensionへ無言で狭めない。versionがwildcardの場合は最初に受理したversionへ固定するが、そのversionに属する期待subtable集合全体を対象とする。`repeat=true`はtable id/versionに一致する全sectionを繰り返し配送する。この配送停止は公開`IFilter.stop()`と同じ状態遷移ではなく、filter objectの公開状態はStartedのまま維持し、利用側が明示的に`stop()` / `flush()` / `configure()` / `close()`を呼べる状態を保つ。''',
              'TableInfo repeat contract',
          )
          forbidden = '最初に受理したsectionの`table_id`、`table_id_extension`、version、`last_section_number`を1個の完了キーとして固定する'
          if forbidden in text:
              raise SystemExit('tuner_hal/DESIGN_JA.md: hidden extension completion key remains')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff --stat
      - name: Commit and push
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 開発規則.md tis/DESIGN_JA.md tuner_hal/DESIGN_JA.md
          git commit -m 'docs: resolve remaining selector and media contract comments'
          git push origin HEAD:agent/apply-tuner-hal2-design-proposals-v70
