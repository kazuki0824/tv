name: pr28-restore-pes-streamid
on:
  push:
    branches:
      - agent/fix-commonization-boundaries
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-commonization-boundaries
          fetch-depth: 0
      - name: Restore PES streamId contract
        run: python3 .tmp/pr28_restore_pes_streamid.py
      - name: Commit restored design
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tuner_hal/DESIGN_JA.md
          git rm -f .tmp/pr28_restore_pes_streamid.py .github/workflows/pr28-restore-pes-streamid.yml
          git commit -m "design: restore PES wildcard contract [skip ci]"
          git push origin HEAD:agent/fix-commonization-boundaries
