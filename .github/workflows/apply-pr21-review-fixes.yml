name: PR21 設計レビュー対応
on:
  push:
    branches: [agent/fix-direct-boot-epg-drain-clean]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-direct-boot-epg-drain-clean
          fetch-depth: 0
      - run: python3 .github/apply_pr21_review_fixes.py
      - run: git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-pr21-review-fixes.yml .github/apply_pr21_review_fixes.py
          git add tis/DESIGN_JA.md tis/INTEGRATION.md
          git diff --cached --check
          git commit -m 'docs: 起動時 EPG 同期の再開契約を閉じる'
          git push origin HEAD:agent/fix-direct-boot-epg-drain-clean
