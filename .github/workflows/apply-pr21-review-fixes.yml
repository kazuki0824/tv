name: PR21 設計レビュー対応

on:
  push:
    branches:
      - agent/fix-direct-boot-epg-drain-clean

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-direct-boot-epg-drain-clean
          fetch-depth: 0

      - name: 設計文書を修正
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          integration = Path('tis/INTEGRATION.md')
          text = integration.read_text()
          replacement = '''## Direct Boot と起動時の受信処理

TIS は `directBootAware=true` を維持する。`AndroidManifest.xml` には `<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />` を宣言し、`BootReceiver` は `android:directBootAware="true"` とする。`BootReceiver` は `ACTION_LOCKED_BOOT_COMPLETED` と `ACTION_BOOT_COMPLETED` の双方を受信対象にする。`ACTION_LOCKED_BOOT_COMPLETED` ではデバイス保護領域に `DirectBootEpgPending` だけを記録し、TvProvider、Tuner、JNI 経由の解析処理は起動しない。

`BootReceiver.onReceive()` は既知の起動通知を判別し、`DirectBootEpgPending` の確認と `BootEpgSyncCoordinator` への開始要求までで終了する。EPG の収集、Tuner の使用、TvProvider への反映処理の寿命を `BroadcastReceiver.onReceive()` に結びつけない。`BootEpgSyncCoordinator` は同一プロセス内で `inputId` ごとに実行中の起動時 EPG 同期を1件だけ許可する。すでに開始済みまたは実行中なら、後続の `ACTION_BOOT_COMPLETED`、動的に受信した `ACTION_USER_UNLOCKED`、開始条件の再評価からの要求を既存処理へ集約し、別の走査処理や別の Tuner 資源取得を開始しない。

`ACTION_BOOT_COMPLETED` は利用者のロック解除後に起動時 EPG 同期へ入る正規の入口とするが、この通知単独を無条件の再開保証とはしない。Android の背景実行制限などで通知が遅延しても状態を失わないよう、`DirectBootEpgPending` をデバイス保護領域に維持する。`ACTION_BOOT_COMPLETED` では `UserManager.isUserUnlocked()==true` を確認し、`DirectBootEpgPending=true` なら同じ開始判定へ進む。`ACTION_USER_UNLOCKED` は `AndroidManifest.xml` に登録せず、プロセスが利用者のロック解除まで生存している場合に動的な受信から同じ開始判定を前倒しする補助経路に限定する。`MaleicacidTvInputService.onCreate()` は Direct Boot の保留処理、起動時の EPG 同期、定期保守を直接開始してはならない。

起動時の EPG 同期と定期保守を開始できるのは、ライブセッション、セッション作成中、設定用の走査、再生処理、走査管理処理がすべて存在しない場合だけとする。開始条件を満たさない場合は `DirectBootEpgPending` を維持して開始を見送る。ライブセッション終了、セッション作成終了、設定用走査終了、再生処理終了、走査管理処理終了など、開始を妨げる状態の更新後に全開始条件が不成立から成立へ変わった場合は、同じ `DirectBootEpgPending` を再評価する。保留中なら `BootEpgSyncCoordinator` へ同じ開始要求を出す。周期的な監視、新しい永続待ち行列、別の定期実行機構をこの再評価のために追加しない。すでに起動時の EPG 同期または定期保守が実行中の状態でライブセッション作成要求が来た場合は、当該処理を停止または延期し、ライブ視聴の選局を優先する。
'''
          pattern = r'## Direct Boot と起動時の受信処理\n.*?(?=\n## flash 後の確認)'
          text, count = re.subn(pattern, replacement.rstrip(), text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('tis/INTEGRATION.md: 対象章を一意に特定できない')
          integration.write_text(text)

          design = Path('tis/DESIGN_JA.md')
          text = design.read_text()
          replacement = '''### Direct Boot の保留処理とライブセッションの優先順位

`MaleicacidTvInputService.onCreate()` は Direct Boot の保留処理、起動時の EPG 同期、定期保守を直接開始しない。起動通知を受ける `BootReceiver` は `android.permission.RECEIVE_BOOT_COMPLETED` を宣言したうえで `ACTION_LOCKED_BOOT_COMPLETED` と `ACTION_BOOT_COMPLETED` を受信する。`ACTION_LOCKED_BOOT_COMPLETED` では `DirectBootEpgPending` の記録だけを行い、TvProvider、Tuner、JNI 経由の解析処理は起動しない。`ACTION_BOOT_COMPLETED` は利用者のロック解除後の正規の起動時入口とするが、この通知単独を無条件の再開保証とはしない。状態の正本はデバイス保護領域の `DirectBootEpgPending` とする。

`BootReceiver.onReceive()` は保留状態の確認と `BootEpgSyncCoordinator` への開始要求までで終了し、EPG の収集、Tuner の使用、TvProvider への反映処理を `BroadcastReceiver` の実行時間へ結びつけない。`BootEpgSyncCoordinator` は同一プロセス内で `inputId` ごとの起動時 EPG 同期を一度に1件だけ実行する。すでに開始済みまたは実行中の `inputId` に対する後続要求は既存処理へ集約し、別の走査処理や別の Tuner 資源取得を開始しない。起動時 EPG 同期を開始できなかった場合、および TvProvider への反映が正常終了する前は `DirectBootEpgPending` を維持し、前節で定めた反映処理が正常に確定した場合だけ解除する。

利用者のロック解除までプロセスが生存している場合は、動的に登録した `ACTION_USER_UNLOCKED` の受信処理から同じ開始判定を前倒ししてよい。ただし、この補助経路や定期保守の実行機構だけに再開保証を依存させない。Android の背景実行制限などで起動完了通知が遅延し得ることを前提に、通知の到達時と開始条件の再成立時の双方で永続化した `DirectBootEpgPending` を再評価する。

起動時の EPG 同期と定期保守を開始できるのは、`activeLiveSessionCount == 0`、`sessionCreationInProgress == false`、`setupScanRunning == false`、`playbackPipelineRunning == false`、`scanManager running == false` をすべて満たす場合だけとする。開始条件を満たさない場合は開始を見送る。開始を妨げる状態を更新した後に全開始条件が不成立から成立へ変わった場合は、`DirectBootEpgPending` を再評価し、保留中なら同じ `BootEpgSyncCoordinator` へ開始要求を出す。周期的な監視、新しい永続待ち行列、別の定期実行機構は追加しない。ライブセッション作成要求が来た時点ですでに起動時の EPG 同期または定期保守が実行中なら、当該処理を停止または延期し、ライブ視聴の選局を優先する。
'''
          pattern = r'### Direct Boot の保留処理とライブセッションの優先順位\n.*?(?=\n## TIS コールバック 入力境界と逆圧)'
          text, count = re.subn(pattern, replacement.rstrip(), text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('tis/DESIGN_JA.md: 対象章を一意に特定できない')
          design.write_text(text)
          PY

          git diff --check
          git diff -- tis/DESIGN_JA.md tis/INTEGRATION.md

      - name: 修正を確定
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-pr21-review-fixes.yml
          git add tis/DESIGN_JA.md tis/INTEGRATION.md
          git diff --cached --check
          git commit -m 'docs: 起動時 EPG 同期の再開契約を閉じる'
          git push origin HEAD:agent/fix-direct-boot-epg-drain-clean
