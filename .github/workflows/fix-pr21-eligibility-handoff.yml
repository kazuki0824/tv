name: PR21 再評価経路の修正

on:
  push:
    branches:
      - agent/fix-direct-boot-epg-drain-clean

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-direct-boot-epg-drain-clean
          fetch-depth: 0
      - run: python3 .github/scripts/fix_pr21_eligibility_handoff.py
      - run: git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/fix_pr21_eligibility_handoff.py
          git rm .github/workflows/fix-pr21-eligibility-handoff.yml
          git add tis/DESIGN_JA.md tis/INTEGRATION.md
          git diff --cached --check
          git commit -m 'docs: 保留処理の再評価経路を JobScheduler に統一'
          git push origin HEAD:agent/fix-direct-boot-epg-drain-clean
