name: Temporary CAS review7 patch

on:
  push:
    branches:
      - design/aosp-mediacas-b25-plugin
    paths:
      - .github/workflows/tmp-cas-review7.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/aosp-mediacas-b25-plugin
          fetch-depth: 0
      - run: python3 .github/tmp-cas-review7.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- tis/src/com/maleicacid/tvinput/tis/CasController.kt tis/tests/src/com/maleicacid/tvinput/tis/CasControllerStateTest.kt tis/DESIGN_JA.md cas_plugin/DESIGN_JA.md
          git diff --cached --check
          git commit -m "fix(cas): unlink MediaCas token before session close"
          git push origin HEAD:design/aosp-mediacas-b25-plugin
