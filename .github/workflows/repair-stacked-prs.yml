name: Repair stacked PRs 53 54 57

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair PR 54 and rebase descendants
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/tuner-hal2-rustfmt-1.81 agent/implement-tis-arib-si-design-pr53 docs/future-work-design-completion design/r52-contracts

          CUR53=e2b88445354e7c881d5fccb888f677e8d0508df6
          CUR54=6510ea834672c84fa0db5b81a37aca9405e6e691
          CUR55=765f59360191517f2bbacdb6daee725c491ba8a7
          CUR57=ff64f1c84e15a3c207320fccb29b2890372174b0
          test "$(git rev-parse origin/fix/tuner-hal2-rustfmt-1.81)" = "$CUR53"
          test "$(git rev-parse origin/agent/implement-tis-arib-si-design-pr53)" = "$CUR54"
          test "$(git rev-parse origin/docs/future-work-design-completion)" = "$CUR55"
          test "$(git rev-parse origin/design/r52-contracts)" = "$CUR57"

          git checkout -B agent/implement-tis-arib-si-design-pr53 "$CUR54"
          python3 <<'PY'
          from pathlib import Path

          def one(path, old, new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n != 1: raise SystemExit(f'{path}: expected one anchor, got {n}: {old[:100]!r}')
              p.write_text(s.replace(old,new,1))

          path='tis/src/com/maleicacid/tvinput/tis/PlaybackPipeline.kt'
          one(path,
              '    private var activeChannel: TunerController.ResolvedChannel? = null\n',
              '    private var activeChannel: TunerController.ResolvedChannel? = null\n    private var activeTuner: Tuner? = null\n    private var activeSelection: TunerController.AvStreamSelection? = null\n')
          one(path,
              '        UNSUPPORTED_AUDIO_STREAM, AUDIO_UNAVAILABLE, CAS_NO_KEY, UNKNOWN,\n',
              '        UNSUPPORTED_AUDIO_STREAM, AUDIO_UNAVAILABLE, INVALID_MEDIA_TIMESTAMP, CAS_NO_KEY, UNKNOWN,\n')
          one(path,
              '''    private fun setSurfaceOnPlaybackExecutor(newSurface: Surface?) {\n        if (surface !== newSurface && mediaSync != null) stopOnPlaybackExecutor()\n        surface = newSurface\n        if (newSurface == null) emitUnavailable(PlaybackUnavailableReason.SURFACE_DETACHED)\n    }\n''',
              '''    private fun setSurfaceOnPlaybackExecutor(newSurface: Surface?) {\n        if (surface !== newSurface && mediaSync != null) stopOnPlaybackExecutor()\n        surface = newSurface\n        if (newSurface == null) emitUnavailable(PlaybackUnavailableReason.SURFACE_DETACHED)\n    }\n\n    fun rearmForNonDestructiveTune(channel: TunerController.ResolvedChannel): Boolean =\n        runOnPlaybackExecutorBlocking {\n            if (activeChannel != channel || mediaSyncSurfaceFailed) return@runOnPlaybackExecutorBlocking false\n            val sync = mediaSync ?: return@runOnPlaybackExecutorBlocking false\n            if (videoPathExpected) {\n                if (surface?.isValid != true || videoFilter == null || videoDecoder == null) {\n                    return@runOnPlaybackExecutorBlocking false\n                }\n                armVideoAvailability(sync, playbackGeneration)\n                scheduleFirstFrameTimeout(playbackGeneration)\n            } else if (audioPathExpected && (audioFilter == null || audioDecoder == null)) {\n                return@runOnPlaybackExecutorBlocking false\n            }\n            true\n        }\n''')
          one(path,
              '        activeChannel = channel\n        val video = selection.video\n',
              '        activeChannel = channel\n        activeTuner = tuner\n        activeSelection = selection\n        val video = selection.video\n')
          one(path,
              '''            } else {\n                audioDecoder?.close()\n                audioDecoder = null\n                if (audioOnly) {\n''',
              '''            } else {\n                audioDecoder?.close()\n                audioDecoder = null\n                audioPathExpected = false\n                audioInputQueued = false\n                if (audioOnly) {\n''')
          one(path,
              '''    private fun handleAudioFailure(reason: PlaybackUnavailableReason, detail: String, audioOnly: Boolean) {\n        releaseOutstandingAudioOutputs()\n        audioDecoder?.close()\n        audioDecoder = null\n        runCatching { audioTrack?.release() }\n        audioTrack = null\n        audioPathExpected = false\n        audioInputQueued = false\n        if (audioOnly) {\n            emitUnavailable(reason, detail)\n            stopOnPlaybackExecutor()\n        } else {\n            logAudioUnavailable(reason, detail)\n            maybeStartMediaSync()\n        }\n    }\n''',
              '''    private fun handleAudioFailure(reason: PlaybackUnavailableReason, detail: String, audioOnly: Boolean) {\n        val restartTuner = activeTuner\n        val restartChannel = activeChannel\n        val restartSelection = activeSelection\n        releaseOutstandingAudioOutputs()\n        audioDecoder?.close()\n        audioDecoder = null\n        runCatching { audioTrack?.release() }\n        audioTrack = null\n        audioPathExpected = false\n        audioInputQueued = false\n        if (audioOnly) {\n            emitUnavailable(reason, detail)\n            stopOnPlaybackExecutor()\n            return\n        }\n        logAudioUnavailable(reason, "$detail; recreating MediaSync generation for video-only fallback")\n        if (restartTuner == null || restartChannel == null || restartSelection?.video == null) {\n            emitUnavailable(reason, "$detail; video-only restart context is unavailable")\n            stopOnPlaybackExecutor()\n            return\n        }\n        val restarted = startOnPlaybackExecutor(restartTuner, restartChannel, restartSelection.copy(audio = null))\n        if (restarted.generation < 0L) {\n            emitUnavailable(reason, "$detail; video-only generation restart failed")\n        }\n    }\n''')
          one(path,
              '        val rawPts = event.pts.takeIf(::isAuthoritativePtsValid) ?: return null\n',
              '''        val rawPts = event.pts\n        if (!isAuthoritativePtsValid(rawPts)) {\n            malformedSamplesDropped++\n            val detail = "producer-authoritative MediaEvent PTS is invalid pts90k=$rawPts isAudio=$isAudio"\n            if (isAudio) {\n                Log.e(LogTags.TIS, "$detail; playback profile contract violated")\n            } else {\n                emitUnavailable(PlaybackUnavailableReason.INVALID_MEDIA_TIMESTAMP, detail)\n            }\n            return null\n        }\n''')
          one(path,
              '        activeChannel = null\n        ptsEpochCoordinator.reset()\n',
              '        activeChannel = null\n        activeTuner = null\n        activeSelection = null\n        ptsEpochCoordinator.reset()\n')

          path='tis/src/com/maleicacid/tvinput/tis/TunerController.kt'
          one(path,
              '''    private fun tuneForLiveOnController(channelUri: Uri): TuneOutcome {\n        // channel 解決に失敗する場合も既存 ライブ state を先に破棄する。\n        resetBeforeTune()\n        val resolved = resolveChannel(channelUri).getOrElse { e ->\n            Log.w(LogTags.TIS, "channel 解決に失敗しました inputId=$inputId uri=$channelUri", e)\n            return TuneOutcome(false, Tuner.RESULT_INVALID_ARGUMENT, null, tuneGeneration, e.message.orEmpty())\n        }\n        return tuneResolvedChannel(resolved, startPlayback = true)\n    }\n''',
              '''    private fun tuneForLiveOnController(channelUri: Uri): TuneOutcome {\n        val resolved = resolveChannel(channelUri).getOrElse { e ->\n            // 解決不能要求では従来どおり既存live stateを破棄する。\n            resetBeforeTune()\n            Log.w(LogTags.TIS, "channel 解決に失敗しました inputId=$inputId uri=$channelUri", e)\n            return TuneOutcome(false, Tuner.RESULT_INVALID_ARGUMENT, null, tuneGeneration, e.message.orEmpty())\n        }\n        if (tuneAccepted && currentTune == resolved && playbackPipeline.rearmForNonDestructiveTune(resolved)) {\n            Log.d(LogTags.TIS, "same-channel tune を非破壊再利用します inputId=$inputId generation=$tuneGeneration channel=$resolved")\n            return TuneOutcome(true, Tuner.RESULT_SUCCESS, resolved, tuneGeneration, "NON_DESTRUCTIVE_SAME_CHANNEL_REUSE")\n        }\n        return tuneResolvedChannel(resolved, startPlayback = true)\n    }\n''')

          path='tis/DESIGN_JA.md'
          p=Path(path); s=p.read_text()
          old='audio失敗は、audio-videoサービスで同generationのvideo経路が正常ならAudioTrackとaudio decoderを解放してvideo-only継続へ移り、診断に`MEDIASYNC_ERROR_AUDIOTRACK_FAIL`を残す。'
          new='audio失敗は、audio-videoサービスでvideo経路を継続可能な場合でも旧MediaSyncを再利用せず、旧AudioTrack/audio decoderを含む現playback generationを終了し、MediaSync・video decoder・video filterを新generationとしてvideo-only構成で再生成する。診断に`MEDIASYNC_ERROR_AUDIOTRACK_FAIL`を残す。'
          if s.count(old) != 1: raise SystemExit(f'tis/DESIGN_JA.md audio failure anchor count={s.count(old)}')
          s=s.replace(old,new,1)
          old2='audio-videoでAudioTrack failure時のvideo-only継続'
          new2='audio-videoでAudioTrack failure時に旧MediaSync generationを破棄してvideo-only新generationへ再生成'
          if s.count(old2) != 1: raise SystemExit(f'tis/DESIGN_JA.md minimum-test anchor count={s.count(old2)}')
          p.write_text(s.replace(old2,new2,1))
          PY

          grep -q 'NON_DESTRUCTIVE_SAME_CHANNEL_REUSE' tis/src/com/maleicacid/tvinput/tis/TunerController.kt
          grep -q 'INVALID_MEDIA_TIMESTAMP' tis/src/com/maleicacid/tvinput/tis/PlaybackPipeline.kt
          git diff --check

          tools_dir="$RUNNER_TEMP/tis-kotlin-compile"
          mkdir -p "$tools_dir"
          curl -fsSL --retry 3 "https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip" -o "$tools_dir/kotlin.zip"
          curl -fsSL --retry 3 "https://repo.maven.apache.org/maven2/org/robolectric/android-all/14-robolectric-10818077/android-all-14-robolectric-10818077.jar" -o "$tools_dir/android-all.jar"
          unzip -q "$tools_dir/kotlin.zip" -d "$tools_dir/compiler"
          out="$RUNNER_TEMP/tis-production"
          mkdir -p "$out"
          mapfile -d '' -t sources < <(find tis/src tis/host_ci/kotlin/stubs/android -type f -name '*.kt' -print0 | sort -z)
          "$tools_dir/compiler/kotlinc/bin/kotlinc" -J-Xmx4g -jvm-target 17 -classpath "$tools_dir/android-all.jar" -d "$out" "${sources[@]}"

          git add tis/DESIGN_JA.md tis/src/com/maleicacid/tvinput/tis/PlaybackPipeline.kt tis/src/com/maleicacid/tvinput/tis/TunerController.kt
          git commit -m "fix(tis): align playback lifecycle and tune reuse"
          NEW54=$(git rev-parse HEAD)
          git push origin HEAD:agent/implement-tis-arib-si-design-pr53

          git checkout -B docs/future-work-design-completion "$CUR55"
          git rebase --onto "$NEW54" "$CUR54"
          NEW55=$(git rev-parse HEAD)
          git push --force-with-lease=refs/heads/docs/future-work-design-completion:$CUR55 origin HEAD:docs/future-work-design-completion

          git checkout -B design/r52-contracts "$CUR57"
          git rebase --onto "$NEW55" "$CUR55"
          git push --force-with-lease=refs/heads/design/r52-contracts:$CUR57 origin HEAD:design/r52-contracts
