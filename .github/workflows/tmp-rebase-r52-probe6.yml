name: tmp probe r52 rebase conflicts 6

on:
  push:
    branches:
      - tmp/rebase-r52-contracts-20260829
    paths:
      - .github/workflows/tmp-rebase-r52-probe6.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve known r52 conflicts and capture final stage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.quotePath false
          git fetch origin docs/future-work-design-completion tmp/r52-old-base-20260829 tmp/r52-old-head-20260829
          git checkout -B probe origin/tmp/r52-old-head-20260829

          set +e
          GIT_EDITOR=true git rebase --onto origin/docs/future-work-design-completion origin/tmp/r52-old-base-20260829 origin/tmp/r52-old-head-20260829
          set -e
          test "$(git rev-parse REBASE_HEAD)" = "e9a283a00f9e2682bb51215ae1097ef14cf97494"
          python3 - <<'PY'
          from pathlib import Path
          def one(text):
              a=text.index('<<<<<<< HEAD\n'); b=text.index('=======\n',a); c=text.index('>>>>>>> ',b); d=text.index('\n',c)+1
              return a,d,text[a+len('<<<<<<< HEAD\n'):b],text[b+len('=======\n'):c]
          p=Path('tis/CHANGELOG.md'); s=p.read_text(); a,d,ours,theirs=one(s); p.write_text(s[:a]+theirs.rstrip()+'\n\n'+ours.lstrip()+s[d:])
          p=Path('tis/src/com/maleicacid/tvinput/tis/TunerController.kt'); s=p.read_text(); a,d,ours,theirs=one(s); p.write_text(s[:a]+ours+s[d:])
          PY
          git add tis/CHANGELOG.md tis/src/com/maleicacid/tvinput/tis/TunerController.kt
          set +e
          GIT_EDITOR=true git rebase --continue
          set -e
          test "$(git rev-parse REBASE_HEAD)" = "bb1f585a563757c6e020b7fbb9a696c4a94f3a7c"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tis/src/com/maleicacid/tvinput/tis/MaleicacidLiveSession.kt'); s=p.read_text()
          for choice in ['theirs','ours','ours','ours']:
              a=s.index('<<<<<<< HEAD\n'); b=s.index('=======\n',a); c=s.index('>>>>>>> ',b); d=s.index('\n',c)+1
              ours=s[a+len('<<<<<<< HEAD\n'):b]; theirs=s[b+len('=======\n'):c]
              s=s[:a]+({'ours':ours,'theirs':theirs}[choice])+s[d:]
          if '<<<<<<<' in s or '>>>>>>>' in s: raise SystemExit('extra LiveSession conflict')
          p.write_text(s)
          PY
          git add tis/src/com/maleicacid/tvinput/tis/MaleicacidLiveSession.kt
          set +e
          GIT_EDITOR=true git rebase --continue
          set -e
          test "$(git rev-parse REBASE_HEAD)" = "c49b4bee310907b4a04a7061008b8fcee7322648"
          test "$(git diff --name-only --diff-filter=U)" = ".github/workflows/tis-host-ci.yml"
          git checkout --ours .github/workflows/tis-host-ci.yml
          git add .github/workflows/tis-host-ci.yml

          set +e
          GIT_EDITOR=true git rebase --skip
          rc=$?
          set -e

          mkdir -p "$RUNNER_TEMP/rebase-probe6/conflicts"
          printf '%s\n' "$rc" > "$RUNNER_TEMP/rebase-probe6/skip-rc.txt"
          git status --short > "$RUNNER_TEMP/rebase-probe6/status.txt" || true
          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/rebase-probe6/conflicts.txt" || true
          if git rev-parse --verify REBASE_HEAD >/dev/null 2>&1; then
            git rev-parse REBASE_HEAD > "$RUNNER_TEMP/rebase-probe6/rebase-head.txt"
            git show --no-patch --format=fuller REBASE_HEAD > "$RUNNER_TEMP/rebase-probe6/rebase-head-show.txt"
          else
            git rev-parse HEAD > "$RUNNER_TEMP/rebase-probe6/final-head.txt"
            git diff --check origin/docs/future-work-design-completion..HEAD > "$RUNNER_TEMP/rebase-probe6/diff-check.txt"
            git log --oneline --decorate -8 > "$RUNNER_TEMP/rebase-probe6/log.txt"
          fi
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            safe=$(printf '%s' "$p" | tr '/' '_')
            cp "$p" "$RUNNER_TEMP/rebase-probe6/conflicts/${safe}.worktree" || true
            git show ":1:$p" > "$RUNNER_TEMP/rebase-probe6/conflicts/${safe}.base" 2>/dev/null || true
            git show ":2:$p" > "$RUNNER_TEMP/rebase-probe6/conflicts/${safe}.ours" 2>/dev/null || true
            git show ":3:$p" > "$RUNNER_TEMP/rebase-probe6/conflicts/${safe}.theirs" 2>/dev/null || true
            git diff --cc -- "$p" > "$RUNNER_TEMP/rebase-probe6/conflicts/${safe}.diffcc" || true
          done < "$RUNNER_TEMP/rebase-probe6/conflicts.txt"
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: r52-rebase-probe-6
          path: ${{ runner.temp }}/rebase-probe6
          if-no-files-found: error
