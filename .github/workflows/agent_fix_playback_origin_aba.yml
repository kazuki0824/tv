name: agent-fix-playback-origin-aba

on:
  push:
    branches:
      - agent/fix-playback-dvr-origin-generation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply design review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tuner_hal/DESIGN_JA.md')
          s = p.read_text()

          old_para = ('Playback DVR の入力originは `TsInputOrigin::PlaybackDvr(dvr_id, queue_epoch)` を唯一の正本キーとし、別の `dvr_generation` は設けない。'
                      '`queue_epoch` の所有者は当該Playback DVRの `QueueEpochProtocol` とし、キュー生成時は0、`stop()` / `start()` では維持し、成功した `flush()` の消去commitでだけ進める。'
                      '`close()` / 所有者消滅では当該キュー識別子ごと無効化し、記述子置換時は新しいキュー識別子を世代0で開始する。'
                      'これにより `stop()`→`start()` は同一stream continuationを保ち、`flush()` 前後のcontinuity / parser stateを同一originとして再結合しない。')
          new_para = ('Playback DVR の入力originは `TsInputOrigin::PlaybackDvr(dvr_id, queue_identity, queue_epoch)` を唯一の正本キーとし、別の `dvr_generation` は設けない。'
                      '`queue_identity` は `QueueEpochProtocol` が既に所有するキュー識別子を表すlogical incarnation tokenであり、fd番号、descriptor内容、アドレス等の再利用可能な物理値を使用せず、同一DVR object寿命中は再利用しない。'
                      '`queue_epoch` は同一 `queue_identity` 内のflush世代だけを表し、キュー生成時は0、`stop()` / `start()` では `queue_identity` とともに維持し、成功した `flush()` の消去commitでだけ進める。'
                      '`close()` / 所有者消滅では当該 `queue_identity` を閉じる。記述子置換では、旧 `queue_identity` を閉じ、旧 `PlaybackDvr` originに属するcontinuity / assembler / parser stateの切断を同じboundary commitで確定してから、再利用しない新しい `queue_identity` を `queue_epoch=0` で開始する。'
                      'これにより `stop()`→`start()` は同一stream continuationを保ち、`flush()` 前後またはdescriptor replacement前後の旧状態を新originへ再結合せず、ABAを許さない。')
          if s.count(old_para) != 1:
              raise SystemExit(f'expected one playback origin SSOT paragraph, got {s.count(old_para)}')
          s = s.replace(old_para, new_para)

          old_desc = '記述子の置換では旧識別子を閉じ、世代0の別識別子を生成する。'
          new_desc = ('キュー識別子はlogical `queue_identity` とし、fd番号やdescriptor内容などの再利用可能な物理値ではなく、同一DVR object寿命中に再利用しない。'
                      '記述子の置換では旧 `queue_identity` を閉じ、世代0の新しい `queue_identity` を生成する。')
          if s.count(old_desc) != 1:
              raise SystemExit(f'expected one descriptor replacement sentence, got {s.count(old_desc)}')
          s = s.replace(old_desc, new_desc)

          old_gen = 'PlaybackDvr(dvr_id, dvr_generation)'
          old_epoch = 'PlaybackDvr(dvr_id, queue_epoch)'
          if s.count(old_gen) < 1:
              raise SystemExit('expected at least one stale dvr_generation origin')
          s = s.replace(old_gen, 'PlaybackDvr(dvr_id, queue_identity, queue_epoch)')
          s = s.replace(old_epoch, 'PlaybackDvr(dvr_id, queue_identity, queue_epoch)')

          if 'PlaybackDvr(dvr_id, dvr_generation)' in s or 'PlaybackDvr(dvr_id, queue_epoch)' in s:
              raise SystemExit('stale PlaybackDvr origin form remains')
          p.write_text(s)
          PY
          rm .github/workflows/agent_fix_playback_origin_aba.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tuner_hal/DESIGN_JA.md .github/workflows/agent_fix_playback_origin_aba.yml
          git diff --cached --check
          git commit -m 'docs: make playback origin queue identity ABA-safe'
          git push
