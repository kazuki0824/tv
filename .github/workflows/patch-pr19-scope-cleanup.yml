name: Patch PR19 scope and direct-input wording
'on':
  push:
    branches:
      - agent/fix-tis-arib-design-residuals
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch design documents
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('開発規則.md')
          s = p.read_text()
          old = '''- `Programs.COLUMN_INTERNAL_PROVIDER_DATA` と `Channels.COLUMN_INTERNAL_PROVIDER_DATA` の新規書き込み正形式は JSON v1 のみとする。r50 以前の `;` 区切り key-value 形式、旧 flat provider-data、旧 provider-data 断片を読み取り互換入力として残してはならない。既存端末の旧形式データは r51 リリース物では移行対象にせず、DB 再構築または setup 再実行で JSON v1 を再生成する。'''
          new = '''- `Programs.COLUMN_INTERNAL_PROVIDER_DATA` と `Channels.COLUMN_INTERNAL_PROVIDER_DATA` の新規書き込み正形式は JSON v1 のみとする。r50 以前の `;` 区切り key-value 形式、旧 flat provider-data、旧 provider-data 断片を読み取り互換入力として残してはならない。r50以前の旧provider-dataはreleaseに依存せず恒久的にmigration対象とせず、既存端末ではDB再構築またはsetup再実行でJSON v1を再生成する。'''
          if old not in s:
              raise SystemExit('provider-data migration wording not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('tis/DESIGN_JA.md')
          s = p.read_text()
          old = '''plain `Filter.flush()`はAOSP契約どおり未消費filter dataのclearに限定し、assembler/pending inputを破棄するだけでMediaSync/decoder/AudioTrack/playback generationを再生成しない。'''
          new = '''plain `Filter.flush()`はAOSP契約どおり未消費filter dataのclearに限定し、未queue `MediaEvent` / `LinearBlock`と対応claimだけを破棄してMediaSync/decoder/AudioTrack/playback generationを再生成しない。'''
          if old not in s:
              raise SystemExit('plain flush stale assembler wording not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          rm -f .github/workflows/patch-pr19-scope-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 開発規則.md tis/DESIGN_JA.md .github/workflows/patch-pr19-scope-cleanup.yml
          git commit -m 'docs: remove stale scope and assembler wording'
          git push
