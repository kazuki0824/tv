name: PR2 review13 synchronize 2026-08-04

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/pr2-review13-trigger-20260804.txt

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tooling
        uses: actions/checkout@v4
        with:
          ref: main
          path: tooling
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/apply-tuner-hal2-design-proposals-v70
          path: work
      - name: Apply design fixes
        run: python3 tooling/.github/pr2-review13-patch-20260804.py work
      - name: Validate and push
        working-directory: work
        run: |
          set -euxo pipefail
          rm .github/pr2-review13-trigger-20260804.txt
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' .github/pr2-review13-trigger-20260804.txt tuner_hal/DESIGN_JA.md | sort)"
          test "$changed" = "$expected"
          python3 - <<'PY'
          from pathlib import Path
          text = Path('tuner_hal/DESIGN_JA.md').read_text(encoding='utf-8')
          for stale in (
              '旧要求を正確に1回だけ再投入する',
              '復元generationを`Tuning`として公開する',
              '現行`ProductProfile.tuneTerminalDeadlineMs`は4000 msとする',
          ):
              assert stale not in text, stale
          for required in (
              'callerが要求していない旧要求を自動再投入しない',
              '旧TSを新サービス向けdemux/filter generationへ戻す経路を設けない',
              'earth_pt1=`4000 ms`、px4=`7000 ms`',
              'VTSの待機値を製品watchdogへ流用せず',
          ):
              assert required in text, required
          assert text.count('```') % 2 == 0
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .github/pr2-review13-trigger-20260804.txt tuner_hal/DESIGN_JA.md
          git commit -m 'docs: remove stale retune restore and deadline rules'
          git push origin HEAD:agent/apply-tuner-hal2-design-proposals-v70
