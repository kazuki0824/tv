name: Temporary CAS review4 patch

on:
  push:
    branches:
      - design/aosp-mediacas-b25-plugin
    paths:
      - .github/workflows/tmp-cas-review4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/aosp-mediacas-b25-plugin
          fetch-depth: 0
      - name: Patch CAS/TIS SSOT
        run: python3 .github/tmp-cas-review4.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- cas_plugin/DESIGN_JA.md tis/DESIGN_JA.md
          git diff --cached --check
          git commit -m "fix(cas): align B1 session private data contract"
          git push origin HEAD:design/aosp-mediacas-b25-plugin
