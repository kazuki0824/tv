name: Patch TableInfo scope wording

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Load patch helper from main
        run: |
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/scripts/patch_tableinfo_scope_20260807.py > /tmp/patch_tableinfo_scope.py

      - name: Apply wording correction
        run: python3 /tmp/patch_tableinfo_scope.py

      - name: Static checks
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "tuner_hal/DESIGN_JA.md"
          grep -F '候補全体の有限終端はAOSP公開契約では規定されない' tuner_hal/DESIGN_JA.md
          grep -F 'first-instanceはAOSPの明文要求ではなく' tuner_hal/DESIGN_JA.md
          grep -F '複数instanceを包括的・継続的に取得するcallerは`repeat=true`を使用' tuner_hal/DESIGN_JA.md
          ! grep -F 'Android 14 `SectionSettings`の`repeat=false`がいうall sectionsは、ISO/IEC 13818-1' tuner_hal/DESIGN_JA.md
          test $(( $(grep -c '^```' tuner_hal/DESIGN_JA.md) % 2 )) -eq 0

      - name: Commit and push
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -f .github/patch-tableinfo-scope-20260807.trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tuner_hal/DESIGN_JA.md .github/patch-tableinfo-scope-20260807.trigger
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: separate TableInfo contract and product resolution'
          git push origin HEAD:"$HEAD_REF"
