name: temporary PR78 ISDB-S AUTO and SSOT patch

on:
  push:
    branches: [fix/tuner-hal2-contract-boundaries]
    paths:
      - ".github/workflows/tmp-pr78-isdbs-auto-ssot-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tuner-hal2-contract-boundaries
          fetch-depth: 0

      - name: Apply exact partial-file patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: target count={count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          adapter = Path("tuner_hal2/binder_adapter/src/aidl_frontend_settings.rs")
          replace_once(
              adapter,
              """    IsdbtExplicitSegmentCount { layer_index: usize, count: i32 },\n    IsdbsExplicitModulation { value: i32 },\n    IsdbsExplicitCoderate { value: i32 },\n    IsdbsExplicitRolloff { value: i32 },\n""",
              """    IsdbtExplicitSegmentCount { layer_index: usize, count: i32 },\n    IsdbsModulationAuto,\n    IsdbsExplicitModulation { value: i32 },\n    IsdbsCoderateAuto,\n    IsdbsExplicitCoderate { value: i32 },\n    IsdbsExplicitRolloff { value: i32 },\n""",
              "adapter enum",
          )
          replace_once(
              adapter,
              """#[derive(Clone, Copy, Debug, Eq, PartialEq)]\nenum IsdbtKnownValue {\n    Unspecified,\n    Auto,\n    Explicit(i32),\n}\n""",
              """#[derive(Clone, Copy, Debug, Eq, PartialEq)]\nenum IsdbtKnownValue {\n    Unspecified,\n    Auto,\n    Explicit(i32),\n}\n\n#[derive(Clone, Copy, Debug, Eq, PartialEq)]\nenum IsdbsKnownValue {\n    Unspecified,\n    Auto,\n    Explicit(i32),\n}\n""",
              "ISDB-S value enum",
          )
          replace_once(
              adapter,
              """fn explicit_known_value(\n    raw: i32,\n    auto: i32,\n    highest_known_bit: i32,\n) -> Result<Option<i32>, HalError> {\n    if raw == 0 || raw == auto {\n        return Ok(None);\n    }\n    if is_single_known_enum_value(raw, highest_known_bit) {\n        return Ok(Some(raw));\n    }\n    invalid_frontend_setting(\"frontend setting contains a reserved enum value\")\n}\n""",
              """fn isdbs_known_value(\n    raw: i32,\n    auto: i32,\n    highest_known_bit: i32,\n) -> Result<IsdbsKnownValue, HalError> {\n    if raw == 0 {\n        return Ok(IsdbsKnownValue::Unspecified);\n    }\n    if raw == auto {\n        return Ok(IsdbsKnownValue::Auto);\n    }\n    if is_single_known_enum_value(raw, highest_known_bit) {\n        return Ok(IsdbsKnownValue::Explicit(raw));\n    }\n    invalid_frontend_setting(\"ISDB-S setting contains a reserved enum value\")\n}\n""",
              "ISDB-S value helper",
          )
          replace_once(
              adapter,
              """    if let Some(value) = explicit_known_value(\n        s.modulation.0,\n        FrontendIsdbsModulation::AUTO.0,\n        FrontendIsdbsModulation::MOD_TC8PSK.0,\n    )? {\n        requested.push(FrontendRequestedSetting::IsdbsExplicitModulation { value });\n    }\n    if let Some(value) = explicit_known_value(\n        s.coderate.0,\n        FrontendIsdbsCoderate::AUTO.0,\n        FrontendIsdbsCoderate::CODERATE_7_8.0,\n    )? {\n        requested.push(FrontendRequestedSetting::IsdbsExplicitCoderate { value });\n    }\n""",
              """    match isdbs_known_value(\n        s.modulation.0,\n        FrontendIsdbsModulation::AUTO.0,\n        FrontendIsdbsModulation::MOD_TC8PSK.0,\n    )? {\n        IsdbsKnownValue::Unspecified => {}\n        IsdbsKnownValue::Auto => requested.push(FrontendRequestedSetting::IsdbsModulationAuto),\n        IsdbsKnownValue::Explicit(value) => {\n            requested.push(FrontendRequestedSetting::IsdbsExplicitModulation { value });\n        }\n    }\n    match isdbs_known_value(\n        s.coderate.0,\n        FrontendIsdbsCoderate::AUTO.0,\n        FrontendIsdbsCoderate::CODERATE_7_8.0,\n    )? {\n        IsdbsKnownValue::Unspecified => {}\n        IsdbsKnownValue::Auto => requested.push(FrontendRequestedSetting::IsdbsCoderateAuto),\n        IsdbsKnownValue::Explicit(value) => {\n            requested.push(FrontendRequestedSetting::IsdbsExplicitCoderate { value });\n        }\n    }\n""",
              "ISDB-S classifier",
          )
          marker = """    #[test]\n    fn isdbs_explicit_rolloff_is_observed_for_service_policy() {\n"""
          test = """    #[test]\n    fn isdbs_auto_constraints_are_distinguished_from_undefined() {\n        let mut settings = valid_isdbs_settings();\n        settings.frequency = 1_049_480_000;\n        settings.modulation = FrontendIsdbsModulation::AUTO;\n        settings.coderate = FrontendIsdbsCoderate::AUTO;\n        let converted =\n            aidl_frontend_settings_to_request(&FrontendSettings::Isdbs(settings)).unwrap();\n        assert_eq!(\n            converted.requested_settings,\n            vec![\n                FrontendRequestedSetting::IsdbsModulationAuto,\n                FrontendRequestedSetting::IsdbsCoderateAuto,\n            ]\n        );\n    }\n\n"""
          replace_once(adapter, marker, test + marker, "ISDB-S AUTO test")

          runtime = Path("tuner_hal2/service_runtime/src/frontend_request_txn.rs")
          replace_once(
              runtime,
              """            | FrontendRequestedSetting::IsdbtLayerCoderateAuto { .. }\n            | FrontendRequestedSetting::IsdbtLayerTimeInterleaveAuto { .. } => None,\n""",
              """            | FrontendRequestedSetting::IsdbtLayerCoderateAuto { .. }\n            | FrontendRequestedSetting::IsdbtLayerTimeInterleaveAuto { .. }\n            | FrontendRequestedSetting::IsdbsModulationAuto\n            | FrontendRequestedSetting::IsdbsCoderateAuto => None,\n""",
              "runtime AUTO policy",
          )
          marker = """    #[test]\n    fn explicit_partial_reception_is_unavailable_for_both_current_backends() {\n"""
          test = """    #[test]\n    fn isdbs_auto_constraints_are_supported_by_product_profile() {\n        assert!(validate_frontend_requested_settings_against_product_profile(&[\n            FrontendRequestedSetting::IsdbsModulationAuto,\n            FrontendRequestedSetting::IsdbsCoderateAuto,\n        ])\n        .is_ok());\n    }\n\n"""
          replace_once(runtime, marker, test + marker, "runtime ISDB-S AUTO test")

          design = Path("tuner_hal/DESIGN_JA.md")
          replace_once(
              design,
              """- `bandwidth`は`AUTO`または`BANDWIDTH_6MHZ`を受け付ける。\n- `mode`、layer `modulation`、layer `codeRate`、`guardInterval`、layer `timeInterleave`は`AUTO`だけをadvertise・受理する。\n- 上記のAUTO専用項目に指定された既知の具体値は`UNAVAILABLE`、unionまたは値域が不正な入力は`INVALID_ARGUMENT`とし、バックエンドと直前の要求を変更しない。\n""",
              """- `bandwidth=UNDEFINED`はcallerがbandwidth制約を指定していないAOSP sentinelとして成功させ、capability bitとしてadvertiseしない。`AUTO`または`BANDWIDTH_6MHZ`は対応値として受理し、既知の`BANDWIDTH_7MHZ` / `BANDWIDTH_8MHZ`は`UNAVAILABLE`とする。予約値・未知値は`INVALID_ARGUMENT`とする。\n- `mode`、layer `modulation`、layer `codeRate`、`guardInterval`、layer `timeInterleave`の`UNDEFINED`はcaller constraintなしとして成功させ、capability bitとしてadvertiseしない。`AUTO`だけを対応値としてadvertise・受理し、既知の具体値は`UNAVAILABLE`とする。予約値・未知値は`INVALID_ARGUMENT`とする。\n- `UNDEFINED`と`AUTO`を同義に正規化してはならない。`UNDEFINED`は制約なし、`AUTO`はhardwareによる自動検出・設定を要求する既知の明示値としてtyped requestで区別し、拒否時はバックエンドと直前の要求を変更しない。\n""",
              "ISDB-T public SSOT",
          )
          replace_once(
              design,
              """- modulationとcodeRateは`AUTO`だけをadvertise・受理し、既知具体値は`UNAVAILABLE`、malformed値は`INVALID_ARGUMENT`とする。\n""",
              """- modulationとcodeRateの`UNDEFINED`はcallerが当該制約を指定していないAOSP sentinelとして成功させ、capability bitとしてadvertiseしない。`AUTO`はhardwareによる自動検出・設定を求める既知の明示要求としてtyped requestに保持し、対応値としてadvertise・受理する。既知具体値は`UNAVAILABLE`、予約値・未知値は`INVALID_ARGUMENT`とする。\n""",
              "ISDB-S public SSOT",
          )
          PY
          git diff --check

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-pr78-isdbs-auto-ssot-patch.yml
          git add tuner_hal2/binder_adapter/src/aidl_frontend_settings.rs tuner_hal2/service_runtime/src/frontend_request_txn.rs tuner_hal/DESIGN_JA.md
          git commit -m "fix(tuner): preserve ISDB-S AUTO intent and update SSOT"
          git push origin HEAD:fix/tuner-hal2-contract-boundaries
