name: temporary PR19 direct tuner media design fix

on:
  push:
    branches:
      - agent/fix-tis-arib-design-residuals

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Recover and run patch script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = '.github/workflows/tmp-pr19-direct-tuner-path.yml'
          old = subprocess.check_output(['git', 'show', f'HEAD^:{path}'], text=True)
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          git diff --check"
          start = old.index(start_marker) + len(start_marker)
          end = old.index(end_marker, start)
          body = old[start:end]
          out = []
          for line in body.splitlines():
              out.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/pr19_patch.py').write_text('\n'.join(out) + '\n')
          PY
          python3 /tmp/pr19_patch.py
          git diff --check
      - name: Commit design fix and remove helper
        shell: bash
        run: |
          rm -f .github/workflows/tmp-pr19-direct-tuner-path.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tis/DESIGN_JA.md .github/workflows/tmp-pr19-direct-tuner-path.yml
          git commit -m "docs: use direct Tuner to MediaCodec playback path"
          git push origin HEAD:agent/fix-tis-arib-design-residuals
