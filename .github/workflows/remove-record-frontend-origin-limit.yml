name: Remove record frontend origin limit
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-record-frontend-origin-limit
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tuner_hal/DESIGN_JA.md')
          s = p.read_text(encoding='utf-8')
          target = 'playback入力は`TsInputOrigin::Playback(dvr_id, generation)`を付けて通常のdemux配送経路へ流すが、playback originのpacketをrecord filterまたはrecord DVRへ再投入してはならない。record経路が受理するoriginはfrontend入力だけとする。playback中にrecord filterが接続または開始されても、record FMQへは書き込まず、record eventも生成しない。この禁止によりfeedback loop、同一TSの再録画、origin横断の重複除去と追加統計を設計対象にしない。\n\n'
          if s.count(target) != 1:
              raise SystemExit(f'unexpected target count: {s.count(target)}')
          p.write_text(s.replace(target, '', 1), encoding='utf-8')
          PY
          rm .github/workflows/remove-record-frontend-origin-limit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tuner_hal/DESIGN_JA.md .github/workflows/remove-record-frontend-origin-limit.yml
          git diff --cached --check
          git commit -m 'design: remove record frontend-origin restriction'
          git push origin HEAD:agent/remove-record-frontend-origin-limit
