          new = r'''pub fn map_bs_if_frequency_to_px4_freq_no(if_hz: u64) -> Result<i32, HalError> {
    let normalized = normalize_japan_bs_if_frequency_hz(if_hz).ok_or_else(|| {
        HalError::invalid_argument(
            HalInvalidArgumentKind::UnsupportedFrequency,
            "px4 BS IF周波数は公開raster許容範囲外です",
        )
    })?;
    let delta = normalized - PX4_BS_BASE_IF_HZ;
    let freq_no = PX4_BS_FREQ_NO_MIN
        + i32::try_from(delta / PX4_BS_STEP_HZ).map_err(|_| {
            HalError::invalid_argument(
                HalInvalidArgumentKind::UnsupportedFrequency,
                "px4 BS IF周波数は非対応です",
            )
        })?;
    if (PX4_BS_FREQ_NO_MIN..=PX4_BS_FREQ_NO_MAX).contains(&freq_no) {
        Ok(freq_no)
    } else {
        Err(HalError::invalid_argument(
            HalInvalidArgumentKind::UnsupportedFrequency,
            "px4 BS IF周波数は非対応です",
        ))
    }
}

pub fn map_cs110_if_frequency_to_px4_freq_no(if_hz: u64) -> Result<i32, HalError> {
    let normalized = normalize_japan_cs110_if_frequency_hz(if_hz).ok_or_else(|| {
