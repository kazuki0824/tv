/// Product adapter tolerance for Android Hz requests targeting the fixed Japanese
/// BS/CS110 channel raster. This covers rounded framework/CTS frequencies while
/// remaining far below half of the minimum 38.36 MHz raster spacing, so a request
/// cannot be ambiguous between adjacent channels.
pub const JAPAN_ISDBS_TUNE_TOLERANCE_HZ: u64 = 1_000_000;

fn normalize_japan_isdbs_raster_frequency_hz(
    frequency_hz: u64,
    first_hz: u64,
    step_hz: u64,
    count: u64,
) -> Option<u64> {
    if count == 0 {
        return None;
    }
    let last_hz = first_hz.checked_add(step_hz.checked_mul(count.checked_sub(1)?)?)?;
    let lower = first_hz.saturating_sub(JAPAN_ISDBS_TUNE_TOLERANCE_HZ);
    let upper = last_hz.checked_add(JAPAN_ISDBS_TUNE_TOLERANCE_HZ)?;
    if !(lower..=upper).contains(&frequency_hz) {
        return None;
    }
    let index = if frequency_hz <= first_hz {
        0
    } else {
        frequency_hz
            .checked_sub(first_hz)?
            .checked_add(step_hz / 2)?
            / step_hz
    };
    if index >= count {
        return None;
    }
    let center = first_hz.checked_add(step_hz.checked_mul(index)?)?;
    (frequency_hz.abs_diff(center) <= JAPAN_ISDBS_TUNE_TOLERANCE_HZ).then_some(center)
}

pub fn normalize_japan_bs_if_frequency_hz(frequency_hz: u64) -> Option<u64> {
    normalize_japan_isdbs_raster_frequency_hz(frequency_hz, 1_049_480_000, 38_360_000, 12)
}

pub fn normalize_japan_cs110_if_frequency_hz(frequency_hz: u64) -> Option<u64> {
    normalize_japan_isdbs_raster_frequency_hz(frequency_hz, 1_613_000_000, 40_000_000, 12)
}

#[cfg(test)]
mod isdbs_frequency_normalization_tests {
    use super::*;

    #[test]
    fn cts_rounded_isdbs_frequency_maps_to_bs1_without_widening_to_adjacent_channels() {
        assert_eq!(normalize_japan_bs_if_frequency_hz(1_050_000_000), Some(1_049_480_000));
        assert_eq!(normalize_japan_bs_if_frequency_hz(1_050_480_000), Some(1_049_480_000));
        assert_eq!(normalize_japan_bs_if_frequency_hz(1_050_480_001), None);
        assert_eq!(normalize_japan_cs110_if_frequency_hz(1_613_500_000), Some(1_613_000_000));
        assert_eq!(normalize_japan_cs110_if_frequency_hz(1_614_000_001), None);
    }
}
'''
