name: temp PR53 worker owner diagnose serial

on:
  push:
    branches:
      - fix/tuner-hal2-rustfmt-1.81
    paths:
      - .github/workflows/temp-fix53-easy.yml

permissions:
  contents: write

concurrency:
  group: temp-pr53-worker-owner
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tuner-hal2-rustfmt-1.81
          persist-credentials: true
          fetch-depth: 0
      - name: Apply repairs
        run: python3 tools/temp_fix53_worker_owner.py
      - name: Format
        working-directory: tuner_hal2/host_ci
        run: cargo fmt --all
      - name: Check
        working-directory: tuner_hal2/host_ci
        run: cargo check --workspace --all-targets --locked
      - name: Test with log
        id: tests
        continue-on-error: true
        working-directory: tuner_hal2/host_ci
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee ../../tools/temp_worker_owner_test2.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temp-worker-owner-test-log-2
          path: tools/temp_worker_owner_test2.log
      - name: Fail if tests failed
        if: steps.tests.outcome != 'success'
        run: exit 1
