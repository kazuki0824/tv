name: temp PR53 publish production repairs

on:
  push:
    branches:
      - fix/tuner-hal2-rustfmt-1.81
    paths:
      - .github/workflows/temp-fix53-easy.yml

permissions:
  contents: write

concurrency:
  group: temp-pr53-final-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tuner-hal2-rustfmt-1.81
          persist-credentials: true
          fetch-depth: 0
      - name: Apply ISDB-S follow-up
        run: python3 tools/temp_fix53_isdbs_followup.py
      - name: Apply worker ownership repair
        run: python3 tools/temp_fix53_worker_owner.py
      - name: Format
        working-directory: tuner_hal2/host_ci
        run: cargo fmt --all
      - name: Test
        working-directory: tuner_hal2/host_ci
        run: cargo test --workspace --locked
      - name: Check
        working-directory: tuner_hal2/host_ci
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        working-directory: tuner_hal2/host_ci
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Commit production repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tuner_hal2/common/src/lib.rs tuner_hal2/device/src/px4/tune_mapping.rs tuner_hal2/service_runtime/src/worker_runtime.rs tuner_hal2/service_runtime/src/lib.rs tuner_hal2/service_runtime/src/frontend_worker_txn.rs tuner_hal2/aidl_service/src/dvr_callback_delivery.rs tuner_hal2/DESIGN_JA.md
          git commit -m "Finish ISDB-S raster and worker lifecycle contracts"
          git push origin HEAD:fix/tuner-hal2-rustfmt-1.81
