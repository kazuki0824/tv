name: temp PR53 repair easy

on:
  push:
    branches: [fix/tuner-hal2-rustfmt-1.81]
    paths:
      - ".github/workflows/temp-fix53-easy.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
