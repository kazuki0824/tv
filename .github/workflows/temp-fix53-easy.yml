name: temp PR53 structural scan

on:
  push:
    branches:
      - fix/tuner-hal2-rustfmt-1.81
    paths:
      - .github/workflows/temp-fix53-easy.yml

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tuner-hal2-rustfmt-1.81
          persist-credentials: true
          fetch-depth: 0
      - name: Scan call sites
        run: bash tools/temp_fix53_scan.sh
      - name: Commit scan report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/temp_fix53_scan.txt
          git commit -m "ci: record temporary PR53 structural scan"
          git push origin HEAD:fix/tuner-hal2-rustfmt-1.81
