name: temp PR53 cleanup helpers

on:
  push:
    branches:
      - fix/tuner-hal2-rustfmt-1.81
    paths:
      - .github/workflows/temp-fix53-easy.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tuner-hal2-rustfmt-1.81
          persist-credentials: true
          fetch-depth: 0
      - name: Remove temporary helpers
        run: |
          rm -f tools/temp_fix53_*.py tools/temp_fix53_*.sh tools/temp_fix53_*.txt tools/temp_worker_owner_test*.log
      - name: Commit helper cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tools
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: remove temporary PR53 repair helpers"
          git push origin HEAD:fix/tuner-hal2-rustfmt-1.81
