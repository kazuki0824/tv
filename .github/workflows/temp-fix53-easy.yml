name: temp PR53 queue repair

on:
  push:
    branches:
      - fix/tuner-hal2-rustfmt-1.81
    paths:
      - .github/workflows/temp-fix53-easy.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tuner-hal2-rustfmt-1.81
          persist-credentials: true
          fetch-depth: 0
      - name: Apply repairs
        run: python3 tools/temp_fix53_queue.py
      - name: Format
        working-directory: tuner_hal2/host_ci
        run: cargo fmt --all
      - name: Check
        working-directory: tuner_hal2/host_ci
        run: cargo check --workspace --all-targets --locked
      - name: Test
        working-directory: tuner_hal2/host_ci
        run: cargo test --workspace --locked
      - name: Clippy
        working-directory: tuner_hal2/host_ci
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tuner_hal2/demux/src/runtime/queue_runtime.rs tuner_hal2/demux/src/runtime/demux.rs tuner_hal2/service_runtime/src/playback_consume_txn.rs
          git commit -m "Make DVR queue rollback explicit on fallible paths"
          git push origin HEAD:fix/tuner-hal2-rustfmt-1.81
