name: Tuner contract T1-T7 patch

on:
  push:
    branches:
      - design/tuner-contract-t1-t7
    paths:
      - .github/workflows/tuner-contract-t1-t7.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/tuner-contract-t1-t7
          fetch-depth: 0
      - name: Apply T1-T7 design contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tuner_hal/DESIGN_JA.md')
          text = path.read_text(encoding='utf-8')

          def insert_after(anchor: str, addition: str, marker: str) -> None:
              global text
              if marker in text:
                  raise SystemExit(f'already applied: {marker}')
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(f'expected one anchor for {marker}, got {count}')
              text = text.replace(anchor, anchor + addition, 1)

          def insert_before(anchor: str, addition: str, marker: str) -> None:
              global text
              if marker in text:
                  raise SystemExit(f'already applied: {marker}')
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(f'expected one anchor for {marker}, got {count}')
              text = text.replace(anchor, addition + anchor, 1)

          # T1: DVB exclusiveGroupId.  The group identity is physical, so the
          # ISDB-T/ISDB-S variant bit used by frontend IDs must not split it.
          insert_after(
              '生成後の duplicate ID 検出は最終保険として残す。px4 frontend の `exclusiveGroupId` は unit index 単独値ではなく、device family code と unit index を含む packed physical group id として返す。',
              '''\n\nDVB frontend の `exclusiveGroupId` も公開 frontend ID から逆算せず、物理的に同時利用できない frontend 群を一意に表す。global group ID は符号付き32 bitの非負範囲に収め、上位4 bitをbackend class、下位28 bitをbackend固有の物理group payloadとする。現行backend classはpx4=`0x10000000`、DVB=`0x20000000`に固定する。px4は既存のdevice family codeとunit indexを含むpacked physical group idを下位28 bitへ格納し、DVBは`0x20000000 | (adapter_id << 8) | frontend_index`を使用する。DVBの`variant`はgroup IDへ含めないため、同じ`(adapter_id, frontend_index)`から公開するISDB-T/ISDB-S variantは必ず同じ`exclusiveGroupId`を返す。別の`(adapter_id, frontend_index)`、または別backend classは異なるgroup IDを返す。payloadが28 bitへ収まらない候補、group ID重複、同じ物理frontendのvariant間でgroup IDが不一致になる候補は`CapabilitySnapshot`へcommitせず、そのfrontendを公開しない。resource arbitrationはfrontend IDの数値近接ではなく、この`exclusiveGroupId`だけを同時利用不可群の正本とする。''',
              'DVB frontend の `exclusiveGroupId` も公開 frontend ID から逆算せず',
          )

          # T2: FrontendInfo scalar fields must be a first-class part of the
          # immutable capability snapshot and must match tune acceptance.
          insert_before(
              '\n### demux能力の横断不変条件',
              '''\n### `FrontendInfo` scalar capability 契約\n\n公開frontendごとに、`CapabilitySnapshot`は`FrontendInfo`へ返す`minFrequency`、`maxFrequency`、`minSymbolRate`、`maxSymbolRate`、`acquireRange`を`FrontendScalarCapability`として変更不能に保持する。`getFrontendInfo(id)`はこのsnapshotをコピーするだけとし、呼出し時のbackend probe、推測値、別の周波数表から値を合成しない。\n\n- `minFrequency`と`maxFrequency`は、同じfrontendの公開`tune()`/`scan()` validationが受理し得る周波数集合の外側境界と一致させ、`0 <= minFrequency <= maxFrequency`を満たす。境界外を`UNAVAILABLE`で拒否する実装が、それより広い範囲を`FrontendInfo`で広告してはならない。逆に、明示選局で受理する周波数をこの範囲外へ置いてはならない。\n- `minSymbolRate`と`maxSymbolRate`はcaller指定のsymbol rateを当該frontendが実際に反映または検証できる範囲だけを表す。現行ISDB-T/ISDB-S profileのように非0のcaller指定symbol rateを対応能力として持たない場合は両方を`0`に固定する。放送方式の公称symbol rateを、設定可能能力の証拠なしに広告値へ流用しない。\n- `acquireRange`は、要求周波数の周囲でbackendが探索可能と製品profileで検証した非負の範囲だけを返す。検証済みの非0範囲がない現行profileでは`0`とする。`acquireRange`を`minFrequency`/`maxFrequency`の外側を受理する根拠にしてはならない。\n- 起動時のsnapshot候補について、上記scalarとfrontend validation、backend設定経路、`ProductProfile`のいずれかが矛盾する場合は候補をcommitしない。scalarだけを後からclampして整合したことにしてはならない。\n\n''',
              '### `FrontendInfo` scalar capability 契約',
          )

          # T3: Segment capability booleans and numOfSegment acceptance share
          # one source of truth.
          insert_before(
              '\n### frontend settings validation の固定方針',
              '''\n### ISDB-T segment capability 契約\n\nAndroid 14 AIDL V2の`FrontendIsdbtCapabilities.isSegmentAuto`と`isFullSegment`は、ISDB-T frontendごとの変更不能な`IsdbtSegmentCapability`として`CapabilitySnapshot`へ保持し、`FrontendInfo.frontendCaps`とsettings validationの両方を同じ値から導出する。\n\n- `isSegmentAuto=true`にできるのは、layerの`numOfSegment=0`をAUTO指定として受理し、backendが明示segment数なしで実際に選局できることを検証済みの場合だけとする。`false`のfrontendで`numOfSegment=0`を成功させてはならない。\n- `isFullSegment=true`にできるのは、対象backend/device/profileで13-segmentの通常受信が成立することを機器能力として検証済みの場合だけとする。単にlockを取得できたこと、またはARIB上13 segmentが存在することだけから`true`を推測しない。\n- callerが指定する明示`numOfSegment=1..13`を成功させるには、その値をlayerごとにbackendへ反映する経路または固定値として検証する経路が必要である。現行px4/earth_pt1でその経路を持たない間は、値域内の明示segment数を`UNAVAILABLE`とし、値を捨てて成功しない。\n- segment能力の証跡がない場合はbooleanを`false`に倒す。能力boolean、`numOfSegment`の受付、`ProductProfile`、VTS選局入力の間に矛盾がある候補は`CapabilitySnapshot`へcommitしない。\n\n''',
              '### ISDB-T segment capability 契約',
          )

          # T4: enumerate the Android 14 AIDL V2 ISDB-T fields that were not
          # covered by the pre-existing AUTO/concrete-value rule.
          t4_anchor = '- 上記のAUTO専用項目に指定された既知の具体値は`UNAVAILABLE`、unionまたは値域が不正な入力は`INVALID_ARGUMENT`とし、バックエンドと直前の要求を変更しない。\n- blind scanは`UNAVAILABLE`とする。'
          t4_new = '''- 上記のAUTO専用項目に指定された既知の具体値は`UNAVAILABLE`、unionまたは値域が不正な入力は`INVALID_ARGUMENT`とし、バックエンドと直前の要求を変更しない。\n- `inversion`は未指定・自動を表すAIDL値だけを、明示制約なしとして成功させる。規格上有効な明示inversionは、対象backendで設定または固定値検証できる場合だけ成功させ、現行profileでその証跡がない値は`UNAVAILABLE`とする。予約値・未知値は`INVALID_ARGUMENT`とする。\n- `serviceAreaId=0`は未指定として成功させる。正の値は構文上有効な要求として、backend requestまたは選局結果検証へ実際に使用できる場合だけ成功させる。現行profileでその経路がない正の値は`UNAVAILABLE`、負値は`INVALID_ARGUMENT`とする。\n- `partialReceptionFlag`は未指定を表すAIDL値だけを明示制約なしとして成功させる。規格上有効な明示値を反映または検証する経路がない現行profileでは`UNAVAILABLE`、予約値・未知値は`INVALID_ARGUMENT`とする。\n- layer `numOfSegment=0`は`isSegmentAuto=true`のfrontendだけAUTOとして成功させる。`1..13`は構文上有効だが、layerごとのsegment数をbackendへ反映または固定値検証できない現行profileでは`UNAVAILABLE`とする。負値または13超は`INVALID_ARGUMENT`とする。\n- 上記4項目を含むsettingsは、成功時だけ正規化済みrequest fingerprintへ含める。`UNAVAILABLE`または`INVALID_ARGUMENT`では旧tune/scan、backend、generationを変更せず、入力値を黙って捨てて成功してはならない。\n- blind scanは`UNAVAILABLE`とする.'''
          if 'layer `numOfSegment=0`は`isSegmentAuto=true`' in text:
              raise SystemExit('already applied: T4')
          if text.count(t4_anchor) != 1:
              raise SystemExit(f'expected one T4 anchor, got {text.count(t4_anchor)}')
          text = text.replace(t4_anchor, t4_new, 1)

          # T5: rolloff follows the same no-silent-ignore rule.
          t5_anchor = '- modulationとcodeRateは`AUTO`だけをadvertise・受理し、既知具体値は`UNAVAILABLE`、malformed値は`INVALID_ARGUMENT`とする。\n- blind scanは`UNAVAILABLE`とする。'
          t5_new = '''- modulationとcodeRateは`AUTO`だけをadvertise・受理し、既知具体値は`UNAVAILABLE`、malformed値は`INVALID_ARGUMENT`とする。\n- `rolloff`は未指定を表すAIDL値を明示制約なしとして成功させる。規格上有効な明示rolloffは、対象backend/deviceでその値を設定できるか、固定rolloffとして検証済みの場合だけ成功させる。現行profileで証跡のない既知値は`UNAVAILABLE`、予約値・未知値は`INVALID_ARGUMENT`とする。入力`rolloff`をbackend requestから捨てたまま成功してはならず、拒否時は旧tune/scan、backend、generationを変更しない。\n- blind scanは`UNAVAILABLE`とする.'''
          if '`rolloff`は未指定を表すAIDL値' in text:
              raise SystemExit('already applied: T5')
          if text.count(t5_anchor) != 1:
              raise SystemExit(f'expected one T5 anchor, got {text.count(t5_anchor)}')
          text = text.replace(t5_anchor, t5_new, 1)

          # Keep the central frontend reflection table synchronized with T3-T5.
          isdbt_row = '| 対象のpx4またはearth_pt1 | ISDB-T | モード、変調、符号化率、ガードインターバル、時間インターリーブ | `AUTO` | バックエンドの自動検出を使用 | 既知の具体値：`UNAVAILABLE` | `INVALID_ARGUMENT` |'
          isdbt_rows_add = '''\n| 対象のpx4またはearth_pt1 | ISDB-T | `inversion` | 未指定・自動を表すAIDL値 | 明示inversion制約を付けずbackendへ要求 | 設定・固定値検証できない既知の明示値：`UNAVAILABLE` | 予約値・未知値：`INVALID_ARGUMENT` |\n| 対象のpx4またはearth_pt1 | ISDB-T | `serviceAreaId` | `0` | 未指定として扱い、追加制約を付けない | 正の値でbackendへ反映・検証経路なし：`UNAVAILABLE` | 負値：`INVALID_ARGUMENT` |\n| 対象のpx4またはearth_pt1 | ISDB-T | `partialReceptionFlag` | 未指定を表すAIDL値 | 明示partial-reception制約を付けずbackendへ要求 | 反映・検証できない既知の明示値：`UNAVAILABLE` | 予約値・未知値：`INVALID_ARGUMENT` |\n| 対象のpx4またはearth_pt1 | ISDB-T | layer `numOfSegment` | `0`かつ`isSegmentAuto=true` | backendのsegment AUTOを使用 | `1..13`で明示segment数を反映・検証できない値：`UNAVAILABLE` | 負値または13超：`INVALID_ARGUMENT` |'''
          insert_after(isdbt_row, isdbt_rows_add, '| 対象のpx4またはearth_pt1 | ISDB-T | `inversion` |')

          isdbs_row = '| 対象のpx4またはearth_pt1 | ISDB-S | modulation・code rate | `AUTO` | backendの自動検出を使用 | 既知の具体値：`UNAVAILABLE` | `INVALID_ARGUMENT` |'
          isdbs_row_add = '''\n| 対象のpx4またはearth_pt1 | ISDB-S | `rolloff` | 未指定を表すAIDL値 | backend既定値を使用 | 設定または固定値検証できない既知の明示値：`UNAVAILABLE` | 予約値・未知値：`INVALID_ARGUMENT` |'''
          insert_after(isdbs_row, isdbs_row_add, '| 対象のpx4またはearth_pt1 | ISDB-S | `rolloff` |')

          # T6: define record-index request validation and the output event.
          insert_before(
              '\n### record index packet boundary 契約',
              '''\n### RECORD filter index request / event 契約\n\nRECORD filterの`DemuxFilterRecordSettings.tsIndexMask`、`scIndexType`、`scIndexMask`は、record filterの正規化済み設定として一括検証し、`CapabilitySnapshot`の`RecordIndexCapability`だけを受付可否の正本とする。設定値を内部でmaskして成功させてはならない。\n\n- `tsIndexMask=0`はTS index eventを要求しない有効値として成功させる。AIDLで既知のbitのうち現行`RecordIndexCapability.tsIndexMask`にないbitを要求した場合は`UNAVAILABLE`、予約bit・未知bitを含む場合は`INVALID_ARGUMENT`とする。\n- `scIndexType=NONE`では`scIndexMask=0`だけを受理し、非0 maskは`INVALID_ARGUMENT`とする。非NONEの既知typeは、対応parserと対応maskを`RecordIndexCapability`で公開できる場合だけ成功させる。既知だが未対応のtypeまたはbitは`UNAVAILABLE`、予約type・未知type・未知bitは`INVALID_ARGUMENT`とする。\n- 成功した設定は`requestedTsIndexMask`、`requestedScIndexType`、`requestedScIndexMask`としてfilter generationへ固定する。再設定、`flush()`、source/stream boundaryではrecord index parserのcarry stateとrecord output generationを更新し、旧generationのindex eventを配送しない。\n\n`DemuxFilterTsRecordEvent`は、対象record filterの現generationに属し、対応するTS bytesが接続済みRecord DVR FMQへcommit済みの場合だけ生成する。イベントの`tsIndexMask`と`scIndexMask`はそれぞれ`detected & requested`とし、要求されていないbit、未検出bit、別generationのbitを立てない。両maskが0のイベントをindex検出として生成しない。\n\n- `byteNumber`は当該record filter output generationの先頭から、Record DVRへ実際にcommitしたbyte数を基準とする0始まりのbyte位置とする。TEI付きpacketその他、本設計がrecord TSへ保持して実際に書いた188 byte packetはこの位置へ含める。dropしたbytesを加算しない。\n- `pts`はindex対象のPESから構文上有効なPTSを取得できた場合だけ、その90 kHz値を格納する。PTSを取得できないindexでは`0`に固定し、PCR、monotonic clock、直前PESのPTSから推測しない。内部parserは`pts_present`を別に保持し、公開値0だけをPTS存在の証明にしない。\n- `firstMbInSlice`はAVC slice start indexについて構文上取得した`first_mb_in_slice`だけを設定し、それ以外のindex種別では`0`に固定する。\n- start-code prefix、PES header、PTS、AVC slice headerが188 byte TS packet境界を跨ぐ場合は、直後の「record index packet boundary 契約」のcarry stateで解析する。malformed index候補ではeventを生成せず、raw record TSの保持規則を変更しない。\n\n''',
              '### RECORD filter index request / event 契約',
          )

          # T7: make all DvrSettings fields deterministic and direction-aware.
          dvr_anchor = 'DVR FMQは`openDvr()`の`bufferSize`から作成し、`configure()`はAOSPの`DvrSettings`に含まれるしきい値などを設定する。`configure()`または再設定でFMQの識別子、容量、記述子を置換しない。設定失敗では設定世代、queue位置、接続済みfilterを変更しない。再設定成功でも接続関係を維持する。接続関係を変更できるのは`attachFilter()`、`detachFilter()`、filterまたはDVRの閉鎖だけとする。'
          dvr_add = '''\n\n#### `DvrSettings` configure 契約\n\n`IDvr.configure()`は`statusMask`、`lowThreshold`、`highThreshold`、`dataFormat`、`packetSize`を同一の`DvrSettingsSnapshot`としてvalidateし、全項目が成功条件を満たした場合だけ設定世代を一括commitする。いずれか1項目の拒否時は以前のsettings、FMQ read/write位置、queue identity、filter接続、worker状態を変更しない。\n\n- `statusMask=0`はstatus callbackを要求しない有効値として成功させ、データ経路は通常どおり動作させる。AIDLで既知のstatus bitのうち現行profileが生成できないbitは`UNAVAILABLE`、予約bit・未知bitは`INVALID_ARGUMENT`とする。成功後はmaskで選択したstatusだけをcallback対象にし、非選択statusを内部観測しても公開callbackへ出さない。\n- `lowThreshold`と`highThreshold`はbyte単位とし、`0 <= lowThreshold <= highThreshold <= openDvr(bufferSize)`を満たす場合だけ受理する。負値、大小逆転、FMQ容量超過は`INVALID_ARGUMENT`とし、clampしない。\n- playbackでは水位をplayback input FMQの`unusedBytes = capacity - usedBytes`で測り、low/high thresholdを空き領域byteへ適用する。recordではRecord DVR output FMQの`unconsumedBytes`へlow/high thresholdを適用する。playbackの使用済み量、recordの空き領域量、別queueの`queued_bytes`を代用しない。\n- `dataFormat`は現行TS-only `ProductProfile`が扱うTS formatだけを成功させる。AIDL上既知だが非TSのformatは`UNAVAILABLE`、予約値・未知値・未定義のformatは`INVALID_ARGUMENT`とする。\n- `packetSize`は正のbyte数だけを構文上受け付ける。現行TS formatでは188 byteだけを成功させ、正の別packet sizeは本製品のpacket pipelineで扱わないため`UNAVAILABLE`、0以下は`INVALID_ARGUMENT`とする。`dataFormat`と`packetSize`を独立に黙認せず、組として検証する。\n- status callbackは、現在のqueue状態から算出したstatusのうち`statusMask`で選択されたものだけを、`start()`直後の初期通知、threshold crossingまたはstatus変化、および設定済みstatus intervalの周期確認で配送する。同一状態を周期ごとに必ず再通知する必要はなく、callback失敗は既存のcallback health契約へ接続する。\n\n'''
          insert_after(dvr_anchor, dvr_add, '#### `DvrSettings` configure 契約')

          # Synchronize testable acceptance criteria without renumbering any
          # existing test IDs.
          test_anchor = '| T-AOSP-40 | `FilterDelayHint` time+data | OR条件 |'
          test_add = '''\n| T-AOSP-44 | `FrontendInfo` scalar境界とtune validation | min/max frequency、symbol rate、acquire rangeが同一`CapabilitySnapshot`と受付範囲に一致 |\n| T-AOSP-45 | DVB同一`(adapter_id, frontend_index)`のvariantと別物理frontend | 同一物理variantは同じ`exclusiveGroupId`、別group/backendは衝突しない |\n| T-AOSP-46 | ISDB-T segment capabilityとlayer `numOfSegment` | `isSegmentAuto`/`isFullSegment`とAUTO・明示segment受付が同一能力正本に一致 |\n| T-AOSP-47 | ISDB-T V2 `inversion` / `serviceAreaId` / `partialReceptionFlag` / `numOfSegment` | 成功・`UNAVAILABLE`・`INVALID_ARGUMENT`をフィールド別に固定し、silent ignore-successがない |\n| T-AOSP-48 | ISDB-S `rolloff` | 未指定、既知未対応、malformedを分類し、未適用値を成功させない |\n| T-AOSP-49 | RECORD index settings/event | request mask/typeを無損失検証し、event mask、`byteNumber`、`pts`、`firstMbInSlice`をgenerationと実出力に一致させる |\n| T-AOSP-50 | DVR `statusMask` / threshold / `dataFormat` / `packetSize` | playbackはunused bytes、recordはunconsumed bytesで判定し、無効・未対応設定を状態不変で拒否 |'''
          insert_after(test_anchor, test_add, '| T-AOSP-44 | `FrontendInfo` scalar境界とtune validation |')

          # Require all seven concrete contracts to be present exactly once.
          required = {
              'T1': 'DVB frontend の `exclusiveGroupId` も公開 frontend ID から逆算せず',
              'T2': '### `FrontendInfo` scalar capability 契約',
              'T3': '### ISDB-T segment capability 契約',
              'T4': 'layer `numOfSegment=0`は`isSegmentAuto=true`',
              'T5': '`rolloff`は未指定を表すAIDL値',
              'T6': '### RECORD filter index request / event 契約',
              'T7': '#### `DvrSettings` configure 契約',
          }
          for label, marker in required.items():
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one marker, got {count}')

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tuner_hal/DESIGN_JA.md
          git commit -m 'docs: define tuner AIDL field contracts T1-T7'
          git push origin HEAD:design/tuner-contract-t1-t7
