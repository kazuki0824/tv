name: Apply PR2 result mapping fix 20260729

on:
  push:
    branches:
      - agent/apply-tuner-hal2-design-proposals-v70

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apply-tuner-hal2-design-proposals-v70
          fetch-depth: 0
      - name: Apply exact paragraph replacement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tuner_hal/DESIGN_JA.md')
          text = path.read_text(encoding='utf-8')
          old = '公開APIの戻り値は、不存在または別所有者のIDを`INVALID_ARGUMENT`、同一サービス内の閉鎖済みオブジェクトを`INVALID_STATE`、容量不足または資源不足を`UNAVAILABLE`、依存資源の未初期化を`NOT_INITIALIZED`、内部不整合または破損を`UNKNOWN_ERROR`とする。実体のないオブジェクトを生成せず、自動的な隔離も行わない。'
          new = '公開APIの戻り値は、不存在または別所有者のIDを`INVALID_ARGUMENT`、同一サービス内の閉鎖済みオブジェクトを`INVALID_STATE`とする。通常のメモリ割り当て、FMQ領域、共有メモリ、dma-bufなど要求byte容量の不足が確定した場合は`OUT_OF_MEMORY`、frontend・demux・filter・DVR・worker slot・leaseなど論理資源の使用枯渇は`UNAVAILABLE`、依存資源の未初期化は`NOT_INITIALIZED`、内部不整合・破損、原因不明、または割り当て結果・副作用を確定できない内部障害は`UNKNOWN_ERROR`とする。個別API表がlifecycle、入力、未対応、確定前後のpriorityを定める場合はその表を優先する。実体のないオブジェクトを生成せず、自動的な隔離も行わない。'
          if text.count(old) != 1:
              raise SystemExit(f'expected one old paragraph, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/apply-pr2-result-mapping-fix-20260729.yml
          git diff --check
          test "$(git diff --name-only | sort)" = $'.github/workflows/apply-pr2-result-mapping-fix-20260729.yml\ntuner_hal/DESIGN_JA.md'
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tuner_hal/DESIGN_JA.md .github/workflows/apply-pr2-result-mapping-fix-20260729.yml
          git commit -m 'docs: distinguish capacity and resource exhaustion'
          git push origin HEAD:agent/apply-tuner-hal2-design-proposals-v70
