name: Fix DVR playback watermark test

on:
  push:
    branches:
      - agent/fix-dvr-playback-watermark-test
    paths:
      - .github/workflows/fix-dvr-playback-watermark-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-dvr-playback-watermark-test
          fetch-depth: 0

      - name: Align DVR playback watermark test contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tuner_hal/DESIGN_JA.md')
          text = path.read_text(encoding='utf-8')
          old = '| T-AOSP-36 | DVR playback watermark | 空き領域基準 |'
          new = '| T-AOSP-36 | DVR playback watermark | T-AOSP-50のPlayback watermark判定と一致 |'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one T-AOSP-36 target, got {count}')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/fix-dvr-playback-watermark-test.yml
          git diff --check
          git diff -- tuner_hal/DESIGN_JA.md .github/workflows/fix-dvr-playback-watermark-test.yml

      - name: Commit and push final patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tuner_hal/DESIGN_JA.md .github/workflows/fix-dvr-playback-watermark-test.yml
          git commit -m 'docs: align DVR playback watermark test contract'
          git push origin HEAD:agent/fix-dvr-playback-watermark-test
