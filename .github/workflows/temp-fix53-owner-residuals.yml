name: temp-fix53-owner-residuals
on:
  workflow_dispatch:
  push:
    branches: [fix/tuner-hal2-rustfmt-1.81]
    paths:
      - tools/temp_fix53_owner_residuals.py
      - tools/temp_fix53_owner_residuals_v2.py
      - .github/workflows/temp-fix53-owner-residuals.yml
jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tuner-hal2-rustfmt-1.81
          fetch-depth: 0
      - name: Apply owner residual repair
        run: python3 tools/temp_fix53_owner_residuals_v2.py
      - name: Rustfmt touched Rust files
        run: |
          rustup toolchain install 1.81.0 --profile minimal --component rustfmt
          rustup run 1.81.0 rustfmt \
            tuner_hal2/control/src/lib.rs \
            tuner_hal2/service_runtime/src/worker_runtime.rs \
            tuner_hal2/device/src/runtime/thread_result_owner.rs \
            tuner_hal2/aidl_service/src/cleanup_reaper.rs \
            tuner_hal2/service_runtime/src/frontend_worker_txn.rs \
            tuner_hal2/aidl_service/src/dvr_callback_delivery.rs \
            tuner_hal2/service_runtime/src/boot/frontend_txn.rs \
            tuner_hal2/service_runtime/src/lnb_ops.rs \
            tuner_hal2/service_runtime/src/frontend_ops.rs \
            tuner_hal2/service_runtime/src/lib.rs
      - name: Validate owner structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          control = Path('tuner_hal2/control/src/lib.rs').read_text()
          service = Path('tuner_hal2/service_runtime/src/worker_runtime.rs').read_text()
          device = Path('tuner_hal2/device/src/runtime/thread_result_owner.rs').read_text()
          cleanup = Path('tuner_hal2/aidl_service/src/cleanup_reaper.rs').read_text()
          fw = Path('tuner_hal2/service_runtime/src/frontend_worker_txn.rs').read_text()
          lnb = Path('tuner_hal2/service_runtime/src/lnb_ops.rs').read_text()
          fops = Path('tuner_hal2/service_runtime/src/frontend_ops.rs').read_text()
          ftxn = Path('tuner_hal2/service_runtime/src/boot/frontend_txn.rs').read_text()
          bp = Path('tuner_hal2/Android.bp').read_text()
          design = Path('tuner_hal2/DESIGN_JA.md').read_text()
          assert 'pub struct WorkerRuntimeResultOwner' not in control
          assert 'pub struct WorkerRuntime<' in control
          assert 'pub struct WorkerHandle<' in control
          assert 'pub fn spawn_handle' in control
          handle_body = control.split('pub struct WorkerHandle',1)[1].split('pub enum WorkerTerminalResult',1)[0]
          assert 'pub fn start(' not in handle_body
          assert 'WorkerRuntime::spawn_handle' in device
          assert 'WorkerRuntimeReaperQueue::start' not in cleanup
          assert 'WorkerRuntimeReaperQueue::start' not in fw
          assert 'pub use maleicacid_tuner_hal2_control_core' in service
          assert 'struct FrontendFixedPowerPreparation' not in lnb
          assert 'ensure_frontend_fixed_power_for_object' not in lnb
          assert 'release_frontend_fixed_power_after_operation' not in lnb
          assert 'pub(crate) fn retain_fixed_power_lease' not in ftxn
          assert 'fn ensure_frontend_fixed_power_for_object' in fops
          assert 'fn release_frontend_fixed_power_after_operation' in fops
          service_block = bp.split('name: "libmaleicacid_tuner_hal2_service_runtime"',1)[1].split('name: "libmaleicacid_tuner_hal2_domain_request"',1)[0]
          assert '"libmaleicacid_tuner_hal2_control_core"' in service_block
          assert '`control/src/lib.rs::{WorkerRuntime, WorkerHandle' in design
          PY
      - name: Host workspace test
        working-directory: tuner_hal2/host_ci
        run: cargo +1.81.0 test --workspace --all-targets
      - name: Host workspace check
        working-directory: tuner_hal2/host_ci
        run: cargo +1.81.0 check --workspace --all-targets
      - name: Host workspace clippy
        working-directory: tuner_hal2/host_ci
        run: |
          rustup component add clippy --toolchain 1.81.0
          cargo +1.81.0 clippy --workspace --all-targets -- -D warnings
      - name: Commit production repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tuner_hal2/control/src/lib.rs \
            tuner_hal2/service_runtime/src/worker_runtime.rs \
            tuner_hal2/device/src/runtime/thread_result_owner.rs \
            tuner_hal2/aidl_service/src/cleanup_reaper.rs \
            tuner_hal2/service_runtime/src/frontend_worker_txn.rs \
            tuner_hal2/aidl_service/src/dvr_callback_delivery.rs \
            tuner_hal2/service_runtime/src/boot/frontend_txn.rs \
            tuner_hal2/service_runtime/src/lnb_ops.rs \
            tuner_hal2/service_runtime/src/frontend_ops.rs \
            tuner_hal2/service_runtime/src/lib.rs \
            tuner_hal2/Android.bp \
            tuner_hal2/DESIGN_JA.md
          git diff --cached --quiet && exit 1
          git commit -m 'Unify worker and frontend transaction ownership'
          git push origin HEAD:fix/tuner-hal2-rustfmt-1.81
