name: Polish PR19 review round 2

on:
  push:
    paths:
      - '.github/workflows/polish-pr19-review-round2.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-tis-arib-design-residuals
          fetch-depth: 0
      - name: Polish design-only wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tis/DESIGN_JA.md')
          s = p.read_text()
          replacements = {
            'まだseedされていないtrackの最初の明示PTS、および同generation内で置換されたtrackの最初の明示PTSは、current coordinator referenceに対して':
            'まだseedされていないtrackの最初の明示PTSは、current coordinator referenceに対して',
            'late-drop／attach失敗／queue失敗でepochを消費しないこと':
            'late-drop／attach失敗／queue失敗でcurrent armを消費しないこと',
            'epoch Aのfinal-output成功eventを生成したままJava配送を遅延させ、その間にunavailable遷移とepoch Bのre-armを行った場合、遅延event AをID不一致で破棄し、epoch B arm後の新しいfinal-output成功eventだけで再availableにする競合試験':
            'arm Aのfinal-output成功eventを生成したままJava配送を遅延させ、その間にunavailable遷移とarm Bのre-armを行った場合、遅延event Aをtoken不一致で破棄し、arm B後の新しいfinal-output成功eventだけで再availableにする競合試験',
            'Framework-private setterへ十分に広いopaque `registrationToken`を渡す。tokenの数値自体にTIF/TIS意味や単調増加意味を持たせず、**旧arm由来eventがまだ配送され得るtokenと同じ値を新armへ割り当てない**ことだけをallocatorの不変条件とする。':
            'Framework-private setterの`long`へ64-bit opaque `registrationToken`を渡す。tokenの数値自体にTIF/TIS意味や単調増加意味を持たせず、**旧arm由来eventがまだ配送され得るtokenと同じ値を新armへ割り当てない**ことだけをallocatorの不変条件とする。allocatorはnonce＋counterまたはcollision-check付き候補生成のいずれでもよく、candidateがlive／retired tokenと衝突した場合は別candidateを選ぶ。'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit('missing replacement target: ' + old[:80])
              s = s.replace(old, new)
          p.write_text(s)
          PY
          git diff --check
          git add tis/DESIGN_JA.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'docs: align availability arm terminology'
          git push origin HEAD:agent/fix-tis-arib-design-residuals
