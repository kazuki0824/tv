name: agent-fix-av-positive-token
on:
  push:
    branches:
      - agent/fix-av-positive-token-duplicate-release
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch design contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tuner_hal/DESIGN_JA.md')
          s = p.read_text()

          replacements = [
              (
                  '解放済みであることを確認できる重複終了は状態を変えず成功し、所有者、世代、転送方式、識別情報の不一致には`INVALID_ARGUMENT`を返す。',
                  '`dataId=0`のshared/event-local handle leaseで、同一backing/allocationに対するboundedなlease stateから解放済みと確認できる重複終了は状態を変えず成功し、所有者、世代、転送方式、識別情報の不一致には`INVALID_ARGUMENT`を返す。'
              ),
              (
                  '発行済みで解放済みと確認できるIDへの重複要求は、状態を変えず成功する。',
                  '正の`avDataId`はactive token台帳に存在する場合だけ解放を成功させ、成功時にtokenを削除する。以後、同じ値を含めactiveでない正のtokenは`INVALID_ARGUMENT`とし、資源を変更しない。'
              ),
              (
                  '`Active`または`ReleaseOnly`の解放は1回だけ資源を返して成功する。終了済みと確認できるIDへの重複解放は状態を変えず成功し、不明ID、別所有者、組の不一致には`INVALID_ARGUMENT`を返す。',
                  'active token台帳に残る`Active`または`ReleaseOnly`の解放は1回だけ資源を返して成功し、成功時にtokenを削除する。以後、同じ値を含めactiveでない正のtoken、および別所有者・組の不一致には`INVALID_ARGUMENT`を返し、資源を変更しない。'
              ),
              (
                  '共有領域方式は最適化手段とし、要求サイズどおりのイベント固有ファイル記述子方式を正式な代替経路とする。遅延終了済みと確認できる要求は状態を変えず成功し、不明または別所有者の識別情報は拒否する。',
                  '共有領域方式は最適化手段とし、要求サイズどおりのイベント固有ファイル記述子方式を正式な代替経路とする。`dataId=0`のhandle lease終了だけは表1-C-AVHで定めたboundedなlease stateにより冪等化し、正の`avDataId`はactive token台帳に存在する場合だけ解放を成功させる。'
              ),
          ]

          for old, new in replacements:
              count = s.count(old)
              assert count == 1, (old, count)
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit design-only change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent_fix_av_positive_token.yml
          git add tuner_hal/DESIGN_JA.md
          git diff --cached --check
          git commit -m 'docs: align positive AV token release semantics'
          git push
