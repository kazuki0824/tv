name: PR54 SI lifetime補修

on:
  push:
    branches:
      - agent/implement-tis-arib-si-design-pr53
    paths:
      - .github/workflows/pr54-fix-mut.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/implement-tis-arib-si-design-pr53
          fetch-depth: 0
      - name: 残るlifetime問題を修正
        run: python3 .github/pr54_fix_mut.py
      - name: 検証して一時コミット
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add arib_si_engine_rs/src/lib.rs
          git rm .github/workflows/pr54-fix-mut.yml .github/pr54_fix_mut.py
          git commit -m 'fix(si): end mutable parser lock temporary before owner drop'
          git push origin HEAD:agent/implement-tis-arib-si-design-pr53
