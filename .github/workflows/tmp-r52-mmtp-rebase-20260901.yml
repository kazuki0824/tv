name: tmp r52 mmtp rebase 20260901

on:
  push:
    branches:
      - tmp/r52-rebase-control-20260901
    paths:
      - .github/workflows/tmp-r52-mmtp-rebase-20260901.yml

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase MMTP design commit onto rebuilt PR57
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.quotePath false
          BASE=9a759f8373eb7d8535b53c47c229109e973fdf17
          OLD_MMT=bce2bb5c102a0abd063070b9413f318bdfaa9bc7
          git fetch origin "$BASE" "$OLD_MMT"
          git checkout -B rebuilt-r52-mmtp "$BASE"
          set +e
          git cherry-pick "$OLD_MMT"
          rc=$?
          set -e
          echo "cherry_pick_rc=$rc"
          if [ "$rc" -ne 0 ]; then
            echo '--- conflicts ---'
            git diff --name-only --diff-filter=U || true
            for f in $(git diff --name-only --diff-filter=U); do
              echo "===== $f ====="
              grep -n -B8 -A70 '^<<<<<<<\|^=======\|^>>>>>>>' "$f" || true
            done
            exit "$rc"
          fi
          git diff "$BASE" HEAD --check
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git diff --name-only "$BASE" HEAD | wc -l)" -eq 7
          git push --force origin HEAD:refs/heads/tmp/rebuilt-r52-mmtp-20260901
