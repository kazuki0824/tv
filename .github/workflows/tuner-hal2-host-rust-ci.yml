name: tuner_hal2 host Rust CI

on:
  pull_request:
    paths:
      - "tuner_hal2/**/*.rs"
      - "tuner_hal2/**/Cargo.toml"
      - "tuner_hal2/host_ci/Cargo.lock"
      - "tuner_hal2/host_ci/rust-toolchain.toml"
      - ".github/workflows/tuner-hal2-host-rust-ci.yml"
  push:
    branches: [main]
    paths:
      - "tuner_hal2/**/*.rs"
      - "tuner_hal2/**/Cargo.toml"
      - "tuner_hal2/host_ci/Cargo.lock"
      - "tuner_hal2/host_ci/rust-toolchain.toml"
      - ".github/workflows/tuner-hal2-host-rust-ci.yml"

permissions:
  contents: read

concurrency:
  group: tuner-hal2-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: /tmp/tuner-hal2-host-ci-target

jobs:
  host-rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tuner_hal2/host_ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Host harness固有Rustの整形を確認
        shell: bash
        run: |
          mapfile -d '' -t sources < <(find . -type f -name '*.rs' -print0 | sort -z)
          if ((${#sources[@]} == 0)); then
            echo "host_ci固有のRust sourceはありません"
            exit 0
          fi
          failed=0
          for source in "${sources[@]}"; do
            if ! rustfmt --edition 2021 --check "$source"; then
              failed=1
            fi
          done
          exit "$failed"

  production-rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tuner_hal2/host_ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: tuner_hal2のhost harness外Rust全体の整形を確認
        shell: bash
        run: |
          mapfile -d '' -t sources < <(
            find .. \
              -path '../host_ci' -prune -o \
              -type f -name '*.rs' -print0 \
              | sort -z
          )
          test "${#sources[@]}" -gt 0
          failed=0
          for source in "${sources[@]}"; do
            if ! rustfmt --edition 2021 --check "$source"; then
              failed=1
            fi
          done
          exit "$failed"

  workspace-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tuner_hal2/host_ci
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cargo workspace package一覧を生成
        id: packages
        shell: bash
        run: |
          packages="$(
            cargo metadata --no-deps --format-version 1 --locked |
              jq -c '
                .workspace_members as $members
                | [.packages[]
                   | select(.id as $id | $members | index($id))
                   | .name]
                | sort
              '
          )"
          test "$(jq 'length' <<<"$packages")" -gt 0
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  clippy:
    name: Clippy (${{ matrix.package }})
    needs: workspace-packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.workspace-packages.outputs.packages) }}
    defaults:
      run:
        working-directory: tuner_hal2/host_ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: PackageをClippyで検査
        run: cargo clippy -p "${{ matrix.package }}" --all-targets --locked --no-deps -- -D warnings

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tuner_hal2/host_ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Type-check production Rust libraries and host crates
        run: cargo check --workspace --lib --locked

  unit-tests:
    name: Unit tests (${{ matrix.package }})
    needs: workspace-packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.workspace-packages.outputs.packages) }}
    defaults:
      run:
        working-directory: tuner_hal2/host_ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Packageのunit testsを実行
        run: cargo test -p "${{ matrix.package }}" --lib --locked

  demux-record-fmq:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tuner_hal2/host_ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run production demux Record FMQ integration test
        run: cargo test -p maleicacid-tuner-hal2-demux-host-ci --test record_filter_fmq --locked
