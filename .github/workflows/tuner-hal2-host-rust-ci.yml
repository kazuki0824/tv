name: tuner_hal2 host Rust CI

on:
  pull_request:
    paths:
      - "tuner_hal2/aidl_service/**"
      - "tuner_hal2/Android.bp"
      - "tuner_hal2/common/**"
      - "tuner_hal2/compile_contract/**"
      - "tuner_hal2/control/**"
      - "tuner_hal2/demux/**"
      - "tuner_hal2/descrambler/**"
      - "tuner_hal2/device/**"
      - "tuner_hal2/lnb/**"
      - "tuner_hal2/resource_ledger/**"
      - "tuner_hal2/service_runtime/**"
      - "tuner_hal2/host_ci/**"
      - ".github/workflows/tuner-hal2-host-rust-ci.yml"
  push:
    branches: [main]
    paths:
      - "tuner_hal2/aidl_service/**"
      - "tuner_hal2/Android.bp"
      - "tuner_hal2/common/**"
      - "tuner_hal2/compile_contract/**"
      - "tuner_hal2/control/**"
      - "tuner_hal2/demux/**"
      - "tuner_hal2/descrambler/**"
      - "tuner_hal2/device/**"
      - "tuner_hal2/lnb/**"
      - "tuner_hal2/resource_ledger/**"
      - "tuner_hal2/service_runtime/**"
      - "tuner_hal2/host_ci/**"
      - ".github/workflows/tuner-hal2-host-rust-ci.yml"

permissions:
  contents: read

concurrency:
  group: tuner-hal2-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: /tmp/tuner-hal2-host-ci-target

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tuner_hal2/host_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check host harness formatting
        run: |
          cargo fmt \
            -p maleicacid-tuner-hal2-common-host-ci \
            -p maleicacid-tuner-hal2-compile-contract-host-ci \
            -p maleicacid-tuner-hal2-control-host-ci \
            -p maleicacid-tuner-hal2-descrambler-host-ci \
            -p maleicacid-tuner-hal2-device-host-ci \
            -p maleicacid-tuner-hal2-fmq-host-ci \
            -p maleicacid-tuner-hal2-lnb-host-ci \
            -p maleicacid-tuner-hal2-resource-ledger-host-ci \
            -- --check
          rustfmt --edition 2021 --check demux/tests/record_filter_fmq.rs

      - name: Check reviewed AIDL authority sources formatting
        run: |
          rustfmt --edition 2021 --check ../aidl_service/src/callback_store.rs
          rustfmt --edition 2021 --check ../aidl_service/src/service_context.rs
          rustfmt --edition 2021 --check ../aidl_service/src/object_runtime/mod.rs
          rustfmt --edition 2021 --check ../aidl_service/src/child_object_open.rs
          rustfmt --edition 2021 --check ../service_runtime/src/playback_consume_txn.rs

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tuner_hal2/host_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Clippy on existing host-compatible crates
        run: cargo clippy --workspace --exclude maleicacid-tuner-hal2-demux-host-ci --all-targets --locked -- -D warnings

  host-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tuner_hal2/host_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: ソース契約を確認
        run: cargo test -p maleicacid-tuner-hal2-compile-contract-host-ci --locked

      - name: Type-check production demux library and host crates
        run: cargo check --workspace --lib --locked

      - name: Run existing host-compatible unit tests
        run: cargo test --workspace --exclude maleicacid-tuner-hal2-demux-host-ci --locked

      - name: Run production demux Record FMQ integration test
        run: cargo test -p maleicacid-tuner-hal2-demux-host-ci --test record_filter_fmq --locked
