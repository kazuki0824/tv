name: tuner_hal2 ホストRust CI

on:
  pull_request:
    paths:
      - "tuner_hal2/aidl_service/**"
      - "tuner_hal2/Android.bp"
      - "tuner_hal2/common/**"
      - "tuner_hal2/compile_contract/**"
      - "tuner_hal2/control/**"
      - "tuner_hal2/descrambler/**"
      - "tuner_hal2/device/**"
      - "tuner_hal2/lnb/**"
      - "tuner_hal2/resource_ledger/**"
      - "tuner_hal2/host_ci/**"
      - ".github/workflows/tuner-hal2-host-rust-ci.yml"
  push:
    branches: [main]
    paths:
      - "tuner_hal2/aidl_service/**"
      - "tuner_hal2/Android.bp"
      - "tuner_hal2/common/**"
      - "tuner_hal2/compile_contract/**"
      - "tuner_hal2/control/**"
      - "tuner_hal2/descrambler/**"
      - "tuner_hal2/device/**"
      - "tuner_hal2/lnb/**"
      - "tuner_hal2/resource_ledger/**"
      - "tuner_hal2/host_ci/**"
      - ".github/workflows/tuner-hal2-host-rust-ci.yml"

permissions:
  contents: read

concurrency:
  group: tuner-hal2-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: /tmp/tuner-hal2-host-ci-target

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tuner_hal2/host_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Rust整形を確認
        run: cargo fmt --all -- --check

      - name: レビュー済みAIDL権限ソースの整形を確認
        run: |
          rustfmt --edition 2021 --check ../aidl_service/src/callback_store.rs
          rustfmt --edition 2021 --check ../aidl_service/src/service_context.rs
          rustfmt --edition 2021 --check ../aidl_service/src/object_runtime/mod.rs
          rustfmt --edition 2021 --check ../aidl_service/src/child_object_open.rs

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tuner_hal2/host_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: ホスト互換crateへClippyを実行
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  host-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tuner_hal2/host_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: AIDL callback権限ソース契約を確認
        run: cargo test -p maleicacid-tuner-hal2-compile-contract-host-ci --locked

      - name: ホスト互換crateを型検査
        run: cargo check --workspace --all-targets --locked

      - name: ホスト互換単体テストを実行
        run: cargo test --workspace --locked
