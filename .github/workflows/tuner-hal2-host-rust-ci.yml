name: tuner_hal2 host Rust CI

on:
  pull_request:
    paths:
      - "tuner_hal2/**/*.rs"
      - "tuner_hal2/**/Cargo.toml"
      - "tuner_hal2/host_ci/Cargo.lock"
      - "tuner_hal2/host_ci/rust-toolchain.toml"
      - ".github/workflows/tuner-hal2-host-rust-ci.yml"
  push:
    branches: [main]
    paths:
      - "tuner_hal2/**/*.rs"
      - "tuner_hal2/**/Cargo.toml"
      - "tuner_hal2/host_ci/Cargo.lock"
      - "tuner_hal2/host_ci/rust-toolchain.toml"
      - ".github/workflows/tuner-hal2-host-rust-ci.yml"

permissions:
  contents: read

concurrency:
  group: tuner-hal2-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: /tmp/tuner-hal2-host-ci-target

jobs:
  workspace-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tuner_hal2/host_ci
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cargo workspace package一覧を生成
        id: packages
        shell: bash
        run: |
          packages="$(
            cargo metadata --no-deps --format-version 1 --locked |
              jq -c '
                .workspace_members as $members
                | [.packages[]
                   | select(.id as $id | $members | index($id))
                   | .name]
                | sort
              '
          )"
          test "$(jq 'length' <<<"$packages")" -gt 0
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  clippy:
    name: Clippy (${{ matrix.package }})
    needs: workspace-packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.workspace-packages.outputs.packages) }}
        exclude:
          # service_runtime host packageのproduction parityは専用rustc checkで検査し、Clippy対象は既存のpackage集合に限定する。
          - package: maleicacid-tuner-hal2-service-runtime-host-ci
    defaults:
      run:
        working-directory: tuner_hal2/host_ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: PackageをClippyで検査
        run: cargo clippy -p "${{ matrix.package }}" --all-targets --locked --no-deps -- -D warnings

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tuner_hal2/host_ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Type-check production Rust libraries and host crates
        run: cargo check --workspace --lib --locked

  service-runtime-production-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tuner_hal2/host_ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Type-check production service_runtime with AOSP warning policy
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check -p maleicacid-tuner-hal2-service-runtime-host-ci --lib --locked

  unit-tests:
    name: Unit tests (${{ matrix.package }})
    needs: workspace-packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.workspace-packages.outputs.packages) }}
    defaults:
      run:
        working-directory: tuner_hal2/host_ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Packageのunit testsを実行
        run: cargo test -p "${{ matrix.package }}" --lib --locked

  concurrency-loom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tuner_hal2/host_ci/concurrency_loom
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 並行性契約のLoom試験
        env:
          RUSTFLAGS: "--cfg loom"
        run: |
          cargo generate-lockfile
          cargo test --locked

  demux-record-fmq:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tuner_hal2/host_ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run production demux Record FMQ integration test
        run: cargo test -p maleicacid-tuner-hal2-demux-host-ci --test record_filter_fmq --locked

  large-av-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LARGE_AV_TS: /tmp/large-av.ts
      LARGE_AV_ES: /tmp/large-av.h264
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Generate and decode an AVC High Level 5.2 transport fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -y -f lavfi -i "color=black:s=3840x2160:r=60000/1001,noise=alls=100:allf=u:enable='eq(n,0)'" \
            -frames:v 60 -c:v libx264 -preset fast -crf 24 -profile:v high -level:v 5.2 \
            -maxrate 60M -bufsize 80M -x264-params 'aud=1:repeat-headers=1:nal-hrd=vbr:vbv-init=0.9:keyint=30:min-keyint=30:scenecut=0:bframes=0' \
            -mpegts_start_pid 641 -f mpegts "$LARGE_AV_TS"
          ffmpeg -v error -xerror -i "$LARGE_AV_TS" -f null -
      - name: Run the production producer and event allocator
        working-directory: tuner_hal2/host_ci
        run: cargo test -p maleicacid-tuner-hal2-demux-host-ci --test large_av_payload --locked -- --ignored --nocapture
      - name: Decode the exact delivered access unit
        run: ffmpeg -v error -xerror -i "$LARGE_AV_ES" -f null -
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Feed the delivered payload through the TIS SDK callback to Codec input
        run: gradle --no-daemon -p tis/host_ci/robolectric testDebugUnitTest --tests com.maleicacid.tvinput.tis.PlaybackFilterAdmissionTest.largeVideoPayloadReachesCodecInput
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: large-av-payload
          path: |
            /tmp/large-av.ts
            /tmp/large-av.h264
            /tmp/large-av.h264.pts
            tis/host_ci/robolectric/build/test-results/testDebugUnitTest/
