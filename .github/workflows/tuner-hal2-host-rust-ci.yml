name: tuner_hal2 host Rust CI

on:
  pull_request:
    paths:
      - "tuner_hal2/aidl_service/**"
      - "tuner_hal2/Android.bp"
      - "tuner_hal2/binder_adapter/**"
      - "tuner_hal2/common/**"
      - "tuner_hal2/compile_contract/**"
      - "tuner_hal2/control/**"
      - "tuner_hal2/demux/**"
      - "tuner_hal2/descrambler/**"
      - "tuner_hal2/device/**"
      - "tuner_hal2/domain_request/**"
      - "tuner_hal2/fmq/**"
      - "tuner_hal2/lnb/**"
      - "tuner_hal2/resource_ledger/**"
      - "tuner_hal2/service_runtime/**"
      - "tuner_hal2/host_ci/**"
      - ".github/workflows/tuner-hal2-host-rust-ci.yml"
  push:
    branches: [main]
    paths:
      - "tuner_hal2/aidl_service/**"
      - "tuner_hal2/Android.bp"
      - "tuner_hal2/binder_adapter/**"
      - "tuner_hal2/common/**"
      - "tuner_hal2/compile_contract/**"
      - "tuner_hal2/control/**"
      - "tuner_hal2/demux/**"
      - "tuner_hal2/descrambler/**"
      - "tuner_hal2/device/**"
      - "tuner_hal2/domain_request/**"
      - "tuner_hal2/fmq/**"
      - "tuner_hal2/lnb/**"
      - "tuner_hal2/resource_ledger/**"
      - "tuner_hal2/service_runtime/**"
      - "tuner_hal2/host_ci/**"
      - ".github/workflows/tuner-hal2-host-rust-ci.yml"

permissions:
  contents: read

concurrency:
  group: tuner-hal2-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: /tmp/tuner-hal2-host-ci-target
  RUST_TOOLCHAIN: 1.81.0

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tuner_hal2/host_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: LineageOS 22.1のRust toolchainを導入
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt

      - name: Host workspaceのRust整形を確認
        run: cargo +"$RUST_TOOLCHAIN" fmt --all -- --check

      - name: tuner_hal2本番Rust全体の整形を確認
        shell: bash
        run: |
          mapfile -d '' -t sources < <(
            find .. \
              -path '../host_ci' -prune -o \
              -type f -name '*.rs' -print0 \
              | sort -z
          )
          test "${#sources[@]}" -gt 0
          for source in "${sources[@]}"; do
            rustfmt +"$RUST_TOOLCHAIN" --edition 2021 --check "$source"
          done

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tuner_hal2/host_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: LineageOS 22.1のRust toolchainを導入
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy

      - name: Host workspace全体をClippyで検査
        run: cargo +"$RUST_TOOLCHAIN" clippy --workspace --all-targets --locked -- -D warnings

  host-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tuner_hal2/host_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: LineageOS 22.1のRust toolchainを導入
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: ソース契約を確認
        run: cargo +"$RUST_TOOLCHAIN" test -p maleicacid-tuner-hal2-compile-contract-host-ci --locked

      - name: Type-check production Rust libraries and host crates
        run: cargo +"$RUST_TOOLCHAIN" check --workspace --lib --locked

      - name: Run existing host-compatible unit tests
        run: cargo +"$RUST_TOOLCHAIN" test --workspace --exclude maleicacid-tuner-hal2-demux-host-ci --locked

      - name: Run production demux Record FMQ integration test
        run: cargo +"$RUST_TOOLCHAIN" test -p maleicacid-tuner-hal2-demux-host-ci --test record_filter_fmq --locked
