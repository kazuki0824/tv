name: Temporary nullable status fix

on:
  push:
    branches:
      - agent/apply-tuner-hal2-design-proposals-v70
    paths:
      - .github/workflows/fix-nullable-status-temp.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apply-tuner-hal2-design-proposals-v70
          fetch-depth: 0
      - name: Clarify nullable implementation status
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tuner_hal/DESIGN_JA.md')
          text = path.read_text(encoding='utf-8')
          old = '''`IDescrambler.addPid()` / `removePid()` は、`optionalSourceFilter == NULL` を demux input 全体に対する PID 登録 / 解除として扱い、`optionalSourceFilter != NULL` を指定 filter output、すなわち upper stream に対する PID 登録 / 解除として扱う。NULL 経路は現行AOSP契約上の成功対象であり、実装済み対象に含める。non-null source filter 経路は、本書の「表D-1. IDescrambler PID 操作表」を正とし、同一 demux、非閉鎖、世代一致を検証する。'''
          new = '''`IDescrambler.addPid()` / `removePid()` は、`optionalSourceFilter == NULL` を demux input 全体に対する PID 登録 / 解除として扱い、`optionalSourceFilter != NULL` を指定 filter output、すなわち upper stream に対する PID 登録 / 解除として扱う。NULL 経路は現行AOSP契約上の必須成功対象として設計上および目標実装上の対象に含めるが、現行Rust Binder境界では受信経路が未成立であるため、実装済み対象、VTS接続済み、またはAOSP契約達成済みには含めない。non-null source filter 経路は、本書の「表D-1. IDescrambler PID 操作表」を正とし、同一 demux、非閉鎖、世代一致を検証する。'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one target paragraph, found {count}')
          updated = text.replace(old, new)
          if 'NULL 経路は現行AOSP契約上の成功対象であり、実装済み対象に含める' in updated:
              raise SystemExit('contradictory wording remains')
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Remove temporary workflow and validate
        shell: bash
        run: |
          rm .github/workflows/fix-nullable-status-temp.yml
          test -z "$(git diff --name-only -- future_work)"
          grep -Fq '現行Rust Binder境界では受信経路が未成立であるため、実装済み対象、VTS接続済み、またはAOSP契約達成済みには含めない' tuner_hal/DESIGN_JA.md
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tuner_hal/DESIGN_JA.md .github/workflows/fix-nullable-status-temp.yml
          git commit -m 'docs: clarify nullable implementation status [skip ci]'
          git push origin HEAD:agent/apply-tuner-hal2-design-proposals-v70
