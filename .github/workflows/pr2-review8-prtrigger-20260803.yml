name: PR2 review8 PR trigger 2026-08-03

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/pr2-review8-pr-trigger-20260803.txt

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tooling
        uses: actions/checkout@v4
        with:
          ref: main
          path: tooling
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/apply-tuner-hal2-design-proposals-v70
          path: work
      - name: Check trigger
        id: trigger
        working-directory: work
        run: |
          if test -f .github/pr2-review8-pr-trigger-20260803.txt; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply design fixes
        if: steps.trigger.outputs.present == 'true'
        run: python3 tooling/.github/pr2-review8-patch-20260803.py work
      - name: Validate and push
        if: steps.trigger.outputs.present == 'true'
        working-directory: work
        run: |
          rm .github/pr2-review8-pr-trigger-20260803.txt
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' .github/pr2-review8-pr-trigger-20260803.txt tuner_hal/DESIGN_JA.md tuner_hal2/DESIGN_JA.md | sort)"
          test "$changed" = "$expected"
          python3 - <<'PY'
          from pathlib import Path
          for p in (Path('tuner_hal/DESIGN_JA.md'), Path('tuner_hal2/DESIGN_JA.md')):
              text = p.read_text(encoding='utf-8')
              assert text.count('```') % 2 == 0, p
          hal = Path('tuner_hal/DESIGN_JA.md').read_text(encoding='utf-8')
          hal2 = Path('tuner_hal2/DESIGN_JA.md').read_text(encoding='utf-8')
          for stale in (
              'tableInfoCompletionWindowMs',
              'tableInfoTrackingBudgetBytes',
              '復元を含む2確定点',
              '完全な`RuntimeCapabilityVector`',
              '完全能力ベクトル',
              'vector全体で一括予約',
              '候補間の列を混成しない',
          ):
              assert stale not in hal, stale
          assert '新要求失敗時restore' not in hal2
          assert '`CapabilitySnapshot` の依存閉包合成' in hal
          assert '`TableInfo repeat=false`は、AOSP契約上' in hal
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .github/pr2-review8-pr-trigger-20260803.txt tuner_hal/DESIGN_JA.md tuner_hal2/DESIGN_JA.md
          git commit -m 'docs: close remaining tuner design inconsistencies'
          git push origin HEAD:agent/apply-tuner-hal2-design-proposals-v70
