name: Temporary CAS review2 patch
on:
  push:
    branches: [design/aosp-mediacas-b25-plugin]
    paths: [.github/workflows/tmp-cas-review2.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/aosp-mediacas-b25-plugin
      - shell: python
        run: |
          from pathlib import Path
          p = Path('cas_plugin/DESIGN_JA.md')
          s = p.read_text(encoding='utf-8')
          old = '''Maleicacid CAS plugin library
            |- extern "C" createCasFactory()
            |- MaleicacidCasFactory : android::CasFactory
            `- MaleicacidB25CasPlugin  : android::CasPlugin
                 |- SessionTable
                 |- backend binding
                 |- YakisobaBackend
                 |- SmartCardBackend
                 `- Tuner key bridge'''
          new = '''Maleicacid CAS plugin library
            |- extern "C" createCasFactory()
            |- MaleicacidCasFactory : android::CasFactory
            |- MaleicacidB25CasPlugin : android::CasPlugin
            |    |- SessionTable
            |    |- backend binding
            |    |- YakisobaBackend
            |    |- SmartCardBackend
            |    `- Tuner key bridge
            `- MaleicacidB1CasPlugin : android::CasPlugin
                 |- SessionTable
                 |- B1SmartCardBackend
                 `- Tuner key bridge'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '`MaleicacidCasFactory` はB25 CA system IDのsupport判定、plugin descriptor query、B25 CasPlugin instance生成を所有する。AOSP `CasAPI.h` のpure virtual ABIに従い、`CasPluginCallback` 版と `CasPluginCallbackExt` 版の両 `createPlugin()` を実装する。両overloadは同じB25 plugin coreを生成し、callback形式だけをadapterで分ける。AIDL default `MediaCasService` はExt callback版を使用するが、legacy callback版も未実装のまま残さない。'
          new = '`MaleicacidCasFactory` はB25/B1 CA system IDのsupport判定、B25/B1 plugin descriptor query、caSystemIdに対応するCasPlugin instance生成を所有する。AOSP `CasAPI.h` のpure virtual ABIに従い、`CasPluginCallback` 版と `CasPluginCallbackExt` 版の両 `createPlugin()` を実装する。両overloadは同じsystem-id dispatchを使い、B25なら `MaleicacidB25CasPlugin`、B1なら `MaleicacidB1CasPlugin` を生成し、callback形式だけをadapterで分ける。AIDL default `MediaCasService` はExt callback版を使用するが、legacy callback版も未実装のまま残さない。'
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cas_plugin/DESIGN_JA.md
          git diff --cached --check
          git commit -m 'fix(cas): complete B1 factory ownership'
          git push origin HEAD:design/aosp-mediacas-b25-plugin
