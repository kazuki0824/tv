name: Apply PR19 review round3

on:
  push:
    branches:
      - agent/fix-tis-arib-design-residuals

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-tis-arib-design-residuals
          fetch-depth: 0
      - shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one match, got {n}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'tis/DESIGN_JA.md',
              "video decoderには実行開始前に `MediaCodec.OnFrameRenderedListener` を登録する。codecのoutput Surfaceは`MediaSync.createInputSurface()`で得たMediaSync入力Surfaceなので、current decoder/current playback generationの最初の`onFrameRendered()`はdecoderからMediaSync入力へ少なくとも1 frameが渡ったことを示す中間観測に限定する。Android公開`MediaSync` APIには、その後の特定video frameが`sessionSurface`へ実際に提示されたことを通知するvideo presentation callbackはなく、`MediaSync.getTimestamp()`もcurrent playback positionであって表示済みvideo frameのcommit通知ではないため、これらを厳密なcompositor presentation証明として扱わない。TIFの`notifyVideoAvailable()`はTISがcontentをready for viewingと判断した時点で呼ぶ状態通知であり、特定frameのcompositor commit tokenを要求するAPIではない。現行productでは、current decoder/current generationで最初の`onFrameRendered()`を受け、MediaSyncがcurrent generationでplayback rate 0より大きく開始済み、`MediaSync.setSurface()`へ設定したcurrent `sessionSurface`が有効、視聴制限でblockされておらず、同generationで`MEDIASYNC_ERROR_SURFACE_FAIL`が発生していない場合を、公開APIで構成できる最小のready-for-viewing判定として`notifyVideoAvailable()`を一度だけ呼ぶ。旧decoder/旧generationのcallbackは無視する。厳密な最終pixel提示を証明するための固定delay、独自clock、独自frame scheduler、hidden API、Surface/compositor pixel probeは追加しない。",
              "video decoderには実行開始前に `MediaCodec.OnFrameRenderedListener` を登録する。codecのoutput Surfaceは`MediaSync.createInputSurface()`で得たMediaSync入力Surfaceなので、current decoder/current playback generationの最初の`onFrameRendered()`はdecoderからMediaSync入力へ少なくとも1 frameが渡ったことを示す中間観測に限定し、その`presentationTimeUs`をcurrent generationの`firstFrameCandidatePtsUs`として保持する。Android公開`MediaSync` APIには、その後の特定video frameが`sessionSurface`へ実際に提示されたことを通知するvideo presentation callbackはなく、`MediaSync.getTimestamp()`も表示済みvideo frameのcommit通知ではないため、厳密なcompositor presentation証明には使わない。一方で`MediaSync.getTimestamp()`はcurrent playback positionを返す公開APIなので、future PTSのcandidateをpresentation時刻より前にavailable扱いしないtemporal gateとして使用する。`notifyVideoAvailable()`は、candidateが存在し、MediaSyncがcurrent generationでplayback rate 0より大きく開始済みで、`getTimestamp()`がnon-nullかつ`MediaTimestamp.getMediaClockRate()>0`で、そのcurrent playback positionである`getAnchorMediaTimeUs()`が`firstFrameCandidatePtsUs`以上に到達し、`MediaSync.setSurface()`へ設定したcurrent `sessionSurface`が有効、視聴制限でblockされておらず、同generationで`MEDIASYNC_ERROR_SURFACE_FAIL`が発生していない場合だけ一度呼ぶ。`getTimestamp()`がnullまたはcandidate PTS未到達なら通知せず、後続のcurrent-generation decoder/MediaSync callbackで同じgateを再評価する。このtimestamp gateはcandidateのdue time到達前通知を防ぐためのbest-effort条件であり、実際のoutput Surface/compositor提示完了を証明するものとは扱わない。旧decoder/旧generationのcallbackは無視する。固定delay、独自clock、独自frame scheduler、hidden API、Surface/compositor pixel probeは追加しない。"
          )

          replace_once(
              'tis/DESIGN_JA.md',
              "`tunneled`／platform passthrough playback pathは現行productの設計候補から外し、実装しない。`notifyVideoAvailable()`は、本書「再生経路」で定義したとおり、current decoder/current generationの最初の`MediaCodec.OnFrameRenderedListener.onFrameRendered()`をMediaSync入力到達の中間観測として使い、MediaSync再生開始、current session Surface有効、generation、視聴制限、MediaSync Surface errorの各gateを満たした時点を公開APIで構成可能なready-for-viewing判定とする。`MediaSync.getTimestamp()`を表示済みvideo frameの証明には使わず、単なるfilter開始、入力event到着、decoder output生成だけでは通知しない。",
              "`tunneled`／platform passthrough playback pathは現行productの設計候補から外し、実装しない。`notifyVideoAvailable()`は、本書「再生経路」で定義したとおり、current decoder/current generationの最初の`MediaCodec.OnFrameRenderedListener.onFrameRendered()`をMediaSync入力到達の中間観測としてcandidate PTSを保持し、`MediaSync.getTimestamp()`のcurrent playback positionがそのcandidate PTSへ到達したことをfuture-frame早期通知防止のtemporal gateとして確認する。さらにMediaSync再生開始、current session Surface有効、generation、視聴制限、MediaSync Surface errorの各gateを満たした場合だけ通知する。`MediaSync.getTimestamp()`を表示済みvideo frameの証明には使わず、単なるfilter開始、入力event到着、decoder output生成だけでも通知しない。"
          )

          replace_once(
              'tis/DESIGN_JA.md',
              "- `notifyVideoAvailable()` は `MediaCodec.OnFrameRenderedListener.onFrameRendered()`をMediaSync入力Surface到達の中間観測として扱い、current generationで少なくとも1 video frameがMediaSync入力へ渡され、playback rateが0より大きく、current session Surfaceが有効で`MEDIASYNC_ERROR_SURFACE_FAIL`がなく、視聴制限でblockされていない場合に一度だけ呼ぶ。Android公開APIには特定video frameの最終`sessionSurface`提示完了callbackがないため、`MediaSync.getTimestamp()`をその証明へ転用せず、固定delay、独自clock、hidden API、pixel probeも使わない。",
              "- `notifyVideoAvailable()` は `MediaCodec.OnFrameRenderedListener.onFrameRendered()`をMediaSync入力Surface到達の中間観測としてcandidate PTSを保持し、`MediaSync.getTimestamp()`のcurrent playback positionがcandidate PTS以上に到達するまで通知しない。timestampはfuture-frame早期通知防止のtemporal gateに限定し、最終`sessionSurface`提示完了の証明とは扱わない。加えてplayback rateが0より大きく、current session Surfaceが有効で`MEDIASYNC_ERROR_SURFACE_FAIL`がなく、視聴制限でblockされていない場合に一度だけ呼ぶ。固定delay、独自clock、hidden API、pixel probeは使わない。"
          )

          replace_once(
              'tis/DESIGN_JA.md',
              "最低試験契約は、型付きLinearBlock→block model QueueRequest、ES全体copy禁止、PTS欠落sample単体dropとgeneration継続、通常PTS wrap、`OnFrameRendered`単独ではvideo availableにしないこと、current generationで最初のvideo frameがMediaSync入力へ渡された後もplayback rate／current Surface／parental／Surface-error gateが揃うまで抑止すること、`MediaSync.getTimestamp()`をfinal video presentation証明として使わないこと、条件成立後に一回だけavailability通知すること、audio bufferのconsume callbackまでの寿命、A/V同期、video-only、audio-only、非wrap discontinuity後のMediaSync再生成、Surface／route変更後の旧generation非利用、MediaSync error写像、stale generation非描画を含む。試験のqueue数値上限は選択した`ProductProfile`と一致させる。",
              "最低試験契約は、型付きLinearBlock→block model QueueRequest、ES全体copy禁止、PTS欠落sample単体dropとgeneration継続、通常PTS wrap、`OnFrameRendered`単独ではvideo availableにしないこと、candidate PTSに対する`MediaSync.getTimestamp()`のcurrent playback positionが未到達またはnullの間はfuture-frame早期通知を抑止すること、timestampをfinal video presentation証明とは扱わないこと、candidate PTS到達後もplayback rate／current Surface／parental／Surface-error gateが揃うまで抑止し条件成立後に一回だけavailability通知すること、audio bufferのconsume callbackまでの寿命、A/V同期、video-only、audio-only、非wrap discontinuity後のMediaSync再生成、Surface／route変更後の旧generation非利用、MediaSync error写像、stale generation非描画を含む。試験のqueue数値上限は選択した`ProductProfile`と一致させる。"
          )
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tis/DESIGN_JA.md
          git commit -m 'docs: restore first-frame due-time gate'
          git push origin HEAD:agent/fix-tis-arib-design-residuals
