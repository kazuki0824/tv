name: pr28-close-public-result-fix

on:
  push:
    branches:
      - agent/fix-commonization-boundaries
    paths:
      - .github/workflows/pr28-close-public-result-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-commonization-boundaries
      - name: Preserve public close result while referencing canonical cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tuner_hal/DESIGN_JA.md')
          text = path.read_text()
          old = '| CL-010 | Filter / DVR | 二重`close()` | 後片付け未完 | 0-S-3Bの`ObjectCloseTxn`参照 | true | false | 0-S-3Bの`ObjectCloseTxn`が定める公開結果に従う | 0-S-3Bの`ObjectCloseTxn`参照 | 0-S-3Bの`ObjectCloseTxn`参照 | `close()`以外は`INVALID_STATE` | `close_retry` | 未完cleanupを成功扱いで隠さないこと | cleanup_complete を正にする |'
          new = '| CL-010 | Filter / DVR | 二重`close()` | 後片付け未完 | 公開再`close()` | true | false | cleanup完了なら成功、未完なら`UNKNOWN_ERROR` | 0-S-3Bの`ObjectCloseTxn`参照 | 0-S-3Bの`ObjectCloseTxn`参照 | `close()`以外は`INVALID_STATE` | `close_retry` | 未完cleanupを成功扱いで隠さないこと | cleanup_complete を正にする |'
          if text.count(old) != 1:
              raise SystemExit(f'expected one CL-010 row, got {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tuner_hal/DESIGN_JA.md
          git commit -m "design: keep close public result in API table"
          git push origin HEAD:agent/fix-commonization-boundaries
