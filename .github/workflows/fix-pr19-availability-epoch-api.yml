name: Clarify PR19 availability epoch API

on:
  push:
    branches:
      - agent/fix-tis-arib-design-residuals

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-tis-arib-design-residuals
          fetch-depth: 0
      - shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('tis/DESIGN_JA.md')
          text = p.read_text(encoding='utf-8')
          old = '''stock Android 14 / LineageOS 21 の `MediaSync` はvideo scheduling/dropをnative側で所有し、late frameをinputへ返すdrop分岐と、render対象frameをcurrent outputへattachして`queueBuffer()`する分岐を区別する。一方、公開Java APIにはそのfinal-output成功をvideo clientへ通知するcallbackがない。この不足だけを閉じるため、対象LineageOS platformの`android.media.MediaSync`へ、既存public `MediaSync.Callback`とは別の `@hide OnFirstVideoFrameQueuedListener` と `@hide setOnFirstVideoFrameQueuedListener(listener, handler)` 相当を追加する。public SDK、`@SystemApi`、`@TestApi`、Tuner AIDL/VINTFは変更しない。'''
          new = '''stock Android 14 / LineageOS 21 の `MediaSync` はvideo scheduling/dropをnative側で所有し、late frameをinputへ返すdrop分岐と、render対象frameをcurrent outputへattachして`queueBuffer()`する分岐を区別する。一方、公開Java APIにはそのfinal-output成功をvideo clientへ通知するcallbackがない。この不足だけを閉じるため、対象LineageOS platformの`android.media.MediaSync`へ、既存public `MediaSync.Callback`とは別の `@hide OnFirstVideoFrameQueuedListener` と、`availabilityEpochId`を同時にarmする `@hide setOnFirstVideoFrameQueuedListener(long availabilityEpochId, listener, handler)` 相当を追加する。listener eventは少なくとも`MediaSync` instanceと成功判定時に固定した`availabilityEpochId`を返す。public SDK、`@SystemApi`、`@TestApi`、Tuner AIDL/VINTFは変更しない。'''
          if text.count(old) != 1:
              raise SystemExit('target paragraph not unique')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tis/DESIGN_JA.md
          git commit -m 'docs: make availability epoch callback token explicit'
          git push origin HEAD:agent/fix-tis-arib-design-residuals
