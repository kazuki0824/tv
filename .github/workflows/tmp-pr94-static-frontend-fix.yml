name: Temporary PR94 static frontend ordering fix

on:
  push:
    branches:
      - fix/bs-mixed-frontend-discovery
    paths:
      - .github/pr94-static-frontend-fix-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bs-mixed-frontend-discovery
          fetch-depth: 0
          persist-credentials: true

      - name: Apply focused scan-order fix
        run: |
          python3 .github/pr94-static-frontend-fix.py
          git diff --check
          git diff --exit-code -- . ':!tis/src/com/maleicacid/tvinput/tis/ChannelScanController.kt' ':!.github/pr94-static-frontend-fix.py' ':!.github/workflows/tmp-pr94-static-frontend-fix.yml' ':!.github/pr94-static-frontend-fix-trigger.txt'

      - name: Commit source fix and remove temporary files
        run: |
          rm -f .github/pr94-static-frontend-fix.py
          rm -f .github/workflows/tmp-pr94-static-frontend-fix.yml
          rm -f .github/pr94-static-frontend-fix-trigger.txt
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tis/src/com/maleicacid/tvinput/tis/ChannelScanController.kt .github/pr94-static-frontend-fix.py .github/workflows/tmp-pr94-static-frontend-fix.yml .github/pr94-static-frontend-fix-trigger.txt
          git commit -m 'fix(tis): defer BS frontend selection until execution'
          git push origin HEAD:fix/bs-mixed-frontend-discovery
