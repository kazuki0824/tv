name: PR28 latest SSOT review fixes

on:
  push:
    branches:
      - agent/fix-commonization-boundaries
    paths:
      - .github/workflows/pr28-review-7-ssot-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-commonization-boundaries
          fetch-depth: 0
      - name: Apply design fixes
        shell: bash
        run: |
          echo '' | base64 -d >/tmp/pr28_patch.py
          python3 /tmp/pr28_patch.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tuner_hal/DESIGN_JA.md
          git rm .github/workflows/pr28-review-7-ssot-fixes.yml
          git commit -m 'docs: address latest PR28 SSOT review findings'
          git push origin HEAD:agent/fix-commonization-boundaries
