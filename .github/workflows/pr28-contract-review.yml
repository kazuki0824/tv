name: pr28-contract-review
on:
  push:
    branches:
      - agent/fix-commonization-boundaries
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-commonization-boundaries
          fetch-depth: 0
      - name: Apply design review corrections
        run: |
          sed -i 's/raise SystemExit(/print(/g' .tmp/pr28_contract_review.py
          python3 .tmp/pr28_contract_review.py
      - name: Commit design-only changes and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tuner_hal/DESIGN_JA.md tuner_hal/CODE_CONVENTION.md tuner_hal2/INTEGRATION.md 開発規則.md
          git rm .github/workflows/pr28-contract-review.yml .tmp/pr28_contract_review.py
          git commit -m "design: close contract review gaps [skip ci]"
          git push origin HEAD:agent/fix-commonization-boundaries
