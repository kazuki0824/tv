これらの名称・lock/API選択は実装規約であり、`DESIGN_JA.md`の公開状態・capability・戻り値・資源寿命を変更する根拠にはしない。
'''
              cc.write_text(c)

          integ = Path('tuner_hal2/INTEGRATION.md')
          i = integ.read_text()
          imarker = '## px4 probe prefix 変更時の同期対象（PR #28）'
          if imarker not in i:
              i += r'''

