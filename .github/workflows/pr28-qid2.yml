name: PR28 qid fix 2
on:
  push:
    branches: [agent/fix-commonization-boundaries]
    paths: [.github/workflows/pr28-qid2.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-commonization-boundaries
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tuner_hal/DESIGN_JA.md'); s=p.read_text()
          a='| `QueueEpochProtocol` | `demux/src/runtime/queue_runtime.rs` | DVR data path、`QueueCleanupTxn`からのtyped flush request | queue identity、epoch、read/write token、active count | Filter producer、DVR parser/stats、flush orchestration |'
          b='| `QueueEpochProtocol` | `demux/src/runtime/queue_runtime.rs` | DVR data path、`QueueCleanupTxn`からのtyped flush request | `queue_epoch`、read/write token、active count、drain state | `queue_identity`（`PlaybackQueueBacking`所有）、Filter producer、DVR parser/stats、flush orchestration |'
          assert s.count(a)==1; p.write_text(s.replace(a,b))
          p=Path('tuner_hal2/DESIGN_JA.md'); s=p.read_text()
          a='| `QueueEpochProtocol` | 既存`demux/src/runtime/queue_runtime.rs` | DVR data pathのbegin/commit/cancelと`QueueCleanupTxn`からのtyped flush入口 | `QueueCleanupTxn`がqueue token/epoch内部状態を直接変更する、Filter stateを吸収する |'
          b='| `QueueEpochProtocol` | 既存`demux/src/runtime/queue_runtime.rs`。`queue_epoch`、read/write token、active count、drain stateだけを所有し、`PlaybackQueueBacking.queue_identity`は参照するが所有しない | DVR data pathのbegin/commit/cancelと`QueueCleanupTxn`からのtyped flush入口 | `QueueCleanupTxn`がqueue token/epoch内部状態を直接変更する、`QueueEpochProtocol`が`PlaybackQueueBacking.queue_identity`を二重所有・変更する、Filter stateを吸収する |'
          assert s.count(a)==1; p.write_text(s.replace(a,b))
          PY
          git diff --check
          git rm .github/workflows/pr28-qid2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tuner_hal/DESIGN_JA.md tuner_hal2/DESIGN_JA.md
          git commit -m 'design: align queue identity ownership'
          git push
