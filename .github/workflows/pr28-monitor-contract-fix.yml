name: PR28 monitor capability contract fix

on:
  push:
    branches:
      - agent/fix-commonization-boundaries
    paths:
      - .github/workflows/pr28-monitor-contract-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-commonization-boundaries
          fetch-depth: 0
          sparse-checkout: |
            tuner_hal/DESIGN_JA.md
            .github/workflows/pr28-monitor-contract-fix.yml
      - name: Normalize monitor capability contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tuner_hal/DESIGN_JA.md')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '現行のTS-only `ProductProfile`ではmonitor eventを宣言しない。AIDLのreset入力だけを実装し、非0 maskを受理する将来状態機械は置かない。',
                  '本製品のTS-only `ProductProfile`はfilter monitor eventを対応能力として採用しない。AIDLのreset入力だけを成功対象とし、非0 maskは`UNAVAILABLE`とする。',
                  'monitor temporal paragraph',
              ),
              (
                  '現行profileが宣言しない有効機能要求を成功扱いにしない',
                  '本製品が対応能力として採用しない有効機能要求を成功扱いにしない',
                  'F-C-026 rationale',
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, got {count}')
              text = text.replace(old, new, 1)

          forbidden = [
              '現行のTS-only `ProductProfile`ではmonitor eventを宣言しない',
              '非0 maskを受理する将来状態機械',
              '現行profileが宣言しない有効機能要求',
          ]
          for phrase in forbidden:
              if phrase in text:
                  raise SystemExit(f'residual temporal monitor wording: {phrase}')

          required = [
              '本製品のTS-only `ProductProfile`はfilter monitor eventを対応能力として採用しない。AIDLのreset入力だけを成功対象とし、非0 maskは`UNAVAILABLE`とする。',
              '本製品が対応能力として採用しない有効機能要求を成功扱いにしない',
          ]
          for phrase in required:
              if phrase not in text:
                  raise SystemExit(f'required monitor contract missing: {phrase}')

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check -- tuner_hal/DESIGN_JA.md
          git diff -- tuner_hal/DESIGN_JA.md
      - name: Commit design fix and remove transport workflow
        shell: bash
        run: |
          git config user.name 'maleicacid'
          git config user.email '4982384+kazuki0824@users.noreply.github.com'
          git add tuner_hal/DESIGN_JA.md
          git rm .github/workflows/pr28-monitor-contract-fix.yml
          git diff --cached --quiet && exit 1
          git commit -m 'design: make monitor capability contract timeless'
          git push origin HEAD:agent/fix-commonization-boundaries
