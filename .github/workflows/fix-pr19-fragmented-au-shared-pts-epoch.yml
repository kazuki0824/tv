name: Fix PR19 fragmented AU and shared PTS epoch

on:
  push:
    branches:
      - agent/fix-tis-arib-design-residuals

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-tis-arib-design-residuals
          fetch-depth: 0
      - shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('tis/DESIGN_JA.md')
          text = p.read_text(encoding='utf-8')

          def replace_regex(pattern: str, replacement: str, label: str) -> None:
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {count}')

          replace_regex(
              r'現行 product の平文 non-tunneled AV入力は、Tuner `MediaEvent\.getLinearBlock\(\)` と `MediaCodec` block model の型付き経路だけを正式経路とする。AOSP Tuner の media filter output は complete ES に限定されず partial ES も許すため、`MediaEvent` 1件を独立したaccess unitと仮定しない。.*?PTS欠落access unit単体を理由にplayback generationを再生不能へ遷移させず、generation全体のunavailable遷移は既存のdecoder error、lock喪失、startup/backpressure deadline等の独立条件だけで判定する。',
              '''現行 product の平文 non-tunneled AV入力は、Tuner `MediaEvent.getLinearBlock()` と `MediaCodec` block model の型付き経路だけを正式経路とする。AOSP Tuner の media filter output は complete ES に限定されず partial ES も許すため、`MediaEvent` 1件を独立したaccess unitと仮定しない。video／audio decoderは `MediaCodec.CONFIGURE_FLAG_USE_BLOCK_MODEL` で構成し、track別のbounded `AccessUnitAssembler` がcodec bitstreamのframe/access-unit境界を確定するまで、到着順の`MediaEvent`／`LinearBlock`／rangeとそのeventに付随するPTS有無を保持する。完成access unitが1つのsource `LinearBlock`上の1つの連続rangeだけで構成される場合は、そのsource block/rangeを`MediaCodec.QueueRequest.setLinearBlock()`へ直接1回だけ渡す。完成access unitが複数`MediaEvent`、複数`LinearBlock`、または非連続rangeに跨る場合は、source fragmentのclaimを保持したままaccess-unit総byte数をchecked arithmeticで算出し、正で`Int.MAX_VALUE`以下かつ同じ`TisPlaybackBudgetSnapshot`の追加reassembly byte予算を原子的にclaimできる場合だけ、`MediaCodec.LinearBlock.obtain(totalAuBytes, arrayOf(selectedCodecName))`相当でTIS所有のmappable blockを確保する。各source rangeの有効payloadだけを到着順にそのblockへ連続copyして**完成access unit 1個**へ再構成し、copy完了後にsource `MediaEvent`／`LinearBlock`／source claimを解放する。再構成blockは`QueueRequest.setLinearBlock(reassemblyBlock, 0, totalAuBytes)`で1回だけqueueし、queue成功または破棄確定までreassembly claimとともに保持する。現行productの正式経路はvideo/audioのいずれについても`MediaCodec.BUFFER_FLAG_PARTIAL_FRAME`または`FEATURE_PartialFrame`を必須能力とせず、decoderのoptional partial-frame capabilityへ再生成立性を依存させない。1つの明示PTSが完成access unitに関連付けられた場合だけ、その90 kHz・33 bit値から算出した1つの`presentationTimeUs`を完成access unitのqueueへ設定する。0、直前access unit、PCR、wallclock、frame rate等からPTSを補間・捏造しない。complete access unitの境界が確定しても明示PTSを関連付けられない場合に限り、その**完成access unit全体**をcodecへ渡さず解放してtrack別`MISSING_PTS_ACCESS_UNIT`診断へ計上する。`isPtsPresent()==false`の`MediaEvent`だけを理由にそのpayload/rangeを単独破棄してはならず、途中fragmentを欠落させない。incomplete access unitは既存のper-track pending byte/count budgetとstartup/backpressure deadlineに従い、上限超過時は当該incomplete unit全体を`INCOMPLETE_ACCESS_UNIT`として破棄するがdeadlineを延長・リセットしない。reassembly用追加claimを確保できない場合もsource fragmentを無制限保持せず、既存deadlineとbounded queue規則に従って`AU_REASSEMBLY_BUDGET_EXCEEDED`へ落とす。PTS欠落access unit単体を理由にplayback generationを再生不能へ遷移させず、generation全体のunavailable遷移は既存のdecoder error、lock喪失、startup/backpressure deadline等の独立条件だけで判定する。''',
              'input contract')

          replace_regex(
              r'`PlaybackPipeline` はplayback generation内のactive compressed trackごとに独立した`PtsNormalizer`を持ち、video／各selected audio等のraw PTS列を相互に比較しない。.*?secure `MediaEvent`は現行平文productの対象外とし、mappable blockへの暗黙変換を行わない。',
              '''`PlaybackPipeline` はplayback generationごとに1個の`PtsEpochCoordinator`と、active compressed trackごとの`PtsNormalizer`を持つ。`PtsNormalizer`の`rawPrev`／`extendedPrev`はtrack別とし、通常のreorderやwrap処理でaudio/videoの直前値を混用しない。一方、MediaSyncへ渡すextended PTSは同一generationの共通media timeline上に置く必要があるため、33-bit wrap epochだけは`PtsEpochCoordinator`が共有する。`M = 2^33`、`H = 2^32`とし、`signedDelta(rawNew, rawRef) = ((rawNew - rawRef + H) mod M) - H`を`[-H, H-1]`の一意な差とする。ちょうど半周期差は`-H`に固定する。generationで最初に受理した明示PTSは、そのtrackのraw値にかかわらず共通extended seed `H`へ置き、coordinatorのreferenceを`(referenceRaw=rawFirst, referenceExtended=H)`とする。まだseedされていないtrackの最初の明示PTS、および同generation内で置換されたtrackの最初の明示PTSは、current coordinator referenceに対して `extendedSeed = referenceExtended + signedDelta(rawNew, referenceRaw)` として現在のwrap epochへjoinする。seed済みtrackの2件目以後はtrack-localに `extendedNew = extendedPrev + signedDelta(rawNew, rawPrev)` とする。各明示PTSを受理した後、serial playback executor上でcoordinator referenceをその`(rawNew, extendedNew)`へ更新し、後からjoinするtrackは常にcurrent generation timeline近傍へliftする。したがってgeneration開始時にvideo=`2^33-100`、audio=`50`なら両者のextended差は150 tick、逆順でも150 tickの絶対差を維持し、独立seedによる約`2^33` tickの乖離を作らない。`2^33-1 -> 0`は+1の通常wrap、`0 -> 2^33-1`は-1のreorderであり、negative deltaを含むpresentation-order reorder自体をdiscontinuityとみなさない。現行productはPTS差分の大きさだけから独自のforward/backward thresholdで「non-wrap discontinuity」を推定しない。新playback generationではcoordinatorと全track normalizerを破棄して新しい共通seedから開始する。filter flush、decoder再生成、track置換では対象trackのlocal normalizerだけを破棄し、generationを維持する場合は次の明示PTSをcurrent coordinatorへjoinさせる。filterをstop/reconfigure/restartした場合の`RestartEvent`は旧configuration eventを捨てるevent-validity境界としてgeneration管理に使うが、任意のin-stream PTS jump検出器としては使わない。通常wrap／reorder／large deltaだけではgenerationを再生成しない。`PtsEpochCoordinator`はmodulo epoch mappingだけを所有し、独自media clock、PCR→wallclock変換、独自future/late schedulerへ拡張しない。reflection、および本書で明示したMediaSync final-output観測用Framework-private `@hide` contract以外のnon-SDK APIを禁止する。ES stream全体を`LinearBlock.map()`から`ByteArray`へ複製して通常input bufferへ入れる経路、通常ByteBuffer input modelへの代替処理は禁止する。ただし、複数fragmentから**完成access unit 1個だけ**をTIS所有`LinearBlock`へ再構成する上記のbounded copyはこの禁止に含めない。direct pathのsource `MediaEvent`／`LinearBlock`／claimはqueue成功または破棄確定まで、reassembly pathのsourceはcopy完了または破棄確定まで、reassembly block／claimはqueue成功または破棄確定まで保持する。secure `MediaEvent`は現行平文productの対象外とし、non-mappable inputをcopy可能と仮定する暗黙変換を行わない。''',
              'pts contract')

          old = 'TIS のライブplaybackは、Tuner AV filterの平文`MediaEvent.LinearBlock`をMediaCodec block modelへcopyなしで投入し、video decoder出力を`MediaSync.createInputSurface()`へ、audio decoder出力PCMを`MediaSync.queueAudio()`へ渡す標準経路だけを採用する。'
          new = 'TIS のライブplaybackは、Tuner AV filterの平文`MediaEvent.LinearBlock`について、完成access unitが単一blockの連続rangeならそのrangeを直接、複数fragmentなら完成AU単位でboundedなTIS所有`LinearBlock`へ再構成してから、いずれもMediaCodec block modelへ投入する。video decoder出力を`MediaSync.createInputSurface()`へ、audio decoder出力PCMを`MediaSync.queueAudio()`へ渡す標準経路だけを採用する。'
          if text.count(old) != 1:
              raise SystemExit(f'live playback sentence: expected 1, got {text.count(old)}')
          text = text.replace(old, new, 1)

          old = 'header解析に必要な最小範囲だけ`LinearBlock.map()`でread-only参照してよいが、ES本体を`ByteArray`へ複製して通常input bufferへ移送してはならない。decoder構成成功後は同じsnapshotのsteady-state上限へ遷移し、startup queueの`MediaEvent`／`LinearBlock`所有権をblock model QueueRequestへ移す。'
          new = 'header解析に必要な最小範囲だけ`LinearBlock.map()`でread-only参照してよいが、ES stream全体を`ByteArray`へ複製して通常input bufferへ移送してはならない。完成AUが複数fragmentに跨る場合に限り、本書「再生経路」のbounded reassembly契約に従ってTIS所有`LinearBlock`へ完成AU 1個分だけcopyしてblock modelへ投入してよい。decoder構成成功後は同じsnapshotのsteady-state上限へ遷移し、direct pathではstartup queueの`MediaEvent`／`LinearBlock`所有権をblock model QueueRequestへ移し、reassembly pathではcopy完了後にsource所有権を返してreassembly blockのclaimをqueue完了まで保持する。'
          if text.count(old) != 1:
              raise SystemExit(f'header copy sentence: expected 1, got {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '各eventはrange検証後、block model投入前に`dataLength`をsnapshot台帳へclaimし、いずれかのevent、byte、sample、duration上限を超える場合は原因別に`SAMPLE_TOO_LARGE`または`PENDING_QUEUE_FULL`を記録してHAL handleを解放する。claim済みbyte、sample、durationはQueueRequest成功、破棄、generation変更、stop、releaseで正確に返す。'
          new = '各eventはrange検証後、block model投入前に`dataLength`をsnapshot台帳へclaimし、いずれかのevent、byte、sample、duration上限を超える場合は原因別に`SAMPLE_TOO_LARGE`または`PENDING_QUEUE_FULL`を記録してHAL handleを解放する。fragmented AUのreassemblyではsource claimを保持したまま`totalAuBytes`分の追加reassembly claimを同じsnapshot台帳へ原子的に予約し、二重保持のpeakもoffline検証済み上限へ含める。copy完了後にsource claimを返し、reassembly claimはQueueRequest成功または破棄まで保持する。claim済みbyte、sample、durationはQueueRequest成功、copy完了、破棄、generation変更、stop、releaseの各ownership境界で正確に返す。'
          if text.count(old) != 1:
              raise SystemExit(f'budget claim sentence: expected 1, got {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '- `MediaEvent` sampleは固定4 MiBを上限にしない。負のoffset、0以下のlength、加算overflow、`offset + length > LinearBlock capacity`は不正入力として確保前に破棄する。正常sampleはES全体をcopyせず、同一製品profileのper-event予算をclaimしてblock model QueueRequestへ渡す。共有領域方式とイベント固有fd方式を同じpending byte予算へ計上する。'
          new = '- `MediaEvent` sampleは固定4 MiBを上限にしない。負のoffset、0以下のlength、加算overflow、`offset + length > LinearBlock capacity`は不正入力として確保前に破棄する。正常sampleは同一製品profileのper-event予算をclaimし、完成AUが単一blockの連続rangeなら直接block model QueueRequestへ渡す。fragmented AUだけは完成AU単位の追加reassembly claimを予約してTIS所有`LinearBlock`へ再構成し、ES stream全体のcopyや通常ByteBuffer input modelへのfallbackは行わない。共有領域方式とイベント固有fd方式を同じpending byte予算へ計上する。'
          if text.count(old) != 1:
              raise SystemExit(f'backpressure bullet: expected 1, got {text.count(old)}')
          text = text.replace(old, new, 1)

          replace_regex(
              r'最低試験契約は、型付きLinearBlock→block model QueueRequest、ES全体copy禁止、\*\*PTSなしのpartial `MediaEvent`を単独dropせず保持して後続fragmentとaccess unitを完成させること、複数fragmentの完成access unitを最後以外`BUFFER_FLAG_PARTIAL_FRAME`でqueueすること、完成access unitに関連付く明示PTSを各fragmentへ同一値で渡すこと、明示PTSが無い場合はevent fragmentではなく完成access unit単位でだけdropすること\*\*、incomplete access unitのbudget超過、track別PtsNormalizer、`2\^33-1 -> 0` wrap、`0 -> 2\^33-1` reorder、半周期差=`-2\^32`、audio/video interleaveでnormalizer stateを共有しないこと、PTS deltaの大小だけではgeneration resetしないこと、flush／track置換後の最初の明示PTSが新seedになること、`MediaEvent`のlong offset／lengthについて負値、0 length、`Int.MAX_VALUE`境界、`Int.MAX_VALUE\+1`、checked-add overflow、`end==capacity`、`end>capacity`をnarrow前に検査すること、',
              '''最低試験契約は、型付きLinearBlock→block model QueueRequest、ES stream全体のByteArray copy／通常input-buffer fallback禁止、**PTSなしのpartial `MediaEvent`を単独dropせず保持して後続fragmentとaccess unitを完成させること、単一block・連続rangeの完成AUはsource LinearBlockを直接queueすること、fragmented audio AUと`FEATURE_PartialFrame`非対応video decoderのfragmented AUはいずれもTIS所有`LinearBlock`へ完成AU単位で再構成して1回queueし`BUFFER_FLAG_PARTIAL_FRAME`へ依存しないこと、reassembly中はsource claimと追加reassembly claimの二重保持peakをbudgetへ計上しcopy完了後だけsourceを解放すること、明示PTSが無い場合はevent fragmentではなく完成access unit単位でだけdropすること**、incomplete access unit／reassembly budget超過、track-local `rawPrev`／`extendedPrev`とgeneration共有`PtsEpochCoordinator`、`2^33-1 -> 0` wrap、`0 -> 2^33-1` reorder、半周期差=`-2^32`、**generation開始時のvideo=`2^33-100`／audio=`50`とその逆順でextended差が±150 tick近傍の同一epochになること、片trackがwrap前・他trackがwrap後に開始すること、track replacementがwrapを跨いでもcurrent coordinatorへjoinすること**、PTS deltaの大小だけではgeneration resetしないこと、新generationだけがcoordinatorをresetしflush／decoder再生成／track置換でgeneration維持時は対象trackだけを再seedしてcurrent epochへjoinすること、`MediaEvent`のlong offset／lengthについて負値、0 length、`Int.MAX_VALUE`境界、`Int.MAX_VALUE+1`、checked-add overflow、`end==capacity`、`end>capacity`をnarrow前に検査すること、''',
              'minimum tests')

          if 'BUFFER_FLAG_PARTIAL_FRAME`でqueue' in text:
              raise SystemExit('unexpected remaining mandatory partial-frame queue contract')
          if 'copyなしで投入' in text:
              raise SystemExit('unexpected old zero-copy-only wording')

          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- tis/DESIGN_JA.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tis/DESIGN_JA.md
          git commit -m 'docs: close fragmented AU and PTS epoch gaps'
          git push origin HEAD:agent/fix-tis-arib-design-residuals
