name: Fix PR19 reassembly ownership wording

on:
  push:
    branches:
      - agent/fix-tis-arib-design-residuals

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-tis-arib-design-residuals
          fetch-depth: 0
      - shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('tis/DESIGN_JA.md')
          text = p.read_text(encoding='utf-8')
          old = '圧縮入力側の`MediaEvent`／input `LinearBlock`は`QueueRequest.queue()`成功時にcodecへ所有権を移管し、PCM消費完了までは保持しない。'
          new = '圧縮入力側は、direct pathではsource `MediaEvent`／input `LinearBlock`を`QueueRequest.queue()`成功時にcodecへ移管し、reassembly pathではsourceを完成AUのcopy完了時に解放してreassembly `LinearBlock`を`QueueRequest.queue()`成功時にcodecへ移管する。いずれも圧縮入力artifactをPCM消費完了までは保持しない。'
          if text.count(old) != 1:
              raise SystemExit(f'expected 1 replacement, got {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tis/DESIGN_JA.md
          git commit -m 'docs: align reassembly ownership wording'
          git push origin HEAD:agent/fix-tis-arib-design-residuals
