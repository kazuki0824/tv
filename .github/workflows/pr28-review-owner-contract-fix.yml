name: PR28 owner contract review fixes
on:
  push:
    branches: [agent/fix-commonization-boundaries]
    paths: [.github/workflows/pr28-review-owner-contract-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-commonization-boundaries
          fetch-depth: 0
      - name: Apply canonical design fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_unique(path, prefix, new):
              p = Path(path)
              lines = p.read_text().splitlines()
              idx = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(idx) != 1:
                  raise SystemExit(f"{path}: {prefix!r}: expected 1 row, got {len(idx)}")
              lines[idx[0]] = new
              p.write_text("\n".join(lines) + "\n")

          public = "tuner_hal/DESIGN_JA.md"
          impl = "tuner_hal2/DESIGN_JA.md"

          replace_unique(public, "| public close / owner loss / Drop |", "| public close / owner loss / Drop | `ObjectCloseTxn` | `begin_close`を単一atomic commitとしてlogical close確定・新規通常操作遮断・`CloseCleanupAuthority`取得を同時に線形化し、そのauthority下でtyped cleanupを実行 | `DropLeakTxn`等の別cleanup authority、API/Drop/Reaperごとのclose state machine、中間的なclosed-without-authority状態 |")
          replace_unique(public, "| `ObjectCloseTxn` |", "| `ObjectCloseTxn` | `tuner_hal2/DESIGN_JA.md` の同名論理契約行 | public `close()`、owner loss/Drop、shutdown/reaper retryはいずれも同じ`begin_close`入口 | `CloseCleanupAuthority`、未完step、cleanup report、retry/reaper handoff、完了確定 | API固有入力、backend内部状態、queue parser内部 | `begin_close` atomic commit（logical close確定 + 新規通常操作遮断 + authority取得） → authority下でtyped cleanup全件試行 → unregister/release → complete/pending | 全stepを試行し、retryableは`CleanupPending`。authority取得後にcaller/ownerが消滅した場合は未完authorityを回収機構へ一度だけ移管し、実状態不明/遮断不能だけquarantine。主障害とcleanup障害を別保持 | object close façade、owner-loss/Drop façade、reaper | AIDL method body、Drop、worker、backendが独自cleanup authorityを持つこと、logical closeとauthority取得の分離commit | close-vs-Drop race、`begin_close` atomicityと中間状態不存在、owner-loss/Drop handoffの一回性、途中失敗後も後続cleanup実行、retry、二重release防止、quarantine |")
          replace_unique(public, "| `PostCommitCallbackFailureTxn` |", "| `PostCommitCallbackFailureTxn` | `tuner_hal2/DESIGN_JA.md` の同名論理契約行 | domain commit済みcompletion use-caseから`WorkerFailureClassifier`で分類済みのtyped callback failureを受け取る | callback health、delivery outcome、診断への写像と確定 | commit済みdomain state、backend state、failure category分類 | verify post-commit → classified typed callback failure受領 → delivery outcome / health / diagnostic commit | failure categoryを再分類せず、domain rollback禁止・public結果維持。分類済みcategoryからcallback health/delivery outcome/診断だけを確定 | Frontend/Filter/DVR等のcompletion use-case | API別rollback handler、文字列/errno再分類、failure categoryの再分類 | Frontend tune、Filter/DVR start、分類済みmissing/store/Binder failureのcategory維持、domain unchanged、classifier二重呼出しなし |")
          replace_unique(public, "| `FilterProducerDrainGate` |", "| `FilterProducerDrainGate` | `tuner_hal2/DESIGN_JA.md` の同名論理契約行 | Filter/SharedFilter producer、`QueueCleanupTxn`からのtyped drain request | `Open`/`Draining`/`Closed`、`filter_delivery_generation`、`parser_state_generation`、`admitted_producer_count`、bounded pending event queue、`FilterProducerPermit(g)` | FMQ内容、DVR token/epoch、flush全体のorchestration | `Open`でadmit/permit発行 → producer commit/finishでpermit解放 → drain開始を`Draining`へ線形化し新規admit拒否 → admitted producerとpending eventを排出 → generation/parser stateを確定して`Open`へ戻す、またはcloseで`Closed` | panic/returnでもpermit解放。drain中は旧generationのproducer/eventを新generationへ確定せず、遮断不能だけFilter fail。`QueueCleanupTxn`はtyped入口の結果だけを集約 | data producer、`QueueCleanupTxn` | Binder callback/IO/joinをpermit内に保持、`QueueCleanupTxn`/API/workerがgate内部stateを直接変更、DVR stateの吸収 | Open/Draining/Closed遷移、flush中の新規permit拒否、全permit/pending event排出、generation/parser更新、panic/drop、commit前失敗時の旧state維持、共通orchestratorからのdrain |")
          replace_unique(public, "| Filter producer drain |", "| Filter producer drain | `FilterProducerDrainGate` | `Open`/`Draining`/`Closed`、`filter_delivery_generation`、`parser_state_generation`、`admitted_producer_count`、bounded pending event queue、`FilterProducerPermit(g)`を同gateの単一正本として管理し、`QueueCleanupTxn`はtyped drain入口だけを使用 | Filter flush全体やDVR queue stateの所有、`QueueCleanupTxn`/API/workerによるgate内部state直接変更 |")
          replace_unique(public, "| AT-005 |", "| AT-005 | public close / owner loss / Drop | `ObjectCloseTxn.begin_close`がlogical close確定・新規通常操作遮断・一回性`CloseCleanupAuthority`取得を単一atomic commitとして線形化し、そのauthority下でtyped cleanup・登録解除・資源回収を実行 | `begin_close` commit時点で公開通常操作を遮断しcleanup authorityを一意に取得。cleanup完了は表5の完了条件を満たしauthorityを消費した時点 | `begin_close`前は状態不変。取得後の未完手順とauthorityは`CleanupPending`または回収機構へ一度だけ移管 | 当該objectと未完依存資源 | 表5と`ObjectCloseTxn`に従う | logical close/通常操作遮断/authority取得を別commitにせず、API/Drop/Reaperが別々のcleanup state machineを持たない |")

          replace_unique(impl, "| `ObjectCloseTxn` |", "| `ObjectCloseTxn` | `service_runtime/src/object_close_txn.rs::ObjectCloseTxn`。`begin_close`がlogical close確定・新規通常操作遮断・`CloseCleanupAuthority`取得を単一atomic commitとして所有し、typed artifact/domain/runtime cleanup command、`CleanupExecutionReport`接続、close finalizationを同typeが所有する | `aidl_service/src/object_runtime/mod.rs`のpublic close、owner-loss/Drop入口、service shutdown/reaper retryはいずれも同じ`begin_close`を使用する。取得済みauthorityの未完分だけを回収機構へ一度移管する | `DropLeakTxn`等の別cleanup authority、logical closeとauthority取得の分離commit、AIDL/Drop/worker/Reaperによるauthority重複、個別objectでのclose state machine複製 |")
          replace_unique(impl, "| `PostCommitCallbackFailureTxn` |", "| `PostCommitCallbackFailureTxn` | `service_runtime/src/post_commit_callback_failure_txn.rs::PostCommitCallbackFailureTxn`。分類済みtyped callback failureからdelivery outcome、callback health、必須診断への写像だけを所有し、failure category分類・commit済みdomain state・worker lifecycle・rollbackは所有しない | domain commitを完了したFrontend/Filter/DVR等のcompletion use-caseが`WorkerFailureClassifier`の分類済みtyped callback failureを一回だけ渡す | failure categoryの再分類、文字列/errno分類、domain commitのrollback、APIごとのcallback health/診断更新再実装 |")
          replace_unique(impl, "| `FilterProducerDrainGate` |", "| `FilterProducerDrainGate` | 既存`demux/src/runtime/queue_runtime.rs`。`Open`/`Draining`/`Closed`、`filter_delivery_generation`、`parser_state_generation`、`admitted_producer_count`、bounded pending event queue、`FilterProducerPermit(g)`の単一正本 | Filter/SharedFilter data pathのtyped producer admission/finishと、`QueueCleanupTxn`からのtyped drain/flush requestだけを入口とする | 公開API、worker、`QueueCleanupTxn`がgate内部状態を直接変更する、permit/drainを飛び越えてFMQ writeまたはpending event追加を確定する、DVR stateを吸収する |")
          replace_unique(impl, "| post-commit callback failure |", "| post-commit callback failure | `PostCommitCallbackFailureTxn`が`WorkerFailureClassifier`で分類済みのtyped callback failureを受け、delivery outcome / callback health / diagnosticへの写像だけを所有する | failure categoryの再分類、commit済みdomain stateのrollback、API別同型handler |")

          for p in (public, impl):
              text = Path(p).read_text()
              if "verify post-commit → classify callback failure" in text:
                  raise SystemExit(f"{p}: stale callback reclassification remains")
              if "permit、admitted count、Draining gate" in text:
                  raise SystemExit(f"{p}: narrowed FilterProducerDrainGate owner remains")
          PY
          rm -f .github/workflows/pr28-review-owner-contract-fix.yml
          git diff --check
          grep -Fq 'begin_close` atomic commit' tuner_hal/DESIGN_JA.md
          grep -Fq 'classified typed callback failure受領' tuner_hal/DESIGN_JA.md
          grep -Fq 'filter_delivery_generation' tuner_hal/DESIGN_JA.md
          grep -Fq 'filter_delivery_generation' tuner_hal2/DESIGN_JA.md
          git config user.name 'maleicacid'
          git config user.email '4982384+kazuki0824@users.noreply.github.com'
          git add tuner_hal/DESIGN_JA.md tuner_hal2/DESIGN_JA.md .github/workflows/pr28-review-owner-contract-fix.yml
          git commit -m 'design: restore complete common owner contracts'
          git push origin HEAD:agent/fix-commonization-boundaries
