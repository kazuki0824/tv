name: PR2 review follow-up runner2 2026-08-02

on:
  push:
    branches:
      - main
    paths:
      - .github/pr2-review-followup-runner2-trigger-20260802.txt

permissions:
  contents: write

jobs:
  patch-pr-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runner files
        uses: actions/checkout@v4
        with:
          ref: main
          path: runner

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/apply-tuner-hal2-design-proposals-v70
          fetch-depth: 0
          path: target

      - name: Apply review fixes
        working-directory: target
        run: python ../runner/.github/pr2-review-followup-patch-20260802.py

      - name: Static checks
        working-directory: target
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          for name in ("tuner_hal/DESIGN_JA.md", "tis/DESIGN_JA.md"):
              text = Path(name).read_text(encoding="utf-8")
              if text.count("```") % 2:
                  raise SystemExit(f"unbalanced code fence: {name}")
          if "pesSupportedStreamIds={0xBD}" in Path("tis/DESIGN_JA.md").read_text(encoding="utf-8"):
              raise SystemExit("residual TIS PES subset")
          PY

      - name: Commit and push
        working-directory: target
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: complete TableInfo across observed extensions"
          git push origin HEAD:agent/apply-tuner-hal2-design-proposals-v70
