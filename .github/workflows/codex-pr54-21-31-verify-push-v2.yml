name: Verify and push PR54 BS scan and audio metadata fixes v2

on:
  push:
    branches: [codex/pr54-apply-20260902]
    paths: [.github/workflows/codex-pr54-21-31-verify-push-v2.yml]

permissions:
  contents: write

env:
  EXPECTED_TARGET_SHA: 9b3ed7440a923ff861b7ff19cf03a0490677b015
  TARGET_BRANCH: agent/implement-tis-arib-si-design-pr53
  RUST_TOOLCHAIN: 1.81.0
  KOTLIN_VERSION: 1.9.22

jobs:
  verify-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: codex/pr54-apply-20260902, path: staging}
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 2
          path: target
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
      - name: Apply guarded changes
        shell: bash
        run: |
          set -euo pipefail
          cd target
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"
          python3 ../staging/codex_apply_pr54_31_fixed2.py
          python3 ../staging/codex_apply_pr54_21.py
          git diff --check
          git status --short
      - name: Validate Rust and schemas
        shell: bash
        run: |
          set -euo pipefail
          cd target
          cargo +"$RUST_TOOLCHAIN" fmt --manifest-path arib_si_engine_rs/host_ci/Cargo.toml -- --check
          cargo +"$RUST_TOOLCHAIN" check --locked --manifest-path arib_si_engine_rs/host_ci/Cargo.toml
          cargo +"$RUST_TOOLCHAIN" test --locked --manifest-path arib_si_engine_rs/host_ci/Cargo.toml
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('arib_si_engine_rs/schema').glob('*.json')): json.loads(path.read_text())
          for path in sorted(Path('arib_si_engine_rs/testdata').rglob('*.json')): json.loads(path.read_text())
          print('JSON parse OK')
          PY
      - name: Prepare Kotlin inputs
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/tis-kotlin-test"; mkdir -p "$tools_dir"
          curl --fail --location --retry 3 --retry-all-errors "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" -o "$tools_dir/kotlin-compiler.zip"
          curl --fail --location --retry 3 --retry-all-errors "https://repo.maven.apache.org/maven2/org/robolectric/android-all/14-robolectric-10818077/android-all-14-robolectric-10818077.jar" -o "$tools_dir/android-all.jar"
          curl --fail --location --retry 3 --retry-all-errors "https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar" -o "$tools_dir/junit.jar"
          curl --fail --location --retry 3 --retry-all-errors "https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar" -o "$tools_dir/hamcrest-core.jar"
          echo "88b39213506532c816ff56348c07bbeefe0c8d18943bffbad11063cf97cac3e6  $tools_dir/kotlin-compiler.zip" | sha256sum -c
          echo "6be2218c6a53fe3c57bc22ebdc723edcb7270a8a6f187545708aa5c0ed813977  $tools_dir/android-all.jar" | sha256sum -c
          unzip -q "$tools_dir/kotlin-compiler.zip" -d "$tools_dir/compiler"
          echo "TIS_KOTLIN_HOME=$tools_dir/compiler/kotlinc" >> "$GITHUB_ENV"
          echo "TIS_ANDROID_ALL_JAR=$tools_dir/android-all.jar" >> "$GITHUB_ENV"
          echo "TIS_JUNIT_JAR=$tools_dir/junit.jar" >> "$GITHUB_ENV"
          echo "TIS_HAMCREST_JAR=$tools_dir/hamcrest-core.jar" >> "$GITHUB_ENV"
      - name: Compile Kotlin and run host tests
        shell: bash
        run: |
          set -euo pipefail
          cd target
          production_dir="$RUNNER_TEMP/tis-kotlin-production"; test_dir="$RUNNER_TEMP/tis-kotlin-tests"; mkdir -p "$production_dir" "$test_dir"
          mapfile -d '' -t production_sources < <(find tis/src tis/host_ci/kotlin/stubs/android -type f -name '*.kt' -print0 | sort -z)
          "$TIS_KOTLIN_HOME/bin/kotlinc" -J-Xmx4g -jvm-target 17 -classpath "$TIS_ANDROID_ALL_JAR" -d "$production_dir" "${production_sources[@]}"
          test_cp="$production_dir:$TIS_ANDROID_ALL_JAR:$TIS_JUNIT_JAR:$TIS_HAMCREST_JAR:$TIS_KOTLIN_HOME/lib/kotlin-test.jar:$TIS_KOTLIN_HOME/lib/kotlin-test-junit.jar"
          mapfile -d '' -t test_sources < <(find tis/tests/src tis/host_ci/kotlin/stubs/androidx -type f -name '*.kt' -print0 | sort -z)
          "$TIS_KOTLIN_HOME/bin/kotlinc" -J-Xmx4g -jvm-target 17 -Xfriend-paths="$production_dir" -classpath "$test_cp" -d "$test_dir" "${test_sources[@]}"
          mapfile -t discovered_classes < <(find "$test_dir" -type f -name '*Test.class' -printf '%P\n' | sed 's#/#.#g; s#\.class$##' | sort)
          test_classes=(); for c in "${discovered_classes[@]}"; do case "$c" in com.maleicacid.tvinput.tis.DirectBootGuardR51FixTest|com.maleicacid.tvinput.tis.ProviderDataAssetsR51ContractTest|com.maleicacid.tvinput.tis.RecordingDisabledR51Test|com.maleicacid.tvinput.tis.TvProviderWriterDescriptorSchemaTest) ;; *) test_classes+=("$c");; esac; done
          test "${#discovered_classes[@]}" -eq 30; test "${#test_classes[@]}" -eq 26
          runtime_cp="$production_dir:$test_dir:$TIS_ANDROID_ALL_JAR:$TIS_JUNIT_JAR:$TIS_HAMCREST_JAR:$TIS_KOTLIN_HOME/lib/kotlin-stdlib.jar:$TIS_KOTLIN_HOME/lib/kotlin-stdlib-jdk7.jar:$TIS_KOTLIN_HOME/lib/kotlin-stdlib-jdk8.jar:$TIS_KOTLIN_HOME/lib/kotlin-test.jar:$TIS_KOTLIN_HOME/lib/kotlin-test-junit.jar"
          java -Xmx4g -Djava.library.path=arib_si_engine_rs/host_ci/target/debug/deps -cp "$runtime_cp" org.junit.runner.JUnitCore "${test_classes[@]}" | tee "$RUNNER_TEMP/tis-junit.log"
          grep -F "OK (131 tests)" "$RUNNER_TEMP/tis-junit.log"
      - name: Validate XML and document scope
        shell: bash
        run: |
          set -euo pipefail
          cd target
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          paths=sorted(Path('tis').rglob('*.xml')); assert paths
          for p in paths: ElementTree.parse(p)
          doc=Path('ARIB_SI_EPG_TvProvider投影方針.md').read_text()
          for x in ('TvTrackInfo.Builder','setAudioSampleRate(','setHardOfHearing(','Tuner.scan(','onInputStreamIdsReported'): assert x not in doc, x
          PY
          git diff --check
      - name: Commit and push verified changes
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name maleicacid
          git config user.email 4982384+kazuki0824@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(tis): align BS discovery and ARIB audio metadata'
          git push origin HEAD:"$TARGET_BRANCH"
