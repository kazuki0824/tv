name: Polish PR19 AU boundary wording

on:
  push:
    paths:
      - '.github/workflows/fix-pr19-au-boundary-pts-correlation.yml'

permissions:
  contents: write

jobs:
  polish-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-tis-arib-design-residuals
          fetch-depth: 0
      - name: Polish design text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tis/DESIGN_JA.md')
          s = p.read_text()
          old = 'range境界や`isPtsPresent()`の変化だけでAUを閉じてはならない。`AccessUnitAssembler` のcodec別境界は次で固定する。'
          new = 'range境界や`isPtsPresent()`の変化だけでAUを閉じてはならない。\n\n`AccessUnitAssembler` のcodec別境界は次で固定する。'
          if old not in s:
              raise SystemExit('paragraph boundary not found')
          s = s.replace(old, new, 1)
          s = s.replace('QueueRequest、**MediaEvent／LinearBlock／range境界', 'QueueRequest、MediaEvent／LinearBlock／range境界', 1)
          s = s.replace('後続fragmentのanchorで既開始AUのPTSを書き換えないこと、**ES stream全体', '後続fragmentのanchorで既開始AUのPTSを書き換えないこと、ES stream全体', 1)
          p.write_text(s)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tis/DESIGN_JA.md
          git commit -m 'docs: polish AU boundary and PTS tests'
          git push origin HEAD:agent/fix-tis-arib-design-residuals
