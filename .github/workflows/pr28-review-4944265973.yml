name: pr28-review-4944265973

on:
  push:
    branches:
      - agent/fix-commonization-boundaries
    paths:
      - .github/workflows/pr28-review-4944265973.yml

permissions:
  contents: write

jobs:
  patch-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-commonization-boundaries
          fetch-depth: 0
      - name: Apply and validate patch
        run: |
          python3 .github/pr28_review_4944265973.py
          git diff --check
      - name: Commit design fix and remove temporary helpers
        run: |
          rm .github/pr28_review_4944265973.py
          rm .github/workflows/pr28-review-4944265973.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tuner_hal/DESIGN_JA.md .github/pr28_review_4944265973.py .github/workflows/pr28-review-4944265973.yml
          git diff --cached --check
          git commit -m 'design: resolve remaining SSOT review findings [skip ci]'
          git push origin HEAD:agent/fix-commonization-boundaries
