name: Temporary PR24 record stop review fix

on:
  push:
    branches:
      - agent/fix-dvr-stop-parser-residual

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-dvr-stop-parser-residual
      - name: Apply Record DVR stop contract fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tuner_hal/DESIGN_JA.md')
          s = p.read_text()
          old = "| DVR-012 | `stop()` record | D2 | 成功 | D3 | 録画作業スレッドを停止 | `dvr_stop_success` | record開始済みを停止済みにする |"
          new = "| DVR-012 | `stop()` record | D2 | 成功 | D3 | record productionを停止し、Record DVR FMQへ確定済みの未消費データとqueue identityを維持する。`stop()`をrecord-input continuity boundaryとして、停止区間を跨げないparser / index / assembler等のRecord-path partial stateを破棄する | `dvr_stop_success` | client-visible queued dataは`stop()`で破棄せず、未消費Record DVR FMQの破棄は`flush()`だけが行う |"
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tuner_hal/DESIGN_JA.md
          git rm .github/workflows/tmp-address-pr24-record-stop-review.yml
          git commit -m "design: define record stop continuity boundary"
          git push origin HEAD:agent/fix-dvr-stop-parser-residual
