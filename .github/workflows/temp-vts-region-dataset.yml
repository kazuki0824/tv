name: temporary VTS region dataset generation
on:
  push:
    branches: [fix/tuner-hal2-vts-auto-region]
    paths:
      - "tuner_hal2/tools/update_vts_region_dataset.py"
      - ".github/workflows/temp-vts-region-dataset.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate versioned region dataset
        run: |
          python tuner_hal2/tools/update_vts_region_dataset.py \
            --output tuner_hal2/config/vts_channel_plan.japan.json \
            --dataset-version 2026-09-02-ina4n-snapshot
      - name: Validate generated dataset shape
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('tuner_hal2/config/vts_channel_plan.japan.json')
          d=json.loads(p.read_text())
          assert d['schema_version'] == 2
          assert len(d['prefectures']) == 47
          assert all(v['prefecture_channels'] for v in d['prefectures'].values())
          assert all(
              13 <= channel <= 52
              for v in d['prefectures'].values()
              for channel in v['prefecture_channels']
          )
          assert d['prefectures']['大阪府']['areas']['大阪市'] == [13, 14, 15, 16, 17, 18, 24]
          print(sum(len(v['areas']) for v in d['prefectures'].values()), 'area keys')
          PY
      - name: Run region/default unit tests
        working-directory: tuner_hal2/tools
        run: |
          python -m unittest test_vts_region_defaults.py
          python -m unittest \
            test_vts_profile.VtsProfileTest.test_region_resolution_and_selection_update_same_profile \
            test_vts_profile.VtsProfileTest.test_noninteractive_init_requires_explicit_inputs \
            test_vts_profile.VtsProfileTest.test_resource_closure_uses_production_rust_ssot
      - name: Commit snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tuner_hal2/config/vts_channel_plan.japan.json
          git diff --cached --quiet && exit 0
          git commit -m "data: add versioned Japan ISDB-T region snapshot"
          git push
