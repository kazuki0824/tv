name: tmp rebase55 20260901

on:
  push:
    branches:
      - tmp/rebase55-control-20260901
    paths:
      - .github/workflows/tmp-rebase55-20260901.yml

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect semantic merge hunks for PR55
        shell: bash
        run: |
          set -euo pipefail
          git config core.quotePath false
          BASE=03b64958244e398a67cb4dc66f79938d17645d38
          OLD_BASE=a7d5976e6e371ab45f39fd0ceacc8c6550a95fe9
          OLD_HEAD=81fa1e66c317b7b0258383b7d09bf67634ac092c
          git fetch origin "$BASE" "$OLD_BASE" "$OLD_HEAD"
          for f in 'tuner_hal/DESIGN_JA.md' '開発規則.md'; do
            rm -rf /tmp/m55 && mkdir -p /tmp/m55
            git show "$BASE:$f" > /tmp/m55/ours
            git show "$OLD_BASE:$f" > /tmp/m55/base
            git show "$OLD_HEAD:$f" > /tmp/m55/theirs
            set +e
            git merge-file -p /tmp/m55/ours /tmp/m55/base /tmp/m55/theirs > /tmp/m55/merged
            rc=$?
            set -e
            echo "===== $f merge_rc=$rc ====="
            grep -n -B20 -A100 '^<<<<<<<\|^=======\|^>>>>>>>' /tmp/m55/merged || true
          done
