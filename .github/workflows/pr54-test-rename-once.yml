name: PR54静的eligibilityテスト名同期

on:
  push:
    branches:
      - agent/implement-tis-arib-si-design-pr53
    paths:
      - .github/workflows/pr54-test-rename-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/implement-tis-arib-si-design-pr53
          persist-credentials: true
          fetch-depth: 0
      - name: テストを静的eligibility契約へ同期
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path('tis/tests/src/com/maleicacid/tvinput/aribsi/NativeAribSiParserCasDiscoveryTest.kt'),
              Path('tis/tests/src/com/maleicacid/tvinput/tis/TisR51FixedPlanAcceptanceTest.kt'),
          ]
          for path in paths:
              text = path.read_text()
              text = text.replace('clearLivePlaybackSupportedServices', 'clearLivePlaybackStaticallyEligibleServices')
              text = text.replace('clearLivePlaybackSupported', 'clearLivePlaybackStaticallyEligible')
              path.write_text(text)
          PY
          ! grep -R 'clearLivePlaybackSupported' \
            tis/tests/src/com/maleicacid/tvinput/aribsi/NativeAribSiParserCasDiscoveryTest.kt \
            tis/tests/src/com/maleicacid/tvinput/tis/TisR51FixedPlanAcceptanceTest.kt
          git diff --check
      - name: テスト修正をpush
        run: |
          git add tis/tests/src/com/maleicacid/tvinput/aribsi/NativeAribSiParserCasDiscoveryTest.kt
          git add tis/tests/src/com/maleicacid/tvinput/tis/TisR51FixedPlanAcceptanceTest.kt
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git commit -m 'test(tis): 静的playback eligibility名へ同期'
          git push origin HEAD:agent/implement-tis-arib-si-design-pr53
      - name: 一時workflowを削除
        run: |
          git rm .github/workflows/pr54-test-rename-once.yml
          git commit -m 'chore(ci): PR54一時テスト同期workflowを削除'
          git push origin HEAD:agent/implement-tis-arib-si-design-pr53
