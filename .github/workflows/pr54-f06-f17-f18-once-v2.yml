name: PR54 F06 F17 F18 one-shot fix v2

on:
  push:
    branches:
      - agent/implement-tis-arib-si-design-pr53

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/implement-tis-arib-si-design-pr53
          fetch-depth: 0

      - name: Apply targeted large-file edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # F17: JNI/resource所有クラスからテスト専用APIと純粋policy実装を分離する。
          p = Path('tis/src/com/maleicacid/tvinput/aribsi/NativeAribSiParser.kt')
          s = p.read_text()
          old = 'val componentsByService = services.associate { it.serviceKey to componentsForService(it) }'
          new = 'val componentsByService = services.associate { it.serviceKey to AribComponentProjectionPolicy.componentsForService(it) }'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = 'else mergeEventAndServiceComponents(event.descriptors.components, serviceComponents)'
          new = 'else AribComponentProjectionPolicy.mergeEventAndServiceComponents(event.descriptors.components, serviceComponents)'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          marker = '    companion object {\n'
          start = s.index(marker)
          s = s[:start] + '''    companion object {
              init {
                  System.loadLibrary("maleicacid_arib_si_engine_jni")
              }
          }
          }
          '''
          p.write_text(s)

          p = Path('tis/tests/src/com/maleicacid/tvinput/tis/TisR51FixedPlanAcceptanceTest.kt')
          s = p.read_text()
          if 'import com.maleicacid.tvinput.aribsi.AribComponentProjectionPolicy\n' not in s:
              s = s.replace(
                  'import com.maleicacid.tvinput.aribsi.NativeAribSiParser\n',
                  'import com.maleicacid.tvinput.aribsi.AribComponentProjectionPolicy\nimport com.maleicacid.tvinput.aribsi.NativeAribSiParser\n',
                  1,
              )
          replacements = {
              'NativeAribSiParser.isRecognizedVideoCodecForTest': 'AribComponentProjectionPolicy.isRecognizedVideoCodec',
              'NativeAribSiParser.isR51PlaybackSupportedVideoCodecForTest': 'AribComponentProjectionPolicy.isR51PlaybackSupportedVideoCodec',
              'NativeAribSiParser.isRecognizedAudioCodecForTest': 'AribComponentProjectionPolicy.isRecognizedAudioCodec',
              'NativeAribSiParser.isR51PlaybackSupportedAudioCodecForTest': 'AribComponentProjectionPolicy.isR51PlaybackSupportedAudioCodec',
              'NativeAribSiParser.toComponentsObjectForServiceForTest': 'AribComponentProjectionPolicy.toComponentsObjectForService',
              'NativeAribSiParser.mergeEventAndServiceComponentsForTest': 'AribComponentProjectionPolicy.mergeEventAndServiceComponents',
              'NativeAribSiParser.componentsForServiceForTest': 'AribComponentProjectionPolicy.componentsForService',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)

          # F18: section追跡は維持し、BS/110CSのEIT[p/f] actual section 2以降だけProgram publish入力から除外する。
          p = Path('arib_si_engine_rs/src/core/service_discovery.rs')
          s = p.read_text()
          anchor = 'use crate::eit::{EitEvent, EitStore, EitUpdateWindow};\n'
          assert s.count(anchor) == 1
          s = s.replace(anchor, anchor + 'use crate::eit_publish_policy::is_program_publish_eit_section;\n', 1)
          old = '        self.engine.push_section(pid, section);\n'
          assert s.count(old) == 1
          s = s.replace(old, '''        if is_program_publish_eit_section(self.discovery_profile, pid, section) {
              self.engine.push_section(pid, section);
          }
          ''', 1)
          p.write_text(s)

          # F06: 衛星SI初期graphic set、JIS X 0213 multi-scalar、XCS代替文字列selectionを閉じる。
          p = Path('arib_si_engine_rs/src/core/arib_string.rs')
          s = p.read_text()
          include_anchor = 'include!("arib_extended_graphic_table.rs");\n'
          assert s.count(include_anchor) == 1
          s = s.replace(include_anchor, include_anchor + 'include!("arib_jis_x0213_multiscalar.rs");\n', 1)
          s = s.replace(
              '// ARIB STD-B24 の SI/EPG 初期呼出し状態: G0 は漢字、G1 は英数字、\n        // G2 はひらがな、G3 はカタカナ、GL は LS0(G0)、GR は LS2R(G2)。',
              '// ARIB TR-B15の衛星SI運用profileに合わせ、G0/GLはJIS互換漢字Plane 1を正本とする。\n        // G1は英数字、G2はひらがな、G3はカタカナ、GRはLS2R(G2)。',
              1,
          )
          assert s.count('            g0: GraphicSet::Kanji,') == 1
          assert s.count('            gl: GraphicSet::Kanji,') == 1
          s = s.replace('            g0: GraphicSet::Kanji,', '            g0: GraphicSet::JisPlane1,', 1)
          s = s.replace('            gl: GraphicSet::Kanji,', '            gl: GraphicSet::JisPlane1,', 1)

          insert_before = '#[derive(Default)]\npub(crate) struct AribStringDecoder'
          assert s.count(insert_before) == 1
          helpers = r'''
          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          enum XcsMarker {
              Start,
              End,
          }

          fn csi_xcs_marker(bytes: &[u8]) -> Result<(usize, Option<XcsMarker>), AribStringDecodeError> {
              let consumed = consume_csi(bytes)?;
              let marker = if consumed == 4 && bytes.get(2) == Some(&0x20) && bytes.get(3) == Some(&b'f') {
                  match bytes.get(1) {
                      Some(b'0') => Some(XcsMarker::Start),
                      Some(b'1') => Some(XcsMarker::End),
                      _ => None,
                  }
              } else {
                  None
              };
              Ok((consumed, marker))
          }

          fn consume_xcs_block(bytes: &[u8]) -> Result<Option<(usize, usize, usize)>, AribStringDecodeError> {
              let (start_len, marker) = csi_xcs_marker(bytes)?;
              if marker != Some(XcsMarker::Start) {
                  return Ok(None);
              }
              let mut cursor = start_len;
              while cursor < bytes.len() {
                  if bytes[cursor] != 0x9b {
                      cursor += 1;
                      continue;
                  }
                  let (consumed, nested_marker) = csi_xcs_marker(&bytes[cursor..])?;
                  match nested_marker {
                      Some(XcsMarker::End) => return Ok(Some((start_len, cursor, cursor + consumed))),
                      Some(XcsMarker::Start) => return Err(AribStringDecodeError::MalformedCsi),
                      None => cursor += consumed,
                  }
              }
              Err(AribStringDecodeError::MalformedCsi)
          }

          '''
          s = s.replace(insert_before, helpers + insert_before, 1)

          loop_anchor = '    let mut index = 0usize;\n    while index < bytes.len() {\n        let byte = bytes[index];'
          assert s.count(loop_anchor) == 1
          s = s.replace(loop_anchor, '''    let mut index = 0usize;
              let mut pending_xcs_at: Option<usize> = None;
              while index < bytes.len() {
                  if pending_xcs_at.is_some() && pending_xcs_at != Some(index) {
                      pending_xcs_at = None;
                  }
                  let byte = bytes[index];''', 1)

          ss_start = s.index('            0x19 | 0x1d => {')
          ss_end = s.index('            0x1b =>', ss_start)
          ss = s[ss_start:ss_end]
          ss_old = '                        out.push_str(&value);\n                        index += consumed;'
          assert ss.count(ss_old) == 1
          ss = ss.replace(
              ss_old,
              '                        out.push_str(&value);\n                        pending_xcs_at = (value == "�").then_some(index + consumed + 1);\n                        index += consumed;',
              1,
          )
          s = s[:ss_start] + ss + s[ss_end:]

          csi_start = s.index('            0x9b => match consume_csi(&bytes[index..]) {')
          csi_end = s.index('            0x21..=0x7e if', csi_start)
          csi = r'''            0x9b => match consume_xcs_block(&bytes[index..]) {
                      Ok(Some((content_start, content_end, consumed))) => {
                          if pending_xcs_at == Some(index) {
                              if out.ends_with('�') {
                                  out.pop();
                              }
                              let mut fallback_state = *state;
                              let (fallback, fallback_diagnostic) = decode_arib_string_with_policy(
                                  &bytes[index + content_start..index + content_end],
                                  &mut fallback_state,
                                  error_policy,
                              )?;
                              *state = fallback_state;
                              out.push_str(&fallback);
                              diagnostic.replacement_count = diagnostic
                                  .replacement_count
                                  .saturating_add(fallback_diagnostic.replacement_count);
                              diagnostic.unsupported_escape_count = diagnostic
                                  .unsupported_escape_count
                                  .saturating_add(fallback_diagnostic.unsupported_escape_count);
                              diagnostic.truncated_escape_count = diagnostic
                                  .truncated_escape_count
                                  .saturating_add(fallback_diagnostic.truncated_escape_count);
                              diagnostic.truncated_graphic_count = diagnostic
                                  .truncated_graphic_count
                                  .saturating_add(fallback_diagnostic.truncated_graphic_count);
                              diagnostic.entries.extend(fallback_diagnostic.entries);
                          }
                          pending_xcs_at = None;
                          index += consumed.saturating_sub(1);
                      }
                      Ok(None) => match consume_csi(&bytes[index..]) {
                          Ok(consumed) => {
                              pending_xcs_at = None;
                              index += consumed.saturating_sub(1);
                          }
                          Err(error) => {
                              if error_policy == ErrorPolicy::Strict {
                                  return Err(error);
                              }
                              diagnostic.replacement_count = diagnostic.replacement_count.saturating_add(1);
                              diagnostic.record_entry(bytes, index, "CSI/XCS", "malformed_or_truncated_csi", true);
                              out.push('�');
                              break;
                          }
                      },
                      Err(error) => {
                          if error_policy == ErrorPolicy::Strict {
                              return Err(error);
                          }
                          diagnostic.replacement_count = diagnostic.replacement_count.saturating_add(1);
                          diagnostic.record_entry(bytes, index, "CSI/XCS", "malformed_or_truncated_csi", true);
                          out.push('�');
                          break;
                      }
                  },
          '''
          s = s[:csi_start] + csi + s[csi_end:]

          gl_old = '                        out.push_str(map_two_byte_graphic(state.gl, byte, next));\n                        index += 1;'
          assert s.count(gl_old) == 1
          s = s.replace(
              gl_old,
              '                        let mapped = map_two_byte_graphic(state.gl, byte, next);\n                        out.push_str(mapped);\n                        pending_xcs_at = (mapped == "�").then_some(index + 2);\n                        index += 1;',
              1,
          )
          gr_old = '                            out.push_str(map_two_byte_graphic(state.gr, normalized, next & 0x7f));\n                            index += 1;'
          assert s.count(gr_old) == 1
          s = s.replace(
              gr_old,
              '                            let mapped = map_two_byte_graphic(state.gr, normalized, next & 0x7f);\n                            out.push_str(mapped);\n                            pending_xcs_at = (mapped == "�").then_some(index + 2);\n                            index += 1;',
              1,
          )

          mapping_old = '''        GraphicSet::Kanji => map_kanji(first, second),
                  GraphicSet::JisPlane1 => map_jis_x0213_plane1(first, second),
                  GraphicSet::JisPlane2 => map_jis_x0213_plane2(first, second),
                  GraphicSet::AdditionalSymbols => map_arib_additional_symbol(first, second),'''
          assert s.count(mapping_old) == 1
          s = s.replace(mapping_old, '''        GraphicSet::Kanji => map_kanji(first, second),
                  GraphicSet::JisPlane1 => map_jis_x0213_plane1_multiscalar(first, second)
                      .unwrap_or_else(|| map_jis_x0213_plane1(first, second)),
                  GraphicSet::JisPlane2 => map_jis_x0213_plane2_multiscalar(first, second)
                      .unwrap_or_else(|| map_jis_x0213_plane2(first, second)),
                  GraphicSet::AdditionalSymbols => map_arib_additional_symbol(first, second),''', 1)

          tests = r'''

              #[test]
              fn initial_si_graphic_set_is_jis_x0213_plane1_and_preserves_multiscalar() {
                  assert_eq!(decode_arib_string(&[0x24, 0x77]), Ok("か゚".to_string()));
              }

              #[test]
              fn designated_jis_x0213_plane2_decodes_non_bmp_scalar() {
                  let bytes = [0x1b, b'$', b'(', b':', 0x21, 0x21];
                  assert_eq!(decode_arib_string(&bytes), Ok("𠂉".to_string()));
              }

              #[test]
              fn xcs_selects_alternative_only_for_unrenderable_source_graphic() {
                  let unsupported_with_fallback = [
                      0x24, 0x7c,
                      0x9b, b'0', 0x20, b'f',
                      0x19, 0x22,
                      0x9b, b'1', 0x20, b'f',
                  ];
                  assert_eq!(decode_arib_string(&unsupported_with_fallback), Ok("あ".to_string()));

                  let supported_with_fallback = [
                      0x24, 0x22,
                      0x9b, b'0', 0x20, b'f',
                      0x19, 0x24,
                      0x9b, b'1', 0x20, b'f',
                  ];
                  assert_eq!(decode_arib_string(&supported_with_fallback), Ok("あ".to_string()));
              }
          '''
          close = s.rfind('\n}')
          assert close > 0
          s = s[:close] + tests + s[close:]
          p.write_text(s)
          PY

      - name: Install Rust 1.81 rustfmt
        run: rustup toolchain install 1.81.0 --profile minimal --component rustfmt

      - name: Format Rust changes
        run: |
          rustfmt +1.81.0 \
            arib_si_engine_rs/src/core/arib_string.rs \
            arib_si_engine_rs/src/core/service_discovery.rs \
            arib_si_engine_rs/src/core/eit_publish_policy.rs \
            arib_si_engine_rs/src/core/arib_jis_x0213_multiscalar.rs

      - name: Validate focused fixes
        run: |
          cargo +1.81.0 check --manifest-path arib_si_engine_rs/host_ci/core/Cargo.toml --locked
          cargo +1.81.0 test --manifest-path arib_si_engine_rs/host_ci/core/Cargo.toml --locked initial_si_graphic_set_is_jis_x0213_plane1_and_preserves_multiscalar
          cargo +1.81.0 test --manifest-path arib_si_engine_rs/host_ci/core/Cargo.toml --locked designated_jis_x0213_plane2_decodes_non_bmp_scalar
          cargo +1.81.0 test --manifest-path arib_si_engine_rs/host_ci/core/Cargo.toml --locked xcs_selects_alternative_only_for_unrenderable_source_graphic
          cargo +1.81.0 test --manifest-path arib_si_engine_rs/host_ci/core/Cargo.toml --locked satellite_pf_actual_allows_only_sections_zero_and_one
          ! grep -q 'ForTest' tis/src/com/maleicacid/tvinput/aribsi/NativeAribSiParser.kt
          ! grep -q 'NativeAribSiParser.*ForTest' tis/tests/src/com/maleicacid/tvinput/tis/TisR51FixedPlanAcceptanceTest.kt
          grep -q 'AribComponentProjectionPolicy' tis/src/com/maleicacid/tvinput/aribsi/NativeAribSiParser.kt
          git diff --check

      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            tis/src/com/maleicacid/tvinput/aribsi/NativeAribSiParser.kt \
            tis/tests/src/com/maleicacid/tvinput/tis/TisR51FixedPlanAcceptanceTest.kt \
            arib_si_engine_rs/src/core/arib_string.rs \
            arib_si_engine_rs/src/core/service_discovery.rs
          git commit -m 'fix(pr54): close F06 F17 F18 review findings'
          git push origin HEAD:agent/implement-tis-arib-si-design-pr53
