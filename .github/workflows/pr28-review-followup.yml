name: PR28 review followup

on:
  push:
    branches:
      - agent/fix-commonization-boundaries
    paths:
      - .github/workflows/pr28-review-followup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-commonization-boundaries
          fetch-depth: 0
      - name: Apply design review fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, got {n}')
              return text.replace(old, new, 1)

          def replace_row(text: str, prefix: str, new_row: str, label: str) -> str:
              lines = text.splitlines()
              idx = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(idx) != 1:
                  raise SystemExit(f'{label}: expected 1 row, got {len(idx)}')
              lines[idx[0]] = new_row
              return '\n'.join(lines) + ('\n' if text.endswith('\n') else '')

          # --- tuner_hal/DESIGN_JA.md ---
          p = Path('tuner_hal/DESIGN_JA.md')
          t = p.read_text(encoding='utf-8')

          t = replace_once(
              t,
              '| LNB persistent control | `LnbControlTxn` | `setVoltage()` / `setTone()` / `setSatellitePosition()`のlock、backend apply、registry commit、失敗状態を共通化 | `sendDiseqcMessage()`をpersistent state transactionへ吸収すること、3 APIで同型state machineを複製すること |',
              '| Frontend / LNB assignment relation | `FrontendLnbRelationTxn` | `IFrontend.setLnb()`とFrontend close時のassignment releaseを同ownerへ接続 | frontend object method use-caseとLNB lease/registry ownerがrelationとlease参照を別commitすること、`LnbControlTxn`へassignment ownershipを吸収すること |\n| LNB persistent control | `LnbControlTxn` | `setVoltage()` / `setTone()` / `setSatellitePosition()`のlock、backend apply、registry commit、失敗状態を共通化 | `sendDiseqcMessage()`をpersistent state transactionへ吸収すること、3 APIで同型state machineを複製すること |',
              '0-S-3A frontend-lnb owner',
          )

          lnb_control_row = next(line for line in t.splitlines() if line.startswith('| `LnbControlTxn` |'))
          frontend_lnb_row = '| `FrontendLnbRelationTxn` | `tuner_hal2/DESIGN_JA.md` の同名論理契約行 | `IFrontend.setLnb()` use-case、Frontend close時は`ObjectCloseTxn`からのtyped assignment release | frontend→LNB assignment relation、prepared assignment lease-reference mutation、transaction authority、旧assignment cleanup record | LNB endpoint lease pool内部、共有railの物理状態、`LnbControlTxn`のpersistent control state、`ILnb` object lifecycle | frontendとLNB endpointのlive/owner/generation/type/connectability・shared rail互換性を同一snapshotでvalidate → LNB resource ownerからassignment lease-reference mutationをprepare → relation prepare → composite commit（新relation + 新lease参照 + 旧relation logical detach） → 旧assignment lease参照cleanup | commit前失敗はprepared relation/lease mutationをabortして旧relation/旧lease参照を維持。commit結果不明時だけ当該frontend assignmentと関係claimをquarantine。commit後の旧lease cleanup失敗では新relationをrollbackせず旧lease cleanupだけをretry/quarantineへ接続。Frontend closeは同ownerのtyped releaseでassignmentを解放 | frontend object-method use-case、`ObjectCloseTxn` typed cleanup command、LNB resource ownerのprepared lease入口 | AIDL wrapper/frontend use-case/LNB registryによるrelation・leaseの別commit、`LnbControlTxn`への吸収、LNB lease pool内部の直接変更 | 初回assignment、同一assignment再設定、別LNBへの更新、non-satellite/wrong owner/stale generation/incompatible rail/capacity、prepare/commit fault、post-commit旧lease cleanup failureで新assignment維持、Frontend closeでassignment release |'
          t = replace_once(t, lnb_control_row, frontend_lnb_row + '\n' + lnb_control_row, '0-S-3B frontend-lnb row')

          table7_intro_old = '本表は、複数の所有者または外部副作用をまたぐ操作について、個別状態表に重複記載しない確定点の所在を固定する索引である。単一object内で完結する戻り値と状態遷移は表1、表2、表4、表5、表D-1を正とし、本表へ複製しない。成功を返すには、索引先で定めた確定点までの変更が全て完了していなければならない。確定点前の失敗、巻き戻し不能時の対象、閉鎖側失敗は索引先の規則に従う。'
          table7_intro_new = '本表は、複数の所有者または外部副作用をまたぐ操作について、API固有の公開対象・公開結果・必要な順序と、その論理契約の索引先を固定する。単一object内で完結する戻り値と状態遷移は表1、表2、表4、表5、表D-1を正とし、本表へ複製しない。0-S-3Bに同名transactionがある操作では、transaction内部のphase、commit、rollback / cleanup、failure semanticsを本表で再定義せず0-S-3Bを正とする。'
          t = replace_once(t, table7_intro_old, table7_intro_new, 'table7 intro')

          rows = {
              '| AT-003 |': '| AT-003 | `IDemux.setFrontendDataSource()` | APIとしてfrontend source assignment変更と必要なstream boundary変更を同一要求として扱う。transaction内部phaseは0-S-3Bの`DemuxFrontendSourceTxn` / `StreamBoundaryTxn`参照 | 公開成功条件と内部確定点は0-S-3B参照 | rollback / cleanup / commit不明時処理は0-S-3B参照 | 0-S-3B参照 | API別状態・Result写像と0-S-3Bに従う | API成功時に要求したsource assignmentが成立していることだけを本索引で要求し、内部transaction semanticsを複製しない |',
              '| AT-004 |': '| AT-004 | Filter / DVR configure・start・flush | configure/startの公開意味と順序は各API状態表、`flush()`の共通cleanup ownerは0-S-3Bの`QueueCleanupTxn`参照 | 各APIの公開成功条件は表1・表2・表6-A、共通cleanupの内部確定点は0-S-3B参照 | transaction内部のrollback / failure semanticsは各API表と0-S-3B参照 | 各API owner / 0-S-3B参照 | 表1、表2、表6-A、0-S-3Bに従う | API別公開契約を維持し、flushの共通orchestrationや下位state machineを本索引で再定義しない |',
              '| AT-005 |': '| AT-005 | public close / owner loss / Drop | 公開closeの意味・対象順序は表5を正とし、cleanup authority内部phaseは0-S-3Bの`ObjectCloseTxn`参照 | 公開close完了条件は表5、内部確定点は0-S-3B参照 | rollback / `CleanupPending` / handoff semanticsは0-S-3B参照 | 0-S-3B参照 | 表5と`ObjectCloseTxn`に従う | API/Drop/Reaper別のclose state machineを本索引で再定義しない |',
              '| AT-006 |': '| AT-006 | callback登録 | set / replace / NULL解除の公開意味・戻り値はcallback各API契約を正とし、artifact/runtime/domainの内部登録transactionは0-S-3Bの`CallbackRegistrationUseCase`参照 | 公開registration成功条件はcallback契約、内部composite commit点は0-S-3B参照 | rollback / old-artifact cleanup / delivery failure semanticsは0-S-3B参照 | 0-S-3B参照 | callback各API契約と0-S-3Bに従う | AIDL façadeとservice_runtimeの内部phaseを本索引で再定義しない |',
              '| AT-009 |': '| AT-009 | `IFilter.setDataSource()` | NULLはdemux input復帰、non-NULLは指定Filter source assignmentという公開意味を表1-D / 表18-Bで固定し、内部relation transactionは0-S-3Bの`SourceBoundaryTxn`参照 | 公開成功条件は表1-D / 表18-B、内部確定点は0-S-3B参照 | rollback / quarantine semanticsは0-S-3B参照 | 0-S-3B参照 | 表1-D、表18-B、`SourceBoundaryTxn`に従う | source relation内部state machineを本索引で再定義しない |',
              '| AT-010 |': '| AT-010 | `IDescrambler.setKeyToken()` / `addPid()` / `removePid()` | key/PIDの公開入力分類・戻り値はtoken/PID状態表を正とし、内部mutationは0-S-3Bの`DescramblerKeyTxn` / `DescramblerPidTxn`参照 | 公開成功条件は各状態表、内部確定点は0-S-3B参照 | compensation / quarantineを含むtransaction内部failure semanticsは0-S-3B参照 | 0-S-3B参照 | token/PID状態表と0-S-3Bに従う | key/PID/session cleanupのowner境界を本索引で再定義しない |',
              '| AT-011 |': '| AT-011 | `ILnb.setVoltage()` / `setTone()` / `setSatellitePosition()` | operation/valueごとの公開入力・戻り値・未対応判定は「ILnb公開操作」を正とし、persistent control内部transactionは0-S-3Bの`LnbControlTxn`参照 | 公開成功条件は「ILnb公開操作」、内部確定点は0-S-3B参照 | backend/registry failure、quarantine semanticsは0-S-3B参照 | 0-S-3B参照 | 「ILnb公開操作」と`LnbControlTxn`に従う | 3 APIの内部control state machineを本索引で再定義せず、`sendDiseqcMessage()`を同transactionへ吸収しない |',
          }
          for prefix, row in rows.items():
              t = replace_row(t, prefix, row, prefix)

          at11 = next(line for line in t.splitlines() if line.startswith('| AT-011 |'))
          at12 = '| AT-012 | `IFrontend.setLnb()` | satellite frontendへhardware LNB resource assignmentを設定・更新する公開操作として扱う。assignment/leaseの内部transactionは0-S-3Bの`FrontendLnbRelationTxn`参照 | 指定assignmentが公開成功状態になったことをAPI成功条件とし、内部composite commit点は0-S-3B参照 | rollback / commit不明 / post-commit旧lease cleanup semanticsは0-S-3B参照 | 0-S-3B参照 | `IFrontend.setLnb()`公開契約と`FrontendLnbRelationTxn`に従う | assignmentは複数回更新可能でFrontend close時に解放するAOSP契約を維持し、relationとleaseを別commitしない |'
          t = replace_once(t, at11, at11 + '\n' + at12, 'AT-012 insert')

          old_setlnb = '`IFrontend.setLnb(lnb_id)`のrelation mutationは、frontendとLNB endpointの生存、所有者、generation、接続可能性、endpoint leaseおよび共有rail互換性を同一validation snapshotで確認し、frontend-LNB relationと必要なlease参照を単一commitで公開する。commit前失敗では旧relationと既存leaseを維持し、frontend側またはLNB側の片側だけを確定したrelation/leaseを通常状態として公開しない。CI CAM系は本書「非対応のTimeFilterとCI CAM」の契約どおり非対応であり、このrelation commit契約の成功対象へ含めない。'
          new_setlnb = '`IFrontend.setLnb(lnb_id)`はsatellite frontendへhardware LNB resource assignmentを設定し、複数回の呼出しでassignmentを更新できる公開操作とする。Frontend closeでは当該assignment resourceを解放する。frontend-LNB relation、assignment lease参照、atomic commit、rollback / cleanupの論理契約は0-S-3Bの`FrontendLnbRelationTxn`を唯一の正本とし、本節では内部mutation semanticsを再定義しない。CI CAM系は本書「非対応のTimeFilterとCI CAM」の契約どおり非対応であり、`FrontendLnbRelationTxn`の成功対象へ含めない。'
          t = replace_once(t, old_setlnb, new_setlnb, 'setLnb API section')

          p.write_text(t, encoding='utf-8')

          # --- tuner_hal2/DESIGN_JA.md ---
          p = Path('tuner_hal2/DESIGN_JA.md')
          t = p.read_text(encoding='utf-8')

          t = replace_once(
              t,
              '| LNB persistent control | `LnbControlTxn` | persistent control APIごとに別のcontrol ownerを持たない |',
              '| Frontend / LNB assignment relation | `FrontendLnbRelationTxn` | frontend object method use-caseまたはLNB registry ownerがrelation/leaseを別commitしない |\n| LNB persistent control | `LnbControlTxn` | persistent control APIごとに別のcontrol ownerを持たない |',
              'tuner_hal2 owner mapping',
          )

          t = replace_once(
              t,
              '| `LnbControlTxn` | `service_runtime/src/lnb_control_txn.rs::LnbControlTxn` | `ILnb.setVoltage()` / `setTone()` / `setSatellitePosition()` object use-case | API別control owner、`sendDiseqcMessage()`の同ownerへの統合 |',
              '| `FrontendLnbRelationTxn` | `service_runtime/src/frontend_ops.rs::FrontendLnbRelationTxn` | `IFrontend.setLnb()` object use-case、Frontend close時の`ObjectCloseTxn` typed assignment release | frontend use-case/LNB registryによるrelation・lease別commit、`LnbControlTxn`へのassignment ownership統合 |\n| `LnbControlTxn` | `service_runtime/src/lnb_control_txn.rs::LnbControlTxn` | `ILnb.setVoltage()` / `setTone()` / `setSatellitePosition()` object use-case | API別control owner、`sendDiseqcMessage()`の同ownerへの統合 |',
              'tuner_hal2 anchor',
          )

          child_old = '`IFilter.setDataSource()`は`SourceBoundaryTxn`、`IDemux.setFrontendDataSource()`は`DemuxFrontendSourceTxn`、Record DVR接続は`RecordDvrFilterRelationTxn`、descrambler PID登録は`DescramblerPidTxn`を通す。`IFrontend.setLnb()`はservice_runtimeのfrontend object method use-caseからLNB lease/registry ownerへ接続する。CI CAM系は`../tuner_hal/DESIGN_JA.md`の非対応契約へ接続し、backend relationを生成しない。relationのvalidation、generation、commit/rollback semanticsは同書を正とする。'
          child_new = '`IFilter.setDataSource()`は`SourceBoundaryTxn`、`IDemux.setFrontendDataSource()`は`DemuxFrontendSourceTxn`、Record DVR接続は`RecordDvrFilterRelationTxn`、descrambler PID登録は`DescramblerPidTxn`を通す。`IFrontend.setLnb()`は`FrontendLnbRelationTxn`を通し、同ownerからLNB resource ownerのprepared assignment lease入口へ接続する。CI CAM系は`../tuner_hal/DESIGN_JA.md`の非対応契約へ接続し、backend relationを生成しない。relationのvalidation、generation、commit/rollback semanticsは同書を正とする。'
          t = replace_once(t, child_old, child_new, 'tuner_hal2 child mapping')

          composition_anchor = '- Record DVR/Filter lifecycle use-caseは`RecordDvrFilterRelationTxn`のtyped入口へ接続する。'
          composition_new = composition_anchor + '\n- Frontend LNB assignment use-caseは`FrontendLnbRelationTxn`へ接続し、LNB resource ownerのlease台帳内部を直接変更しない。'
          t = replace_once(t, composition_anchor, composition_new, 'tuner_hal2 composition')

          p.write_text(t, encoding='utf-8')

          # --- 開発規則.md ---
          p = Path('開発規則.md')
          t = p.read_text(encoding='utf-8')
          t = replace_once(
              t,
              'この例外を適用した部分LNB endpointはAndroid 14 CTSのLNB試験および同試験が前提とするAndroid互換性を満たさない可能性があるため、本製品は当該LNB面についてCTS/CDD適合を宣言しない。未対応operationを成功no-op、擬似成功、callback echoで実装済みに見せることも禁止する。',
              'この例外を適用した部分LNB endpointはAndroid 14 CTSのLNB試験に加え、Android 14 AIDL Tuner VTSのLNB live試験でも失敗し得るため、本製品は当該LNB面についてCTS/VTS合格およびCDD適合を宣言しない。未対応operationを成功no-op、擬似成功、callback echoで実装済みに見せることも、公開済みLNBをVTS XML/profileから到達不能にして検査を回避することも禁止する。',
              'product LNB CTS/VTS delta',
          )
          t = replace_once(
              t,
              'この節が所有するのは「部分LNB能力を公開し、CTS/CDD compatibility deltaを既知として受容する」という製品判断だけである。公開endpointの選定条件、operation / valueごとの成功・`UNAVAILABLE`・`INVALID_ARGUMENT`、資源寿命、callback、rollback / cleanup等のTuner HAL公開契約は`tuner_hal/DESIGN_JA.md`を正とする。理由、CTS側の具体的試験内容、既知差分、再評価条件の記録は`future_work/not_planned/tuner_lnb_partial_hardware_cts_mismatch.md`を参照する。',
              'この節が所有するのは「部分LNB能力を公開し、CTS/VTS/CDD compatibility deltaを既知として受容する」という製品判断だけである。公開endpointの選定条件、operation / valueごとの成功・`UNAVAILABLE`・`INVALID_ARGUMENT`、資源寿命、callback、rollback / cleanup等のTuner HAL公開契約は`tuner_hal/DESIGN_JA.md`を正とする。理由、CTS/VTS側の具体的試験内容、既知差分、再評価条件の記録は`future_work/not_planned/tuner_lnb_partial_hardware_cts_mismatch.md`を参照する。',
              'product LNB SSOT wording',
          )
          p.write_text(t, encoding='utf-8')

          # Guards.
          hal = Path('tuner_hal/DESIGN_JA.md').read_text(encoding='utf-8')
          hal2 = Path('tuner_hal2/DESIGN_JA.md').read_text(encoding='utf-8')
          rules = Path('開発規則.md').read_text(encoding='utf-8')
          if hal.count('`FrontendLnbRelationTxn`') < 5:
              raise SystemExit('FrontendLnbRelationTxn references missing from canonical design')
          if hal2.count('`FrontendLnbRelationTxn`') < 4:
              raise SystemExit('FrontendLnbRelationTxn references missing from implementation design')
          if hal.count('| AT-012 | `IFrontend.setLnb()` |') != 1:
              raise SystemExit('AT-012 must exist exactly once')
          if 'CTS/VTS/CDD compatibility delta' not in rules:
              raise SystemExit('product-level VTS delta wording missing')
      - name: Check diff
        shell: bash
        run: git diff --check
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'maleicacid'
          git config user.email '4982384+kazuki0824@users.noreply.github.com'
          git add tuner_hal/DESIGN_JA.md tuner_hal2/DESIGN_JA.md 開発規則.md
          git commit -m 'design: close remaining transaction ownership gaps'
          git push origin HEAD:agent/fix-commonization-boundaries
