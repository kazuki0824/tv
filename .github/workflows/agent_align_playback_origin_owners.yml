name: agent-align-playback-origin-owners

on:
  push:
    branches:
      - agent/fix-playback-dvr-origin-generation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align playback origin owners
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tuner_hal/DESIGN_JA.md')
          s = p.read_text()

          old1 = ('キュー識別子はlogical `queue_identity` とし、fd番号やdescriptor内容などの再利用可能な物理値ではなく、同一DVR object寿命中に再利用しない。'
                  '記述子の置換では旧 `queue_identity` を閉じ、世代0の新しい `queue_identity` を生成する。')
          new1 = ('playback queue のlogical incarnationは既存の `PlaybackQueueBacking` が所有する `queue_identity` を正本とする。'
                  '`queue_identity` はfd番号やdescriptor内容などの再利用可能な物理値ではなく、同一DVR object寿命中に再利用しない。'
                  '`QueueEpochProtocol` はこのidentityを参照し、同一identity内の `queue_epoch` だけを所有する。'
                  '記述子の置換では `StreamBoundaryTxn` のboundary commitで旧originのcontinuity / assembler / parser stateを切断し、旧 `queue_identity` を閉じてから、`PlaybackQueueBacking` が世代0の再利用しない新しい `queue_identity` を発行する。')
          if s.count(old1) != 1:
              raise SystemExit(f'expected one QueueEpoch ownership paragraph, got {s.count(old1)}')
          s = s.replace(old1, new1)

          old2 = ('Playback DVR の入力originは `TsInputOrigin::PlaybackDvr(dvr_id, queue_identity, queue_epoch)` を唯一の正本キーとし、別の `dvr_generation` は設けない。'
                  '`queue_identity` は `QueueEpochProtocol` が既に所有するキュー識別子を表すlogical incarnation tokenであり、fd番号、descriptor内容、アドレス等の再利用可能な物理値を使用せず、同一DVR object寿命中は再利用しない。'
                  '`queue_epoch` は同一 `queue_identity` 内のflush世代だけを表し、キュー生成時は0、`stop()` / `start()` では `queue_identity` とともに維持し、成功した `flush()` の消去commitでだけ進める。'
                  '`close()` / 所有者消滅では当該 `queue_identity` を閉じる。記述子置換では、旧 `queue_identity` を閉じ、旧 `PlaybackDvr` originに属するcontinuity / assembler / parser stateの切断を同じboundary commitで確定してから、再利用しない新しい `queue_identity` を `queue_epoch=0` で開始する。'
                  'これにより `stop()`→`start()` は同一stream continuationを保ち、`flush()` 前後またはdescriptor replacement前後の旧状態を新originへ再結合せず、ABAを許さない。')
          new2 = ('Playback DVR の入力originは `TsInputOrigin::PlaybackDvr(dvr_id, queue_identity, queue_epoch)` を唯一の正本キーとし、別の `dvr_generation` は設けない。'
                  '`queue_identity` は `PlaybackQueueBacking` が所有するlogical incarnation token、`queue_epoch` は `QueueEpochProtocol` が所有する同一identity内のflush世代とする。'
                  'キュー生成時の `queue_epoch` は0とし、`stop()` / `start()` ではidentityとepochを維持し、成功した `flush()` の消去commitでだけepochを進める。'
                  '`flush()` とdescriptor replacementで旧originのcontinuity / assembler / parser stateを切断する責務は既存の `StreamBoundaryTxn` に集約する。'
                  '`close()` / 所有者消滅では当該identityを閉じ、descriptor replacementでは同じboundary commitで旧originを切断して旧identityを閉じた後、再利用しない新identityを `queue_epoch=0` で開始する。'
                  'これにより `stop()`→`start()` は同一stream continuationを保ち、`flush()` 前後またはdescriptor replacement前後の旧状態を新originへ再結合せず、ABAを許さない。')
          if s.count(old2) != 1:
              raise SystemExit(f'expected one playback origin SSOT paragraph, got {s.count(old2)}')
          s = s.replace(old2, new2)

          p.write_text(s)
          PY
          rm .github/workflows/agent_align_playback_origin_owners.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tuner_hal/DESIGN_JA.md .github/workflows/agent_align_playback_origin_owners.yml
          git diff --cached --check
          git commit -m 'docs: align playback origin ownership'
          git push
