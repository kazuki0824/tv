name: Temporary CAS review10 patch

on:
  push:
    branches:
      - design/aosp-mediacas-b25-plugin
    paths:
      - .github/workflows/tmp-cas-review10.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/aosp-mediacas-b25-plugin
          fetch-depth: 0
      - run: python3 .github/tmp-cas-review10.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- tis/DESIGN_JA.md
          git diff --cached --check
          git commit -m "docs(tis): align descrambler PID ownership"
          git push origin HEAD:design/aosp-mediacas-b25-plugin
