name: pr28-residue-cleanup
on:
  push:
    branches:
      - agent/fix-commonization-boundaries
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-commonization-boundaries
          fetch-depth: 0
      - name: Apply residue cleanup
        run: python3 .tmp/pr28_cleanup_residue.py
      - name: Commit and clean helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tuner_hal/DESIGN_JA.md
          git rm -f .tmp/pr28_cleanup_residue.py .github/workflows/pr28-residue-cleanup.yml
          git commit -m "design: finish contract review cleanup [skip ci]"
          git push origin HEAD:agent/fix-commonization-boundaries
