name: Verify PR54 BS/audio fixes v3

on:
  push:
    branches: [codex/pr54-apply-20260902]
    paths: [.github/workflows/codex-pr54-21-31-verify-push-v3.yml]

permissions:
  contents: write

env:
  EXPECTED_TARGET_SHA: 9b3ed7440a923ff861b7ff19cf03a0490677b015
  TARGET_BRANCH: agent/implement-tis-arib-si-design-pr53
  RUST_TOOLCHAIN: 1.81.0
  KOTLIN_VERSION: 1.9.22

jobs:
  verify-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr54-apply-20260902
          path: staging
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 2
          path: target
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
      - name: Apply, verify, commit and push
        shell: bash
        run: bash staging/codex_verify_pr54_21_31.sh "$GITHUB_WORKSPACE/target"
