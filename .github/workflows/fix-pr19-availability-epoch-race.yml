name: Fix PR19 availability epoch race

on:
  push:
    branches:
      - agent/fix-tis-arib-design-residuals

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-tis-arib-design-residuals
          fetch-depth: 0
      - shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('tis/DESIGN_JA.md')
          text = p.read_text(encoding='utf-8')

          def replace_once(old, new):
              global text
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'expected one match, got {n}: {old[:160]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '''non-null listenerを設定する操作は、current MediaSync instanceの**次のfinal-output成功を1件だけ通知するavailability epochをarmする操作**でもある。native MediaSyncは、arm中にvideo bufferがlate-drop分岐を通過し、current `mOutput`へのattachと`queueBuffer()`がともに成功した後だけeventを1件生成し、そのepochをdisarmする。late-drop、attach失敗、queue失敗、output abandonment、inputへ返したbufferではeventを生成せず、arm状態も消費しない。常時すべてのrender成功を通知せず、TISが必要なavailability epochだけをarm/re-armする。''',
              '''availabilityをarmするたびに、`PlaybackPipeline`は同一session内で再利用しない単調増加`availabilityEpochId`を割り当てる。Framework-private setterはlistener/handlerとこのIDを同時にnativeへ渡し、native MediaSyncはcurrent armのIDを保持する。arm中にvideo bufferがlate-drop分岐を通過し、current `mOutput`へのattachと`queueBuffer()`がともに成功した時点で、その**成功を判定したarmの`availabilityEpochId`をevent payloadへ固定してから**epochをdisarmする。late-drop、attach失敗、queue失敗、output abandonment、inputへ返したbufferではeventを生成せず、arm状態も消費しない。re-arm後に旧eventのJava配送が遅延しても、event payloadのIDは生成時の旧epochから書き換えない。`availabilityEpochId`はpending eventが存在し得る間に再利用せず、整数overflow時はwrapさせず現sessionのplayback pipelineを再生成する。常時すべてのrender成功を通知せず、TISが必要なavailability epochだけをarm/re-armする。'''
          )

          replace_once(
              '''TISは新playback generation開始時にinitial availability epochをarmする。current instance/current generationのeventを受け、current `sessionSurface`が有効、視聴制限でblockされておらず、同generationの`MEDIASYNC_ERROR_SURFACE_FAIL`がない場合だけ`notifyVideoAvailable()`を呼ぶ。一度availableになった後、`VIDEO_UNAVAILABLE_REASON_BUFFERING`等のrecoverable unavailableへ遷移し**同じMediaSync instance/generationを維持して復旧する場合**は、復旧開始時にlistenerを再設定して次のfinal-output成功をre-armし、その成功event後だけ再びavailableへ遷移する。generation teardownを伴うunavailableは新MediaSync instanceのinitial armで閉じる。これにより`available -> unavailable -> available`をrecoverable pathとgeneration-recreate pathの双方で閉じる。''',
              '''TISは新playback generation開始時にinitial availability epochを新しい`availabilityEpochId`でarmし、`waitingAvailabilityEpochId`として保持する。callback eventはMediaSync instance、playback generation、event payloadの`availabilityEpochId`を同executor上で照合し、IDが`waitingAvailabilityEpochId`と一致し、current `sessionSurface`が有効、視聴制限でblockされておらず、同generationの`MEDIASYNC_ERROR_SURFACE_FAIL`がない場合だけ`notifyVideoAvailable()`を呼ぶ。受理またはepoch取消し後は`waitingAvailabilityEpochId`を無効化する。一度availableになった後、`VIDEO_UNAVAILABLE_REASON_BUFFERING`等のrecoverable unavailableへ遷移し**同じMediaSync instance/generationを維持して復旧する場合**は、旧waiting epochを取消して新しいIDでre-armし、re-arm前の旧epochで既に生成済みだった遅延eventはID不一致で必ず破棄する。新epochのfinal-output成功event後だけ再びavailableへ遷移する。generation teardownを伴うunavailableは新MediaSync instanceのinitial armで閉じる。これにより`available -> unavailable -> available`をrecoverable pathとgeneration-recreate pathの双方で閉じる。'''
          )

          replace_once(
              '''callbackは物理display/compositorへのpresent fence完了を意味せず、video scheduling/drop ownerであるMediaSyncがrender対象を選択しcurrent final outputへのqueueを成功させたことだけをcommitする。`MediaCodec.OnFrameRenderedListener`、`MediaSync.getTimestamp()`、playback clock進行はvideo availability commitへ使用しない。native内部mutexを保持したままJavaへreentrant callせず、JNI/Java handlerへ非同期配送する。release済みまたは旧generation/旧MediaSync instanceから遅延配送されたeventはstate更新に使わない。''',
              '''callbackは物理display/compositorへのpresent fence完了を意味せず、video scheduling/drop ownerであるMediaSyncがrender対象を選択しcurrent final outputへのqueueを成功させたことだけをcommitする。`MediaCodec.OnFrameRenderedListener`、`MediaSync.getTimestamp()`、playback clock進行はvideo availability commitへ使用しない。native内部mutexを保持したままJavaへreentrant callせず、成功時に固定した`availabilityEpochId`を保持したままJNI/Java handlerへ非同期配送する。release済み、旧generation、旧MediaSync instance、またはcurrent waiting epochとIDが一致しない遅延eventはstate更新に使わない。'''
          )

          old = '''最低試験契約は、型付きLinearBlock→block model QueueRequest、ES全体copy禁止、PTS欠落sample単体dropとgeneration継続、通常PTS wrap、MediaSync rate-0有限prefillからstartup gate成立後speed 1.0へ遷移すること、`MEDIASYNC_ERROR_SURFACE_FAIL`と`MEDIASYNC_ERROR_AUDIOTRACK_FAIL`の分離、audio-videoでAudioTrack failure時のvideo-only継続、audio-onlyでの再生不能遷移、video-onlyがAudioTrack error遷移を持たないこと、initial availability epochでfinal-output成功前はvideo availableにしないこと、late-drop／attach失敗／queue失敗でepochを消費しないこと、成功event後だけ一回availability通知すること、`available -> recoverable unavailable -> available`で同MediaSync instanceを維持する場合にlistenerをre-armして次のfinal-output成功後だけ再availableにすること、generation teardown後は新instanceのinitial armを使うこと、audio bufferのconsume callbackまでの寿命、A/V同期、video-only、audio-only、retune／flush／非wrap discontinuity／Surface変更／AudioTrack切替・再生成／audio route変更／decoder再生成後のMediaSync再生成、route変更後の旧generation非利用、MediaSync error写像、stale generation非描画を含む。試験のqueue数値上限は選択した`ProductProfile`と一致させる。'''
          new = '''最低試験契約は、型付きLinearBlock→block model QueueRequest、ES全体copy禁止、PTS欠落sample単体dropとgeneration継続、通常PTS wrap、MediaSync rate-0有限prefillからstartup gate成立後speed 1.0へ遷移すること、`MEDIASYNC_ERROR_SURFACE_FAIL`と`MEDIASYNC_ERROR_AUDIOTRACK_FAIL`の分離、audio-videoでAudioTrack failure時のvideo-only継続、audio-onlyでの再生不能遷移、video-onlyがAudioTrack error遷移を持たないこと、initial availability epochでfinal-output成功前はvideo availableにしないこと、late-drop／attach失敗／queue失敗でepochを消費しないこと、成功event後だけ一回availability通知すること、`available -> recoverable unavailable -> available`で同MediaSync instanceを維持する場合に新しい`availabilityEpochId`でlistenerをre-armして次のfinal-output成功後だけ再availableにすること、**epoch Aのfinal-output成功eventを生成したままJava配送を遅延させ、その間にunavailable遷移とepoch Bのre-armを行った場合、遅延event AをID不一致で破棄し、epoch B arm後の新しいfinal-output成功eventだけで再availableにする競合試験**、generation teardown後は新instanceのinitial armを使うこと、audio bufferのconsume callbackまでの寿命、A/V同期、video-only、audio-only、retune／flush／非wrap discontinuity／Surface変更／AudioTrack切替・再生成／audio route変更／decoder再生成後のMediaSync再生成、route変更後の旧generation非利用、MediaSync error写像、stale generation非描画を含む。試験のqueue数値上限は選択した`ProductProfile`と一致させる。'''
          replace_once(old, new)

          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tis/DESIGN_JA.md
          git commit -m 'docs: bind MediaSync availability events to epochs'
          git push origin HEAD:agent/fix-tis-arib-design-residuals
