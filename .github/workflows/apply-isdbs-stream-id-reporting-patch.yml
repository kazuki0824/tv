name: Apply ISDB-S stream-id reporting patch

on:
  push:
    branches:
      - feat/tuner-hal2-isdbs-stream-id-reporting
    paths:
      - .github/workflows/apply-isdbs-stream-id-reporting-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tuner-hal2-isdbs-stream-id-reporting
          fetch-depth: 0

      - name: Apply exact source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          worker_path = Path("tuner_hal2/service_runtime/src/frontend_worker_txn.rs")
          text = worker_path.read_text()
          text = replace_once(
              text,
              "    FrontendIsdbtPartialReceptionRequirement, FrontendScanMode, FrontendTuneRequest, HalError,\n    HalErrorDetail, HalInternalKind, HalInvalidStateKind,\n",
              "    FrontendIsdbtPartialReceptionRequirement, FrontendScanMode, FrontendSystem,\n    FrontendTuneRequest, HalError, HalErrorDetail, HalInternalKind, HalInvalidStateKind,\n",
              "common import",
          )
          text = replace_once(
              text,
              "    FrontendTmccPartialReceptionObservation, FrontendWorkerCancelReason, FrontendWorkerContext,\n    FrontendWorkerKind, FrontendWorkerStartError, FrontendWorkerStopOutcome,\n",
              "    FrontendTmccPartialReceptionObservation, FrontendTmccTsidListObservation,\n    FrontendWorkerCancelReason, FrontendWorkerContext, FrontendWorkerKind,\n    FrontendWorkerStartError, FrontendWorkerStopOutcome,\n",
              "device import",
          )
          text = replace_once(
              text,
              "#[derive(Clone, Copy, Debug, Eq, PartialEq)]\npub enum FrontendScanNotification {\n    Locked,\n    End,\n}\n",
              "#[derive(Clone, Debug, Eq, PartialEq)]\npub enum FrontendScanNotification {\n    InputStreamIds(Vec<i32>),\n    Locked,\n    End,\n}\n",
              "scan notification enum",
          )

          anchor = """fn record_frontend_tune_lock_qualification(\n    runtime: &SharedRuntime,\n    ctx: &FrontendWorkerContext,\n    frontend_id: i32,\n    generation: u64,\n) -> Result<bool, HalError> {\n    if ctx.cancel_requested() {\n        return Ok(false);\n    }\n    let mut guard = lock_runtime(\n        runtime,\n        \"service runtime lock poisoned while recording qualified frontend tune lock\",\n    )?;\n    if ctx.cancel_requested() {\n        return Ok(false);\n    }\n    guard\n        .frontend_txn()\n        .record_frontend_tune_lock_qualified(frontend_id, generation)?;\n    Ok(true)\n}\n"""
          helpers = anchor + """\nfn frontend_uses_tmcc_stream_id_list(\n    runtime: &SharedRuntime,\n    frontend_id: i32,\n) -> Result<bool, HalError> {\n    let guard = lock_runtime(\n        runtime,\n        \"service runtime lock poisoned while checking TMCC stream-id support\",\n    )?;\n    let entry = guard.frontend_entry(frontend_id).ok_or_else(|| {\n        HalError::internal(\n            HalInternalKind::InvariantViolation,\n            \"frontend registry entry is missing while checking TMCC stream-id support\",\n        )\n    })?;\n    Ok(\n        entry.backend == FrontendBackendKind::Px4CharDevice\n            && entry.system == FrontendSystem::IsdbS,\n    )\n}\n\nfn wait_for_and_record_frontend_stream_id_list(\n    runtime: &SharedRuntime,\n    ctx: &FrontendWorkerContext,\n    session: &FrontendBackendSession,\n    backend: FrontendBackendKind,\n    frontend_id: i32,\n    generation: u64,\n) -> Result<Option<Vec<i32>>, HalError> {\n    if !frontend_uses_tmcc_stream_id_list(runtime, frontend_id)? {\n        return Ok(None);\n    }\n    let started = Instant::now();\n    let deadline = frontend_terminal_deadline(backend);\n    loop {\n        if ctx.cancel_requested() {\n            return Ok(None);\n        }\n        match session.observe_tmcc_tsid_list()? {\n            FrontendTmccTsidListObservation::Pending => {}\n            FrontendTmccTsidListObservation::Available(stream_ids) => {\n                let stream_ids = stream_ids.into_iter().map(i32::from).collect::<Vec<_>>();\n                if ctx.cancel_requested() {\n                    return Ok(None);\n                }\n                let mut guard = lock_runtime(\n                    runtime,\n                    \"service runtime lock poisoned while recording TMCC stream IDs\",\n                )?;\n                if ctx.cancel_requested() {\n                    return Ok(None);\n                }\n                guard.frontend_txn().record_frontend_stream_id_list(\n                    frontend_id,\n                    generation,\n                    stream_ids.clone(),\n                )?;\n                return Ok(Some(stream_ids));\n            }\n        }\n        if started.elapsed() >= deadline {\n            return Err(HalError::Io {\n                backend: \"px4\",\n                operation: \"PTX_GET_TMCC_TSID_LIST\",\n                path: None,\n                errno: Some(FRONTEND_BACKEND_SUBMIT_TIMEOUT_ERRNO),\n                detail: HalErrorDetail::new(\n                    \"TMCC stream-id list did not become available before frontend deadline\",\n                ),\n            });\n        }\n        thread::sleep(Duration::from_millis(20));\n    }\n}\n"""
          text = replace_once(text, anchor, helpers, "stream-id helpers")

          text = replace_once(
              text,
              """            FrontendLockWaitOutcome::Locked => {\n                if !record_frontend_tune_lock_qualification(&runtime, ctx, frontend_id, generation)?\n                {\n""",
              """            FrontendLockWaitOutcome::Locked => {\n                let _ = wait_for_and_record_frontend_stream_id_list(\n                    &runtime,\n                    ctx,\n                    &session,\n                    backend,\n                    frontend_id,\n                    generation,\n                )?;\n                if !record_frontend_tune_lock_qualification(&runtime, ctx, frontend_id, generation)?\n                {\n""",
              "initial tune lock",
          )
          text = replace_once(
              text,
              """                FrontendLockTransition::Locked => {\n                    if !record_frontend_tune_lock_qualification(\n                        &runtime,\n                        ctx,\n                        frontend_id,\n                        generation,\n                    )? {\n""",
              """                FrontendLockTransition::Locked => {\n                    let _ = wait_for_and_record_frontend_stream_id_list(\n                        &runtime,\n                        ctx,\n                        &session,\n                        backend,\n                        frontend_id,\n                        generation,\n                    )?;\n                    if !record_frontend_tune_lock_qualification(\n                        &runtime,\n                        ctx,\n                        frontend_id,\n                        generation,\n                    )? {\n""",
              "tune relock",
          )
          text = replace_once(
              text,
              """        let mut signal_state = FrontendSignalState::NoSignal;\n        let body_result = (|| {\n""",
              """        let mut signal_state = FrontendSignalState::NoSignal;\n        let mut locked_stream_ids = None;\n        let body_result = (|| {\n""",
              "scan state",
          )
          text = replace_once(
              text,
              """                FrontendLockWaitOutcome::Locked => signal_state = FrontendSignalState::Locked,\n                FrontendLockWaitOutcome::NoSignal | FrontendLockWaitOutcome::Cancelled => {}\n""",
              """                FrontendLockWaitOutcome::Locked => {\n                    signal_state = FrontendSignalState::Locked;\n                    locked_stream_ids = wait_for_and_record_frontend_stream_id_list(\n                        &runtime,\n                        ctx,\n                        &session,\n                        backend,\n                        ctx.frontend_id(),\n                        ctx.generation(),\n                    )?;\n                }\n                FrontendLockWaitOutcome::NoSignal | FrontendLockWaitOutcome::Cancelled => {}\n""",
              "scan lock readback",
          )
          text = replace_once(
              text,
              """        if signal_state == FrontendSignalState::Locked {\n            deliver_committed_scan_notification(\n                &runtime,\n                &scan_notifier,\n                ctx.frontend_id(),\n                ctx.generation(),\n                FrontendScanNotification::Locked,\n            )?;\n""",
              """        if signal_state == FrontendSignalState::Locked {\n            if let Some(stream_ids) = locked_stream_ids {\n                deliver_committed_scan_notification(\n                    &runtime,\n                    &scan_notifier,\n                    ctx.frontend_id(),\n                    ctx.generation(),\n                    FrontendScanNotification::InputStreamIds(stream_ids),\n                )?;\n            }\n            deliver_committed_scan_notification(\n                &runtime,\n                &scan_notifier,\n                ctx.frontend_id(),\n                ctx.generation(),\n                FrontendScanNotification::Locked,\n            )?;\n""",
              "scan callback order",
          )
          worker_path.write_text(text)

          service_path = Path("tuner_hal2/aidl_service/src/tuner_service.rs")
          service = service_path.read_text()
          old = """    if lnb_profile_supports_voltage_status(snapshot.lnb_profile) {\n        caps.push(FrontendStatusType::LNB_VOLTAGE);\n    }\n    caps\n}\n"""
          new = """    if lnb_profile_supports_voltage_status(snapshot.lnb_profile) {\n        caps.push(FrontendStatusType::LNB_VOLTAGE);\n    }\n    if snapshot.backend == FrontendBackendKind::Px4CharDevice\n        && snapshot.system == FrontendSystem::IsdbS\n    {\n        caps.push(FrontendStatusType::STREAM_ID_LIST);\n    }\n    caps\n}\n"""
          service = replace_once(service, old, new, "statusCaps")
          service_path.write_text(service)

          workflow = Path(".github/workflows/apply-isdbs-stream-id-reporting-patch.yml")
          workflow.unlink()
          PY

          cargo fmt --manifest-path tuner_hal2/host_ci/Cargo.toml --all

          git config user.name "maleicacid"
          git config user.email "4982384+kazuki0824@users.noreply.github.com"
          git add tuner_hal2/service_runtime/src/frontend_worker_txn.rs tuner_hal2/aidl_service/src/tuner_service.rs .github/workflows/apply-isdbs-stream-id-reporting-patch.yml
          git commit -m "feat(tuner): connect TMCC stream IDs to frontend reporting"
          git push origin HEAD:feat/tuner-hal2-isdbs-stream-id-reporting
