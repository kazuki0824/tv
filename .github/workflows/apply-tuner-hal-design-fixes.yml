name: Apply tuner HAL design fixes

on:
  push:
    branches:
      - agent/fix-tuner-hal-design-contracts

permissions:
  contents: write

jobs:
  patch-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-tuner-hal-design-contracts
      - name: Apply design-only corrections
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          path = Path('tuner_hal/DESIGN_JA.md')
          text = path.read_text(encoding='utf-8')
          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              text = text.replace(old, new, 1)
          replace_once('| FILTER_PCR | サービス全体 | 4 | `CapabilitySnapshot`の値 | 0 | なし | 呼び出し側指定のFMQ容量はsnapshotの`fmqRuntimeBudgetBytes`から別transactionで予約する。 |', '| FILTER_PCR | サービス全体 | 4 | `CapabilitySnapshot`の値 | 0 | なし | PCRはcallback-only filterとして通常payload FMQを持たず、`openFilter()`の`bufferSize`を`fmqRuntimeBudgetBytes`から予約しない。PCR通知に必要なcallback stateだけを当該filterの固定資源として扱う。 |', 'PCR capacity row')
          source_anchor = '\n開始中の`setDataSource()`には、引数がNULLかどうかにかかわらず`INVALID_STATE`を返す。入力元の接続と切断は、open済み、設定済み、または停止済みの場合だけ許可し、動作中の切り替えは行わない。\n'
          source_text = '\nRecord DVR経路について、表18-Bの`queued payload` / `entry`は、Record DVR FMQへcommitする前にHAL内部で保持しているentryだけを指す。Record DVR FMQへのcommitはAOSPのbyte FMQ契約上の公開境界であり、commit済みbyte列にはsource/filter/generationを示すsideband metadataを付与しない。したがって、source変更、source filterの`flush()`・再設定・close、またはgeneration不一致だけを理由に、Record DVR FMQへcommit済みのbyte列を遡及的に選択破棄または配送禁止へ変更してはならない。これらの境界は、commit前の内部entryと境界以後のproductionにだけgeneration fenceを適用する。client未消費のRecord DVR FMQ全体を破棄する操作は`IDvr.flush()`だけとする。\n'
          replace_once(source_anchor, source_text + source_anchor, 'Record DVR source boundary')
          union_para = 'demux入力世代ごとに、Record DVRへ接続中の全記録フィルター条件を、変更不能な1個の和集合条件へまとめる。到着した188バイトTSパケットは1回だけ評価し、いずれかの記録条件に一致した場合は、到着順にRecord DVRへ正確に1回書き込む。フィルターごとの索引状態とコールバック状態は別々に保持する。接続、切断、設定変更では、世代境界で和集合条件をトランザクションとして置き換える。各フィルターへ一度分配してから全体を並べ替える、重複排除する、または `ingress_sequence` で欠落を推測する構成にしてはならない。\n'
          union_add = '\nRecord DVR FMQへ成功commitした188-byte packetは公開済みとして扱い、後続のrecord filter接続・切断、source変更、source generation変更によって遡及変更しない。和集合条件のcommitは次のpacket境界以後のwrite可否にだけ作用する。Record DVR FMQのclient未消費byte列を明示的に破棄するのは`IDvr.flush()`だけとし、個別source/filter境界の代替として共有queue全体をflushしてはならない。\n'
          replace_once(union_para, union_para + union_add, 'Record DVR union paragraph')
          start_marker = '##### 表1-C-AVH. `releaseAvHandle()` 全域判定表\n'
          end_marker = '#### 表1-D. `setDataSource()` 互換表\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          avh_b64 = ''
          avh = base64.b64decode(avh_b64).decode('utf-8')
          text = text[:start] + avh + text[end:]
          ident_start = text.index('AV領域の正本となる同一性情報は')
          ident_end = text.index('\n\n\n#### 0-S-3.', ident_start)
          new_ident = '未解放AV allocationの正本は、正の`avDataId`をkeyとするactive token台帳に記録した`{owner_filter_id, filter_generation, transfer_kind, backing_id, allocation_id, avDataId, lease_state}`とする。ファイル記述子番号や`fstat`の`{st_dev, st_ino, size}`をallocation identityの正本にしてはならない。`fstat`などの記述子メタデータは、採用した記憶領域実装で同一性が保証される場合だけ補助検証と診断に用いる。共有ハンドルの`dataId=0`解放は呼出先IFilterが所有するboundedなクライアント使用権を対象とし、正の`dataId`解放はactive token台帳で当該IFilterの未解放allocationと転送方式を特定して行う。allocation解放成功時はtoken entryを削除し、その後activeでない正のtokenは`INVALID_ARGUMENT`として資源を変更しない。解放済みduplicate、foreign、never-issuedを永久に識別するためのtombstoneは持たない。台帳の信頼性を確認できない場合は`UNKNOWN_ERROR`とし、安全を確認できない記憶領域を隔離する。'
          text = text[:ident_start] + new_ident + text[ident_end:]
          rel_prefix = '解放要求の形状、既知の古い要求を状態変更なしで受理する条件'
          rel_start = text.index(rel_prefix)
          rel_end = text.index('\n\n### AV shared handle の `NativeHandle` 形式', rel_start)
          new_rel = '解放要求の形状、active `avDataId` tokenのowner・generation・transfer kind検証、inactive/unknown tokenの拒否、ファイル記述子の補助検証、論理閉鎖後の解放は、本書の「表1-C-AVH. `releaseAvHandle()` 全域判定表」を正とする。`releaseAvHandle(fd,0)`を共有記憶領域全体の破棄と解釈してはならない。イベント固有モードでは、受領したハンドルの使用権だけを先に閉じ、正のactive tokenとallocationを後続解放まで維持できる。'
          text = text[:rel_start] + new_rel + text[rel_end:]
          avh_now = text[text.index(start_marker):text.index(end_marker, text.index(start_marker))]
          for obsolete in ('issued range/high-watermark', 'KnownReleased | POSITIVE', '既知released/duplicate'):
              if obsolete in avh_now:
                  raise SystemExit(f'obsolete AV release semantic remains: {obsolete}')
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/apply-tuner-hal-design-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tuner_hal/DESIGN_JA.md .github/workflows/apply-tuner-hal-design-fixes.yml
          git diff --cached --check
          if git diff --cached --quiet; then echo 'no changes produced'; exit 1; fi
          git commit -m 'design: fix FMQ and AV lifetime contracts'
          git push origin HEAD:agent/fix-tuner-hal-design-contracts
