name: PR54レビュー修正の大規模部分編集

on:
  push:
    branches:
      - agent/implement-tis-arib-si-design-pr53
    paths:
      - .github/workflows/pr54-review-fixes-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/implement-tis-arib-si-design-pr53
          persist-credentials: true
          fetch-depth: 0

      - name: Rust 1.81を導入
        run: rustup toolchain install 1.81.0 --profile minimal --component rustfmt --component clippy

      - name: 第二段の大規模部分修正を適用
        run: |
          python3 .github/scripts/pr54_review_fixes_phase2_once.py
          python3 .github/scripts/pr54_review_fixes_phase2_regression_once.py

      - name: Rust検証
        working-directory: arib_si_engine_rs/host_ci
        run: |
          cargo +1.81.0 fmt --all
          cargo +1.81.0 check --all-targets --locked
          cargo +1.81.0 test --locked
          cargo +1.81.0 clippy --all-targets --locked -- -D warnings

      - name: TISの静的整合を検査
        run: |
          ! grep -R "clearLivePlaybackSupported" tis/src/com/maleicacid/tvinput/aribsi/SiModels.kt tis/src/com/maleicacid/tvinput/aribsi/ServiceListBuilder.kt tis/src/com/maleicacid/tvinput/tis/ChannelScanController.kt
          python3 -m json.tool arib_si_engine_rs/schema/program_provider_data_v1.schema.json >/dev/null
          git diff --check

      - name: 通常sourceの修正だけをcommitしてpush
        run: |
          git add tis/src/com/maleicacid/tvinput/aribsi/SiModels.kt
          git add tis/src/com/maleicacid/tvinput/aribsi/NativeAribSiParser.kt
          git add tis/src/com/maleicacid/tvinput/aribsi/ProviderDataBridge.kt
          git add tis/src/com/maleicacid/tvinput/aribsi/ServiceListBuilder.kt
          git add tis/src/com/maleicacid/tvinput/tis/ChannelScanController.kt
          git add tis/src/com/maleicacid/tvinput/tis/TunerSelectionPolicy.kt
          git add tis/DESIGN_JA.md
          git add tis/platform_patches/lineage-22.1/frameworks_base_mediasync_first_output.patch
          git add arib_si_engine_rs/src/core/provider_data.rs
          git add arib_si_engine_rs/schema/program_provider_data_v1.schema.json
          git diff --cached --check
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git commit -m 'fix(tis): review指摘の意味境界を補正'
          git push origin HEAD:agent/implement-tis-arib-si-design-pr53
