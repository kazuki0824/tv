name: temporary PR19 scope cleanup

on:
  push:
    branches:
      - agent/fix-tis-arib-design-residuals

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scope wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'tis/DESIGN_JA.md': [("現行製品が登録対象とするARIB `service_type`は、`0x01`のdigital television serviceと`0x02`のdigital radio sound serviceに固定する。`0x01`は`TvContract.Channels.SERVICE_TYPE_AUDIO_VIDEO`、`0x02`は`TvContract.Channels.SERVICE_TYPE_AUDIO`へ写像する。その他のservice typeは壊れたサービスへ丸めず、`UNSUPPORTED_SERVICE_TYPE`を記録して現行製品スコープ外としてchannel登録しない。対応集合を追加する場合は、ARIB上の意味、TvProvider写像、PMT成立条件、再生経路を同じ変更で追加する。", "本productがchannel登録およびlive viewableとして対応するARIB `service_type`集合は、`0x01`のdigital television serviceと`0x02`のdigital radio sound serviceだけに恒久固定する。`0x01`は`TvContract.Channels.SERVICE_TYPE_AUDIO_VIDEO`、`0x02`は`TvContract.Channels.SERVICE_TYPE_AUDIO`へ写像する。その他のservice typeはparser / provider-data診断ではraw値を保持するが、既知typeへ丸めず`UNSUPPORTED_SERVICE_TYPE`を記録してchannel登録・live viewable対象にしない。")],
              'ARIB_SI_EPG_TvProvider投影方針.md': [("| ISDB-C | `TvContract.Channels.TYPE_ISDB_C` | 将来、実際のISDB-C transportを対応宣言した場合だけ使用する。CATV周波数帯を走査したという理由だけでは使用しない |", "| ISDB-C | 投影しない | ISDB-C delivery systemは本productの恒久非対応対象とする。CATV周波数帯を走査したという理由だけで`TYPE_ISDB_C`へ写像せず、実transportがISDB-Cならchannel登録対象にしない |")],
              '開発規則.md': [("  - HAL-generated Japanese scan plan は 対応宣言しない。", "  - 製品Japanese scan planはTISが所有してexplicit tune candidateを生成し、Tuner HALはproduct-specific Japanese scan planを生成しない。これはreleaseに依存しないmodule責務の恒久不変条件とする。")],
          }
          for name, pairs in replacements.items():
              p = Path(name)
              s = p.read_text()
              for old, new in pairs:
                  assert old in s, (name, old)
                  s = s.replace(old, new, 1)
              p.write_text(s)
          PY
          git diff --check
      - name: Commit and remove helper
        shell: bash
        run: |
          rm -f .github/workflows/tmp-pr19-scope-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tis/DESIGN_JA.md ARIB_SI_EPG_TvProvider投影方針.md 開発規則.md .github/workflows/tmp-pr19-scope-cleanup.yml
          git commit -m "docs: make product scope invariants permanent"
          git push origin HEAD:agent/fix-tis-arib-design-residuals
