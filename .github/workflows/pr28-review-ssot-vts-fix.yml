name: PR28 review SSOT and VTS fix

on:
  push:
    branches:
      - agent/fix-commonization-boundaries
    paths:
      - .github/workflows/pr28-review-ssot-vts-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-commonization-boundaries
          fetch-depth: 0
      - name: Apply design review fixes
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/pr28_patch.py
          python3 /tmp/pr28_patch.py
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tuner_hal/DESIGN_JA.md tuner_hal2/DESIGN_JA.md future_work/not_planned/tuner_lnb_partial_hardware_cts_mismatch.md
          git commit -m 'design: address SSOT and LNB VTS review'
          git push origin HEAD:agent/fix-commonization-boundaries
