name: Apply PR22 review fixes

on:
  push:
    branches:
      - agent/fix-tuner-hal-design-contracts

permissions:
  contents: write

jobs:
  patch-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-tuner-hal-design-contracts
      - name: Apply review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rules = Path('開発規則.md')
          r = rules.read_text(encoding='utf-8')
          start = r.index('## px4_drv系のロック方法\n')
          end = r.index('## px4_drv系のchardev open方法\n', start)
          new_section = '## px4_drv系のロック方法\npx4_drv の AOSP frontend lock状態、status capability、callback遷移の公開契約は `tuner_hal/DESIGN_JA.md` の「px4_drv ロック 方針」を唯一の正本とする。\n\npx4_drv / product-level invariant として、`PTX_SET_CHANNEL` は driver 内部の `ops->check_lock()` が当該要求の demodulator lock 成立を確認した場合だけ成功する。また、現行 userspace ABI には選局後の current demodulator lock を副作用なく読み戻す経路がない。read-only ABI と I/O failure 分離の追加条件は `future_work/r51/px4_demod_lock_status_readback_blocker.md` を参照し、AOSPへの具体的な状態写像は本書で重複定義しない。\n\n'
          r = r[:start] + new_section + r[end:]
          rules.write_text(r, encoding='utf-8')
          design = Path('tuner_hal/DESIGN_JA.md')
          d = design.read_text(encoding='utf-8')
          old_record = 'Record DVR経路について、表18-Bの`queued payload` / `entry`は、Record DVR FMQへcommitする前にHAL内部で保持しているentryだけを指す。Record DVR FMQへのcommitはAOSPのbyte FMQ契約上の公開境界であり、commit済みbyte列にはsource/filter/generationを示すsideband metadataを付与しない。したがって、source変更、source filterの`flush()`・再設定・close、またはgeneration不一致だけを理由に、Record DVR FMQへcommit済みのbyte列を遡及的に選択破棄または配送禁止へ変更してはならない。これらの境界は、commit前の内部entryと境界以後のproductionにだけgeneration fenceを適用する。client未消費のRecord DVR FMQ全体を破棄する操作は`IDvr.flush()`だけとする。'
          new_record = old_record + '\n\nAOSP AIDLの`IFilter.flush()`が対象とする「filterが生成済みで未消費のdata」は、Record DVR経路ではRecord DVR FMQへの成功commit前にfilter側が所有するdataまでとする。Record DVR FMQへ成功commitした時点で、そのdataはfilter側では消費済みとなりDVR側の所有境界へ移る。commit後にclientがまだ消費していないbyte列は`IDvr.flush()`の対象であり、`IFilter.flush()`で遡及的に選択破棄してはならない。'
          if d.count(old_record) != 1:
              raise SystemExit(f'Record DVR paragraph match count={d.count(old_record)}')
          d = d.replace(old_record, new_record, 1)
          old_pcr = '| FILTER_PCR | サービス全体 | 4 | `CapabilitySnapshot`の値 | 0 | なし | PCRはcallback-only filterとして通常payload FMQを持たず、`openFilter()`の`bufferSize`を`fmqRuntimeBudgetBytes`から予約しない。PCR通知に必要なcallback stateだけを当該filterの固定資源として扱う。 |'
          new_pcr = '| FILTER_PCR | サービス全体 | 4 | `CapabilitySnapshot`の値 | 0 | なし | PCRは通常payload FMQを持たず、`openFilter()`の`bufferSize`を`fmqRuntimeBudgetBytes`から予約しない。固定資源にはstatus callbackとA/V sync / PCR clockに必要なgeneration-local state（`PcrClockAnchor`等）を含む。 |'
          if d.count(old_pcr) != 1:
              raise SystemExit(f'PCR row match count={d.count(old_pcr)}')
          d = d.replace(old_pcr, new_pcr, 1)
          design.write_text(d, encoding='utf-8')
          PY
          rm .github/workflows/apply-pr22-review-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 開発規則.md tuner_hal/DESIGN_JA.md .github/workflows/apply-pr22-review-fixes.yml
          git diff --cached --check
          if git diff --cached --quiet; then echo 'no changes produced'; exit 1; fi
          git commit -m 'docs: address PR22 review feedback'
          git push origin HEAD:agent/fix-tuner-hal-design-contracts
