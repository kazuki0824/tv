name: Fix PR19 review runner

on:
  push:
    branches:
      - agent/fix-tis-arib-design-residuals

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-tis-arib-design-residuals
          fetch-depth: 0
      - shell: bash
        run: |
          sed -i "/! grep -q 'UNDECIDED_EVENT'/d" .github/workflows/apply-pr19-review-fixes.yml
          rm .github/workflows/fix-pr19-review-runner.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/apply-pr19-review-fixes.yml .github/workflows/fix-pr19-review-runner.yml
          git commit -m 'ci: fix PR19 review runner'
          git push origin HEAD:agent/fix-tis-arib-design-residuals
