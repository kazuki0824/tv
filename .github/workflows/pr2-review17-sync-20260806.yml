name: PR2 review17 synchronize 2026-08-06

on:
  push:
    branches:
      - agent/apply-tuner-hal2-design-proposals-v70
    paths:
      - .github/pr2-review17-trigger-20260806.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/apply-tuner-hal2-design-proposals-v70
          fetch-depth: 0
      - name: Clarify compressed input and decoded audio ownership
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tis/DESIGN_JA.md')
          text = path.read_text(encoding='utf-8')
          old = 'audio decoder出力PCMは`MediaSync.queueAudio()`へPTS付きで渡し、`MediaSync.Callback.onAudioBufferConsumed()`を受けるまでcodec output／mapped linear blockを解放または変更しない。'
          new = 'audio decoder出力PCMは`MediaSync.queueAudio()`へPTS付きで渡し、`MediaSync.Callback.onAudioBufferConsumed()`を受けるまでaudio decoderのoutput buffer IDとPCM `ByteBuffer`（block model出力では`OutputFrame`／output `LinearBlock`を含む）を解放・変更・再利用しない。圧縮入力側の`MediaEvent`／input `LinearBlock`は`QueueRequest.queue()`成功時にcodecへ所有権を移管し、PCM消費完了までは保持しない。'
          if text.count(old) != 1:
              raise SystemExit(f'expected one ownership sentence, found {text.count(old)}')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Static checks
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import subprocess

          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed != {'tis/DESIGN_JA.md'}:
              raise SystemExit(f'unexpected changed files: {sorted(changed)}')
          text = Path('tis/DESIGN_JA.md').read_text(encoding='utf-8')
          required = [
              'MediaEvent.getLinearBlock()',
              'MediaCodec.CONFIGURE_FLAG_USE_BLOCK_MODEL',
              'QueueRequest.setLinearBlock',
              'MediaSync.createInputSurface()',
              'MediaSync.queueAudio()',
              'QueueRequest.queue()`成功時にcodecへ所有権を移管',
              'PCM消費完了までは保持しない',
              'onAudioBufferConsumed(sync, buffer, bufferId)',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'missing required text: {needle}')
          forbidden = [
              'AudioPlaybackClock',
              'StandalonePlaybackClock',
              'VideoFrameScheduler',
              '受けるまでcodec output／mapped linear blockを解放または変更しない',
          ]
          for needle in forbidden:
              if needle in text:
                  raise SystemExit(f'stale text remains: {needle}')
          if text.count('```') % 2:
              raise SystemExit('unbalanced Markdown code fences')
          PY
      - name: Remove temporary files and commit
        run: |
          rm -f .github/pr2-review17-trigger-20260806.txt
          rm -f .github/workflows/pr2-review17-sync-20260806.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tis/DESIGN_JA.md .github/pr2-review17-trigger-20260806.txt .github/workflows/pr2-review17-sync-20260806.yml
          git commit -m "docs(tis): clarify MediaCodec and MediaSync ownership"
          git push origin HEAD:agent/apply-tuner-hal2-design-proposals-v70
