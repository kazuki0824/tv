name: temp PR53 review 3-7
on:
  push:
    branches: [fix/tuner-hal2-rustfmt-1.81]
    paths: [.github/workflows/temp-fix53-review-3-7.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tuner-hal2-rustfmt-1.81
          persist-credentials: true
          fetch-depth: 0
      - run: python3 tools/temp_fix53_review_3_7.py
      - working-directory: tuner_hal2/host_ci
        run: cargo fmt --all
      - working-directory: tuner_hal2/host_ci
        run: cargo test --workspace --locked
      - working-directory: tuner_hal2/host_ci
        run: cargo check --workspace --all-targets --locked
      - working-directory: tuner_hal2/host_ci
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tuner_hal2/demux/src/runtime/queue_runtime.rs tuner_hal2/demux/src/runtime/demux.rs tuner_hal2/service_runtime/src/queue_cleanup_use_case.rs
          git commit -m "Preserve DVR queue rollback failures"
          git push origin HEAD:fix/tuner-hal2-rustfmt-1.81
