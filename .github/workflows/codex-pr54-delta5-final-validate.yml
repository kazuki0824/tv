name: Validate PR54 final actionable delta

on:
  push:
    branches: [codex/pr54-apply-20260902]
    paths: [.github/workflows/codex-pr54-delta5-final-validate.yml]

permissions:
  contents: read

env:
  TARGET_SHA: 9b3ed7440a923ff861b7ff19cf03a0490677b015
  RUST_TOOLCHAIN: 1.81.0
  KOTLIN_VERSION: 1.9.22

jobs:
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - run: cargo +"$RUST_TOOLCHAIN" build --lib --locked --manifest-path arib_si_engine_rs/host_ci/Cargo.toml
      - name: Prepare Kotlin inputs
        shell: bash
        run: |
          tools_dir="$RUNNER_TEMP/tis-kotlin-test"
          mkdir -p "$tools_dir"
          curl --fail --location --retry 3 --retry-all-errors "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" --output "$tools_dir/kotlin-compiler.zip"
          curl --fail --location --retry 3 --retry-all-errors "https://repo.maven.apache.org/maven2/org/robolectric/android-all/14-robolectric-10818077/android-all-14-robolectric-10818077.jar" --output "$tools_dir/android-all.jar"
          curl --fail --location --retry 3 --retry-all-errors "https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar" --output "$tools_dir/junit.jar"
          curl --fail --location --retry 3 --retry-all-errors "https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar" --output "$tools_dir/hamcrest-core.jar"
          echo "88b39213506532c816ff56348c07bbeefe0c8d18943bffbad11063cf97cac3e6  $tools_dir/kotlin-compiler.zip" | sha256sum --check
          echo "6be2218c6a53fe3c57bc22ebdc723edcb7270a8a6f187545708aa5c0ed813977  $tools_dir/android-all.jar" | sha256sum --check
          echo "8e495b634469d64fb8acfa3495a065cbacc8a0fff55ce1e31007be4c16dc57d3  $tools_dir/junit.jar" | sha256sum --check
          echo "66fdef91e9739348df7a096aa384a5685f4e875584cce89386a7a47251c4d8e9  $tools_dir/hamcrest-core.jar" | sha256sum --check
          unzip -q "$tools_dir/kotlin-compiler.zip" -d "$tools_dir/compiler"
          echo "TIS_KOTLIN_HOME=$tools_dir/compiler/kotlinc" >> "$GITHUB_ENV"
          echo "TIS_ANDROID_ALL_JAR=$tools_dir/android-all.jar" >> "$GITHUB_ENV"
          echo "TIS_JUNIT_JAR=$tools_dir/junit.jar" >> "$GITHUB_ENV"
          echo "TIS_HAMCREST_JAR=$tools_dir/hamcrest-core.jar" >> "$GITHUB_ENV"
      - name: Compile production and tests
        shell: bash
        run: |
          production_dir="$RUNNER_TEMP/tis-kotlin-production"
          test_dir="$RUNNER_TEMP/tis-kotlin-tests"
          mkdir -p "$production_dir" "$test_dir"
          mapfile -d '' -t production_sources < <(find tis/src tis/host_ci/kotlin/stubs/android -type f -name '*.kt' -print0 | sort -z)
          "$TIS_KOTLIN_HOME/bin/kotlinc" -J-Xmx4g -jvm-target 17 -classpath "$TIS_ANDROID_ALL_JAR" -d "$production_dir" "${production_sources[@]}"
          test_classpath="$production_dir:$TIS_ANDROID_ALL_JAR:$TIS_JUNIT_JAR:$TIS_HAMCREST_JAR:$TIS_KOTLIN_HOME/lib/kotlin-test.jar:$TIS_KOTLIN_HOME/lib/kotlin-test-junit.jar"
          mapfile -d '' -t test_sources < <(find tis/tests/src tis/host_ci/kotlin/stubs/androidx -type f -name '*.kt' -print0 | sort -z)
          "$TIS_KOTLIN_HOME/bin/kotlinc" -J-Xmx4g -jvm-target 17 -Xfriend-paths="$production_dir" -classpath "$test_classpath" -d "$test_dir" "${test_sources[@]}"
          mapfile -t discovered_classes < <(find "$test_dir" -type f -name '*Test.class' -printf '%P\n' | sed 's#/#.#g; s#\.class$##' | sort)
          test_classes=()
          for test_class in "${discovered_classes[@]}"; do
            case "$test_class" in
              com.maleicacid.tvinput.tis.DirectBootGuardR51FixTest|com.maleicacid.tvinput.tis.ProviderDataAssetsR51ContractTest|com.maleicacid.tvinput.tis.RecordingDisabledR51Test|com.maleicacid.tvinput.tis.TvProviderWriterDescriptorSchemaTest) ;;
              *) test_classes+=("$test_class") ;;
            esac
          done
          test "${#discovered_classes[@]}" -eq 30
          test "${#test_classes[@]}" -eq 26
          runtime_classpath="$production_dir:$test_dir:$TIS_ANDROID_ALL_JAR:$TIS_JUNIT_JAR:$TIS_HAMCREST_JAR:$TIS_KOTLIN_HOME/lib/kotlin-stdlib.jar:$TIS_KOTLIN_HOME/lib/kotlin-stdlib-jdk7.jar:$TIS_KOTLIN_HOME/lib/kotlin-stdlib-jdk8.jar:$TIS_KOTLIN_HOME/lib/kotlin-test.jar:$TIS_KOTLIN_HOME/lib/kotlin-test-junit.jar"
          java -Xmx4g -Djava.library.path=arib_si_engine_rs/host_ci/target/debug/deps -cp "$runtime_classpath" org.junit.runner.JUnitCore "${test_classes[@]}" | tee "$RUNNER_TEMP/tis-junit.log"
          grep --fixed-strings "OK (131 tests)" "$RUNNER_TEMP/tis-junit.log"
      - name: Parse TIS XML
        run: |
          python3 -c 'from pathlib import Path; from xml.etree import ElementTree; paths=sorted(Path("tis").rglob("*.xml")); assert paths; [ElementTree.parse(path) for path in paths]'
