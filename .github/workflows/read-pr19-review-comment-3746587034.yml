name: Read PR19 review comment 3746587034

on:
  push:
    paths:
      - '.github/workflows/read-pr19-review-comment-3746587034.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  read-comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-tis-arib-design-residuals
      - name: Save full review comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/kazuki0824/tv/pulls/comments/3746587034 --jq .body > .review-comment-3746587034.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .review-comment-3746587034.txt
          git commit -m 'chore: capture PR19 review comment 3746587034'
          git push origin HEAD:agent/fix-tis-arib-design-residuals
