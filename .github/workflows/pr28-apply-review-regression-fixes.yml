name: PR28 apply review regression fixes
on:
  push:
    paths:
      - '.github/workflows/pr28-apply-review-regression-fixes.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-commonization-boundaries
          fetch-depth: 1
      - name: Apply reviewed design replacements
        run: |
          git fetch origin 16a3a0141a2daea182789cb922746c9a45c1c392
          git show 16a3a0141a2daea182789cb922746c9a45c1c392:.github/workflows/pr28-review-regression-fixes.yml > /tmp/source.yml
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/source.yml').read_text().splitlines()
          start = next(i for i, x in enumerate(lines) if x.strip() == '- name: Apply design fixes')
          run = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
          end = next(i for i in range(run + 1, len(lines)) if lines[i].startswith('      - name:'))
          code = []
          for line in lines[run + 1:end]:
              if line.startswith('          '):
                  code.append(line[10:])
              elif not line.strip():
                  code.append('')
              else:
                  raise SystemExit(f'unexpected indentation: {line!r}')
          script = '\n'.join(code) + '\n'
          compile(script, '<review-fixes>', 'exec')
          exec(script, {'__name__': '__main__'})
          PY
          git diff --check
          test "$(git diff --name-only | sort)" = $'tuner_hal/DESIGN_JA.md\ntuner_hal2/DESIGN_JA.md'
          git config user.name maleicacid
          git config user.email 4982384+kazuki0824@users.noreply.github.com
          git add tuner_hal/DESIGN_JA.md tuner_hal2/DESIGN_JA.md
          git commit -m 'design: restore PR27 responsibility boundaries'
          git push origin HEAD:agent/fix-commonization-boundaries
