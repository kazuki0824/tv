name: temporary PR85 private test surfaces

on:
  push:
    branches:
      - tmp/tuner-hal2-soong-clippy-hygiene-clean

permissions:
  contents: write

jobs:
  privatize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/tuner-hal2-soong-clippy-hygiene-clean
          fetch-depth: 0
          persist-credentials: true

      - name: Configure toolchain
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rustup toolchain install 1.81.0 --profile minimal --component clippy

      - name: Privatize reviewed module-local test surfaces
        run: |
          set -eux
          git checkout -B work origin/fix/tuner-hal2-soong-clippy-hygiene
          test "$(git rev-parse HEAD)" = "7dce2746110a987bda13c4d8ffa8f56c2d42174f"

          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = {
              'tuner_hal2/aidl_service/src/service_context.rs': [('fn', 'drop_leak_error_diagnostic_snapshot')],
              'tuner_hal2/demux/src/parser/packet_pipeline.rs': [
                  ('fn', 'validate_packet'), ('fn', 'push_ts_packet'), ('fn', 'inspect_ts_packet'),
              ],
              'tuner_hal2/demux/src/parser/record_index.rs': [('fn', 'processed_packets')],
              'tuner_hal2/demux/src/parser/sections.rs': [
                  ('fn', 'oversized_section_drops'), ('fn', 'stale_partial_section_discards'), ('fn', 'push_payload'),
              ],
              'tuner_hal2/demux/src/runtime/demux.rs': [
                  ('fn', 'register_filter_from_open_request'), ('fn', 'consume_playback_dvr_queue'),
              ],
              'tuner_hal2/demux/src/runtime/dvr.rs': [
                  ('field', 'playback_completion'), ('field', 'playback_processing_buffer'),
              ],
              'tuner_hal2/demux/src/runtime/filter.rs': [('fn', 'prepare_next_source_relation_generation')],
              'tuner_hal2/device/src/runtime/frontend_runtime.rs': [
                  ('fn', 'state'), ('fn', 'active_scan_session'), ('fn', 'next_generation'),
              ],
              'tuner_hal2/device/src/runtime/tune_txn.rs': [
                  ('fn', 'attempted_steps'), ('fn', 'failure'), ('fn', 'completed_steps'),
                  ('struct', 'TuneWorkerStart'), ('fn', 'apply_with_worker'),
                  ('enum', 'FrontendTuneOutcome'), ('struct', 'FrontendTuneTxn'),
              ],
              'tuner_hal2/service_runtime/src/boot.rs': [
                  ('fn', 'reserve_filter_capacity_for_test'), ('fn', 'release_filter_capacity_for_test'),
                  ('fn', 'reserve_dvr_capacity_for_test'), ('fn', 'release_dvr_capacity_for_test'),
              ],
              'tuner_hal2/service_runtime/src/frontend_worker_txn.rs': [('fn', 'stop_frontend_worker')],
              'tuner_hal2/service_runtime/src/lnb_ops.rs': [
                  ('fn', 'set_frontend_lnb'), ('fn', 'apply_lnb_voltage'), ('fn', 'apply_lnb_tone'),
                  ('fn', 'apply_lnb_satellite_position'), ('fn', 'send_lnb_diseqc'),
              ],
              'tuner_hal2/service_runtime/src/registry.rs': [
                  ('fn', 'lnb_runtime_mut'), ('fn', 'unbind_lnb_from_frontend'),
              ],
          }

          def declaration_pattern(kind, name):
              n = re.escape(name)
              if kind == 'fn':
                  return re.compile(rf'\bpub\(crate\)\s+(?:(?:const|async|unsafe)\s+)*fn\s+{n}\b')
              if kind == 'field':
                  return re.compile(rf'\bpub\(crate\)\s+{n}\s*:')
              if kind == 'struct':
                  return re.compile(rf'\bpub\(crate\)\s+struct\s+{n}\b')
              if kind == 'enum':
                  return re.compile(rf'\bpub\(crate\)\s+enum\s+{n}\b')
              raise ValueError(kind)

          changed = 0
          for path, declarations in targets.items():
              p = Path(path)
              lines = p.read_text().splitlines(keepends=True)
              for kind, name in declarations:
                  pattern = declaration_pattern(kind, name)
                  matches = [i for i, line in enumerate(lines) if pattern.search(line)]
                  if len(matches) != 1:
                      raise SystemExit(f'{path}: {kind} {name}: expected exactly one declaration, got {matches}')
                  i = matches[0]
                  context = ''.join(lines[max(0, i - 8):i + 1])
                  if '#[cfg(test)]' not in context:
                      raise SystemExit(f'{path}: {kind} {name}: declaration is not guarded by nearby #[cfg(test)]')
                  lines[i] = lines[i].replace('pub(crate) ', '', 1)
                  changed += 1
              p.write_text(''.join(lines))

          print('privatized declarations:', changed)
          if changed != 35:
              raise SystemExit(f'expected 35 privatizations, got {changed}')
          PY

          git diff --check
          git diff --stat
          git add tuner_hal2
          git commit -m 'refactor(tuner-hal2): privatize module-local test surfaces'

      - name: Validate visibility invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cfg_pub_crate = re.compile(
              r'#\[cfg\(test\)\]\s*\n(?:\s*#\[[^\n]+\]\s*\n)*\s*pub\(crate\)\s+',
              re.MULTILINE,
          )
          cfg_plain_pub = re.compile(
              r'#\[cfg\(test\)\]\s*\n(?:\s*#\[[^\n]+\]\s*\n)*\s*pub\s+',
              re.MULTILINE,
          )
          allow = re.compile(r'#\s*!?\s*\[\s*allow\s*\(')
          pub_crate = 0
          plain = []
          allows = []
          for p in Path('tuner_hal2').rglob('*.rs'):
              s = p.read_text()
              pub_crate += len(cfg_pub_crate.findall(s))
              if cfg_plain_pub.search(s): plain.append(str(p))
              if allow.search(s): allows.append(str(p))
          print('cfg(test)+pub(crate):', pub_crate)
          print('cfg(test)+plain pub:', plain)
          print('allow hits:', allows)
          if pub_crate != 82 or plain or allows:
              raise SystemExit(1)
          PY
          git diff --check

      - name: Check Rust 1.81 host build and all-target Clippy
        run: |
          set -eux
          cd tuner_hal2/host_ci
          cargo +1.81.0 check --workspace --lib --locked
          cargo +1.81.0 clippy --workspace --all-targets --locked -- -D warnings

      - name: Publish PR branch
        run: |
          set -eux
          git push origin HEAD:fix/tuner-hal2-soong-clippy-hygiene
