name: temporary PR85 private test surfaces

on:
  push:
    branches: [tmp/tuner-hal2-soong-clippy-hygiene-clean]

permissions:
  contents: write

jobs:
  narrow:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/tuner-hal2-soong-clippy-hygiene-clean
          fetch-depth: 0
          persist-credentials: true
      - name: Configure toolchain
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rustup toolchain install 1.81.0 --profile minimal --component clippy
      - name: Apply one-pass pub(super) narrowing
        run: |
          set -eux
          git checkout -B work origin/fix/tuner-hal2-soong-clippy-hygiene
          test "$(git rev-parse HEAD)" = "f59aad676cb68411f15a55c58c66c31723e791d0"
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = {
            'tuner_hal2/demux/src/runtime/dvr.rs': [
              ('fn','new'),
              ('fn','install_test_playback_processing_buffer'),
              ('fn','push_playback_bytes'),
              ('fn','take_playback_processing_buffer'),
              ('fn','restore_playback_processing_buffer'),
              ('fn','drain_playback_completion_for_boundary'),
            ],
            'tuner_hal2/demux/src/runtime/filter.rs': [
              ('fn','new'),
              ('fn','set_source_relation_generation_for_test'),
              ('fn','restore'),
            ],
            'tuner_hal2/demux/src/runtime/pcr_clock_anchor.rs': [
              ('fn','observation_for_test'),
            ],
            'tuner_hal2/device/src/runtime/tune_txn.rs': [
              ('fn','generation'),
            ],
            'tuner_hal2/service_runtime/src/boot/demux_filter_dvr_ops.rs': [
              ('fn','start_filter_runtime'),
            ],
          }

          def pattern(kind, name):
            n = re.escape(name)
            if kind == 'fn':
              return re.compile(rf'\bpub\(crate\)\s+(?:(?:const|async|unsafe)\s+)*fn\s+{n}\b')
            raise ValueError(kind)

          changed = 0
          for path, decls in targets.items():
            p = Path(path)
            lines = p.read_text().splitlines(keepends=True)
            for kind, name in decls:
              rx = pattern(kind, name)
              hits = [i for i, line in enumerate(lines) if rx.search(line)]
              if len(hits) != 1:
                raise SystemExit(f'{path}: {name}: expected exactly one declaration, got {hits}')
              i = hits[0]
              context = ''.join(lines[max(0, i - 8):i + 1])
              if '#[cfg(test)]' not in context:
                raise SystemExit(f'{path}: {name}: not guarded by nearby #[cfg(test)]')
              lines[i] = lines[i].replace('pub(crate) ', 'pub(super) ', 1)
              changed += 1
            p.write_text(''.join(lines))

          print('narrowed to pub(super):', changed)
          if changed != 12:
            raise SystemExit(f'expected 12, got {changed}')
          PY
          git diff --check
          git add tuner_hal2
          git commit -m 'refactor(tuner-hal2): narrow shared test visibility to parent modules'
      - name: Validate visibility invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          pc = re.compile(r'#\[cfg\(test\)\]\s*\n(?:\s*#\[[^\n]+\]\s*\n)*\s*pub\(crate\)\s+', re.M)
          ps = re.compile(r'#\[cfg\(test\)\]\s*\n(?:\s*#\[[^\n]+\]\s*\n)*\s*pub\(super\)\s+', re.M)
          pp = re.compile(r'#\[cfg\(test\)\]\s*\n(?:\s*#\[[^\n]+\]\s*\n)*\s*pub\s+', re.M)
          al = re.compile(r'#\s*!?\s*\[\s*allow\s*\(')
          c = s_count = 0
          plain = []
          allows = []
          for p in Path('tuner_hal2').rglob('*.rs'):
            text = p.read_text()
            c += len(pc.findall(text))
            s_count += len(ps.findall(text))
            if pp.search(text): plain.append(str(p))
            if al.search(text): allows.append(str(p))
          print('cfg(test)+pub(crate):', c)
          print('cfg(test)+pub(super):', s_count)
          print('cfg(test)+plain pub:', plain)
          print('allow hits:', allows)
          if c != 71 or s_count < 12 or plain or allows:
            raise SystemExit(1)
          PY
          git diff --check
      - name: Check Rust 1.81 host build and all-target Clippy
        run: |
          set -eux
          cd tuner_hal2/host_ci
          cargo +1.81.0 check --workspace --lib --locked
          cargo +1.81.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Publish PR branch
        run: git push origin HEAD:fix/tuner-hal2-soong-clippy-hygiene
