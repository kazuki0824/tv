name: temporary PR78 ISDB-T SSOT acceptance wording

on:
  push:
    branches: [fix/tuner-hal2-contract-boundaries]
    paths:
      - ".github/workflows/tmp-pr78-isdbt-ssot-acceptance-wording.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tuner-hal2-contract-boundaries
          fetch-depth: 0
      - name: Apply exact DESIGN_JA wording patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tuner_hal/DESIGN_JA.md")
          text = path.read_text(encoding="utf-8")
          old = "ARIB STD-B31 2.2-E1は、モードを2.3、内符号化率を3.8と3.15.6.6、搬送波変調を3.9と3.15.6.5、時間インターリーブを3.11.1と3.15.6.7、ガードインターバルを3.14.2で定義する。本製品の対象バックエンドでAUTOだけを受け付けることは、ARIB上の値を否定するものではない。明示的な設定経路がない対象について、対応能力を過大に表明しないための制限である。"
          new = "ARIB STD-B31 2.2-E1は、モードを2.3、内符号化率を3.8と3.15.6.6、搬送波変調を3.9と3.15.6.5、時間インターリーブを3.11.1と3.15.6.7、ガードインターバルを3.14.2で定義する。本製品の対象バックエンドで明示要求として`AUTO`だけを対応値として受け付け、`UNDEFINED`はcaller constraintなしのAOSP sentinelとして別途受理することは、ARIB上の値を否定するものではない。明示的な設定経路がない対象について、対応能力を過大に表明しないための制限である。"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"ISDB-T acceptance wording target count={count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-pr78-isdbt-ssot-acceptance-wording.yml
          git add tuner_hal/DESIGN_JA.md
          git commit -m "docs(tuner): align ISDB-T sentinel acceptance wording"
          git push origin HEAD:fix/tuner-hal2-contract-boundaries
