name: PR2 review10 synchronize 2026-08-04

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/pr2-review10-pr-trigger-20260804.txt

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tooling
        uses: actions/checkout@v4
        with:
          ref: main
          path: tooling
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/apply-tuner-hal2-design-proposals-v70
          path: work
      - name: Apply design fixes
        run: |
          cp tooling/.github/pr2-review10-patch-20260804.py work/.github/pr2-review10-patch-20260804.py
          python3 work/.github/pr2-review10-patch-20260804.py
          rm work/.github/pr2-review10-patch-20260804.py
      - name: Validate and push
        working-directory: work
        run: |
          set -euxo pipefail
          rm .github/pr2-review10-pr-trigger-20260804.txt
          rm .github/workflows/pr2-review10-prtrigger-20260804.yml
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' .github/pr2-review10-pr-trigger-20260804.txt .github/workflows/pr2-review10-prtrigger-20260804.yml tuner_hal/DESIGN_JA.md | sort)"
          test "$changed" = "$expected"
          python3 - <<'PY'
          from pathlib import Path
          text = Path('tuner_hal/DESIGN_JA.md').read_text(encoding='utf-8')
          for stale in (
              '現行`ProductProfile`では当該組合せを対応済みと表明せず',
              '`configure()`のvalidate段階で`UNAVAILABLE`',
              '`ProductProfile`に宣言した完全vectorを優先順に検証',
              'query-onlyの縮退状態',
              'tableInfoCompletionWindowMs',
              'broadcast-cycle closure',
          ):
              assert stale not in text, stale
          for required in (
              'TableInstanceKey=',
              'section_number=0..last_section_number',
              'tableInfoOneShotBufferBytes = checked_mul(256, maxSupportedSectionBytes)',
              '選択済み`CapabilityClosure`のclaimから導出',
              '最大256 section×4096 bytes',
              'T-SEC-14h',
          ):
              assert required in text, required
          assert text.count('```') % 2 == 0
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .github/pr2-review10-pr-trigger-20260804.txt .github/workflows/pr2-review10-prtrigger-20260804.yml tuner_hal/DESIGN_JA.md
          git commit -m 'docs: complete section one-shot and closure degradation'
          git push origin HEAD:agent/apply-tuner-hal2-design-proposals-v70
