name: Verify PR54 BS/audio fixes v8

on:
  push:
    branches: [codex/pr54-apply-20260902]
    paths: [.github/workflows/codex-pr54-21-31-verify-push-v8.yml]

permissions:
  contents: write

env:
  EXPECTED_TARGET_SHA: 9b3ed7440a923ff861b7ff19cf03a0490677b015
  TARGET_BRANCH: agent/implement-tis-arib-si-design-pr53
  RUST_TOOLCHAIN: 1.81.0
  KOTLIN_VERSION: 1.9.22

jobs:
  verify-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr54-apply-20260902
          path: staging
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 2
          path: target
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
      - name: Apply, verify, commit and push
        shell: bash
        run: |
          sed -e 's#codex_apply_pr54_31_fixed3.py#codex_apply_pr54_31_fixed4.py#' -e 's#codex_apply_pr54_21.py#codex_apply_pr54_21_fixed.py#' staging/codex_verify_pr54_21_31.sh > staging/codex_verify_runtime.sh
          sed -i '/codex_apply_pr54_21_fixed.py/a python3 "$STAGING_DIR/codex_fix_pr54_provider_test_initializers.py"\npython3 "$STAGING_DIR/codex_fix_pr54_kotlin_names.py"\npython3 "$STAGING_DIR/codex_fix_pr54_scan_plan_test.py"' staging/codex_verify_runtime.sh
          bash staging/codex_verify_runtime.sh "$GITHUB_WORKSPACE/target"
