name: PR2 review7 PR trigger 2026-08-03

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/pr2-review7-pr-trigger-20260803.txt

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tooling
        uses: actions/checkout@v4
        with:
          ref: main
          path: tooling
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/apply-tuner-hal2-design-proposals-v70
          path: work
      - name: Check trigger
        id: trigger
        working-directory: work
        run: |
          if test -f .github/pr2-review7-pr-trigger-20260803.txt; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply design fixes
        if: steps.trigger.outputs.present == 'true'
        run: python3 tooling/.github/pr2-review7-patch-20260803.py work
      - name: Validate and push
        if: steps.trigger.outputs.present == 'true'
        working-directory: work
        run: |
          rm .github/pr2-review7-pr-trigger-20260803.txt
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' .github/pr2-review7-pr-trigger-20260803.txt tuner_hal/CODE_CONVENTION.md tuner_hal/DESIGN_JA.md tis/DESIGN_JA.md | sort)"
          test "$changed" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .github/pr2-review7-pr-trigger-20260803.txt tuner_hal/CODE_CONVENTION.md tuner_hal/DESIGN_JA.md tis/DESIGN_JA.md
          git commit -m 'docs: address latest tuner review findings'
          git push origin HEAD:agent/apply-tuner-hal2-design-proposals-v70
