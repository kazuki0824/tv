name: PR2 review12 synchronize 2026-08-04

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/pr2-review12-trigger-20260804.txt

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tooling
        uses: actions/checkout@v4
        with:
          ref: main
          path: tooling
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/apply-tuner-hal2-design-proposals-v70
          path: work
      - name: Apply design fixes
        run: python3 tooling/.github/pr2-review12-patch-20260804.py work
      - name: Validate and push
        working-directory: work
        run: |
          set -euxo pipefail
          rm .github/pr2-review12-trigger-20260804.txt
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' .github/pr2-review12-trigger-20260804.txt tis/DESIGN_JA.md tuner_hal2/DESIGN_JA.md | sort)"
          test "$changed" = "$expected"
          python3 - <<'PY'
          from pathlib import Path
          tis = Path('tis/DESIGN_JA.md').read_text(encoding='utf-8')
          hal2 = Path('tuner_hal2/DESIGN_JA.md').read_text(encoding='utf-8')
          for stale in (
              'decoder構成完了後かつAV filter開始前',
              'nextAttemptAtMillis',
              'pending 平文',
              'pending平文',
              'reflection による補助設定',
              '明示的に none / `UNDEFINED` 相当に設定',
          ):
              assert stale not in tis, stale
          for required in (
              'startupQueueBudgetBytes',
              'SERVICE_TYPE_AUDIO',
              'earliestEligibleAtMillis',
              'DirectBootEpgPending',
              'AudioTrack.Builder.setContext(Context)',
              'setterをどちらも呼ばない',
          ):
              assert required in tis, required
          for required in (
              '静的inventory／capability参照メソッド',
              'FrontendStatusSnapshot',
              'bounded同期read',
          ):
              assert required in hal2, required
          assert tis.count('```') % 2 == 0
          assert hal2.count('```') % 2 == 0
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .github/pr2-review12-trigger-20260804.txt tis/DESIGN_JA.md tuner_hal2/DESIGN_JA.md
          git commit -m 'docs: close TIS startup and provider state gaps'
          git push origin HEAD:agent/apply-tuner-hal2-design-proposals-v70
