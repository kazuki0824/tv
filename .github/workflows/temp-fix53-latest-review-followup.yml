name: temp PR53 latest review follow-up

on:
  push:
    branches:
      - fix/tuner-hal2-rustfmt-1.81
    paths:
      - .github/workflows/temp-fix53-latest-review-followup.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tuner-hal2-rustfmt-1.81
          persist-credentials: true
          fetch-depth: 0
      - name: Apply consistency fixes
        run: python3 tools/temp_fix53_latest_review_followup.py
      - name: Verify stale anchors are gone
        run: |
          ! grep -R -n -F 'service_runtime/src/demux_filter_dvr_ops.rs' tuner_hal2/DESIGN_JA.md
          ! grep -R -n -F 'service_runtime/src/packet_ops.rs' tuner_hal2/DESIGN_JA.md
          ! grep -R -n -F 'FMQ backpressure中の未確定sectionは既存のsection assembler／配送保留予算で保持' tuner_hal/DESIGN_JA.md
      - name: Test
        working-directory: tuner_hal2/host_ci
        run: cargo test --workspace --locked
      - name: Check
        working-directory: tuner_hal2/host_ci
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        working-directory: tuner_hal2/host_ci
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tuner_hal/DESIGN_JA.md tuner_hal2/DESIGN_JA.md
          git commit -m "Finish review contract consistency"
          git push origin HEAD:fix/tuner-hal2-rustfmt-1.81
