name: PR19 review round 7

on:
  push:
    branches:
      - agent/fix-tis-arib-design-residuals
    paths:
      - '.github/workflows/pr19-round7.yml'
      - '.github/scripts/apply_pr19_round7.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-tis-arib-design-residuals
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply design changes
        run: python .github/scripts/apply_pr19_round7.py
      - name: Check whitespace
        run: git diff --check
      - name: Commit design document only
        run: |
          if git diff --quiet -- tis/DESIGN_JA.md; then
            echo 'No design change produced' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tis/DESIGN_JA.md
          git commit -m 'docs: close playback review residuals'
          git push origin HEAD:agent/fix-tis-arib-design-residuals
