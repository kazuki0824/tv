name: apply-record-origin-review-fix

on:
  push:
    branches:
      - agent/remove-record-frontend-origin-limit
    paths:
      - .github/workflows/apply-record-origin-review-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-record-frontend-origin-limit
      - name: Remove stale record-origin prohibition
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tuner_hal/DESIGN_JA.md')
          s = p.read_text()
          old = '三者を同じcontinuity、parser、flush generation名前空間へ入れてはならない。playback由来packetのrecord経路への再投入禁止は後述のorigin契約に従う。'
          new = '三者を同じcontinuity、parser、flush generation名前空間へ入れてはならない。'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one stale prohibition, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tuner_hal/DESIGN_JA.md
          git rm .github/workflows/apply-record-origin-review-fix.yml
          git commit -m 'docs: remove stale playback record prohibition'
          git push origin HEAD:agent/remove-record-frontend-origin-limit
