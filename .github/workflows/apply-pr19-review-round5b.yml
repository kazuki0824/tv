name: Apply PR19 review round 5b

on:
  push:
    branches:
      - agent/fix-tis-arib-design-residuals
    paths:
      - .github/workflows/apply-pr19-review-round5b.yml
      - .github/scripts/apply_pr19_round5b.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-tis-arib-design-residuals
      - name: Apply design changes
        run: python3 .github/scripts/apply_pr19_round5b.py
      - name: Verify and push
        run: |
          git diff --check
          if git grep -n -E 'MediaSync first-frame gate|同generationのMediaSync|block model QueueRequest|CONFIGURE_FLAG_USE_BLOCK_MODEL|QueueRequest.setLinearBlock|QueueRequest.setPresentationTimeUs|decoder／MediaSync入力|正常sampleはES全体をcopyせず' -- tis/DESIGN_JA.md; then
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tis/DESIGN_JA.md
          git commit -m 'docs: synchronize Media3 playback input ownership'
          git push
