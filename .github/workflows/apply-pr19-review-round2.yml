name: Apply PR19 review round2

on:
  push:
    branches:
      - agent/fix-tis-arib-design-residuals

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-tis-arib-design-residuals
          fetch-depth: 0
      - shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one match, got {n}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'tis/DESIGN_JA.md',
              "video decoderには実行開始前に `MediaCodec.OnFrameRenderedListener` を登録する。ただしcodecのoutput Surfaceは`MediaSync.createInputSurface()`で得たMediaSync入力Surfaceなので、current decoder/current playback generationの`onFrameRendered()`はdecoderからMediaSync入力へframeが渡ったことを示す中間観測に限定し、`notifyVideoAvailable()`のfinal commit pointにはしない。callbackの`presentationTimeUs`をcurrent generationの`firstFrameCandidatePtsUs`として記録した後、同じserial executor上で`MediaSync.getTimestamp()`を確認する。`notifyVideoAvailable()`は、candidateが存在し、MediaSyncがcurrent generationでplayback rate 0より大きく再生中で、`getTimestamp()`がnon-nullかつ`MediaTimestamp.getMediaClockRate()>0`で、そのcurrent playback positionである`getAnchorMediaTimeUs()`が`firstFrameCandidatePtsUs`以上に到達し、`MediaSync.setSurface()`へ設定したcurrent `sessionSurface`が有効で、視聴制限でblockされず、同generationで`MEDIASYNC_ERROR_SURFACE_FAIL`が発生していない場合だけ一度呼ぶ。`getTimestamp()`がnullまたはcandidate時刻未到達なら通知せず、後続のcurrent-generation decoder/MediaSync pipeline callbackで同じgateを再評価する。旧decoder/旧generationのcallbackは無視する。AOSP `MediaTimestamp`のpresentationはplatformが把握できる範囲で外部観測可能またはpresentation commit済みの時刻を表すため、この公開APIのbest-effort presentation evidenceを用い、固定delay、独自clock、独自frame scheduler、compositor/pixel probeは追加しない。",
              "video decoderには実行開始前に `MediaCodec.OnFrameRenderedListener` を登録する。codecのoutput Surfaceは`MediaSync.createInputSurface()`で得たMediaSync入力Surfaceなので、current decoder/current playback generationの最初の`onFrameRendered()`はdecoderからMediaSync入力へ少なくとも1 frameが渡ったことを示す中間観測に限定する。Android公開`MediaSync` APIには、その後の特定video frameが`sessionSurface`へ実際に提示されたことを通知するvideo presentation callbackはなく、`MediaSync.getTimestamp()`もcurrent playback positionであって表示済みvideo frameのcommit通知ではないため、これらを厳密なcompositor presentation証明として扱わない。TIFの`notifyVideoAvailable()`はTISがcontentをready for viewingと判断した時点で呼ぶ状態通知であり、特定frameのcompositor commit tokenを要求するAPIではない。現行productでは、current decoder/current generationで最初の`onFrameRendered()`を受け、MediaSyncがcurrent generationでplayback rate 0より大きく開始済み、`MediaSync.setSurface()`へ設定したcurrent `sessionSurface`が有効、視聴制限でblockされておらず、同generationで`MEDIASYNC_ERROR_SURFACE_FAIL`が発生していない場合を、公開APIで構成できる最小のready-for-viewing判定として`notifyVideoAvailable()`を一度だけ呼ぶ。旧decoder/旧generationのcallbackは無視する。厳密な最終pixel提示を証明するための固定delay、独自clock、独自frame scheduler、hidden API、Surface/compositor pixel probeは追加しない。"
          )

          replace_once(
              'tis/DESIGN_JA.md',
              "`tunneled`／platform passthrough playback pathは現行productの設計候補から外し、実装しない。`notifyVideoAvailable()`はcurrent decoder/current generationの最初の `MediaCodec.OnFrameRenderedListener.onFrameRendered()` と本書「再生経路」のMediaSync再生開始・surface・generation・視聴制限gateを満たしたことだけをcommit pointとし、単なるfilter開始、入力event到着、decoder output生成をgateにしない。",
              "`tunneled`／platform passthrough playback pathは現行productの設計候補から外し、実装しない。`notifyVideoAvailable()`は、本書「再生経路」で定義したとおり、current decoder/current generationの最初の`MediaCodec.OnFrameRenderedListener.onFrameRendered()`をMediaSync入力到達の中間観測として使い、MediaSync再生開始、current session Surface有効、generation、視聴制限、MediaSync Surface errorの各gateを満たした時点を公開APIで構成可能なready-for-viewing判定とする。`MediaSync.getTimestamp()`を表示済みvideo frameの証明には使わず、単なるfilter開始、入力event到着、decoder output生成だけでは通知しない。"
          )

          replace_once(
              'tis/DESIGN_JA.md',
              "- `notifyVideoAvailable()` は `MediaCodec.OnFrameRenderedListener.onFrameRendered()`をMediaSync入力Surface到達の中間観測として扱い、そのcurrent-generation candidate PTSに`MediaSync.getTimestamp()`のcurrent playback positionが到達したこと、playback rateが0より大きいこと、current session Surfaceが有効で`MEDIASYNC_ERROR_SURFACE_FAIL`がなく、視聴制限でblockされていないことを全て満たした場合だけ呼ぶ。旧decoder／旧generationのcallbackは無視し、固定delay、独自clock、pixel probeは使わない。",
              "- `notifyVideoAvailable()` は `MediaCodec.OnFrameRenderedListener.onFrameRendered()`をMediaSync入力Surface到達の中間観測として扱い、current generationで少なくとも1 video frameがMediaSync入力へ渡され、playback rateが0より大きく、current session Surfaceが有効で`MEDIASYNC_ERROR_SURFACE_FAIL`がなく、視聴制限でblockされていない場合に一度だけ呼ぶ。Android公開APIには特定video frameの最終`sessionSurface`提示完了callbackがないため、`MediaSync.getTimestamp()`をその証明へ転用せず、固定delay、独自clock、hidden API、pixel probeも使わない。"
          )

          replace_once(
              'tis/DESIGN_JA.md',
              "最低試験契約は、型付きLinearBlock→block model QueueRequest、ES全体copy禁止、PTS欠落sample単体dropとgeneration継続、通常PTS wrap、`OnFrameRendered`単独ではvideo availableにしないこと、candidate PTSに対する`MediaSync.getTimestamp()`未到達/null時の抑止と到達時の一回だけのavailability通知、audio bufferのconsume callbackまでの寿命、A/V同期、video-only、audio-only、非wrap discontinuity後のMediaSync再生成、Surface／route変更後の旧generation非利用、MediaSync error写像、stale generation非描画を含む。試験のqueue数値上限は選択した`ProductProfile`と一致させる。",
              "最低試験契約は、型付きLinearBlock→block model QueueRequest、ES全体copy禁止、PTS欠落sample単体dropとgeneration継続、通常PTS wrap、`OnFrameRendered`単独ではvideo availableにしないこと、current generationで最初のvideo frameがMediaSync入力へ渡された後もplayback rate／current Surface／parental／Surface-error gateが揃うまで抑止すること、`MediaSync.getTimestamp()`をfinal video presentation証明として使わないこと、条件成立後に一回だけavailability通知すること、audio bufferのconsume callbackまでの寿命、A/V同期、video-only、audio-only、非wrap discontinuity後のMediaSync再生成、Surface／route変更後の旧generation非利用、MediaSync error写像、stale generation非描画を含む。試験のqueue数値上限は選択した`ProductProfile`と一致させる。"
          )

          replace_once(
              'ARIB_SI_EPG_TvProvider投影方針.md',
              "- `start_time=0xFFFFFFFFFF` かつ `duration=0xFFFFFF` の場合はevent未定状態とする。event内容自体が未確定であり `event_id` に意味はない。この状態を stable event identity に昇格させず、後続EITの具体eventと `event_id` だけで同一eventとして相関してはならない。",
              "- `start_time=0xFFFFFFFFFF` かつ `duration=0xFFFFFF` の場合も、ARIB規定として断定するのは両timing fieldが未定義値であることまでとし、raw `event_id` field自体の意味が失われるとは扱わない。本製品では、具体時刻を持つeventとの誤相関・既存Programの誤削除を避ける保守的ポリシーとして、この状態をpersistent stable event identityへ昇格させず、後続EITの具体eventとraw `event_id`だけで自動相関しない。"
          )

          replace_once(
              'ARIB_SI_EPG_TvProvider投影方針.md',
              "14. EIT `start_time` の具体値はJSTとして解釈してUTC epoch millisへ変換する。片方だけall-1の時刻未定eventは架空の開始・終了時刻で `Programs` へ投影せず、後続EITの同じevent identityと相関できる。`start_time=0xFFFFFFFFFF`かつ`duration=0xFFFFFF`のevent未定状態は `event_id` をstable identityとして扱わず、後続の具体eventと `event_id` だけで相関しない。",
              "14. EIT `start_time` の具体値はJSTとして解釈してUTC epoch millisへ変換する。片方だけall-1の時刻未定eventは架空の開始・終了時刻で `Programs` へ投影せず、本製品のstable identity規則に従って後続EITと相関できる。`start_time=0xFFFFFFFFFF`かつ`duration=0xFFFFFF`ではraw `event_id` field自体をARIB上無意味とは断定せず、本製品の誤相関・誤削除防止ポリシーとしてpersistent stable identityへ昇格させず、後続の具体eventとraw `event_id`だけで自動相関しない。"
          )

          replace_once(
              'ARIB_SI_EPG_TvProvider投影方針.md',
              "- ARIBで定義された `start_time=0xFFFFFFFFFF` / `duration=0xFFFFFF` の未定義値は不正timingに含めない。片方だけall-1の場合は `event_id` が有効な時刻未定状態、両方all-1の場合は `event_id` に意味がないevent未定状態として区別する。それ以外の不正な EIT event timing は、以前有効だった event が消滅した根拠にしてはならない。不正 section だけでは 廃止行削除区間 を作らない。",
              "- ARIBで定義された `start_time=0xFFFFFFFFFF` / `duration=0xFFFFFF` の未定義値は不正timingに含めない。片方だけall-1の場合と両方all-1の場合を区別するが、両方all-1でもraw `event_id` field自体をARIB上無意味とは断定しない。両方all-1をpersistent stable identity、deletion-authoritativeなvalid-event-set、後続具体eventとの自動相関へ使わないのは本製品の誤相関・誤削除防止ポリシーとする。それ以外の不正な EIT event timing は、以前有効だった event が消滅した根拠にしてはならない。不正 section だけでは 廃止行削除区間 を作らない。"
          )
          PY

          git diff --check
          git diff --name-only | sort
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tis/DESIGN_JA.md ARIB_SI_EPG_TvProvider投影方針.md
          git commit -m 'docs: address second PR19 review round'
          git push origin HEAD:agent/fix-tis-arib-design-residuals
