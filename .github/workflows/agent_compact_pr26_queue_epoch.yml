name: agent-compact-pr26-queue-epoch

on:
  push:
    branches:
      - agent/fix-playback-dvr-origin-generation

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/agent_compact_pr26.py
      - run: rm .github/agent_compact_pr26.py .github/workflows/agent_compact_pr26_queue_epoch.yml
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tuner_hal/DESIGN_JA.md .github/agent_compact_pr26.py .github/workflows/agent_compact_pr26_queue_epoch.yml
          git commit -m 'docs: deduplicate playback queue epoch contract'
          git push
