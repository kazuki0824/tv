name: agent-compact-pr26-queue-epoch

on:
  push:
    branches:
      - agent/fix-playback-dvr-origin-generation

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deduplicate QueueEpochProtocol text without dropping contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tuner_hal/DESIGN_JA.md')
          s = p.read_text()
          old = '''状態は `Open(g)`、`Draining(g)`、`Closed` の3種類だけとする。`beginRead` / `beginWrite` は、キュー識別子、検査済みキュー世代、方向、予約情報を持つParcelableではない一回限りのRAIIトークンを返す。`commit` / `cancel` はこのトークンを正確に1回消費する。未消費トークンの所有者が通常return、エラーreturn、取り消し、またはpanicでスコープを離れた場合は`Drop`が`cancel`と同じ予約解除を行い、受付中件数を減らして待機者を起床させる。`flush()`は`Draining`へ移り、新しいトランザクションを拒否して、世代gで受付済みのトランザクションがすべてcommit、cancel、またはRAII取消になるまで待つ。その後、DVRキューを一括消去し、検査済みのg+1へ進めて`Open`に戻る。失敗時はポインター、内容、世代を維持する。閉鎖または所有者消滅ではキュー識別子を閉じ、すべてのトークンを古いものとして無効化し、待機者を起床させる。playback queue のlogical incarnationは既存の `PlaybackQueueBacking` が所有する `queue_identity` を正本とする。`queue_identity` はfd番号やdescriptor内容などの再利用可能な物理値ではなく、同一DVR object寿命中に再利用しない。`QueueEpochProtocol` はこのidentityを参照し、同一identity内の `queue_epoch` だけを所有する。記述子の置換では `StreamBoundaryTxn` のboundary commitで旧originのcontinuity / assembler / parser stateを切断し、旧 `queue_identity` を閉じてから、`PlaybackQueueBacking` が世代0の再利用しない新しい `queue_identity` を発行する。

Playback DVR の入力originは `TsInputOrigin::PlaybackDvr(dvr_id, queue_identity, queue_epoch)` を唯一の正本キーとし、別の `dvr_generation` は設けない。`queue_identity` は `PlaybackQueueBacking` が所有するlogical incarnation token、`queue_epoch` は `QueueEpochProtocol` が所有する同一identity内のflush世代とする。キュー生成時の `queue_epoch` は0とし、`stop()` / `start()` ではidentityとepochを維持し、成功した `flush()` の消去commitでだけepochを進める。`flush()` とdescriptor replacementで旧originのcontinuity / assembler / parser stateを切断する責務は既存の `StreamBoundaryTxn` に集約する。`close()` / 所有者消滅では当該identityを閉じ、descriptor replacementでは同じboundary commitで旧originを切断して旧identityを閉じた後、再利用しない新identityを `queue_epoch=0` で開始する。これにより `stop()`→`start()` は同一stream continuationを保ち、`flush()` 前後またはdescriptor replacement前後の旧状態を新originへ再結合せず、ABAを許さない。'''
          new = '''状態は `Open(g)`、`Draining(g)`、`Closed` の3種類だけとする。`beginRead` / `beginWrite` は、キュー識別子、検査済みキュー世代、方向、予約情報を持つParcelableではない一回限りのRAIIトークンを返す。`commit` / `cancel` はこのトークンを正確に1回消費する。未消費トークンの所有者が通常return、エラーreturn、取り消し、またはpanicでスコープを離れた場合は`Drop`が`cancel`と同じ予約解除を行い、受付中件数を減らして待機者を起床させる。`flush()`は`Draining`へ移り、新しいトランザクションを拒否して、世代gで受付済みのトランザクションがすべてcommit、cancel、またはRAII取消になるまで待つ。その後、DVRキューを一括消去し、検査済みのg+1へ進めて`Open`に戻る。失敗時はポインター、内容、世代を維持する。閉鎖または所有者消滅ではキュー識別子を閉じ、すべてのトークンを古いものとして無効化し、待機者を起床させる。記述子の置換では旧識別子を閉じ、世代0の別識別子を生成する。

Playback DVR では、前項のキュー識別子を既存の `PlaybackQueueBacking` が所有するlogical incarnation token `queue_identity` とし、fd番号やdescriptor内容などの再利用可能な物理値を用いず、同一DVR object寿命中に再利用しない。入力originは `TsInputOrigin::PlaybackDvr(dvr_id, queue_identity, queue_epoch)` を唯一の正本キーとし、別の `dvr_generation` は設けない。`QueueEpochProtocol` は当該identityを参照して同一identity内のflush世代 `queue_epoch` だけを所有し、キュー生成時は0、`stop()` / `start()` ではidentityとepochを維持し、成功した `flush()` の一括消去commitでだけepochを進める。そのflush commitでは既存の `StreamBoundaryTxn` が旧originのcontinuity / assembler / parser stateを切断する。記述子置換は前項のidentity切替を `StreamBoundaryTxn` のboundary commitとして実行し、旧origin stateの切断と旧identityの閉鎖を同じ確定点で行った後、`PlaybackQueueBacking` が再利用しない新identityを `queue_epoch=0` で発行する。閉鎖または所有者消滅では前項どおり当該identityを閉じる。これにより `stop()`→`start()` は同一stream continuationを保ち、`flush()` 前後または記述子置換前後の旧状態を新originへ再結合せず、ABAを許さない。'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one duplicated QueueEpochProtocol block, got {s.count(old)}')
          s = s.replace(old, new)
          p.write_text(s)
          PY
          rm .github/workflows/agent_compact_pr26_queue_epoch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tuner_hal/DESIGN_JA.md .github/workflows/agent_compact_pr26_queue_epoch.yml
          git diff --cached --check
          git commit -m 'docs: deduplicate playback queue epoch contract'
          git push
