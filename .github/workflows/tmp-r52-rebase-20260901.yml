name: tmp r52 rebase 20260901

on:
  push:
    branches:
      - tmp/r52-rebase-control-20260901
    paths:
      - .github/workflows/tmp-r52-rebase-20260901.yml

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase r52 net commit onto current PR55
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.quotePath false
          BASE=1ff04d33dbb0a20a3cec81deb89c9c52774ac557
          OLD_R52=e7de5c0d131969278ef700341294a636af0daeac
          git fetch origin "$BASE" "$OLD_R52"
          git checkout -B rebuilt-r52 "$BASE"
          set +e
          git cherry-pick "$OLD_R52"
          rc=$?
          set -e
          echo "cherry_pick_rc=$rc"
          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "--- conflicts ---"
            printf '%s\n' "$conflicts"
            test "$conflicts" = "tuner_hal2/CHANGELOG.md"
            git show "$OLD_R52:tuner_hal2/CHANGELOG.md" > /tmp/r52-changelog.md
            git show "$BASE:tuner_hal2/CHANGELOG.md" > /tmp/base-changelog.md
            python3 - <<'PY'
          from pathlib import Path
          child = Path('/tmp/r52-changelog.md').read_text()
          base = Path('/tmp/base-changelog.md').read_text()
          marker = '# r50eo84_pr53_capability_topology_ssot_followup\n'
          if marker not in child or marker not in base:
              raise SystemExit('expected common changelog marker not found')
          prefix = child.split(marker, 1)[0]
          if '# r52_key_provisioning_deadline_setup' not in prefix or '# r52_key_provisioning_implementation' not in prefix:
              raise SystemExit('r52 changelog prefix incomplete')
          Path('tuner_hal2/CHANGELOG.md').write_text(prefix + base)
          PY
            git add tuner_hal2/CHANGELOG.md
            git cherry-pick --continue
          fi
          git diff "$BASE" HEAD --check
          test "$(git rev-parse HEAD^)" = "$BASE"
          test -z "$(git grep -l '^<<<<<<<\|^=======\|^>>>>>>>' HEAD -- ':!*.patch' || true)"
          echo "changed_files=$(git diff --name-only "$BASE" HEAD | wc -l)"
          git push --force origin HEAD:refs/heads/tmp/rebuilt-r52-20260901
