name: PR2 review15 synchronize 2026-08-05

on:
  push:
    branches:
      - agent/apply-tuner-hal2-design-proposals-v70
    paths:
      - .github/pr2-review15-trigger-20260805.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/apply-tuner-hal2-design-proposals-v70
          path: work
          fetch-depth: 0
      - name: Checkout helper from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: helper
          sparse-checkout: |
            .github/pr2-review15-patch-20260805.py
          sparse-checkout-cone-mode: false
      - name: Apply design correction
        working-directory: work
        run: python ../helper/.github/pr2-review15-patch-20260805.py
      - name: Static checks
        working-directory: work
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {'tuner_hal/DESIGN_JA.md', 'tuner_hal2/DESIGN_JA.md'}
          if changed != expected:
              raise SystemExit(f'unexpected changed files: {sorted(changed)}')
          PY
      - name: Remove temporary files and commit
        working-directory: work
        run: |
          rm -f .github/pr2-review15-trigger-20260805.txt
          rm -f .github/workflows/pr2-review15-sync-20260805.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tuner_hal/DESIGN_JA.md tuner_hal2/DESIGN_JA.md .github/pr2-review15-trigger-20260805.txt .github/workflows/pr2-review15-sync-20260805.yml
          git commit -m "docs: synchronize tune re-entry branches"
          git push origin HEAD:agent/apply-tuner-hal2-design-proposals-v70
