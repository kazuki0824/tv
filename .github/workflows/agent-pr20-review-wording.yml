name: Apply PR20 review wording fixes

on:
  push:
    branches:
      - agent/fix-tis-arib-provider-contracts

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-tis-arib-provider-contracts
          fetch-depth: 0
      - name: Apply wording fixes
        run: python3 .github/agent-pr20-review-wording.py
      - name: Validate wording fixes
        shell: bash
        run: |
          grep -Fq '`RELATIVE`はAOSP Tuner AIDLで合法なtune-time selector種別だが、本製品では永続channel tune identityとして採用しないため' tis/DESIGN_JA.md
          grep -Fq 'channelとTvInputServiceの関連付けはchannel rowのrequired fieldである`TvContract.Channels.COLUMN_INPUT_ID`を唯一のSSOTとする' tis/DESIGN_JA.md
          grep -Fq '`0x01`の`Digital television service`と`0x02`の`Digital audio service`' tis/DESIGN_JA.md
          ! grep -Fq '`RELATIVE`はdriver固有値になるため' tis/DESIGN_JA.md
          ! grep -Fq 'TV input ownershipはchannel row' tis/DESIGN_JA.md
          ! grep -Fq 'digital radio sound service' tis/DESIGN_JA.md
          git diff --check
      - name: Commit final diff
        shell: bash
        run: |
          rm .github/agent-pr20-review-wording.py
          rm .github/workflows/agent-pr20-review-wording.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: address PR20 wording review"
          git push origin HEAD:agent/fix-tis-arib-provider-contracts
