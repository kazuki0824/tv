name: Verify PR54 projection gap fixes v6

on:
  push:
    branches: [codex/pr54-apply-20260902]
    paths: [.github/workflows/codex-pr54-projection-gaps-verify-push-v6.yml]

permissions:
  contents: write

env:
  EXPECTED_TARGET_SHA: 3015db754868fa6753b09b12162ae9d31c883051
  TARGET_BRANCH: agent/implement-tis-arib-si-design-pr53
  RUST_TOOLCHAIN: 1.81.0
  KOTLIN_VERSION: 1.9.22

jobs:
  verify-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr54-apply-20260902
          path: staging
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 2
          path: target
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
      - name: Apply, format, verify, commit and push
        shell: bash
        run: |
          sed 's#codex_apply_pr54_projection_gaps.py#codex_apply_pr54_projection_gaps_fixed4.py#' staging/codex_verify_pr54_projection_gaps.sh \
            | sed 's#cargo +"$RUST_TOOLCHAIN" fmt --manifest-path arib_si_engine_rs/host_ci/Cargo.toml -- --check#cargo +"$RUST_TOOLCHAIN" fmt --manifest-path arib_si_engine_rs/host_ci/Cargo.toml#' \
            > staging/codex_verify_projection_runtime.sh
          bash staging/codex_verify_projection_runtime.sh "$GITHUB_WORKSPACE/target"
