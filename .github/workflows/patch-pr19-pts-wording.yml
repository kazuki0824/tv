name: Sync PTS wording
'on':
  push:
    branches:
      - agent/fix-tis-arib-design-residuals
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('tis/DESIGN_JA.md'); s=p.read_text(); s=s.replace('generationで最初の明示PTSを共通extended seed `H`へ置き、後から明示PTSを得るtrackはcurrent coordinator referenceに対してsigned-moduloで同じepochへjoinする。','generationで最初のproducer-valid `getPts()`を共通extended seed `H`へ置き、後からtimestamp入力を得るtrackはcurrent coordinator referenceに対してsigned-moduloで同じepochへjoinする。',1); p.write_text(s)"
          git diff --check
          rm .github/workflows/patch-pr19-pts-wording.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tis/DESIGN_JA.md .github/workflows/patch-pr19-pts-wording.yml
          git commit -m 'docs: sync sparse PTS wording'
          git push
