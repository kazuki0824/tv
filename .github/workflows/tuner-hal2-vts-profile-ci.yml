name: tuner_hal2 VTS profile CI

on:
  pull_request:
    paths:
      - "tuner_hal2/tools/**"
      - "tuner_hal2/config/vts_channel_plan*.json"
      - "tuner_hal2/config/product_integration.mk"
      - "tuner_hal2/config/vts_test_agent_integration.mk"
      - "tuner_hal2/vts_agent/**"
      - "tuner_hal2/INTEGRATION.md"
      - "arib_si_engine_rs/src/vts_profile_host.rs"
      - "arib_si_engine_rs/src/service_discovery.rs"
      - "arib_si_engine_rs/Android.bp"
      - ".github/workflows/tuner-hal2-vts-profile-ci.yml"
  push:
    branches: [main]
    paths:
      - "tuner_hal2/tools/**"
      - "tuner_hal2/config/vts_channel_plan*.json"
      - "tuner_hal2/config/product_integration.mk"
      - "tuner_hal2/config/vts_test_agent_integration.mk"
      - "tuner_hal2/vts_agent/**"
      - "tuner_hal2/INTEGRATION.md"
      - "arib_si_engine_rs/src/vts_profile_host.rs"
      - "arib_si_engine_rs/src/service_discovery.rs"
      - "arib_si_engine_rs/Android.bp"
      - ".github/workflows/tuner-hal2-vts-profile-ci.yml"

permissions:
  contents: read

concurrency:
  group: tuner-hal2-vts-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vts-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tuner_hal2/tools
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6

      - name: Run VTS profile unit tests
        run: uv run --locked python -m unittest discover -s . -p 'test_*.py'

      - name: Compile-check VTS profile Python
        run: uv run --locked python -m compileall -q .

      - name: Validate canonical XML with pinned Android 14 xsdc consumer
        env:
          AOSP_TUNER_CONFIG_REF: 53c69987b8
          AOSP_XSDC_REF: 13f3561ace86ee04565f3c7eccc30b7209db0f9c
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://android.googlesource.com/platform/hardware/interfaces/+/${AOSP_TUNER_CONFIG_REF}/tv/tuner/config/tuner_testing_dynamic_configuration.xsd?format=TEXT" \
            | base64 -d > /tmp/tuner_testing_dynamic_configuration.xsd

          git init -q /tmp/xsdc
          git -C /tmp/xsdc remote add origin https://android.googlesource.com/platform/system/tools/xsdc
          git -C /tmp/xsdc fetch -q --depth=1 origin "${AOSP_XSDC_REF}"
          git -C /tmp/xsdc checkout -q --detach FETCH_HEAD

          curl -fsSL \
            https://repo1.maven.org/maven2/commons-cli/commons-cli/1.2/commons-cli-1.2.jar \
            -o /tmp/commons-cli-1.2.jar
          mkdir -p /tmp/xsdc-classes /tmp/tuner-xsdc-generated
          find /tmp/xsdc/src/main/java -name '*.java' -print > /tmp/xsdc-sources.txt
          javac -cp /tmp/commons-cli-1.2.jar -d /tmp/xsdc-classes @/tmp/xsdc-sources.txt
          java -cp "/tmp/xsdc-classes:/tmp/commons-cli-1.2.jar" com.android.xsdc.Main \
            -c \
            -p android.media.tuner.testing.configuration.V1_0 \
            -o /tmp/tuner-xsdc-generated \
            -r TunerConfiguration \
            /tmp/tuner_testing_dynamic_configuration.xsd

          mapfile -t generated_cpp < <(find /tmp/tuner-xsdc-generated -maxdepth 1 -name '*.cpp' -print)
          test "${#generated_cpp[@]}" -gt 0
          g++ -std=c++17 \
            -I/tmp/tuner-xsdc-generated/include \
            -I/tmp/xsdc/utils/include \
            $(pkg-config --cflags libxml-2.0) \
            vts_profile/aosp_tuner_config_consumer.cpp \
            "${generated_cpp[@]}" \
            $(pkg-config --libs libxml-2.0) \
            -o /tmp/tuner-xsdc-consumer

          uv run --locked python - <<'PY'
          from pathlib import Path
          from test_vts_profile import VtsProfileTest
          from test_vts_profile_isdbs_lnb import isdbs_profile
          from vts_profile.render import render_xml
          from vts_profile.schema import validate_xml

          xsd = Path("/tmp/tuner_testing_dynamic_configuration.xsd")
          consumer = "/tmp/tuner-xsdc-consumer"
          validate_xml(render_xml(VtsProfileTest().profile()), xsd, xmllint=consumer)
          validate_xml(render_xml(isdbs_profile()), xsd, xmllint=consumer)
          PY
