name: PR54 A/B/C検証

on:
  push:
    branches:
      - automation/pr54-caption-rustfmt-20260901

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/implement-tis-arib-si-design-pr53
          fetch-depth: 0

      - name: Rust 1.81検証用toolchainを導入
        run: rustup toolchain install 1.81.0 --profile minimal --component rustfmt

      - name: ARIB SI lifetime修正を検証
        working-directory: arib_si_engine_rs/host_ci
        run: |
          cargo +1.81.0 fmt --all -- --check
          cargo +1.81.0 check --all-targets --locked
          cargo +1.81.0 test --locked

      - name: 字幕JNI rustfmt修正を検証
        working-directory: tis/host_ci/caption
        run: |
          cargo +1.81.0 fmt --all -- --check
          cargo +1.81.0 check --all-targets --locked
          cargo +1.81.0 test --locked

      - name: 一時workflowと補修scriptがPR HEADに残っていないことを確認
        run: |
          test ! -e .github/pr54_fix_mut.py
          test ! -e .github/workflows/pr54-fix-mut.yml
          test ! -e .github/workflows/pr54-japanese-audit.yml
          git diff --check
