name: pr28-final-residue
on:
  push:
    branches:
      - agent/fix-commonization-boundaries
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-commonization-boundaries
          fetch-depth: 0
      - name: Apply final residue cleanup
        run: |
          sed -i 's/raise SystemExit(/print(/g' .tmp/pr28_final_residue.py
          python3 .tmp/pr28_final_residue.py
      - name: Commit and clean helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tuner_hal/DESIGN_JA.md
          git rm -f .tmp/pr28_final_residue.py .github/workflows/pr28-final-residue.yml
          git commit -m "design: finalize review contract cleanup [skip ci]"
          git push origin HEAD:agent/fix-commonization-boundaries
