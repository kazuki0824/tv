name: Fix PR57 rebase workflow

on:
  pull_request:
    paths:
      - ".github/workflows/fix-pr57-rebase-workflow.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'automation/rebase-pr57-generic-key'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/rebase-pr57-generic-key
          persist-credentials: true
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/pr57-rebase-diagnostic.yml')
          s = p.read_text()
          old = '          git diff --check "$NEW_BASE"..HEAD 2>/dev/null || git diff --check c81f3828ca5ff2a7091bf5df3995169d8ce6ff10..HEAD\n'
          new = '          git diff --check c81f3828ca5ff2a7091bf5df3995169d8ce6ff10..HEAD\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected one validation line, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name maleicacid
          git config user.email 4982384+kazuki0824@users.noreply.github.com
          git add .github/workflows/pr57-rebase-diagnostic.yml
          git commit -m 'chore: fix PR57 rebase validation base'
          git push origin HEAD:automation/rebase-pr57-generic-key
