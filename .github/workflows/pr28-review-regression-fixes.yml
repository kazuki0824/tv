name: PR28 review regression fixes
on:
  push:
    paths:
      - '.github/workflows/pr28-review-regression-fixes.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-commonization-boundaries
      - name: Apply design fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, got {n}')
              return text.replace(old, new, 1)

          p = Path('tuner_hal/DESIGN_JA.md')
          s = p.read_text()

          s = replace_once(s,
          '| callback registration | `CallbackRegistrationUseCase` | callback artifact準備、runtime登録、domain callback state確定を一つの登録transactionで扱う | `LnbHal`等がBinder callback実体を直接所有すること、三者を片側だけcommitすること |',
          '| callback registration | `CallbackRegistrationUseCase` | AIDL façadeはBinder artifactのprepare/releaseだけを行い、service_runtime側ownerがruntime registry mutationとdomain callback stateをprepareして一つのcomposite commit/rollback policyで確定する | AIDL façadeがdomain stateまたはrollback policyを所有すること、`LnbHal`等がBinder callback実体を直接所有すること、三者を片側だけcommitすること |',
          '0-S-3A callback registration')

          s = replace_once(s,
          '| `DemuxFrontendSourceTxn` | `tuner_hal2/DESIGN_JA.md` の同名論理契約行 | `IDemux.setFrontendDataSource()` use-case、`ObjectCloseTxn`/Frontend・Demux cleanupからのtyped unbind mutation | demux/frontend relationのorchestration | stream parser内部、Filter source graph | validate → relation prepare + `StreamBoundaryTxn.prepare()` → composite commit → old relation release | pre-commitは両prepared stateをabortし旧relation/旧generation維持、commit結果不明だけ対象demuxを隔離 | Demux frontend-source use-case、`ObjectCloseTxn` typed cleanup command | `SourceBoundaryTxn`への吸収、relation/stream別commit | same-source no-reset、switch/unbind、Frontend/Demux close cleanup、cleanup idempotence、boundary prepare failure、composite commit fault |',
          '| `DemuxFrontendSourceTxn` | `tuner_hal2/DESIGN_JA.md` の同名論理契約行 | `IDemux.setFrontendDataSource()` use-case、`ObjectCloseTxn`/Frontend・Demux cleanupからのtyped unbind mutation | demux/frontend relationのorchestration | stream parser内部、Filter source graph | validate → relation prepare + `StreamBoundaryTxn.prepare()` → composite commit（新relation・stream generation・旧relation logical detach） → old relation physical cleanup | pre-commitは両prepared stateをabortし旧relation/旧generation維持。commit結果不明だけ対象demuxを隔離。composite commit成功後のold relation physical cleanup失敗では新relationをrollbackせず、旧relation cleanupだけをretryable cleanupへ移管し、旧資源の実状態不明時だけ旧relation資源をquarantine | Demux frontend-source use-case、`ObjectCloseTxn` typed cleanup command | `SourceBoundaryTxn`への吸収、relation/stream別commit、post-commit cleanup失敗による新relation rollback | same-source no-reset、switch/unbind、Frontend/Demux close cleanup、cleanup idempotence、boundary prepare failure、composite commit fault、post-commit old relation cleanup failureで新relation維持 |',
          'DemuxFrontendSourceTxn postcommit cleanup')

          s = replace_once(s,
          '| `CallbackRegistrationUseCase` | `tuner_hal2/DESIGN_JA.md` の同名論理契約行 | Frontend/LNB等のset/clear/replace callback | 登録transactionのorchestration。artifactはcallback store、runtime entryはregistry、logical stateはdomain owner | callback配送後のdomain state、backend state | artifact prepare → runtime register/clear prepare → domain commit → old artifact release | commit前は逆順rollback、commit後配送失敗は`PostCommitCallbackFailureTxn` | AIDL callback registration façade | LNB/domain/backend/resource ledgerのBinder strong ref直接保持 | set/replace/NULL、各phase failure、Binder death/generation、old callback保持 |',
          '| `CallbackRegistrationUseCase` | `tuner_hal2/DESIGN_JA.md` の同名論理契約行 | Frontend/LNB等のset/clear/replace callback。AIDL façadeはartifact prepare/releaseだけを行い、prepared artifact handleをservice_runtime ownerへ渡す | service_runtime側registration transactionのorchestration、prepared runtime registry mutation、domain callback logical stateのcommit/rollback policy。Binder artifact本体はcallback storeが所有 | Binder artifact storage/strong ref、callback配送後のdomain state、backend state | AIDL artifact prepare（非公開） → service_runtime runtime registry prepare → domain callback state prepare → service_runtime composite commit（prepared artifact handle採用 + runtime mutation + domain logical state） → AIDL old artifact cleanup | composite commit前はservice_runtime ownerがruntime/domain prepared stateをabortし、AIDL façadeへprepared artifact releaseを指示して旧callbackを維持。commit後のold artifact cleanup失敗では新registrationをrollbackせずcleanup/診断へ接続し、callback delivery失敗は`PostCommitCallbackFailureTxn` | service_runtime callback registration owner、AIDL artifact prepare/release façade | AIDL façadeによるdomain state/rollback policy所有、LNB/domain/backend/resource ledgerのBinder strong ref直接保持、artifact/runtime/domainの片側commit | set/replace/NULL、各prepare failure、composite commit fault、old artifact cleanup failureで新registration維持、Binder death/generation |',
          'CallbackRegistrationUseCase phase/owner')

          s = replace_once(s,
          '| `DescramblerSessionCleanupTxn` | `tuner_hal2/DESIGN_JA.md` の同名論理契約行 | descrambler close/demux invalidationから`ObjectCloseTxn`経由 | sessionに属するPID/key/pool帰属のcleanup進捗 | normal key/PID mutation、他session | cleanup authority確認 → backend detach全件 → claims/key refs/pool session release → report | 全対象を試行しretryableは`CleanupPending`、状態不明だけquarantine | `ObjectCloseTxn` typed cleanup command | public API/workerによる個別release | close/invalidate、partial cleanup、retry、idempotence、quarantine |',
          '| `DescramblerSessionCleanupTxn` | `tuner_hal2/DESIGN_JA.md` の同名論理契約行 | descrambler closeは`ObjectCloseTxn`からtyped cleanup command、demux invalidationはdemux invalidation ownerからtyped cleanup request | sessionに属するPID/key/pool帰属のcleanup進捗 | public close authority、normal key/PID mutation、他session | trigger（close authorityまたはdemux invalidation generation）確認 → session cleanup直列化 → backend detach全件 → claims/key refs/pool session release → report | 全対象を試行し、close起因retryableは`ObjectCloseTxn`の`CleanupPending`へ、invalidation起因retryableはdemux invalidation ownerへtyped pending結果を返してcleanup/reaperで再試行。状態不明だけ対象sessionをquarantine | `ObjectCloseTxn` typed cleanup command、demux invalidation owner | public API/workerによる個別release、demux invalidationをpublic close authorityとして扱うこと | close/invalidateの別入口、partial cleanup、retry、idempotence、quarantine |',
          'DescramblerSessionCleanupTxn entry')

          s = replace_once(s,
          '| AT-003 | `IDemux.setFrontendDataSource()` | `DemuxFrontendSourceTxn`が入力/owner/generationを検証し、relation prepareと`StreamBoundaryTxn.prepare()`を取得してcomposite commit | relationとdemux入力generationを同じ上位commitで公開した時点 | commit前失敗は両prepared stateをabortし旧relation/旧generationを維持。commit結果不明時だけ当該demuxを隔離 | demux frontend relationと入力境界 | `DemuxFrontendSourceTxn` / `StreamBoundaryTxn`契約に従う | relationまたはstream boundaryだけを先にcommitしない |',
          '| AT-003 | `IDemux.setFrontendDataSource()` | `DemuxFrontendSourceTxn`が入力/owner/generationを検証し、relation prepareと`StreamBoundaryTxn.prepare()`を取得してcomposite commit。commit後の旧relation physical cleanupは別のpost-commit cleanupとして行う | relation・demux入力generation・旧relation logical detachを同じ上位commitで公開した時点 | commit前失敗は両prepared stateをabortし旧relation/旧generationを維持。commit結果不明時だけ当該demuxを隔離。commit後の旧relation cleanup失敗では新relationを維持し、旧資源cleanupだけをretry/quarantineへ接続 | demux frontend relationと入力境界、cleanup失敗した旧relation資源 | `DemuxFrontendSourceTxn` / `StreamBoundaryTxn`契約に従う | relationまたはstream boundaryだけを先にcommitしない。post-commit cleanup失敗でcommit済み新relationをrollbackしない |',
          'AT-003 postcommit cleanup')

          s = replace_once(s,
          '| AT-006 | callback登録 | `CallbackRegistrationUseCase`がartifact準備・runtime登録・domain logical stateを調停 | 三者を同じ登録transactionで確定した時点 | commit前は準備済みartifact/runtime登録を逆順で戻し旧callbackを維持 | callback artifact store、runtime registry、所有object logical state | 0-S-3Bとcallback ownership契約に従う | LNB等がBinder callback実体を直接保持しない、登録の片側だけを残さない |',
          '| AT-006 | callback登録 | AIDL façadeがBinder artifactを非公開prepareし、service_runtime側`CallbackRegistrationUseCase`がruntime registry mutationとdomain callback stateをprepareしてcomposite commitする。AIDL façadeはcommit後に旧artifact cleanupだけを行う | service_runtime composite commitがprepared artifact handle、runtime mutation、domain logical stateを同時に採用した時点 | composite commit前はservice_runtime ownerがruntime/domain prepared stateをabortし、AIDL façadeへprepared artifact releaseを指示して旧callbackを維持。commit後の旧artifact cleanup失敗は新registrationをrollbackせずcleanup/診断へ接続 | callback artifact store、runtime registry、所有object logical state | 0-S-3Bとcallback ownership契約に従う | AIDL façadeがrollback policy/domain stateを所有しない。LNB等がBinder callback実体を直接保持せず、登録の片側だけを残さない |',
          'AT-006 callback composite commit')

          p.write_text(s)

          p = Path('tuner_hal2/DESIGN_JA.md')
          s = p.read_text()

          s = replace_once(s,
          '| stream boundary | `StreamBoundaryTxn` | relation、queue token、A/V sync map、PCR store内部、callback artifactを所有しない |',
          '| stream boundary | `StreamBoundaryTxn` | relation、queue token、A/V sync map、PCR store内部、callback artifactを所有しない |\n| packet ingress / pipeline | `PacketTxn` / `PacketPipeline` | 通常packet ingress/parse/filter dispatchを`StreamBoundaryTxn`へ吸収しない。AIDL/backend adapter/filter callbackがpipeline状態を直接変更しない |\n| frontend tune/scan | `FrontendTxn` | worker、backend adapter、callback層がfrontend公開状態/generation/rollbackを直接確定しない。demux内部boundaryを`FrontendTxn`へ吸収しない |',
          'top mapping restore packet/frontend')

          s = replace_once(s,
          '| callback registration | `CallbackRegistrationUseCase` | Binder artifact、runtime registry、domain callback stateを片側だけcommitしない |',
          '| callback registration | service_runtime側`CallbackRegistrationUseCase`がruntime/domain prepare・composite commit・rollback policyを所有し、AIDL façadeはBinder artifactのprepare/releaseだけを担当 | AIDL façadeがdomain state/rollback policyを所有すること、Binder artifact・runtime registry・domain callback stateを片側だけcommitすること |',
          'top callback owner')

          s = replace_once(s,
          '| `DescramblerKeyTxn` / `DescramblerPidTxn` / `DescramblerSessionCleanupTxn` | 既存`service_runtime/src/boot/descrambler_txn.rs`内の独立type。session stateは`service_runtime/src/descrambler_session.rs`、key token/slot/refcountは`service_runtime/src/descrambler_key_table.rs`だけが所有する | `service_runtime/src/descrambler_ops.rs`のobject use-case。AIDL methodはobject method façade経由で一回性tokenを渡す | key/PID/cleanupのstate machineを相互に吸収する、AIDL層またはdescrambler crateから台帳を直接変更する |',
          '| `DescramblerKeyTxn` / `DescramblerPidTxn` / `DescramblerSessionCleanupTxn` | 既存`service_runtime/src/boot/descrambler_txn.rs`内の独立type。session stateは`service_runtime/src/descrambler_session.rs`、key token/slot/refcountは`service_runtime/src/descrambler_key_table.rs`だけが所有する | 通常key/PID操作は`service_runtime/src/descrambler_ops.rs`のobject use-case。session cleanupはdescrambler close時に`ObjectCloseTxn` typed cleanup commandから、demux invalidation時にdemux invalidation ownerから直接typed cleanup requestとして`DescramblerSessionCleanupTxn`へ入る | key/PID/cleanupのstate machineを相互に吸収する、AIDL層またはdescrambler crateから台帳を直接変更する、demux invalidationをpublic close authorityへ変換する、close/invalidate callerがPID/key/pool cleanupを個別所有する |',
          'descrambler cleanup anchor')

          s = replace_once(s,
          '| `StreamBoundaryTxn` | 既存`demux/src/runtime/generation_boundary.rs::GenerationBoundaryTxn`。`GenerationBoundaryTxn`は`StreamBoundaryTxn`の実装名であり別正本ではない | `service_runtime/src/packet_ops.rs`のtyped boundary use-case。上位transactionは`prepare`で`PreparedStreamBoundary`を得て、同一owner排他区間で`commit`または`abort`する | relation table、Filter/DVR queue内部、A/V sync map、PCR store内部、callback artifact、descrambler key/PIDを直接変更する |',
          '| `StreamBoundaryTxn` | 既存`demux/src/runtime/generation_boundary.rs::GenerationBoundaryTxn`。`GenerationBoundaryTxn`は`StreamBoundaryTxn`の実装名であり別正本ではない | `service_runtime/src/packet_ops.rs`のtyped boundary use-case。上位transactionは`prepare`で`PreparedStreamBoundary`を得て、同一owner排他区間で`commit`または`abort`する | relation table、Filter/DVR queue内部、A/V sync map、PCR store内部、callback artifact、descrambler key/PIDを直接変更する |\n| packet ingress / pipeline | `service_runtime/src/boot/packet_txn.rs::PacketTxn<\'a>`がpacket ingress transaction、`demux/src/parser/packet_pipeline.rs::PacketPipeline`が通常packet parse/filter pipelineの単一アンカー | `service_runtime/src/packet_ops.rs`のtyped packet ingress use-case。必要な境界変更だけを`StreamBoundaryTxn`のtyped入口へ委譲する | 通常packet ingress/pipelineを`StreamBoundaryTxn`へ吸収する、AIDL層/backend adapter/filter callbackがPacketTxn/PacketPipelineを迂回してcontinuity・assembler・delivery stateを直接変更する |',
          'packet ingress anchor')

          s = replace_once(s,
          '| `CallbackRegistrationUseCase` | `aidl_service/src/object_runtime/mod.rs::CallbackRegistrationUseCase`がorchestrationを所有し、Binder artifactは既存`aidl_service/src/callback_store.rs`、runtime stateは既存`service_runtime/src/callback_registry.rs::RuntimeCallbackRegistry`、domain logical stateは対象`service_runtime/src/*_ops.rs`だけが所有する | `IFrontend.setCallback()` / `ILnb.setCallback()`等のcallback登録/解除入口 | Binder callback実体をLNB/demux/device/resource ledgerへ保持する、artifact/runtime/domainを片側だけcommitする |',
          '| `CallbackRegistrationUseCase` | service_runtime側`service_runtime/src/callback_registry.rs::CallbackRegistrationUseCase`がregistration orchestrationとrollback policyを所有し、prepared runtime mutationは同moduleの`RuntimeCallbackRegistry`、domain logical stateは対象`service_runtime/src/*_ops.rs`のprepared mutationが所有する。Binder artifact本体は既存`aidl_service/src/callback_store.rs`だけが所有する | `IFrontend.setCallback()` / `ILnb.setCallback()`等ではAIDL façadeがlive/dispatch preflight後にBinder artifactを非公開prepareし、そのhandleをservice_runtime ownerへ渡す。service_runtime composite commit後、AIDL façadeは旧artifact cleanup/releaseだけを行う | AIDL façadeがdomain state・runtime registry・rollback policyを所有する、Binder callback実体をLNB/demux/device/resource ledgerへ保持する、artifact/runtime/domainを片側だけcommitする |',
          'callback registration anchor owner')

          s = replace_once(s,
          '| `PlaybackConsumeTxn` | 既存`service_runtime/src/playback_consume_txn.rs` | playback workerから1 consume stepごとのtyped入口 | worker/FMQ helper/packet helperがread/parse/inject/consume遷移を再実装する |',
          '| `PlaybackConsumeTxn` | 既存`service_runtime/src/playback_consume_txn.rs` | playback workerから1 consume stepごとのtyped入口 | worker/FMQ helper/packet helperがread/parse/inject/consume遷移を再実装する |\n| frontend tune/scan | `service_runtime/src/boot/frontend_txn.rs::FrontendTxn<\'a>`。public use-case façadeは`service_runtime/src/frontend_ops.rs` | `aidl_service/src/tuner_service/frontend_methods.rs`からobject method façadeを経由してfrontend object use-caseを呼ぶ。full retune、`stopTune()`、scan切替でdemux境界が必要な場合は`StreamBoundaryTxn`のtyped入口だけを使用する | worker、device backend、callback delivery層によるfrontend公開状態・generation・rollback状態の直接確定、`FrontendTxn`自身によるassembler、FMQ、AV、record queue、demux stream generationの直接変更 |',
          'frontend txn anchor restore')

          s = replace_once(s,
          '- callback登録は`CallbackRegistrationUseCase`でartifact preparation → runtime registration → domain callback state commitを行う。`ILnb.setCallback()`専用のBinder artifact ownerを新設しない。',
          '- callback登録ではAIDL façadeはBinder artifactのprepare/releaseだけを担当し、service_runtime側`CallbackRegistrationUseCase`がruntime registry mutationとdomain callback stateをprepareしてcomposite commit/rollback policyを所有する。prepared artifact handleはcomposite commitで採用し、AIDL façadeがdomain stateまたはrollback方針を持たない。`ILnb.setCallback()`専用のBinder artifact ownerを新設しない。',
          'callback composition rule')

          s = replace_once(s,
          '- 静的inventory／capability queryからcleanup、worker操作、backend I/Oを開始しない。動的frontend status queryは世代付き`FrontendStatusSnapshot`だけを読む。',
          '- 静的inventory／capability queryからcleanup、worker操作、backend I/Oを開始しない。動的frontend status queryは現行製品では世代付き`FrontendStatusSnapshot`だけを読む。ただし、`../tuner_hal/DESIGN_JA.md`の公開状態表で対象status、bounded I/O上限、失敗写像、generation再検証、snapshot更新との排他を明示したstatusはbounded synchronous readへ変更できる。',
          'frontend status exception')

          p.write_text(s)

          # Guardrails for the reviewed regressions.
          th = Path('tuner_hal/DESIGN_JA.md').read_text()
          th2 = Path('tuner_hal2/DESIGN_JA.md').read_text()
          required = [
              ('callback service_runtime owner', 'service_runtime側registration transactionのorchestration', th),
              ('callback composite commit', 'service_runtime composite commit（prepared artifact handle採用 + runtime mutation + domain logical state）', th),
              ('demux postcommit cleanup', 'post-commit old relation cleanup failureで新relation維持', th),
              ('descrambler separate invalidation', 'demux invalidationはdemux invalidation ownerからtyped cleanup request', th),
              ('packet anchor', 'packet ingress / pipeline', th2),
              ('frontend anchor', "frontend_txn.rs::FrontendTxn<'a>", th2),
              ('status exception', 'bounded synchronous readへ変更できる', th2),
              ('AIDL rollback prohibition', 'AIDL façadeがdomain state・runtime registry・rollback policyを所有する', th2),
          ]
          for label, needle, text in required:
              if needle not in text:
                  raise SystemExit(f'missing guardrail: {label}')
      - name: Remove temporary workflow
        run: rm .github/workflows/pr28-review-regression-fixes.yml
      - name: Commit
        run: |
          git config user.name maleicacid
          git config user.email 4982384+kazuki0824@users.noreply.github.com
          git diff --check
          test "$(git diff --name-only | sort)" = $'tuner_hal/DESIGN_JA.md\ntuner_hal2/DESIGN_JA.md\n.github/workflows/pr28-review-regression-fixes.yml' || { git diff --name-only; exit 1; }
          git add tuner_hal/DESIGN_JA.md tuner_hal2/DESIGN_JA.md .github/workflows/pr28-review-regression-fixes.yml
          git commit -m 'design: restore PR27 responsibility boundaries'
          git push origin HEAD:agent/fix-commonization-boundaries
