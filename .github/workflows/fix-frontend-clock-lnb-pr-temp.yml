name: Temporary PR design fix trigger

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/apply-tuner-hal2-design-proposals-v70'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apply-tuner-hal2-design-proposals-v70
          fetch-depth: 0
      - name: Apply exact replacements from the companion workflow
        shell: bash
        run: |
          sed -n '28,74p' .github/workflows/fix-frontend-clock-lnb-temp.yml | sed 's/^          //' > /tmp/fix_design.py
          python3 /tmp/fix_design.py
      - name: Remove temporary workflows and validate
        shell: bash
        run: |
          rm .github/workflows/fix-frontend-clock-lnb-temp.yml
          rm .github/workflows/fix-frontend-clock-lnb-pr-temp.yml
          test -z "$(git diff --name-only -- future_work)"
          grep -Fq 'px4DemodLockPacketCount=16' tuner_hal/DESIGN_JA.md
          grep -Fq 'current_90k = (unwrapped_pcr_90k' tuner_hal/DESIGN_JA.md
          grep -Fq 'FixedDishPowerProfile' tuner_hal/DESIGN_JA.md
          ! grep -Fq 'lockを観測できない場合は`DEMOD_LOCK`を公開せず' tuner_hal/DESIGN_JA.md
          ! grep -Fq '90 kHz系の最新観測時刻を返す' tuner_hal/DESIGN_JA.md
          ! grep -Fq 'LNB給電が必要なsatellite frontendも同じprofileでは公開しない' tuner_hal/DESIGN_JA.md
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tuner_hal/DESIGN_JA.md .github/workflows/fix-frontend-clock-lnb-temp.yml .github/workflows/fix-frontend-clock-lnb-pr-temp.yml
          git commit -m 'docs: fix frontend lock clock and fixed power contracts [skip ci]'
          git push origin HEAD:agent/apply-tuner-hal2-design-proposals-v70
