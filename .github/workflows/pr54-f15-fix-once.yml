name: PR54 F15 repair once

on:
  push:
    paths:
      - ".github/workflows/pr54-f15-fix-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/implement-tis-arib-si-design-pr53
          fetch-depth: 0
      - name: 修正を適用
        run: python3 .github/scripts/pr54_f15_fix.py
      - name: Rust 1.81でHALを検証
        run: |
          rustup toolchain install 1.81.0 --profile minimal --component rustfmt --component clippy
          cargo +1.81.0 fmt --manifest-path tuner_hal2/Cargo.toml --all -- --check
          cargo +1.81.0 check --manifest-path tuner_hal2/Cargo.toml --workspace --lib --locked
          cargo +1.81.0 test --manifest-path tuner_hal2/Cargo.toml --workspace --lib --locked
      - name: 差分を検査
        run: git diff --check
      - name: 通常sourceをcommit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tuner_hal2/service_runtime/src/frontend_request_txn.rs \
                  tis/src/com/maleicacid/tvinput/tis/TunerController.kt \
                  tis/src/com/maleicacid/tvinput/tis/ScanPlan.kt \
                  tis/src/com/maleicacid/tvinput/tis/ChannelScanController.kt \
                  tis/tests/src/com/maleicacid/tvinput/tis/ScanPlanPolicyTest.kt
          git commit -m "fix(tis): distinguish unsupported BS stream discovery"
          git push origin HEAD:agent/implement-tis-arib-si-design-pr53
