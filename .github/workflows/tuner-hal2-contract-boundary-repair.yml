name: tuner_hal2 contract boundary repair

on:
  push:
    branches: [fix/tuner-hal2-contract-boundaries]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[boundary-fix-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tuner-hal2-contract-boundaries
          fetch-depth: 0

      - name: Apply contract boundary repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tuner_hal2/binder_adapter/src/aidl_frontend_settings.rs')
          s = p.read_text()
          old = '''    IsdbtExplicitMode,\n    IsdbtExplicitInversion,'''
          new = '''    IsdbtUnsupportedBandwidth,\n    IsdbtExplicitMode,\n    IsdbtExplicitInversion,'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''    if !matches!(\n        s.bandwidth,\n        FrontendIsdbtBandwidth::AUTO\n            | FrontendIsdbtBandwidth::BANDWIDTH_6MHZ\n            | FrontendIsdbtBandwidth::BANDWIDTH_7MHZ\n            | FrontendIsdbtBandwidth::BANDWIDTH_8MHZ\n    ) {\n        return invalid_frontend_setting("ISDB-T bandwidth contains a reserved enum value");\n    }\n\n    classify_auto_only('''
          new = '''    match s.bandwidth {\n        FrontendIsdbtBandwidth::AUTO | FrontendIsdbtBandwidth::BANDWIDTH_6MHZ => {}\n        FrontendIsdbtBandwidth::BANDWIDTH_7MHZ | FrontendIsdbtBandwidth::BANDWIDTH_8MHZ => {\n            requirements.push(FrontendProfileRequirement::IsdbtUnsupportedBandwidth);\n        }\n        _ => {\n            return invalid_frontend_setting("ISDB-T bandwidth contains a reserved enum value");\n        }\n    }\n\n    classify_auto_only('''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('tuner_hal2/aidl_service/src/tuner_service/frontend_methods.rs')
          s = p.read_text()
          old = '''    let (feature, detail) = match requirement {\n        FrontendProfileRequirement::IsdbtExplicitMode => {'''
          new = '''    let (feature, detail) = match requirement {\n        FrontendProfileRequirement::IsdbtUnsupportedBandwidth => (\n            "isdbt.bandwidth",\n            "known ISDB-T bandwidth is not supported by this product profile",\n        ),\n        FrontendProfileRequirement::IsdbtExplicitMode => {'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('tuner_hal2/aidl_service/src/tuner_service.rs')
          s = p.read_text()
          old = '''fn frontend_type_from_snapshot(snapshot: &RootFrontendInfoSnapshot) -> FrontendType {\n    match snapshot.system {\n        FrontendSystem::IsdbT => FrontendType::ISDBT,\n        FrontendSystem::IsdbS => FrontendType::ISDBS,\n        FrontendSystem::IsdbS3 | FrontendSystem::DvbS => FrontendType::ISDBT,\n    }\n}\n'''
          new = '''fn frontend_type_from_system(system: FrontendSystem) -> Result<FrontendType, HalError> {\n    match system {\n        FrontendSystem::IsdbT => Ok(FrontendType::ISDBT),\n        FrontendSystem::IsdbS => Ok(FrontendType::ISDBS),\n        FrontendSystem::IsdbS3 | FrontendSystem::DvbS => Err(HalError::internal(\n            HalInternalKind::InvariantViolation,\n            "unsupported frontend system escaped the immutable capability snapshot",\n        )),\n    }\n}\n\nfn frontend_type_from_snapshot(\n    snapshot: &RootFrontendInfoSnapshot,\n) -> Result<FrontendType, HalError> {\n    frontend_type_from_system(snapshot.system)\n}\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''fn frontend_caps_for_snapshot(snapshot: &RootFrontendInfoSnapshot) -> FrontendCapabilities {\n    match frontend_type_from_snapshot(snapshot) {\n        FrontendType::ISDBT => FrontendCapabilities::IsdbtCaps(FrontendIsdbtCapabilities {'''
          new = '''fn frontend_caps_for_snapshot(\n    snapshot: &RootFrontendInfoSnapshot,\n) -> Result<FrontendCapabilities, HalError> {\n    match frontend_type_from_snapshot(snapshot)? {\n        FrontendType::ISDBT => Ok(FrontendCapabilities::IsdbtCaps(FrontendIsdbtCapabilities {'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''            isFullSegment: snapshot\n                .capability\n                .isdbt_segment\n                .is_some_and(|capability| capability.is_full_segment),\n        }),\n        FrontendType::ISDBS => FrontendCapabilities::IsdbsCaps(FrontendIsdbsCapabilities {\n            modulationCap: isdbs_modulation_caps(),\n            coderateCap: isdbs_coderate_caps(),\n        }),\n        _ => Default::default(),\n    }\n}\n\nfn frontend_info_from_snapshot(snapshot: &RootFrontendInfoSnapshot) -> FrontendInfo {\n    let scalar = snapshot.capability.scalar;\n    FrontendInfo {\n        r#type: frontend_type_from_snapshot(snapshot),'''
          new = '''            isFullSegment: snapshot\n                .capability\n                .isdbt_segment\n                .is_some_and(|capability| capability.is_full_segment),\n        })),\n        FrontendType::ISDBS => Ok(FrontendCapabilities::IsdbsCaps(FrontendIsdbsCapabilities {\n            modulationCap: isdbs_modulation_caps(),\n            coderateCap: isdbs_coderate_caps(),\n        })),\n        _ => Err(HalError::internal(\n            HalInternalKind::InvariantViolation,\n            "unsupported AIDL frontend type escaped the capability projection",\n        )),\n    }\n}\n\nfn frontend_info_from_snapshot(\n    snapshot: &RootFrontendInfoSnapshot,\n) -> Result<FrontendInfo, HalError> {\n    let scalar = snapshot.capability.scalar;\n    let frontend_type = frontend_type_from_snapshot(snapshot)?;\n    let frontend_caps = frontend_caps_for_snapshot(snapshot)?;\n    Ok(FrontendInfo {\n        r#type: frontend_type,'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''        statusCaps: frontend_status_caps_for_snapshot(snapshot),\n        frontendCaps: frontend_caps_for_snapshot(snapshot),\n    }\n}\n'''
          new = '''        statusCaps: frontend_status_caps_for_snapshot(snapshot),\n        frontendCaps: frontend_caps,\n    })\n}\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''            RootQueryResponse::FrontendInfo(snapshot) => Ok(frontend_info_from_snapshot(&snapshot)),'''
          new = '''            RootQueryResponse::FrontendInfo(snapshot) => {\n                frontend_info_from_snapshot(&snapshot).map_err(status_from_hal_error)\n            },'''
          assert old in s
          s = s.replace(old, new, 1)
          marker = '''    #[test]\n    fn configure_ip_cid_returns_unavailable_for_any_value() {'''
          insert = '''    #[test]\n    fn unsupported_frontend_system_never_falls_back_to_isdbt() {\n        for system in [FrontendSystem::IsdbS3, FrontendSystem::DvbS] {\n            assert!(matches!(\n                frontend_type_from_system(system),\n                Err(HalError::Internal {\n                    kind: HalInternalKind::InvariantViolation,\n                    ..\n                })\n            ));\n        }\n    }\n\n'''
          assert marker in s
          s = s.replace(marker, insert + marker, 1)
          p.write_text(s)

          src = Path('tuner_hal/DESIGN_JA.md')
          dst = Path('tuner_contract/DESIGN_JA.md')
          dst.parent.mkdir(exist_ok=True)
          assert src.exists() and not dst.exists()
          src.rename(dst)
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.as_posix() in {
                  'tuner_hal/CHANGELOG.md',
                  '.github/workflows/tuner-hal2-contract-boundary-repair.yml',
              }:
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              if 'tuner_hal/DESIGN_JA.md' in text:
                  path.write_text(text.replace('tuner_hal/DESIGN_JA.md', 'tuner_contract/DESIGN_JA.md'))
          Path('tuner_hal/DESIGN_JA.md').write_text('''# Tuner HAL 公開契約の移動\n\nTuner HAL の公開AIDL契約、capability、状態遷移、資源寿命、transaction意味論の規範正本は `../tuner_contract/DESIGN_JA.md` へ移動した。\n\nこのファイルは旧 `tuner_hal` 実装treeからの案内だけを目的とし、規範値を所有しない。\n''')
          PY

          rustfmt --edition 2021 tuner_hal2/binder_adapter/src/aidl_frontend_settings.rs
          rustfmt --edition 2021 tuner_hal2/aidl_service/src/tuner_service/frontend_methods.rs
          rustfmt --edition 2021 tuner_hal2/aidl_service/src/tuner_service.rs

      - name: Validate host contracts
        working-directory: tuner_hal2/host_ci
        run: |
          cargo test -p maleicacid-tuner-hal2-compile-contract-host-ci --locked
          cargo check --workspace --lib --locked
          cargo test --workspace --exclude maleicacid-tuner-hal2-demux-host-ci --locked

      - name: Commit production changes and remove helper
        shell: bash
        run: |
          git rm -f .github/workflows/tuner-hal2-contract-boundary-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(tuner): align frontend and contract ownership [boundary-fix-bot]'
          git push origin HEAD:fix/tuner-hal2-contract-boundaries
