name: temporary PR78 frontend SSOT wording patch

on:
  push:
    branches: [fix/tuner-hal2-contract-boundaries]
    paths:
      - ".github/workflows/tmp-pr78-frontend-ssot-wording-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tuner-hal2-contract-boundaries
          fetch-depth: 0

      - name: Apply exact DESIGN_JA partial patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tuner_hal/DESIGN_JA.md")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "本製品の対象バックエンドは、モード、変調方式、符号化率、ガードインターバル、時間インターリーブについて `AUTO` だけを対応能力として採用し、公開・受理する。規格上の具体値を解析や試験のため内部表現に保持してよいが、制御可能な設定として公開または受理してはならない。",
                  "本製品の対象バックエンドは、モード、変調方式、符号化率、ガードインターバル、時間インターリーブについて `AUTO` だけを対応能力として採用し、明示要求として公開・受理する。`UNDEFINED` は対応能力値ではなくcaller constraintなしを表すAOSP sentinelとして別途受理する。規格上の具体値を解析や試験のため内部表現に保持してよいが、制御可能な設定として公開または受理してはならない。",
                  "ISDB-T summary",
              ),
              (
                  "対象のpx4/earth_pt1によるISDB-Sでは、変調方式と符号化率は `AUTO` だけを対応能力として採用する。`AUTO` は成功とし、規格上既知の具体値には状態を変えず `UNAVAILABLE`、不正値には `INVALID_ARGUMENT` を返す。相対TS番号とTS_IDを別のselector domainとして扱う根拠はARIB STD-B20 3.0の2.9（別記第2・第3）と2.10、周波数の根拠はSTD-B21 5.12-E2とし、セレクター設定表で動作を別に定める。",
                  "対象のpx4/earth_pt1によるISDB-Sでは、変調方式と符号化率は `AUTO` だけを対応能力として採用する。`UNDEFINED` は対応能力値ではなくcaller constraintなしを表すAOSP sentinelとして成功させ、`AUTO` はhardwareによる自動検出・設定を求める明示要求として成功させる。規格上既知の具体値には状態を変えず `UNAVAILABLE`、予約値・未知値には `INVALID_ARGUMENT` を返す。相対TS番号とTS_IDを別のselector domainとして扱う根拠はARIB STD-B20 3.0の2.9（別記第2・第3）と2.10、周波数の根拠はSTD-B21 5.12-E2とし、セレクター設定表で動作を別に定める。",
                  "ISDB-S summary",
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: target count={count}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-pr78-frontend-ssot-wording-patch.yml
          git add tuner_hal/DESIGN_JA.md
          git commit -m "docs(tuner): distinguish frontend sentinel from capability"
          git push origin HEAD:fix/tuner-hal2-contract-boundaries
