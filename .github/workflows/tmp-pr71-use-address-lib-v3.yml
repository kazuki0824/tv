name: tmp-pr71-use-address-lib-v3
on:
  push:
    branches: [fix/tuner-hal2-vts-auto-region]
    paths: [.github/workflows/tmp-pr71-use-address-lib-v3.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tuner-hal2-vts-auto-region
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Add existing address parser
        working-directory: tuner_hal2/tools
        run: uv add japanese-address-parser-py
      - name: Integrate parser only for incomplete address input
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tuner_hal2/tools/vts_profile/region.py')
          s=p.read_text()
          s=s.replace('from typing import Any\n', 'from typing import Any\n\nfrom japanese_address_parser_py import Parser\n', 1)
          marker='def _frequency_for_channel(channel: int) -> int:\n'
          insert='''_ADDRESS_PARSER = Parser()\n\ndef _normalize_address(query: str) -> str:\n    result = _ADDRESS_PARSER.parse(query)\n    if result.error:\n        raise ProfileError(f"failed to normalize Japanese address: {result.error}")\n    address = result.address\n    if not isinstance(address, dict):\n        raise ProfileError("Japanese address parser returned no structured address")\n    prefecture = address.get("prefecture")\n    city = address.get("city")\n    if not isinstance(prefecture, str) or not prefecture or not isinstance(city, str) or not city:\n        raise ProfileError("Japanese address must resolve to a prefecture and municipality")\n    town = address.get("town")\n    return prefecture + city + (town if isinstance(town, str) else "")\n\n'''
          if marker not in s: raise SystemExit('frequency marker missing')
          s=s.replace(marker, insert+marker, 1)
          start=s.index('def _resolved_region_addresses(query: str) -> list[str]:\n')
          end=s.index('\n\ndef _channels_for_address', start)
          replacement='''def _resolved_region_addresses(query: str) -> list[str]:\n    value = query.strip()\n    if value.lower().startswith("postal:"):\n        return _postal_addresses(value.split(":", 1)[1])\n    if re.fullmatch(r"\\d{3}-?\\d{4}", value):\n        return _postal_addresses(value)\n    if value.lower().startswith("latlon:"):\n        return [_coordinate_address(value)]\n    if re.fullmatch(r"[+-]?\\d+(?:\\.\\d+)?\\s*,\\s*[+-]?\\d+(?:\\.\\d+)?", value):\n        return [_coordinate_address(value)]\n    if any(prefecture in value for prefecture in JAPAN_PREFECTURES):\n        return [value]\n    return [_normalize_address(value)]\n'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)

          t=Path('tuner_hal2/tools/test_vts_region_defaults.py')
          s=t.read_text()
          old='''    def test_address_without_prefecture_is_fail_closed(self) -> None:\n        with self.assertRaises(ProfileError):\n            resolve_region(_profile("大阪市中央区大阪城1-1"))\n'''
          new='''    def test_address_without_prefecture_is_normalized_by_library(self) -> None:\n        profile = _profile("大阪市中央区大阪城1-1")\n        with patch("vts_profile.region._normalize_address", return_value="大阪府大阪市中央区大阪城"):\n            resolve_region(profile)\n        self.assertEqual(_channels(profile), [13, 14, 15, 16, 17, 18, 24])\n'''
          if old not in s: raise SystemExit('old missing-prefecture test missing')
          t.write_text(s.replace(old,new,1))
          PY
      - name: Validate unit and real parser examples
        working-directory: tuner_hal2/tools
        run: |
          uv run python -m unittest test_vts_region_defaults.py
          uv run python - <<'PY'
          from vts_profile.region import _normalize_address
          for q in ['大阪市中央区大阪城1-1', '八王子市元本郷町3-24-1']:
              print(q, '=>', _normalize_address(q))
          PY
          uv run python -m py_compile vts_profile/region.py vts_profile/cli.py test_vts_region_defaults.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tuner_hal2/tools/pyproject.toml tuner_hal2/tools/uv.lock tuner_hal2/tools/vts_profile/region.py tuner_hal2/tools/test_vts_region_defaults.py
          git commit -m 'fix: normalize VTS addresses with existing parser'
          git push origin HEAD:fix/tuner-hal2-vts-auto-region
