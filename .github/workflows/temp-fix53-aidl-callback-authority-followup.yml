name: temp PR53 AIDL callback authority follow-up
on:
  push:
    branches: [fix/tuner-hal2-rustfmt-1.81]
    paths: [.github/workflows/temp-fix53-aidl-callback-authority-followup.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tuner-hal2-rustfmt-1.81
          persist-credentials: true
          fetch-depth: 0
      - name: Apply production repair
        run: python3 tools/temp_fix53_aidl_callback_authority_followup_v2.py
      - name: Format changed Rust sources
        run: |
          rustfmt --edition 2021 tuner_hal2/aidl_service/src/callback_store.rs
          rustfmt --edition 2021 tuner_hal2/aidl_service/src/service_context.rs
          rustfmt --edition 2021 tuner_hal2/aidl_service/src/object_runtime/mod.rs
          rustfmt --edition 2021 tuner_hal2/aidl_service/src/child_object_open.rs
          rustfmt --edition 2021 tuner_hal2/compile_contract/src/lib.rs
          (cd tuner_hal2/host_ci && cargo fmt --all)
      - name: Run AIDL callback source contract
        working-directory: tuner_hal2/host_ci
        run: cargo test -p maleicacid-tuner-hal2-compile-contract-host-ci --locked
      - name: Run host workspace tests
        working-directory: tuner_hal2/host_ci
        run: cargo test --workspace --locked
      - name: Run host all-target check
        working-directory: tuner_hal2/host_ci
        run: cargo check --workspace --all-targets --locked
      - name: Run host Clippy
        working-directory: tuner_hal2/host_ci
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Commit production repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tuner_hal2/aidl_service/src/callback_store.rs \
            tuner_hal2/aidl_service/src/service_context.rs \
            tuner_hal2/aidl_service/src/object_runtime/mod.rs \
            tuner_hal2/aidl_service/src/child_object_open.rs \
            tuner_hal2/compile_contract/src/lib.rs \
            tuner_hal2/Android.bp
          git diff --cached --check
          git commit -m "Close AIDL callback authority failure paths"
          git push origin HEAD:fix/tuner-hal2-rustfmt-1.81
