name: tmp-caption-pr41-migrate
on:
  push:
    branches: [agent/align-caption-contract-with-dev-rules]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/align-caption-contract-with-dev-rules
          fetch-depth: 0
      - name: Migrate contract into owned documents
        shell: python
        run: |
          from pathlib import Path

          design_path = Path('tis/DESIGN_JA.md')
          integration_path = Path('tis/INTEGRATION.md')

          design = design_path.read_text()
          ds = design.index('## libaribcaption Soong / renderer 統合境界')
          de = design.index('## ライブ playback 実装方式', ds)
          design_chunk = r'''## libaribcaption renderer runtime 契約

ARIB字幕表示は、repoで供給される `libaribcaption-android` の製品forkをSoong build graphに入れ、renderer有効の `libaribcaption` moduleを正式経路として使用する。build/link/partitionの統合条件は `INTEGRATION.md` を正とし、本書はTIS内部runtime、renderer viewport、PTS、native lifecycleだけを所有する。out-of-graph prebuilt、renderer無効build、`dlopen()`確認だけ、decoder API呼び出しだけ、Canvas文字描画だけを字幕対応宣言条件にしてはならない。

`libmaleicacid_arib_caption_jni` は Rust JNI boundary + 安全なRustラッパーから libaribcaption C APIを直接利用し、TISは字幕PESをdecoderからrendererへ渡してRGBA8888 renderer出力を字幕overlayへ接続する。字幕PESを受け取ってもrenderer表示に到達できない状態を字幕対応成功として扱ってはならない。Kotlinへlibaribcaptionのraw pointerや借用寿命を漏らさず、caption/result/imageのcleanupはRust FFI境界で完結させる。

Rust JNIの表示用出力は文字列ではなくrenderer結果を表し、少なくとも `pts_millis`、有限またはindefiniteを区別できるduration、画像ごとの `dst_x`、`dst_y`、`width`、`height`、`stride`、Rust-owned `rgba8888` bufferを持つ。libaribcaption所有bitmapはRust-owned bufferへcopyしてからcleanupする。`CaptionOverlayView`はrenderer imageをBitmap化し、後述viewport originを一度だけ加算して`drawBitmap()`する。`caption.text` / `Canvas.drawText()`を字幕表示正式経路に残さない。strideを無視して `width * 4` の密な配列と仮定せず、Bitmap生成前にwidth/height/stride/buffer sizeの整合を検査する。

### renderer viewport / 座標契約

libaribcaption rendererはrender前に `aribcc_renderer_set_frame_size()` を必ず成功させる。固定1920x1080、字幕plane size、端末display sizeを代替値として推測使用してはならない。

TISはplayback generationごとに `CaptionViewport` を一つ所有する。これはcurrent session Surfaceに対応して実際に字幕を重ねるvideo content viewportをoverlay座標系で表し、少なくとも `overlayWidthPx > 0`、`overlayHeightPx > 0`、`contentLeftPx`、`contentTopPx`、`contentWidthPx > 0`、`contentHeightPx > 0`、`generationToken` を持つ。`contentLeftPx/contentTopPx/contentWidthPx/contentHeightPx` はletterbox / pillarboxを含むoverlay全体ではなくcurrent video content表示矩形を表す。videoを持たないaudio-only serviceでは映像座標のrenderer viewportを成立させず、その経路で字幕表示成功を表明しない。

renderer frame sizeは `contentWidthPx x contentHeightPx` に設定する。libaribcaptionが返す `dst_x/dst_y/width/height` はrenderer frame左上を原点とする座標として扱い、overlayでは `contentLeftPx/contentTopPx` を一度だけ加算する。別の独自scale、ARIB planeからの再計算、Canvas text layoutを追加しない。

viewportが未確定、幅/高さが0、generation不一致の場合は `aribcc_renderer_set_frame_size()` / renderへ進まず字幕表示成功にしない。同一playback generation内の純粋なviewport size/position変更ではdecoder continuityを壊さない。subtitle schedulerを一旦止め旧bitmapをclearし、renderer frame sizeを新 `contentWidthPx/contentHeightPx` へ更新する。current media timeで安全に再renderできる場合だけ新viewportへ再表示し、できない場合は旧bitmapを拡大縮小して流用せず次の有効captionまでclearを維持する。

### 字幕PTS scheduling / NoPTS / clear ownership

字幕のmedia clockはvideo/audioと同じcurrent MediaSyncのcanonical clockだけとする。TIS、Rust JNI、`CaptionOverlayView`はPCR/wallclockから別media clockを作らず、固定delayや周期的な`getTimestamp()` polling loopも持たない。字幕PESにrendererへ渡せるauthoritativeな33-bit 90 kHz PTSがある場合だけ、video/audioと同じcurrent playback generationのunwrap規則でcanonical `timeUs`へ変換し、その時刻をdecoder/renderer/schedulerの同一caption時刻として使用する。

libaribcaptionの `ARIBCC_PTS_NOPTS` / `PTS_NOPTS` をrendererへappendしない。rendererが使用できるauthoritative PTSがないcaptionは、0へ丸めず、直前PTSをcarry-forwardせず、PCR / wallclock / MediaSync current position / 受信時刻 / nominal frame rateからcaption PTSを生成せず、renderer queueへappendせず、そのcaptionを表示成功として扱わず型付き診断へ記録する。NoPTS入力だけを理由に既に表示中の有効captionを即時clearせず、その既存caption自身のduration / clear / lifecycle契約に従う。現行製品profileが字幕表示対応を表明するには、字幕filter / producerが表示対象caption PESについてrendererに渡せるauthoritative PTSを供給できることをqualification条件に含め、満たせないbackend/profileはdecoderが文字列抽出できてもr51字幕表示成功対応として表明しない。

字幕display/clearは、MediaSyncの`getTimestamp()`が返すmedia time / anchor time / playback rateを唯一の時間基準とするevent-driven one-shot subtitle schedulerが担当する。新caption、finite-duration clear、明示clearのうち次の1境界だけをarmし、予定時刻到達時にcurrent MediaSync timestampを再読して境界到達を確認する。earlyなら同じ境界へre-armし、dueならdisplay/clearして次境界だけをarmする。周期polling、独立free-running clock、PCR→wallclock clock、video frame release/drop判定を実装しない。

libaribcaptionが有限durationを返すcaptionは `PTS + duration` を同じcanonical timeline上のclear境界とする。`DURATION_INDEFINITE`は有限値へ推測変換せず、次caption、ARIB/libaribcaptionの明示clear、字幕track無効化、generation終了までcurrent imageを保持する。次captionはそのPTS境界で旧imageを直接replaceする。既表示captionのdurationを後から別clockで補正しない。

### decoder / renderer / scheduler lifecycle

字幕native state、scheduler state、overlay stateは同じsubtitle generationに属し、少なくとも `playbackGenerationToken`、`selectedSubtitleTrackId`、`CaptionViewport`、libaribcaption context、decoder、renderer、pending one-shot event、current rendered frameを一組として扱う。状態変更はsession/subtitleのserial executor上に直列化し、旧generation callback/result/eventはgeneration token不一致で破棄する。

字幕がenabledかつsubtitle trackが選択され、current playback generationと有効viewportが揃った場合だけnative renderer pathをactiveにする。新subtitle generation開始時はcontext/decoder/rendererを既知の初期状態から構築し、renderer initialize後にcurrent viewportで `aribcc_renderer_set_frame_size()` を成功させてからcaption inputを受け入れる。

`onSetCaptionEnabled(false)` はpending scheduler eventをcancelし、overlayを即時clearし、`aribcc_renderer_flush()`相当でrenderer queue/current render stateを失効させる。disabled中のPESを表示用renderer queueへ蓄積しない。再enable時にdisable中に停止・flushされたsubtitle filterのcontinuityを仮定せず、native decoder/renderer state継続可否が証明できない場合は新subtitle generationとして再初期化し、古いdecoder stateの暗黙再利用より再初期化を既定とする。

`onSelectTrack(TYPE_SUBTITLE, null)` は即時にscheduler cancel、overlay clear、renderer flushを行ってcurrent subtitle generationを終了する。別subtitle trackへの変更も旧generationを終了し、新track用context/decoder/rendererを新規初期化して旧trackのcaption/result/eventを持ち越さない。

字幕filter自身のflush、stop/reconfigure/restartによりdata-group continuityが失われ得る場合はpending scheduler eventとoverlayをclearし、rendererをflushし、decoder/rendererを新subtitle generationとして再初期化する。A/V filterだけのplain flushは字幕generationを変更しない。

物理retune、service/codec/PID graph変更、playback generation変更、Surface/MediaSync generation変更では旧subtitle generationを終了し、pending event cancel、overlay clear、renderer flush、decoder/renderer/context解放を行う。新playback generationでは新viewportとtiming epochが確定するまで字幕inputを表示成功にしない。playback rate変更時はcurrent canonical clockに対してpending subtitle eventをcancel/re-armするが、それだけを理由にdecoder stateを破棄しない。

session releaseはpending event cancel、overlay clear、renderer flushの後、renderer → decoder → contextの依存関係を壊さない順で解放し、subtitle executor上のqueued stale workをreleased flag/generation tokenで破棄する。release後にnative callback/resultがUI stateを変更してはならない。

最低試験には、valid viewport確定前のrenderを成功扱いしないこと、valid viewportでRGBA8888 + dst rectがoverlayへ出ること、stride/buffer size検査、viewport変更で旧bitmap座標を流用しないこと、valid PTS captionがcanonical timelineに表示されること、NoPTSを0/前値/PCR/wallclock等で補完しないこと、NoPTS captionをrenderer append/display successにしないこと、NoPTS入力だけで既存有効captionを根拠なくclearしないこと、disable/deselect/track change/subtitle filter continuity loss/retune/playback generation/Surface generation/releaseの各境界で上記state ownershipが成立すること、A/V-only plain flushでは字幕generationをresetしないこと、release後のstale resultが描画しないことを含める。

'''
          design = design[:ds] + design_chunk + design[de:]
          design_path.write_text(design)

          integration = integration_path.read_text()
          ins = integration.index('## libaribcaption Soong / renderer 統合')
          ine = integration.index('## 権限と priv-app', ins)
          integration_chunk = r'''## libaribcaption Soong / renderer 統合

ARIB字幕表示のproduct統合では、repoで供給される `libaribcaption-android` の製品forkをSoong graphに含め、renderer有効の `cc_library_static { name: "libaribcaption" }` を正式経路とする。`libaribcaption` はcore側variantを使用し、`system_ext_specific: true` の `libmaleicacid_arib_caption_jni` からSoongの静的native dependencyとして直接linkする。`libaribcaption` のFreeType依存は `libft2.nodep` を使用し、TISのsystem/system_ext dependency closure内で解決する。

正式な依存関係は次とする。

```text
/system_ext/priv-app/MaleicacidTvInput
  └─ libmaleicacid_arib_caption_jni.so
       └─ Soong static dependency: libaribcaption
            └─ static dependency: libft2.nodep
```

Rust JNIはlibaribcaption C APIを `extern "C"` で直接参照し、`libdl`、`dlopen()`、`dlsym()`、`dlclose()`を正式経路から除去する。Soongの静的依存指定は対象treeでRust `rust_ffi_shared` からC/C++ static moduleを正しく最終linkできる形を選ぶ。`static_libs` と `whole_static_libs` のどちらを使うかはlink graphとdead-strip要件に従う実装詳細とし、不要な全archive強制取り込みを設計目的にしない。ただしlibaribcaption C APIとtransitiveな `libft2.nodep` 依存が最終JNI `.so` で全て解決されることをbuild gateで確認する。

`libaribcaption.so` は生成・配置・APK同梱を要求しない。したがって `libaribcaption.so` の存在、`libmaleicacid_arib_caption_jni.so` の `DT_NEEDED` に `libaribcaption.so` が出ること、`MaleicacidTvInput` の `jni_libs` に `libaribcaption` を追加すること、`libaribcaption.so` のexport symbolをreadelfで確認することを完了条件にしてはならない。`MaleicacidTvInput` はJNI libraryとして `libmaleicacid_arib_caption_jni` のみを取り込み、libaribcaption/FreeTypeのcodeは最終JNI `.so` へ静的に閉じる。

次は字幕対応宣言条件として認めない。

```text
- runtime `dlopen()` でlibaribcaptionを探索できることだけ
- decoder APIを呼べることだけ
- Canvas文字描画だけ
- renderer無効build
- provenanceとbuild optionが不明なout-of-graph prebuilt
```

build確認では次を必須とする。

```text
- m libaribcaption が通る。
- m libmaleicacid_arib_caption_jni が通る。
- m MaleicacidTvInput が通る。
- libmaleicacid_arib_caption_jni.so のundefined native symbolに未解決の aribcc_* が残らない。
- libmaleicacid_arib_caption_jni.so に libaribcaption.so への DT_NEEDED が存在しない。
- runtime経路に dlopen/dlsym が残らない。
- renderer C APIを実際に呼ぶ。
```

実機確認では字幕PES入力からlibaribcaption decoder/renderer、RGBA8888出力、TIS字幕overlay表示までを接続確認対象とする。renderer viewport、PTS/NoPTS、scheduler、decoder/renderer lifecycleのruntime意味論は `DESIGN_JA.md` を正とし、本書で独立に再定義しない。

'''
          integration = integration[:ins] + integration_chunk + integration[ine:]
          integration_path.write_text(integration)

          Path('tis/CAPTION_RENDERER_CONTRACT.md').unlink()
          Path('.github/workflows/tmp-caption-pr41-migrate.yml').unlink()
      - name: Commit migrated design
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "design: move caption contracts into owned documents"
          git push origin HEAD:agent/align-caption-contract-with-dev-rules
