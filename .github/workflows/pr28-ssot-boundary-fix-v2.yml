name: PR28 SSOT boundary fix v2
on:
  push:
    branches:
      - agent/fix-commonization-boundaries
    paths:
      - .github/workflows/pr28-ssot-boundary-fix-v2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-commonization-boundaries
          fetch-depth: 0
      - name: Apply SSOT patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/pr28-fix.py
          python3 /tmp/pr28-fix.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tuner_hal2/DESIGN_JA.md
          git commit -m 'design: restore tuner_hal2 SSOT boundary'
          git push origin HEAD:agent/fix-commonization-boundaries
