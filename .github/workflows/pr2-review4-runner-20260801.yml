name: PR2 review four runner

on:
  push:
    branches: [main]
    paths:
      - .github/pr2-review4-runner-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apply-tuner-hal2-design-proposals-v70
          fetch-depth: 0
      - name: Run reviewed patch
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.github/pr2-review4-patch.py > /tmp/pr2_review4_patch.py
          python3 /tmp/pr2_review4_patch.py
          git diff --check
          git diff --stat
      - name: Commit and push
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tis/DESIGN_JA.md 開発規則.md tuner_hal/DESIGN_JA.md
          git commit -m 'docs: restore TIS HAL boundaries and TableInfo completion'
          git push origin HEAD:agent/apply-tuner-hal2-design-proposals-v70
