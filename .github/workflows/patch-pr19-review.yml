name: Patch PR19 review findings
on:
  push:
    branches: [agent/fix-tis-arib-design-residuals]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch documentation
        run: |
          python3 .github/patch_pr19_review.py
          git diff --check
          rm .github/workflows/patch-pr19-review.yml .github/patch_pr19_review.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tis/DESIGN_JA.md arib_si_engine_rs/DESIGN_JA.md .github/workflows/patch-pr19-review.yml .github/patch_pr19_review.py
          git commit -m "docs: address PTS and UCS review findings"
          git push
