name: PR54 apply items 2 and 4 on macOS

on:
  push:
    branches:
      - agent/implement-tis-arib-si-design-pr53

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scoped transformation
        shell: bash
        run: |
          python3 <<'DRIVER'
          from pathlib import Path
          lines = Path('.github/workflows/pr54-apply-2-4.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if "python3 <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          block = lines[start:end]
          indent = min(len(line) - len(line.lstrip()) for line in block if line.strip())
          code = '\n'.join(line[indent:] for line in block) + '\n'
          exec(compile(code, 'pr54-items-2-4.py', 'exec'), {'__name__': '__main__'})
          DRIVER
      - name: Commit scoped source changes and remove temporary files
        shell: bash
        run: |
          rm -f .github/workflows/pr54-apply-2-4.yml .github/workflows/pr54-apply-macos.yml .pr54-apply-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tis/DESIGN_JA.md arib_si_engine_rs/DESIGN_JA.md arib_si_engine_rs/src/service_discovery.rs tis/src/com/maleicacid/tvinput/aribsi/ServiceListBuilder.kt tis/src/com/maleicacid/tvinput/tis/ChannelScanController.kt .github/workflows/pr54-apply-2-4.yml .github/workflows/pr54-apply-macos.yml .pr54-apply-trigger
          git commit -m "fix: align TIS budgets and SMD reception policy"
          git push origin HEAD:agent/implement-tis-arib-si-design-pr53
