name: PR28 LNB review fixes

on:
  push:
    branches:
      - agent/fix-commonization-boundaries
    paths:
      - .github/workflows/pr28-lnb-review-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-commonization-boundaries
          fetch-depth: 0
      - name: Apply LNB review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, got {n}')
              return text.replace(old, new, 1)

          # 1. LNB callback ownership: remove the API-specific second owner.
          p = Path('tuner_hal/DESIGN_JA.md')
          t = p.read_text(encoding='utf-8')
          old = '`ILnb.setCallback(callback)` は、受け取ったコールバック実体を `LnbHal` 内に保持する。`callback == NULL` は AOSP契約上の callback 登録解除として成功対象に含め、保持中の callback 実体を解放する。再設定時は新しいコールバック実体で置換する。`ILnb.close()` と未閉鎖 `LnbHal` の破棄経路では保持中のコールバック実体を解放する。AOSP frozen/stable AIDL の vendor 独自改変、生の Binder transaction 解析器による公開契約を通さない実装は採用しない。'
          new = '`ILnb.setCallback(callback)` のBinder callback artifact / strong refは共通callback storeだけが所有し、runtime登録は`RuntimeCallbackRegistry`、LNB domainはlogical callback stateだけを所有する。set / replace / `callback == NULL` による解除 / close / owner lossは`CallbackRegistrationUseCase`の登録・cleanup契約へ接続し、`LnbHal`またはLNB個別use-caseがBinder callback実体、runtime registry、rollback方針を第二の正本として直接所有してはならない。`callback == NULL` はAOSP契約上の登録解除として成功対象に含める。AOSP frozen/stable AIDL のvendor独自改変、生のBinder transaction解析器による公開契約を通さない実装は採用しない。'
          t = replace_once(t, old, new, 'LNB callback ownership')
          p.write_text(t, encoding='utf-8')

          # 2. Product-level LNB exception belongs to 開発規則.md.
          p = Path('開発規則.md')
          t = p.read_text(encoding='utf-8')
          old = '  - r51 で 対応宣言する `ITuner` / `IFrontend` / `IDemux` / `IFilter` / `IDvr` / `IDescrambler` / `ILnb` 面は、成功 no-op を残さず AOSP 契約どおりに実装する。'
          new = '  - r51 で 対応宣言する `ITuner` / `IFrontend` / `IDemux` / `IFilter` / `IDvr` / `IDescrambler` / `ILnb` 面は、成功 no-op を残さず AOSP 契約どおりに実装する。ただしLNBについては、本書「LNB部分能力公開の製品例外」に定義するproduct-level例外を適用する。'
          t = replace_once(t, old, new, 'module LNB general rule')

          old = '  - `ITuner` / `IFrontend` / `IDemux` / `IFilter` / `IDvr` / `IDescrambler` / `ILnb` のうち、r51 で advertise / 対応宣言する機能範囲を AOSP 契約どおりに実装する。'
          new = '  - `ITuner` / `IFrontend` / `IDemux` / `IFilter` / `IDvr` / `IDescrambler` / `ILnb` のうち、r51 で advertise / 対応宣言する機能範囲を AOSP 契約どおりに実装する。ただしLNBについては、本書「LNB部分能力公開の製品例外」に定義するproduct-level例外を適用する。'
          t = replace_once(t, old, new, 'r51 LNB general rule')

          marker = '#### 製品 scan 候補の規範値\n'
          if t.count(marker) != 1:
              raise SystemExit(f'product scan marker count={t.count(marker)}')
          section = '\n'.join([
              '#### LNB部分能力公開の製品例外',
              '',
              '本製品は `earth_pt1` / `px4_drv` のLNBについて、Android 14 CTSのLNB試験合格よりも、hardware / driverで実処理可能と確認できたLNB operation / valueを公開することを優先する。このproduct-level判断は、上記の「対応宣言する公開面をAOSP契約どおりに実装する」という一般則に対するLNB限定の明示的例外である。',
              '',
              'この例外を適用した部分LNB endpointはAndroid 14 CTSのLNB試験および同試験が前提とするAndroid互換性を満たさない可能性があるため、本製品は当該LNB面についてCTS/CDD適合を宣言しない。未対応operationを成功no-op、擬似成功、callback echoで実装済みに見せることも禁止する。',
              '',
              'この節が所有するのは「部分LNB能力を公開し、CTS/CDD compatibility deltaを既知として受容する」という製品判断だけである。公開endpointの選定条件、operation / valueごとの成功・`UNAVAILABLE`・`INVALID_ARGUMENT`、資源寿命、callback、rollback / cleanup等のTuner HAL公開契約は`/tuner_hal/DESIGN_JA.md`を正とする。理由、CTS側の具体的試験内容、既知差分、再評価条件の記録は`future_work/not_planned/tuner_lnb_partial_hardware_cts_mismatch.md`を参照する。',
              '',
          ])
          t = t.replace(marker, section + marker, 1)
          p.write_text(t, encoding='utf-8')

          # 3. future_work records rationale/delta and refers to the product-policy SSOT.
          p = Path('future_work/not_planned/tuner_lnb_partial_hardware_cts_mismatch.md')
          t = p.read_text(encoding='utf-8')
          old = 'この文書は、`earth_pt1` / `px4_drv` が実機・driverとして提供する LNB 制御能力と、Android CTS が non-null の `Lnb` に要求する基礎操作一式の粒度が一致しない問題を、既知の not planned 項目として記録する。LNB の公開可否、各 operation / value の成功可否、資源寿命、失敗時遷移の canonical 契約は `tuner_hal/DESIGN_JA.md` を正とし、この文書を並行 SSOT にしない。\n\n本製品では、Android 14 CTS の LNB 試験合格よりも、hardware / driver が実処理できることを証跡で確認した LNB operation / value を公開することを優先する。`aidl_baseline_eligible` は Android 14 CTS が non-null LNB object に要求する基礎操作一式を実処理できるかを表す CTS baseline 適合分類であり、公開 `ILnb` endpoint 全体の生成可否を決める gate には使わない。'
          new = 'この文書は、`earth_pt1` / `px4_drv` が実機・driverとして提供する LNB 制御能力と、Android CTS が non-null の `Lnb` に要求する基礎操作一式の粒度が一致しない問題について、採用理由、既知 compatibility delta、再評価条件を記録する。部分LNB能力を公開してCTS/CDD差分を受容するproduct-level判断は `開発規則.md` の「LNB部分能力公開の製品例外」を正とし、LNB の公開可否、各 operation / value の成功可否、資源寿命、失敗時遷移のTuner HAL公開契約は `tuner_hal/DESIGN_JA.md` を正とする。この文書はどちらの並行SSOTにもならない。\n\n`開発規則.md` の決定により、本製品ではAndroid 14 CTSのLNB試験合格より、hardware / driverが実処理できることを証跡で確認したLNB operation / valueの公開を優先する。`aidl_baseline_eligible` の意味と公開gateとの関係は `tuner_hal/DESIGN_JA.md` を正とし、本書では再定義しない。'
          t = replace_once(t, old, new, 'future_work SSOT position')
          p.write_text(t, encoding='utf-8')

          # Guard against the two review regressions.
          checks = {
              'tuner_hal/DESIGN_JA.md': ['`LnbHal` 内に保持する'],
              '開発規則.md': [],
          }
          for path, forbidden in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              for s in forbidden:
                  if s in text:
                      raise SystemExit(f'forbidden text remains in {path}: {s}')
          if Path('開発規則.md').read_text(encoding='utf-8').count('#### LNB部分能力公開の製品例外') != 1:
              raise SystemExit('product-level LNB exception must have exactly one SSOT section')
          PY
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tuner_hal/DESIGN_JA.md 開発規則.md future_work/not_planned/tuner_lnb_partial_hardware_cts_mismatch.md
          git commit -m 'design: close LNB review ownership gaps'
          git push origin HEAD:agent/fix-commonization-boundaries
