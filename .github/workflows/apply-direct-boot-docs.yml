name: Direct Boot 設計文書を修正

on:
  push:
    branches:
      - agent/fix-direct-boot-epg-drain-clean

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-direct-boot-epg-drain-clean
          fetch-depth: 0

      - name: 設計文書を修正
        run: python3 .github/scripts/apply_direct_boot_docs.py

      - name: 差分を確認して確定
        shell: bash
        run: |
          git diff --check
          git diff -- tis/DESIGN_JA.md tis/INTEGRATION.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-direct-boot-docs.yml .github/scripts/apply_direct_boot_docs.py
          git add tis/DESIGN_JA.md tis/INTEGRATION.md
          git diff --cached --check
          git commit -m 'docs: Direct Boot の保留処理再開契約を固定'
          git push origin HEAD:agent/fix-direct-boot-epg-drain-clean
