name: tmp-pr71-address-normalize
on:
  push:
    branches:
      - fix/tuner-hal2-vts-auto-region
    paths:
      - .github/workflows/tmp-pr71-address-normalize.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tuner-hal2-vts-auto-region
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Add existing address parser
        working-directory: tuner_hal2/tools
        run: uv add japanese-address-parser-py
      - name: Integrate parser and incomplete-address lookup
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tuner_hal2/tools/vts_profile/region.py')
          s=p.read_text()
          if 'from japanese_address_parser_py import Parser' not in s:
              s=s.replace('from typing import Any\n', 'from typing import Any\n\nfrom japanese_address_parser_py import Parser\n', 1)
          if 'GSI_ADDRESS_SEARCH_URL' not in s:
              s=s.replace(
                  'GSI_REVERSE_GEOCODER_URL = "https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress"\n',
                  'GSI_REVERSE_GEOCODER_URL = "https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress"\nGSI_ADDRESS_SEARCH_URL = "https://msearch.gsi.go.jp/address-search/AddressSearch"\n',
                  1,
              )
          marker='def _frequency_for_channel(channel: int) -> int:\n'
          if '_ADDRESS_PARSER = Parser()' not in s:
              insert='''_ADDRESS_PARSER = Parser()\n\ndef _normalize_address(query: str) -> str:\n    result = _ADDRESS_PARSER.parse(query)\n    if result.error:\n        raise ProfileError(f"failed to normalize Japanese address: {result.error}")\n    address = result.address\n    if not isinstance(address, dict):\n        raise ProfileError("Japanese address parser returned no structured address")\n    prefecture = address.get("prefecture")\n    city = address.get("city")\n    if not isinstance(prefecture, str) or not prefecture or not isinstance(city, str) or not city:\n        raise ProfileError("Japanese address must resolve to a prefecture and municipality")\n    town = address.get("town")\n    return prefecture + city + (town if isinstance(town, str) else "")\n\n'''
              if marker not in s: raise SystemExit('frequency marker missing')
              s=s.replace(marker, insert+marker,1)
          old='''def _fetch_json(url: str) -> dict[str, Any]:\n    raw = _fetch_bytes(url)\n    try:\n        value = json.loads(raw.decode("utf-8"))\n    except (UnicodeDecodeError, json.JSONDecodeError) as exc:\n        raise ProfileError(f"invalid JSON from regional lookup service {url}") from exc\n    return require_dict(value, "regional lookup response")\n'''
          new='''def _fetch_json_value(url: str) -> Any:\n    raw = _fetch_bytes(url)\n    try:\n        return json.loads(raw.decode("utf-8"))\n    except (UnicodeDecodeError, json.JSONDecodeError) as exc:\n        raise ProfileError(f"invalid JSON from regional lookup service {url}") from exc\n\n\ndef _fetch_json(url: str) -> dict[str, Any]:\n    return require_dict(_fetch_json_value(url), "regional lookup response")\n'''
          if old in s:
              s=s.replace(old,new,1)
          elif 'def _fetch_json_value' not in s:
              raise SystemExit('fetch_json block missing')
          if 'def _geocoded_address(query: str)' not in s:
              marker='def _resolved_region_addresses(query: str) -> list[str]:\n'
              insert='''def _geocoded_address(query: str) -> str:\n    url = GSI_ADDRESS_SEARCH_URL + "?" + urllib.parse.urlencode({"q": query})\n    value = _fetch_json_value(url)\n    if not isinstance(value, list) or len(value) != 1:\n        raise ProfileError("GSI address search must resolve the address to exactly one location")\n    feature = require_dict(value[0], "GSI address-search feature")\n    geometry = require_dict(feature.get("geometry"), "GSI address-search geometry")\n    coordinates = geometry.get("coordinates")\n    if not isinstance(coordinates, list) or len(coordinates) < 2:\n        raise ProfileError("GSI address search result has no coordinates")\n    try:\n        longitude = float(coordinates[0])\n        latitude = float(coordinates[1])\n    except (TypeError, ValueError) as exc:\n        raise ProfileError("GSI address search returned invalid coordinates") from exc\n    return _coordinate_address(f"{latitude},{longitude}")\n\n\n'''
              if marker not in s: raise SystemExit('resolved marker missing')
              s=s.replace(marker,insert+marker,1)
          start=s.index('def _resolved_region_addresses(query: str) -> list[str]:\n')
          end=s.index('\n\ndef _channels_for_address', start)
          replacement='''def _resolved_region_addresses(query: str) -> list[str]:\n    value = query.strip()\n    if value.lower().startswith("postal:"):\n        return _postal_addresses(value.split(":", 1)[1])\n    if re.fullmatch(r"\\d{3}-?\\d{4}", value):\n        return _postal_addresses(value)\n    if value.lower().startswith("latlon:"):\n        return [_coordinate_address(value)]\n    if re.fullmatch(r"[+-]?\\d+(?:\\.\\d+)?\\s*,\\s*[+-]?\\d+(?:\\.\\d+)?", value):\n        return [_coordinate_address(value)]\n    if any(prefecture in value for prefecture in JAPAN_PREFECTURES):\n        return [_normalize_address(value)]\n    return [_geocoded_address(value)]\n'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)

          t=Path('tuner_hal2/tools/test_vts_region_defaults.py')
          s=t.read_text()
          old='''    def test_address_without_prefecture_is_fail_closed(self) -> None:\n        with self.assertRaises(ProfileError):\n            resolve_region(_profile("大阪市中央区大阪城1-1"))\n'''
          new='''    def test_address_without_prefecture_is_geocoded_before_channel_lookup(self) -> None:\n        profile = _profile("大阪市中央区大阪城1-1")\n        with patch("vts_profile.region._geocoded_address", return_value="大阪府大阪市中央区大阪城"):\n            resolve_region(profile)\n        self.assertEqual(_channels(profile), [13, 14, 15, 16, 17, 18, 24])\n\n    def test_ambiguous_address_geocoding_is_fail_closed(self) -> None:\n        with patch("vts_profile.region._fetch_json_value", return_value=[{}, {}]):\n            with self.assertRaises(ProfileError):\n                resolve_region(_profile("中央区一丁目"))\n'''
          if old in s:
              s=s.replace(old,new,1)
          t.write_text(s)
          PY
      - name: Validate
        working-directory: tuner_hal2/tools
        run: |
          uv run python -m unittest test_vts_region_defaults.py
          uv run python - <<'PY'
          from vts_profile.region import _normalize_address
          for q, expected in [('大阪府大阪市中央区大阪城1-1','大阪府'), ('東京都八王子市元本郷町3-24-1','東京都')]:
              v=_normalize_address(q)
              print(q, '=>', v)
              assert expected in v
          PY
          uv run python -m py_compile vts_profile/region.py vts_profile/cli.py test_vts_region_defaults.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tuner_hal2/tools/pyproject.toml tuner_hal2/tools/uv.lock tuner_hal2/tools/vts_profile/region.py tuner_hal2/tools/test_vts_region_defaults.py
          git commit -m 'fix: normalize VTS addresses with existing parser'
          git push origin HEAD:fix/tuner-hal2-vts-auto-region
