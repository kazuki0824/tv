              s = s.replace(old, new)

          forbidden = [
              'new bind / old unbind / record更新 / stream 境界 reset の途中失敗時には新 binding をrollback',
              'commit Aで初回呼出しを`CallConsumed`へ不可逆に変更',
              'VTS/lab config には descrambling flow を置かない',
              'px4 の擬似 ロック は `DEMOD_LOCK` のみに使い',
              '`request_stop()` → `wake()` → `join_from_owner()`',
              'scan ワーカー と tune ワーカー は、join 失敗時',
              'ワーカーの wait は stop signal で wake 可能な cancellable wait',
              'コールバック失敗、ワーカー異常終了、FMQ / EventFlag 失敗の状態遷移、診断、後続処理停止条件は表7・表8',
              '公開APIがtyped worker failureを観測した場合の戻り値と次状態は表7・表8',
          ]
          for needle in forbidden:
              if needle in s:
                  raise SystemExit(f'forbidden wording remains: {needle}')

          p.write_text(s, encoding='utf-8')
