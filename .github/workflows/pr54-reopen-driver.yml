name: PR54 scoped fix driver

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/implement-tis-arib-si-design-pr53'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply scoped transformation
        shell: bash
        run: |
          python3 <<'DRIVER'
          from pathlib import Path
          workflow = Path('.github/workflows/pr54-fix-tis-smd-once.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python3 <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          block = workflow[start:end]
          indent = min(len(line) - len(line.lstrip()) for line in block if line.strip())
          code = '\n'.join(line[indent:] for line in block) + '\n'
          exec(compile(code, 'pr54-scoped-transform.py', 'exec'), {'__name__': '__main__'})
          DRIVER
      - name: Rust format and host tests
        shell: bash
        run: |
          cargo fmt --manifest-path arib_si_engine_rs/host_ci/Cargo.toml --all -- --check
          cargo test --manifest-path arib_si_engine_rs/host_ci/Cargo.toml --locked
      - name: Remove temporary automation and commit
        shell: bash
        run: |
          rm -f .github/workflows/pr54-fix-tis-smd-once.yml .github/workflows/pr54-reopen-driver.yml .pr54-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tis/DESIGN_JA.md arib_si_engine_rs/DESIGN_JA.md arib_si_engine_rs/src/service_discovery.rs tis/src/com/maleicacid/tvinput/aribsi/ServiceListBuilder.kt tis/src/com/maleicacid/tvinput/tis/ChannelScanController.kt .github/workflows/pr54-fix-tis-smd-once.yml .github/workflows/pr54-reopen-driver.yml .pr54-trigger
          git commit -m 'fix: align TIS budgets and SMD reception policy'
          git push origin HEAD:agent/implement-tis-arib-si-design-pr53
