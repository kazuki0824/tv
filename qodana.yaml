version: "1.0"
linter: qodana-jvm-android
projectJDK: 17

# Soongが製品buildを所有する。RobolectricのGradle modelを使ってAndroidの
# manifestとframeworkの入口を解決する。
rootJavaProjects:
  - "./tis/host_ci/robolectric"

# 未使用シンボルの検査結果はTIS製品Kotlinだけに限定する。
onlyDirectory: tis/src

profile:
  # このjobは未使用シンボル専用。推奨profileの他の検査結果を同じ閾値に混ぜない。
  base:
    name: empty
  inspections:
    - inspection: UnusedSymbol
      enabled: true
      severity: ERROR
