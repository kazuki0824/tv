version: "1.0"
linter: qodana-jvm-android
projectJDK: 17

# Soongが製品buildを所有する。RobolectricのGradle modelでAndroidの
# manifestとframeworkの入口を解決する。Qodana実行時だけrec/srcも
# project modelへ加え、TIS APIのconsumer参照をUnusedSymbol解析に含める。
rootJavaProjects:
  - "./tis/host_ci/robolectric"

# 問題の報告対象はTIS製品Kotlinだけに限定する。rec/srcはconsumer参照解決のため
# project modelには含めるが、rec自身の診断はこのworkflowでは報告しない。
onlyDirectory: tis/src

profile:
  # 推奨profileの全検査を実施し、未使用宣言はERRORとして扱う。
  base:
    name: qodana.recommended
  inspections:
    - inspection: UnusedSymbol
      enabled: true
      severity: ERROR
